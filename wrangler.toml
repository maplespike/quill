name = "quill-edge"
main = "packages/edge-worker/src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "https://maplespike.ca/*", zone_name = "maplespike.ca" }
]

# After decision 0004 (2026-07-01), all external traffic to *.maplespike.ca
# flows through the Cloudflare Tunnel (cloudflared pod in k3s) — NOT a
# Cloudflare Worker. The Edge Worker routing layer that this file assumes
# is thus moot; the entries below are kept only for compatibility with any
# existing Worker deployment, with HOMELAB_API pointed at the .ca side so
# the Worker can still self-fetch without trying to reach the private LAN.
#
# See maplespike/docs/ROUTING.md and decision 0004-split-hostname-routing.md.

[vars]
HOMELAB_API = "https://api.maplespike.ca"
CACHE_TTL = "3600"

# Infra owns quota:<service> (ok or over) in a KV namespace bound as QUOTA_FLAGS.
# The namespace id is set at deploy time. It is not stored here.
# KV for rate limiting (optional, free tier)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "YOUR_KV_ID"

# D1 for cached data (optional, 5GB free)
[[d1_databases]]
binding = "CACHE_DB"
database_name = "quill-cache"
database_id = "YOUR_D1_ID"