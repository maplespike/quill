name = "maplespike-edge"
main = "packages/edge-worker/src/index.ts"
compatibility_date = "2024-01-01"

[env.production]
routes = [
  { pattern = "https://maplespike.ca/*", zone_name = "maplespike.ca" }
]

[vars]
HOMELAB_API = "https://api.maplespike.lan"
CACHE_TTL = "3600"

# KV for rate limiting (optional, free tier)
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "YOUR_KV_ID"

# D1 for cached data (optional, 5GB free)
[[d1_databases]]
binding = "CACHE_DB"
database_name = "maplespike-cache"
database_id = "YOUR_D1_ID"