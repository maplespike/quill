schema: spec-driven-with-review

context: |
  Monorepo: pnpm workspace, TypeScript, Turbo, Astro, Node.js
  Architecture: Canadian public data platform with API, hosted MCP, portal, and ingestion services
  CI: pnpm build and pnpm test
  Production: Quill chart in charts/quill, managed through the media-k8s ArgoCD application
  Observability: VictoriaMetrics, VictoriaLogs, and Grafana managed by media-k8s
  Changes use the proposal → specs → design → review → tasks workflow before implementation

rules:
  proposal:
    - Include affected packages and service boundaries
    - Note whether API/MCP contracts or new dependencies change
  specs:
    - Use Given/When/Then format for scenarios
    - Reference existing spec patterns before inventing new ones
    - Each requirement must be independently testable
  design:
    - Include data flow for cross-service changes
    - Document security, rollout, and rollback implications
