apiVersion: v2
name: maplespike
description: MapleSpike — Canadian sovereign data pipeline (ingestion, verification, audit, MCP)

type: application

# This chart deploys the same manifests that nixos-config/kubernetes/modules/maplespike.nix
# The chart is maintained as a convenience for non-NixOS deployments.
# For NixOS cluster deployments, use nixos-config (which applies these via easykubenix).

version: 0.2.0
appVersion: "0.2.0"

dependencies:
  - name: postgresql
    version: "15.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: maplespike.engine.enabled
    alias: postgresql

keywords:
  - maplespike
  - canada
  - government-data
  - mcp
  - kubernetes
  - nixos

maintainers:
  - name: reverb256
    email: j_kroeker@reverb256.ca

sources:
  - name: maplespike
    url: https://github.com/reverb256/maplespike
  - name: ai-inference-gateway
    url: https://github.com/reverb256/ai-inference-gateway

annotations:
  # Compatibility note: This chart generates the same K8s manifests as
  # nixos-config/kubernetes/modules/maplesnapike.nix for consistency.
  # For NixOS cluster deployments, nixos-config applies these directly.
  nixos-config-compat: "kubernetes/modules/maplespike.nix"