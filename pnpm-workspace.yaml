packages:
  - "packages/*"
  - "!packages/dashboard"
  - "!packages/flywheel-agent"

# Workspace-wide dependency overrides for security patching
# (pnpm 10+ reads these from pnpm-workspace.yaml, not package.json)
overrides:
  undici: ">=8.5.0"
  nodemailer: ">=9.0.1"
  ws: ">=8.21.0"
  uuid: ">=11.1.1"
  # js-yaml omitted: changesets-cli only (dev-time); forcing >=4.2.0 breaks Astro 6 CJS interop
  esbuild: ">=0.28.1"
  vite: ">=7.3.5"
  "@babel/core": ">=7.29.6"
  # CVE-2025-3194: bigint-buffer <=1.1.5 has a buffer overflow in toBigIntLE().
  # The original package is unmaintained; use the community fork that patches it.
  bigint-buffer: "npm:bigint-buffer-fixed@1.1.6"
  # tar: multiple path traversal / arbitrary file write CVEs
  tar: ">=7.5.16"
