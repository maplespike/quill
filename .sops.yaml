# SOPS creation rules — Quill
#
# ONE canonical recipient set for every encrypted file in this repo. SOPS uses
# OR-semantics: any one recipient can decrypt. The set mirrors the fleet set in
# reverb256/nixos-secrets (.sops.yaml) so the cluster has a single key story.
#
#   cluster_age      age1567g6ra… — private key on zephyr
#                                   ~/.config/sops/age/cluster-age-key.txt (0600)
#   zephyr_age_v2    age12k7ch5r… — same file as cluster_age (one file, two identities)
#   homelab_dev      age1p98yp8w… — zephyr ~/.age/key.txt (0600); dev workstations
#   yubikey_nano     age1yubikey1qtrfqkhe… — YubiKey 5 Nano, serial 11115841, slot 1
#   yubikey_nfc      age1yubikey1qvh5yegu… — YubiKey 5 NFC, serial 12251564, slot 2
#   offline_recovery age1td0zl0ee… — air-gapped break-glass, held offline (not on any host)
#
# The two YubiKeys are the host-independent backstop. offline_recovery survives
# losing zephyr AND both YubiKeys. Do not treat six recipients as six
# independent attack vectors — cluster_age, zephyr_age_v2 and homelab_dev all
# sit in plaintext files on zephyr today.
#
# Encryption to an age1yubikey1… recipient needs age-plugin-yubikey on the
# ENCRYPTING host (the physical key is not needed). Encrypt on zephyr, or keep
# edits on a host with the plugin installed.
#
# 2026-09-22: the "nexus-prod" recipient
# (age1fwmxsy0la3sp6d2txz4z8yqq2fwtu5yya6pkl4l2927m0x4csemqrrnnmd) was dropped.
# Its private key was written to /etc/nixos/.age/nexus-prod-key.txt on nexus on
# 2026-08-15; /etc/nixos no longer exists (Omarchy migration, 2026-09-17) and no
# copy survived anywhere in the fleet. While that recipient stayed in the files,
# every decrypt attempt failed on every host. All four files were re-sealed to
# the set below, which decrypts today (verified 2026-09-22 with
# zephyr:~/.age/key.txt and zephyr:~/.config/sops/age/cluster-age-key.txt).
#
# Rotation: add the new recipient to `age:` below, then run
#   sops updatekeys secrets/runtime.yaml secrets/billing.yaml secrets/cloudflared.yaml secrets/build.yaml
# from a host with a working identity, remove the old recipient, run updatekeys
# again. NEVER commit a private key.

creation_rules:
  - path_regex: secrets/.*\.yaml$
    age: >-
      age1567g6raae4adh97lrfhalc9wwhmtsulh89k9pkx24m5ezfh8a4xqndrt6l,
      age12k7ch5r9sczu42zc6eutxtl6leudn47uv5fvsjrlq5ms0f0hz9nshm3t7q,
      age1p98yp8w64rdugp03332gxnz5q2vcnucn69cs5qm6s2l2u7epqfcqmu2pqe,
      age1yubikey1qtrfqkheehc6dlyux9stwq67dq3kcledlwzzrckx0wk639mh0wqh54auh7v,
      age1yubikey1qvh5yeguawe89kr9muzn6xvfwjkcja7rf0j6afxgyula6p9vql4kkjh52h2,
      age1td0zl0eexvgssdz2yljjg3wxnm60m3wytatg4uf3fgmn4z29kevstmgl6j
