# SOPS creation rules — Quill
#
# HISTORY: this file used to seal secrets/runtime.yaml to 'nexus-prod' and
# 'homelab-dev'. Both private keys are gone (the nexus-prod key file is absent
# from nexus; the homelab key lived at /etc/nixos/.age/key.txt and no NixOS hosts
# remain), so the file could not be decrypted by any host. Re-sealed 2026-09-22
# to recipients that exist, mirroring the nixos-secrets repo:
#
#   cluster_age   — private key rescued to zephyr:~/.config/sops/age/cluster-age-key.txt (0600)
#   zephyr_age_v2 — same file carries both cluster_age and zephyr_age_v2
#   yubikey_nano  — YubiKey 5 Nano, serial 11115841 slot 1; needs pcscd.socket
#                   and the plugin identity stub in ~/.config/sops/age/keys.txt
#   yubikey_nfc   — YubiKey 5 NFC, serial 12251564 slot 2; same plugin requirement
#   offline_recovery — air-gapped break-glass key, held offline
#   quill_age_v3  — software key added 2026-10-28 (Infra), nexus+zephyr ~/.config/sops/age, Actions AGE_SECRET_KEY
#
# Decrypt from zephyr:
#   SOPS_AGE_KEY_FILE=~/.config/sops/age/cluster-age-key.txt sops -d secrets/runtime.yaml
#
# Rotation: add the new recipient below, then `sops updatekeys secrets/*.yaml`.
creation_rules:
  - path_regex: secrets/.*\.yaml$
    key_groups:
      - age:
          - age1567g6raae4adh97lrfhalc9wwhmtsulh89k9pkx24m5ezfh8a4xqndrt6l
          - age12k7ch5r9sczu42zc6eutxtl6leudn47uv5fvsjrlq5ms0f0hz9nshm3t7q
          - age1yubikey1qtrfqkheehc6dlyux9stwq67dq3kcledlwzzrckx0wk639mh0wqh54auh7v
          - age1yubikey1qvh5yeguawe89kr9muzn6xvfwjkcja7rf0j6afxgyula6p9vql4kkjh52h2
          - age1td0zl0eexvgssdz2yljjg3wxnm60m3wytatg4uf3fgmn4z29kevstmgl6j
