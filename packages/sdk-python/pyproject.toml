[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quill-sdk"
version = "0.4.0"
description = "Quill (PyPI: quill-sdk) — typed Python client for the MapleSpike public-data API: Parliament, lobbying, immigration, courts, regulations, oversight, and more. Brand-level MapleSpike class names are preserved per ADR 0007."
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-only"
authors = [
    { name = "Reverb", email = "dev@maplespike.ca" },
]
keywords = [
    "maplespike", "api", "sdk", "canada", "government",
    "transparency", "open-data", "civic-tech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific Computing :: GIS",
    "Topic :: Sociology :: Politics",
]
dependencies = []

[project.urls]
Homepage = "https://maplespike.ca"
Repository = "https://github.com/reverb256/quill"
Source = "https://github.com/reverb256/quill/tree/main/packages/sdk-python"
Tracker = "https://github.com/reverb256/quill/issues"
Documentation = "https://maplespike.ca/docs"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=5.0",
]
langchain = [
    "langchain-core>=0.1.0",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quill*"]
