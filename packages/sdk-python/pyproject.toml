[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "maplespike-sdk"
version = "0.2.0"
description = "MapleSpike Python SDK — typed client for Canadian government data: Parliament, lobbying, immigration, courts, regulations, oversight, and more"
authors = [
    { name = "MapleSpike", email = "dev@maplespike.ca" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
keywords = ["maplespike", "api", "sdk", "canada", "government", "transparency", "open-data", "civic-tech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific Computing :: GIS",
    "Topic :: Sociology :: Politics",
]
dependencies = []

[project.urls]
Homepage = "https://maplespike.ca"
Source = "https://github.com/reverb256/maplespike/tree/main/packages/sdk-python"
Tracker = "https://github.com/reverb256/maplespike/issues"
Documentation = "https://maplespike.ca/docs.html"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

