# MapleSpike Edge AI Worker
#
# Architecture:
#   Workers AI (free ~10K neurons/day) -> edge inference for free tier
#   Homelab k3s (Qwen3.5-27B)         -> primary for pro/business, fallback for free
#   Enterprise BYOK                   -> BYOK endpoint if configured in KV tenant
#   KV (api-keys)                      -> hashed API key -> tenant lookup
#   KV (rate-limit)                    -> sliding window per-tenant throttling
#   KV (neuron-budget)                 -> daily UTC neuron budget counter
#   D1 (audit)                         -> full request audit log with PII redaction
#   AI Gateway                         -> response caching + usage analytics
#   Scheduled (cron)                   -> daily D1 audit retention at 01:00 UTC
#
# Free tier limits (all within Cloudflare free plan):
#   Workers AI:   ~10,000 neurons/day (covers ~5K small chat queries)
#   KV:           100K reads/day, 1K writes/day
#   D1:           5M reads/day, 100K writes/day (audit logging)
#   Workers:      100K requests/day
#   Cron:         5 scheduled invocations/day (1 used for retention)

name = "quill-ai"
main = "src/ai-worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = false

# ── AI Binding (Workers AI) ─────────────────────────────────────────────
[ai]
binding = "AI"

# ── AI Gateway (caching + analytics) ────────────────────────────────────
[ai_gateway]
gateway_id = "maplespike"

# ── KV Namespaces ───────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "API_KEYS"
id = "8c0ef6ea32e2410197bf489a83b98c07"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "c7022478939e475da7d217cd4f36b766"

[[kv_namespaces]]
binding = "NEURON_BUDGET"
id = "73309fa7752641fbaf32ae4a5b5b47fd"

# ── D1 Database ─────────────────────────────────────────────────────────
[[d1_databases]]
binding = "AUDIT_DB"
database_name = "quill-audit"
database_id = "a9579d19-39da-454c-a65d-a7d83f0ee080"

# ── Vars (non-secret config) ────────────────────────────────────────────
[vars]
HOMELAB_MODEL = "qwen3.5-27b"
NEURON_DAILY_LIMIT = "8000"
AUDIT_RETENTION_DAYS = "30"

# ── Scheduled handler: D1 audit retention (daily at 01:00 UTC) ──────────
[triggers]
crons = ["0 1 * * *"]

# ── Routes ──────────────────────────────────────────────────────────────
# Routes on maplespike.ca zone:
#   api.maplespike.ca/v1/ai/*  -> this worker (AI endpoints)
#   api.maplespike.ca/v1/*     -> homelab tunnel (data endpoints)

# ── Secrets (set via: npx wrangler secret put) ──────────────────────────
# HOMELAB_API_URL    — https://api.maplespike.ca (tunnel URL for homelab)
# HOMELAB_API_KEY    — MapleSpike API key for homelab auth
# JWT_SIGNING_KEY    — HMAC key for signing tenant context
# PII_HASH_SECRET    — Salt for hashing PII in audit logs
