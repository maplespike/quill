<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23030"/>
      <stop offset="100%" stop-color="#E84545"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern (subtle terminal grid) -->
  <g opacity="0.03" stroke="#C23030" stroke-width="0.5">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="490" x2="1200" y2="490"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
  </g>

  <!-- Gradient glow top-right -->
  <ellipse cx="1000" cy="100" rx="500" ry="300" fill="#C23030" opacity="0.04"/>

  <!-- Terminal bracket header -->
  <text x="60" y="65" fill="#C23030" font-size="16" font-weight="700" font-family="monospace, sans-serif" opacity="0.7">[00/MapleSpike API]</text>
  <rect x="220" y="50" width="42" height="18" rx="9" fill="#10B981" opacity="0.15"/>
  <text x="225" y="64" fill="#10B981" font-size="10" font-weight="700" font-family="monospace, sans-serif" letter-spacing="1">LIVE</text>

  <!-- Code line 1 -->
  <text x="60" y="105" fill="#6B7280" font-size="14" font-family="monospace, sans-serif" font-style="italic">// Every Canadian government dataset. One API. Every response cited.</text>

  <!-- Main headline -->
  <text x="60" y="180" fill="#F8F9FA" font-size="48" font-weight="800" font-family="sans-serif" letter-spacing="-0.5">
    Every Canadian
  </text>
  <text x="60" y="240" fill="url(#accent)" font-size="48" font-weight="800" font-family="sans-serif" letter-spacing="-0.5">
    government dataset.
  </text>
  <text x="60" y="300" fill="#F8F9FA" font-size="48" font-weight="800" font-family="sans-serif" letter-spacing="-0.5">
    One API. Every response cited.
  </text>

  <!-- Curl example (right side) -->
  <rect x="560" y="140" width="580" height="220" rx="12" fill="#0F0F18" stroke="#1F2937" stroke-width="1"/>
  <rect x="560" y="140" width="580" height="36" rx="12" fill="#141422"/>
  <rect x="560" y="164" width="580" height="12" fill="#141422"/>
  <circle cx="582" cy="158" r="5" fill="#EF4444"/>
  <circle cx="600" cy="158" r="5" fill="#FBBF24"/>
  <circle cx="618" cy="158" r="5" fill="#10B981"/>
  <text x="644" y="163" fill="#6B7280" font-size="11" font-family="monospace, sans-serif">Quickstart — curl</text>

  <text x="580" y="200" fill="#6B7280" font-size="12" font-family="monospace, sans-serif" font-style="italic">// Make your first API call</text>
  <text x="580" y="222" fill="#10B981" font-size="12" font-family="monospace, sans-serif">$</text>
  <text x="596" y="222" fill="#F8F9FA" font-size="12" font-family="monospace, sans-serif">curl -s https://api.maplespike.ca/v1/gov/search \</text>
  <text x="596" y="242" fill="#D4A017" font-size="12" font-family="monospace, sans-serif">  -H "x-api-key: YOUR_KEY"</text>
  <text x="596" y="262" fill="#D4A017" font-size="12" font-family="monospace, sans-serif">  -d "query=housing"</text>

  <text x="580" y="290" fill="#6B7280" font-size="12" font-family="monospace, sans-serif" font-style="italic">// Response with verified citation</text>
  <text x="580" y="312" fill="#6B7280" font-size="11" font-family="monospace, sans-serif">{</text>
  <text x="596" y="330" fill="#06B6D4" font-size="11" font-family="monospace, sans-serif">"citation"</text>
  <text x="662" y="330" fill="#6B7280" font-size="11" font-family="monospace, sans-serif">: {</text>
  <text x="612" y="346" fill="#06B6D4" font-size="11" font-family="monospace, sans-serif">"hash"</text>
  <text x="664" y="346" fill="#D4A017" font-size="11" font-family="monospace, sans-serif">"sha256:..."</text>
  <text x="612" y="358" fill="#06B6D4" font-size="11" font-family="monospace, sans-serif">"verified"</text>
  <text x="690" y="358" fill="#10B981" font-size="11" font-family="monospace, sans-serif">true</text>
  <text x="580" y="370" fill="#6B7280" font-size="11" font-family="monospace, sans-serif">}</text>

  <!-- Stats bar -->
  <rect x="60" y="370" width="440" height="52" rx="26" fill="#141422" stroke="#1F2937" stroke-width="1" opacity="0.8"/>
  <circle cx="86" cy="396" r="4" fill="#10B981" opacity="0.8"/>
  <text x="100" y="400" fill="#6B7280" font-size="12" font-family="monospace, sans-serif">// live</text>
  <text x="145" y="400" fill="#F8F9FA" font-size="14" font-weight="700" font-family="sans-serif">54</text>
  <text x="170" y="400" fill="#9CA3AF" font-size="12" font-family="sans-serif">committees</text>
  <text x="260" y="400" fill="#6B7280" font-size="12" font-family="sans-serif">·</text>
  <text x="275" y="400" fill="#F8F9FA" font-size="14" font-weight="700" font-family="sans-serif">28</text>
  <text x="300" y="400" fill="#9CA3AF" font-size="12" font-family="sans-serif">sources</text>
  <text x="370" y="400" fill="#6B7280" font-size="12" font-family="sans-serif">·</text>
  <text x="385" y="400" fill="#F8F9FA" font-size="14" font-weight="700" font-family="sans-serif">14</text>
  <text x="410" y="400" fill="#9CA3AF" font-size="12" font-family="sans-serif">MCP tools</text>

  <!-- Footer with product badges -->
  <text x="60" y="480" fill="#6B7280" font-size="13" font-family="monospace, sans-serif">// products</text>

  <rect x="60" y="495" width="110" height="32" rx="6" fill="#C23030" opacity="0.12" stroke="#C23030" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="80" y="516" fill="#C23030" font-size="13" font-weight="600" font-family="monospace, sans-serif">▦ DATA</text>

  <rect x="185" y="495" width="130" height="32" rx="6" fill="#D4A017" opacity="0.10" stroke="#D4A017" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="207" y="516" fill="#D4A017" font-size="13" font-weight="600" font-family="monospace, sans-serif">◐ SIGNAL</text>

  <rect x="330" y="495" width="110" height="32" rx="6" fill="#8B5CF6" opacity="0.10" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="350" y="516" fill="#8B5CF6" font-size="13" font-weight="600" font-family="monospace, sans-serif">✦ ASK</text>

  <!-- Source badges -->
  <text x="60" y="565" fill="#6B7280" font-size="11" font-family="monospace, sans-serif" opacity="0.6">open.canada.ca · ourcommons.ca · lobbycanada.gc.ca · sencanada.ca · canlii.org</text>
  <text x="60" y="590" fill="#6B7280" font-size="11" font-family="monospace, sans-serif" opacity="0.4">Publisher terms vary by dataset · SHA-256 provenance · audit trails</text>

  <!-- Logo mark bottom right -->
  <rect x="1030" y="520" width="44" height="44" rx="10" fill="#C23030"/>
  <text x="1052" y="552" text-anchor="middle" fill="white" font-size="24" font-weight="800" font-family="sans-serif">C</text>
  <text x="1080" y="550" fill="#9CA3AF" font-size="13" font-weight="600" font-family="sans-serif">MapleSpike</text>
</svg>
