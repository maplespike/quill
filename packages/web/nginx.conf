server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CivicIntel at /CivicIntel/
    # The static files are already built with basePath /CivicIntel
    # so the out dir has index.html referencing /CivicIntel/_next/... 

    location /CivicIntel/ {
        # Try serving static files, fall back to index.html for SPA routing
        try_files $uri $uri/ $uri/index.html /CivicIntel/index.html;
    }

    # Redirect /CivicIntel to /CivicIntel/
    location = /CivicIntel {
        return 301 /CivicIntel/;
    }

    # Cache static assets aggressively
    location /CivicIntel/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
