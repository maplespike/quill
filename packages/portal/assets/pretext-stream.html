<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapleSpike — Data Stream</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0B1120; font-family: 'Inter', sans-serif; overflow: hidden; }

/* Canvas fills screen */
#stream-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }

/* Data stream overlay */
.data-stream { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 10;
  background: linear-gradient(90deg, transparent, #E84545, #06B6D4, transparent);
  animation: streamPulse 2s ease-in-out infinite; opacity: 0.6; }
@keyframes streamPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

/* Ticker tape */
.ticker { position: fixed; top: 12px; left: 0; right: 0; z-index: 10; height: 24px;
  overflow: hidden; background: rgba(11,17,32,0.85); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(232,69,69,0.15); }
.ticker-inner { display: flex; white-space: nowrap; animation: tickerScroll 40s linear infinite; }
.ticker-item { display: inline-flex; align-items: center; gap: 8px; padding: 2px 20px;
  font-size: 0.72rem; color: rgba(255,255,255,0.6); font-family: 'JetBrains Mono', monospace; }
.ticker-item .dot { width: 4px; height: 4px; border-radius: 50%; display: inline-block; }
.dot-green { background: #10B981; }
.dot-red { background: #E84545; }
.dot-cyan { background: #06B6D4; }
.dot-amber { background: #FBBF24; }
@keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

/* Pretext text overlay */
.text-container { position: fixed; bottom: 80px; left: 10%; right: 10%; width: 80%; z-index: 5; }
.text-container canvas { width: 100%; height: auto; display: block; }

/* Stats bar */
.stats-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
  background: rgba(11,17,32,0.9); backdrop-filter: blur(12px);
  border-top: 1px solid rgba(232,69,69,0.15); padding: 14px 24px;
  display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
.stat-item { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.stat-num { font-size: 1.1rem; font-weight: 700; color: #F8F9FA; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 0.65rem; color: #6B7280; text-transform: uppercase; letter-spacing: 0.08em; }
.stat-item .trend { font-size: 0.6rem; margin-top: 1px; }
.trend-up { color: #10B981; }
.trend-warn { color: #E84545; }

/* Floating particles behind text */
.floating-data { position: fixed; bottom: 200px; left: 0; right: 0; z-index: 1;
  display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; opacity: 0.15; }
.floating-data span { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
  color: #06B6D4; animation: floatUp 8s ease-in-out infinite; }
@keyframes floatUp { 0%,100% { transform: translateY(0); opacity: 0.15; }
  50% { transform: translateY(-20px); opacity: 0.4; } }

/* Glow */
.glow-bg { position: fixed; top: 30%; left: 50%; transform: translate(-50%,-50%);
  width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(232,69,69,0.08) 0%, transparent 70%);
  z-index: 0; pointer-events: none; }
</style>
</head>
<body>

<!-- Glow -->
<div class="glow-bg"></div>

<!-- Data stream line -->
<div class="data-stream"></div>

<!-- Ticker -->
<div class="ticker" id="ticker">
  <div class="ticker-inner" id="ticker-inner">
    <span class="ticker-item"><span class="dot dot-gray"></span> Loading live data...</span>
  </div>
</div>

<!-- Main canvas (particle data stream + pretext text) -->
<canvas id="stream-canvas"></canvas>

<!-- Stats bar -->
<div class="stats-bar" id="stats-bar">
  <div class="stat-item">
    <span class="stat-num" id="stat-committees">54</span>
    <span class="stat-label">Committees</span>
    <span class="trend trend-up">▲ live</span>
  </div>
  <div class="stat-item">
    <span class="stat-num" id="stat-execs">17</span>
    <span class="stat-label">Executives</span>
    <span class="trend trend-up">▲ tracked</span>
  </div>
  <div class="stat-item">
    <span class="stat-num" id="stat-actors">34</span>
    <span class="stat-label">Influence Actors</span>
    <span class="trend trend-warn">⏺ monitored</span>
  </div>
  <div class="stat-item">
    <span class="stat-num" id="stat-alerts">12</span>
    <span class="stat-label">Active Signals</span>
    <span class="trend trend-warn">● new</span>
  </div>
  <div class="stat-item">
    <span class="stat-num" id="stat-sources">13</span>
    <span class="stat-label">Data Sources</span>
    <span class="trend trend-up">▲ live</span>
  </div>
  <div class="stat-item">
    <span class="stat-num">$0</span>
    <span class="stat-label">To Start</span>
    <span class="trend trend-up">▲ free tier</span>
  </div>
</div>

<script type="module">
// ─── Import Pretext ───
import { prepareWithSegments, layoutNextLineRange, materializeLineRange } from 'https://esm.sh/@chenglou/pretext@0.0.6';

// ─── Canvas setup ───
const canvas = document.getElementById('stream-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ─── Particle system (data stream) ───
const PARTICLES = 120;
const particles = [];

for (let i = 0; i < PARTICLES; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.6,
    vy: -0.3 - Math.random() * 0.8,
    size: 1 + Math.random() * 2,
    alpha: 0.1 + Math.random() * 0.4,
    speed: 0.3 + Math.random() * 0.7,
    pulse: Math.random() * Math.PI * 2,
    char: '0123456789ABCDEF'[Math.floor(Math.random() * 16)],
  });
}

function drawParticles(time) {
  ctx.clearRect(0, 0, W, H);

  // Data stream lines
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    p.x += Math.sin(time * 0.001 + i) * 0.3;
    p.y += p.vy * p.speed;
    p.pulse += 0.02;

    // Wrap around
    if (p.y < -20) { p.y = H + 20; p.x = Math.random() * W; }
    if (p.x < -20) p.x = W + 20;
    if (p.x > W + 20) p.x = -20;

    const alpha = p.alpha * (0.5 + 0.5 * Math.sin(p.pulse));

    // Glow
    ctx.shadowColor = '#06B6D4';
    ctx.shadowBlur = 4;
    ctx.fillStyle = `rgba(6, 182, 212, ${alpha * 0.7})`;
    ctx.font = '10px "JetBrains Mono", monospace';
    ctx.fillText(p.char, p.x, p.y);
    ctx.shadowBlur = 0;
  }

  // Connection lines between nearby particles
  ctx.strokeStyle = 'rgba(6, 182, 212, 0.04)';
  ctx.lineWidth = 1;
  for (let i = 0; i < particles.length; i += 3) {
    for (let j = i + 1; j < Math.min(i + 4, particles.length); j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 150) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }

  // Data stream "scanner line"
  const scanY = ((time * 0.05) % H);
  const grad = ctx.createLinearGradient(0, scanY - 40, 0, scanY + 40);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(0.5, 'rgba(232, 69, 69, 0.06)');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(0, scanY - 40, W, 80);
}

// ─── Pretext text setup ───
const FONT = '16px Inter';
const LINE_HEIGHT = 28;
const TEXT = "Every day, the Government of Canada makes decisions that affect your life — new regulations, committee hearings, lobbying meetings, court rulings, and billion-dollar contracts. MapleSpike monitors 54 parliamentary committees across both chambers, 17 high-impact executives from Canada's largest banks, telecoms, and media companies, 34 international and domestic influence actors, 13 official government data sources, and publishes over a dozen active signals about what's happening right now. All data is sourced from official public portals under the Open Government Licence — Canada. No spin, no opinion. Just the facts that are already public, organized so you can actually use them.";

const prepared = prepareWithSegments(TEXT, FONT);
let mouseX = W * 0.4;
let mouseY = H * 0.55;
const OBSTACLE_RADIUS = 80;

// ─── Pretext rendering ───
function drawText(time) {
  const textAreaTop = H * 0.35;
  const textAreaHeight = H * 0.45;
  const marginX = W * 0.1;
  const maxWidth = W - marginX * 2;

  let cursor = { segmentIndex: 0, graphemeIndex: 0 };
  let y = textAreaTop;
  let lines = [];

  while (true) {
    // Calculate available width at this Y, accounting for mouse obstacle
    let availWidth = maxWidth;
    if (mouseY > y - LINE_HEIGHT && mouseY < y + LINE_HEIGHT) {
      const distFromMouse = Math.abs(mouseX - (marginX + maxWidth / 2));
      if (distFromMouse < OBSTACLE_RADIUS + maxWidth / 2) {
        // Obstacle overlaps this row — split into two columns
        const obstacleLeft = mouseX - OBSTACLE_RADIUS - marginX;
        const obstacleRight = mouseX + OBSTACLE_RADIUS - marginX;
        const leftCol = Math.max(0, obstacleLeft);
        const rightCol = Math.max(0, maxWidth - obstacleRight);

        if (leftCol > 60) {
          // Try left column first
          const range = layoutNextLineRange(prepared, cursor, leftCol);
          if (range) {
            const line = materializeLineRange(prepared, range);
            cursor = range.end;
            lines.push({ text: line.text, x: marginX, y, width: leftCol });
            y += LINE_HEIGHT;
            if (y > textAreaTop + textAreaHeight) break;
            continue;
          }
        }
        if (rightCol > 60) {
          const range = layoutNextLineRange(prepared, cursor, rightCol);
          if (range) {
            const line = materializeLineRange(prepared, range);
            cursor = range.end;
            lines.push({ text: line.text, x: marginX + obstacleRight, y, width: rightCol });
            y += LINE_HEIGHT;
            if (y > textAreaTop + textAreaHeight) break;
            continue;
          }
        }
      }
    }

    // Normal line
    const range = layoutNextLineRange(prepared, cursor, availWidth);
    if (!range) break;
    const line = materializeLineRange(prepared, range);
    cursor = range.end;
    lines.push({ text: line.text, x: marginX, y, width: availWidth });
    y += LINE_HEIGHT;
    if (y > textAreaTop + textAreaHeight) break;
  }

  // Draw text
  ctx.textBaseline = 'top';
  ctx.font = FONT;

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const alpha = 0.5 + 0.3 * Math.sin(time * 0.001 + i * 0.3);
    ctx.fillStyle = `rgba(248, 249, 250, ${alpha})`;
    ctx.fillText(l.text, l.x, l.y);
  }

  // Draw obstacle (mouse cursor glow)
  const grad2 = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, OBSTACLE_RADIUS);
  grad2.addColorStop(0, 'rgba(232, 69, 69, 0.15)');
  grad2.addColorStop(0.5, 'rgba(6, 182, 212, 0.06)');
  grad2.addColorStop(1, 'transparent');
  ctx.fillStyle = grad2;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, OBSTACLE_RADIUS, 0, Math.PI * 2);
  ctx.fill();

  // Cursor ring
  ctx.strokeStyle = `rgba(232, 69, 69, ${0.3 + 0.2 * Math.sin(time * 0.003)})`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, OBSTACLE_RADIUS, 0, Math.PI * 2);
  ctx.stroke();
}

// ─── Mouse tracking ───
window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// Touch support
window.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
}, { passive: true });

// ─── Animation loop ───
function animate(time) {
  drawParticles(time);
  drawText(time);
  requestAnimationFrame(animate);
}
animate(0);

// ─── Animated counters ───
function animateCounter(el, target, duration = 1500) {
  const start = parseInt(el.textContent) || 0;
  const startTime = performance.now();
  function tick(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3); // ease-out cubic
    const val = Math.round(start + (target - start) * eased);
    el.textContent = val;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Trigger counters when visible
setTimeout(() => {
  animateCounter(document.getElementById('stat-committees'), 54);
  animateCounter(document.getElementById('stat-execs'), 17);
  animateCounter(document.getElementById('stat-actors'), 34);
  animateCounter(document.getElementById('stat-alerts'), 12);
  animateCounter(document.getElementById('stat-sources'), 13);
}, 500);

// ─── Resize handler ───
window.addEventListener('resize', () => {
  resize();
});

// ─── Floating data overlay ───
const dataWords = ['BILL C-27', 'LOBBYING', 'IN-CAMERA', 'GAZETTE', 'OAG', 'PBO', 'CRTC', 'SENATE', 'COMMITTEE', 'ETHICS', 'CONTRACT', 'REGULATION', 'AUDIT', 'CANLII', 'MCP', 'API', 'STREAM', 'SIGNAL', 'ALERT', 'TRACK'];
const floatDiv = document.createElement('div');
floatDiv.className = 'floating-data';
dataWords.forEach((w, i) => {
  const span = document.createElement('span');
  span.textContent = w;
  span.style.animationDelay = `${i * 0.4}s`;
  floatDiv.appendChild(span);
});
document.body.appendChild(floatDiv);
</script>
</body>
</html>
