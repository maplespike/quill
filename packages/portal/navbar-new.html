<!-- JavaScript for navigation -->
<script>
  (function() {
    'use strict';

    // Theme Management
    let currentTheme = localStorage.getItem('maplespike-theme') || 'dark';

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('maplespike-theme', theme);

      const icon = document.querySelector('.ms-theme-icon circle');
      if (icon) {
        icon.setAttribute('fill', theme === 'dark' ? 'currentColor' : 'none');
      }
    }

    function toggleTheme() {
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    }

    // Language Management
    let currentLang = localStorage.getItem('maplespike-locale') || 'en-CA';
    const SUPPORTED_LANGS = ['en-CA', 'fr-CA'];

    function setLang(lang) {
      if (!SUPPORTED_LANGS.includes(lang)) return;
      currentLang = lang;
      localStorage.setItem('maplespike-locale', lang);

      const currentEl = document.querySelector('.ms-lang-current');
      const otherEl = document.querySelector('.ms-lang-other');

      if (currentEl && otherEl) {
        currentEl.textContent = lang.toUpperCase().substring(0, 2);
        otherEl.textContent = lang.toUpperCase().substring(3, 5);
      }

      // Trigger locale change in existing i18n system
      if (window.loadI18n && window.setLocale) {
        window.setLocale(lang);
      }
    }

    function toggleLang() {
      const newLang = currentLang === 'en-CA' ? 'fr-CA' : 'en-CA';
      setLang(newLang);
    }

    // Mobile Menu
    const mobileMenu = document.getElementById('ms-mobile-overlay');
    const mobileToggle = document.querySelector('.ms-mobile-toggle');
    const mobileClose = document.querySelector('.ms-mobile-close');

    function openMobileMenu() {
      mobileMenu.classList.add('ms-active');
      mobileMenu.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
      mobileMenu.classList.remove('ms-active');
      mobileMenu.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    mobileToggle?.addEventListener('click', openMobileMenu);
    mobileClose?.addEventListener('click', closeMobileMenu);

    // Click outside to close
    document.addEventListener('click', (e) => {
      if (!mobileMenu.contains('ms-active')) return;

      const menu = document.querySelector('.ms-mobile-menu-content');
      if (menu && !menu.contains(e.target) && !e.target.closest('.ms-mobile-menu-content'))) {
        closeMobileMenu();
      }
    });

    // Account accordion
    const accountToggle = document.querySelector('.ms-nav-accordion-toggle');
    const accountMenu = document.getElementById('account-menu');

    if (accountToggle && accountMenu) {
      accountToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isExpanded = accountToggle.getAttribute('aria-expanded') === 'true';
        accountToggle.setAttribute('aria-expanded', isExpanded ? 'false' : 'true');
        accountMenu.classList.toggle('ms-active');
      });

      // Close when clicking outside
      document.addEventListener('click', (e) => {
        if (!accountMenu.contains(e.target) && !e.target.closest('.ms-nav-accordion-menu'))) {
          accountMenu.classList.remove('ms-active');
          accountToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }

    // Theme toggle
    document.querySelector('.ms-theme-toggle')?.addEventListener('click', toggleTheme);

    // Language toggle
    document.querySelector('.ms-lang-toggle')?.addEventListener('click', toggleLang);

    // Initialize
    setTheme(currentTheme);
    setLang(currentLang);

    // Handle window resize
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (window.innerWidth > 900) {
          closeMobileMenu();
          document.querySelector('#ms-mobile-overlay')?.setAttribute('aria-hidden', 'true');
        }
      }, 250);
    });

  })();
</script>
