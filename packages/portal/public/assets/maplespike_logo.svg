<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Primary red gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C23030"/>
      <stop offset="60%" stop-color="#D63B3B"/>
      <stop offset="100%" stop-color="#E84545"/>
    </linearGradient>
    <!-- Gold accent for the center node -->
    <radialGradient id="node-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <!-- Soft glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0A0A0F"/>

  <!-- Inner subtle ring -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="#1a1a25" stroke-width="1"/>

  <!--
    Geometric maple leaf — 11 angular spike-points
    Each point is a "data spike" rising from the center.
    Coordinates based on simplified Canadian flag geometry,
    angularized for a modern data-visualization aesthetic.
  -->
  <g fill="url(#leaf-grad)" filter="url(#glow)">
    <path d="
      M 256 96
      L 274 168
      L 336 134
      L 316 200
      L 396 192
      L 346 250
      L 432 270
      L 354 296
      L 396 362
      L 322 332
      L 336 406
      L 276 354
      L 256 432
      L 236 354
      L 176 406
      L 190 332
      L 116 362
      L 158 296
      L 80 270
      L 166 250
      L 116 192
      L 196 200
      L 176 134
      L 238 168
      Z
    "/>
  </g>

  <!-- Center accent: golden data node -->
  <circle cx="256" cy="256" r="20" fill="url(#node-grad)"/>
  <circle cx="256" cy="256" r="8" fill="#0A0A0F" opacity="0.4"/>

  <!-- Data connection lines from center to spike tips -->
  <g stroke="#FBBF24" stroke-width="1.5" opacity="0.25" fill="none">
    <line x1="256" y1="256" x2="256" y2="96"/>
    <line x1="256" y1="256" x2="336" y2="134"/>
    <line x1="256" y1="256" x2="396" y2="192"/>
    <line x1="256" y1="256" x2="432" y2="270"/>
    <line x1="256" y1="256" x2="396" y2="362"/>
    <line x1="256" y1="256" x2="336" y2="406"/>
    <line x1="256" y1="256" x2="176" y2="134"/>
    <line x1="256" y1="256" x2="116" y2="192"/>
    <line x1="256" y1="256" x2="80" y2="270"/>
    <line x1="256" y1="256" x2="116" y2="362"/>
    <line x1="256" y1="256" x2="176" y2="406"/>
  </g>
</svg>
