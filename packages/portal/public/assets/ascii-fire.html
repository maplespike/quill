<!DOCTYPE html>
<html lang="en-CA" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Fire — MapleSpike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;overflow:hidden;height:100vh;user-select:none;cursor:crosshair}
canvas#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.overlay{position:fixed;inset:0;z-index:1;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.overlay h1{font-size:3.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;background:linear-gradient(180deg,#fff 0%,#C23030 50%,transparent 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.overlay p{font-size:0.95rem;color:rgba(255,255,255,0.3);max-width:440px;line-height:1.5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <h1>MapleSpike</h1>
  <p>Canadian government data infrastructure</p>
</div>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
let W, H;
function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

const COLS = 120;
const ROWS = 32;
const CHAR_W = W / COLS;
const CHAR_H = H / ROWS;
const RAMP = ['█','▓','▒','░','@','#','%','&','O','*','+','·',' '];
const TOTAL = COLS * ROWS;

let fire = new Uint8Array(TOTAL);

// Mouse tracking
let mx = -100, my = -100;
document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
document.addEventListener('mouseleave', () => { mx = -100; my = -100; });

function step() {
  // Propagate upward: top-to-bottom, each cell reads from below
  for (let r = 0; r < ROWS - 1; r++) {
    for (let c = 0; c < COLS; c++) {
      if (Math.random() > 0.04) continue;

      // Cursor blows fire away in a radius
      const cx = c * CHAR_W + CHAR_W/2;
      const cy = r * CHAR_H + CHAR_H/2;
      const dist = Math.sqrt((cx - mx) ** 2 + (cy - my) ** 2);
      const blowRadius = CHAR_W * 3;

      const below = fire[(r+1)*COLS + c];
      const bl = c > 0 ? fire[(r+1)*COLS + c-1] : below;
      const br = c < COLS-1 ? fire[(r+1)*COLS + c+1] : below;
      const avg = (below + bl + br) / 3;
      let val = avg - (0.1 + Math.random() * 0.5);

      // Cursor reduces heat near it
      if (dist < blowRadius) {
        const factor = dist / blowRadius; // 0 at center, 1 at edge
        val *= factor * 0.5;
      }

      fire[r*COLS + c] = val > 0 ? val|0 : 0;
    }
  }

  // Bottom row: random heat source (seeded AFTER propagation)
  for (let c = 0; c < COLS; c++)
    fire[(ROWS-1)*COLS + c] = 18 + (Math.random() * 18 | 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.textBaseline = 'top';
  ctx.font = `${Math.min(CHAR_W, CHAR_H) - 2}px monospace`;
  ctx.globalAlpha = 0.35;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const h = fire[r*COLS + c];
      if (h < 2) continue;
      const ch = RAMP[Math.min(RAMP.length-1, ((36-h)/36*RAMP.length)|0)];
      const t = h / 36;
      let r_, g, b;
      if (t > 0.8)      { r_=255; g=200; b=100; }
      else if (t > 0.5) { r_=255; g=80+120*(t-0.5)/0.3; b=20; }
      else if (t > 0.2) { r_=180*(t/0.5); g=20*(t/0.5); b=0; }
      else              { r_=80*(t/0.2); g=10*(t/0.2); b=0; }
      ctx.fillStyle = `rgb(${r_|0},${g|0},${b|0})`;
      ctx.fillText(ch, c*CHAR_W, r*CHAR_H);
    }
  }
  ctx.globalAlpha = 1;
}

let fc = 0, ft = 0;
function loop(now) {
  fc++;
  if (now - ft > 1000) { fc = 0; ft = now; }
  step();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(t => { ft = t; loop(t); });
</script>
</body>
</html>
