<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="30" x2="1200" y2="30"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="630" x2="1200" y2="630"/><line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="30" y1="0" x2="30" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
  </g>
  <!-- Logo - simplified spike maple leaf -->
  <g transform="translate(100, 315)" fill="none">
    <circle cx="0" cy="0" r="60" fill="url(#brand)" opacity="0.9"/>
    <!-- 11-point spike leaf -->
    <path d="M0-55 L8-40 L25-50 L18-32 L38-35 L28-18 L48-12 L32-2 L45 12 L28 8 L22 25 L10 15 L0 30 L-10 15 L-22 25 L-28 8 L-45 12 L-32-2 L-48-12 L-28-18 L-38-35 L-18-32 L-25-50 L-8-40 Z"
      fill="#fff" transform="scale(0.85)"/>
    <!-- Center node -->
    <circle cx="0" cy="0" r="3" fill="#f97316"/>
    <!-- Data connection lines -->
    <g stroke="#f97316" stroke-width="1" opacity="0.6">
      <line x1="0" y1="0" x2="-30" y2="-40"/>
      <line x1="0" y1="0" x2="30" y2="-40"/>
      <line x1="0" y1="0" x2="-45" y2="10"/>
      <line x1="0" y1="0" x2="45" y2="10"/>
      <line x1="0" y1="0" x2="-20" y2="45"/>
      <line x1="0" y1="0" x2="20" y2="45"/>
    </g>
    <!-- Outer nodes -->
    <circle cx="-30" cy="-40" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="30" cy="-40" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="-45" cy="10" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="45" cy="10" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="-20" cy="45" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="45" r="2" fill="#fff" opacity="0.8"/>
  </g>
  <!-- Title -->
  <text x="600" y="290" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#fafafa" text-anchor="middle" letter-spacing="-2">MapleSpike</text>
  <text x="600" y="340" font-family="Inter, system-ui, sans-serif" font-size="24" fill="#a0a0a0" text-anchor="middle" letter-spacing="4">CANADIAN GOVERNMENT DATA &middot; AI PLATFORM</text>
  <!-- Metrics -->
  <g transform="translate(0, 410)">
    <rect x="200" y="0" width="220" height="50" rx="8" fill="#fff" opacity="0.04"/>
    <text x="310" y="22" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#fafafa" text-anchor="middle">144</text>
    <text x="310" y="40" font-family="Inter, sans-serif" font-size="11" fill="#a0a0a0" text-anchor="middle">DATA MODULES</text>
    <rect x="490" y="0" width="220" height="50" rx="8" fill="#fff" opacity="0.04"/>
    <text x="600" y="22" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#fafafa" text-anchor="middle">129</text>
    <text x="600" y="40" font-family="Inter, sans-serif" font-size="11" fill="#a0a0a0" text-anchor="middle">MCP TOOLS</text>
    <rect x="780" y="0" width="220" height="50" rx="8" fill="#fff" opacity="0.04"/>
    <text x="890" y="22" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#fafafa" text-anchor="middle">188K+</text>
    <text x="890" y="40" font-family="Inter, sans-serif" font-size="11" fill="#a0a0a0" text-anchor="middle">LINES OF CODE</text>
  </g>
  <!-- Domain badge -->
  <rect x="480" y="478" width="240" height="28" rx="14" fill="none" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="497" font-family="Inter, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="600">maplespike.lan</text>
</svg>
