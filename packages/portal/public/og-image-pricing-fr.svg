<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e84545"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Right-side watermark logo -->
  <g transform="translate(1000, 315) scale(1.55)" opacity="0.07" fill="none">
    <circle cx="0" cy="0" r="60" fill="url(#brand)"/>
    <path d="M0-55 L8-40 L25-50 L18-32 L38-35 L28-18 L48-12 L32-2 L45 12 L28 8 L22 25 L10 15 L0 30 L-10 15 L-22 25 L-28 8 L-45 12 L-32-2 L-48-12 L-28-18 L-38-35 L-18-32 L-25-50 L-8-40 Z" fill="#fff" transform="scale(0.85)"/>
    <circle cx="0" cy="0" r="3" fill="#f97316"/>
    <g stroke="#f97316" stroke-width="1" opacity="0.6">
      <line x1="0" y1="0" x2="-30" y2="-40"/>
      <line x1="0" y1="0" x2="30" y2="-40"/>
      <line x1="0" y1="0" x2="-45" y2="10"/>
      <line x1="0" y1="0" x2="45" y2="10"/>
      <line x1="0" y1="0" x2="-20" y2="45"/>
      <line x1="0" y1="0" x2="20" y2="45"/>
    </g>
    <circle cx="-30" cy="-40" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="30" cy="-40" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="-45" cy="10" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="45" cy="10" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="-20" cy="45" r="2" fill="#fff" opacity="0.8"/>
    <circle cx="20" cy="45" r="2" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Brand row -->
  <g transform="translate(80, 104) scale(0.5)" fill="none">
    <circle cx="0" cy="0" r="60" fill="url(#brand)" opacity="0.95"/>
    <path d="M0-55 L8-40 L25-50 L18-32 L38-35 L28-18 L48-12 L32-2 L45 12 L28 8 L22 25 L10 15 L0 30 L-10 15 L-22 25 L-28 8 L-45 12 L-32-2 L-48-12 L-28-18 L-38-35 L-18-32 L-25-50 L-8-40 Z" fill="#fff" transform="scale(0.85)"/>
    <circle cx="0" cy="0" r="3" fill="#f97316"/>
  </g>
  <text x="150" y="122" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="800" fill="#fafafa" letter-spacing="-1">MapleSpike</text>

  <!-- Headline -->
  <text x="80" y="300" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#fafafa" letter-spacing="-2">Tarification pour tous les besoins</text>

  <!-- 4-bar brand rule -->
  <g transform="translate(80, 428)">
    <rect x="0" y="0" width="44" height="3" rx="1.5" fill="#e84545"/>
    <rect x="50" y="0" width="44" height="3" rx="1.5" fill="#06b6d4"/>
    <rect x="100" y="0" width="44" height="3" rx="1.5" fill="#22c55e"/>
    <rect x="150" y="0" width="44" height="3" rx="1.5" fill="#f97316"/>
  </g>

  <!-- Subtitle -->
  <text x="80" y="474" font-family="Inter, system-ui, sans-serif" font-size="25" fill="#a0a0a0" letter-spacing="0.5">Du gratuit à l'entreprise — accédez à la couche de données unifiée du Canada</text>

  <!-- Page badge -->
  <rect x="80" y="534" width="148" height="38" rx="19" fill="none" stroke="#e84545" stroke-width="1.5"/>
  <text x="154" y="559" font-family="JetBrains Mono, monospace" font-size="16" fill="#e84545" text-anchor="middle" font-weight="600">/pricing</text>
</svg>
