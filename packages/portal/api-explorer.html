<!DOCTYPE html>
<html lang="en-CA" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleSpike — API Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C23030'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='800' font-family='sans-serif'>C</text></svg>">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <script src="/config.js"></script>
  <script src="/sanitize.js"></script>
  <style>
    .api-explorer-page { padding-top: 80px; min-height: 100vh; }
    .api-explorer-container { max-width: 1400px; margin: 0 auto; padding: 0 24px 80px; }
    .api-explorer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .api-explorer-header h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .api-key-input { display: flex; align-items: center; gap: 8px; }
    .api-key-input label { font-size: 0.82rem; color: var(--text-muted); }
    .api-key-input input { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; font-family: var(--font-mono); font-size: 0.82rem; color: var(--text); width: 280px; }
    #swagger-ui { background: var(--bg); border-radius: var(--radius-lg); border: 1px solid var(--border); overflow: hidden; }
    .swagger-ui { color: var(--text) !important; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 20px; }
    .swagger-ui .info .title { color: var(--text) !important; }
    .swagger-ui .scheme-container { background: var(--bg-card) !important; box-shadow: none !important; }
    .swagger-ui .opblock-tag { border-bottom-color: var(--border) !important; }
    .swagger-ui .opblock-tag:hover { background: var(--bg-elevated) !important; }
    .swagger-ui .opblock { border-radius: var(--radius-sm) !important; border-color: var(--border) !important; }
    .swagger-ui .opblock .opblock-summary { border-color: var(--border) !important; }
    .swagger-ui .opblock-description-wrapper p { color: var(--text-secondary) !important; }
    .swagger-ui .parameter__name, .swagger-ui .parameter__type, .swagger-ui .parameter__in { color: var(--text-muted) !important; }
    .swagger-ui .response-col_status, .swagger-ui .response-col_description { color: var(--text) !important; }
    .swagger-ui .btn { border-radius: var(--radius-sm) !important; }
    .swagger-ui input, .swagger-ui select, .swagger-ui textarea { background: var(--bg-card) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .swagger-ui .model-box { background: var(--bg-elevated) !important; }
    .swagger-ui .model { color: var(--text) !important; }
    .swagger-ui section.models { border-color: var(--border) !important; }
    .swagger-ui section.models.is-open h4 { border-color: var(--border) !important; }
    .swagger-ui .model-container { background: var(--bg-card) !important; border-color: var(--border) !important; }
    .swagger-ui .markdown p, .swagger-ui .markdown pre { color: var(--text-secondary) !important; }
    .swagger-ui .loading-container { padding: 40px; text-align: center; }
    .error-message { text-align: center; padding: 60px 24px; }
    .error-message .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .error-message p { color: var(--text-muted); }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-icon">C</span> MapleSpike</a>
    <div class="nav-links">
      <a href="explorer.html">Explorer</a>
      <a href="api-explorer.html" class="active">API</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="workspace.html">Workspace</a>
      <a href="docs.html">Docs</a>
      <a href="pricing.html">Pricing</a>
    </div>
  </div>
</nav>

<div class="api-explorer-page">
  <div class="api-explorer-container">
    <div class="api-explorer-header">
      <h1>API Explorer</h1>
      <div class="api-key-input">
        <label for="api-key-field">API Key:</label>
        <input id="api-key-field" type="text" placeholder="maplespike_..." value="">
      </div>
    </div>
    <div id="swagger-ui">
      <div class="loading-container">
        <p>Loading API specification...</p>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
(function() {
  const cfg = window.MAPLESPIKE || {};
  const base = cfg.apiBase || 'http://127.0.0.1:8082';
  const apiKeyField = document.getElementById('api-key-field');

  // Restore saved key
  const saved = localStorage.getItem('apiKey');
  if (saved) apiKeyField.value = saved;

  apiKeyField.addEventListener('input', function() {
    localStorage.setItem('apiKey', this.value);
  });

  const specUrl = base + '/v1/openapi.json';

  SwaggerUIBundle({
    url: specUrl,
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [
      SwaggerUIBundle.presets.apis,
      SwaggerUIBundle.SwaggerUIStandalonePreset,
    ],
    plugins: [
      SwaggerUIBundle.plugins.DownloadUrl,
      function() {
        return {
          statePlugins: {
            spec: {
              wrapActions: {
                updateSpec: function(oriAction) {
                  return function(payload) {
                    // Apply dark theme class
                    document.querySelector('.swagger-ui')?.classList.add('swagger-ui');
                    return oriAction(payload);
                  };
                }
              }
            },
            auth: {
              wrapActions: {
                authorize: function(oriAction) {
                  return function(payload) {
                    const key = apiKeyField.value.trim();
                    if (key) {
                      payload = { BearerAuth: { name: 'Bearer', schema: { type: 'apiKey', in: 'header', name: 'Authorization' }, value: key } };
                    }
                    return oriAction(payload);
                  };
                }
              }
            }
          }
        };
      }
    ],
    requestInterceptor: function(req) {
      const key = apiKeyField.value.trim();
      if (key) {
        req.headers['Authorization'] = 'Bearer ' + key;
      }
      return req;
    },
    defaultModelsExpandDepth: 1,
    docExpansion: 'list',
    filter: true,
    showExtensions: true,
    showCommonExtensions: true,
    tryItOutEnabled: true,
  });
})();
</script>
</body>
</html>
