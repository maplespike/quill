server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (non-docs — docs has its own cached assets below)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro hashed assets — all go to /_astro/ directory
    location ~* /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docs — served from generated docs/, accessed at /docs/
    # ^~ gives this prefix priority over the regex asset cache above
    location ^~ /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    # SPA-like routing for all HTML pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Proxy API calls to the backend so the browser sees them as same-origin.
    # The ${API_UPSTREAM} placeholder is substituted from the API_UPSTREAM env var
    # by the official nginx image when the config is copied to /etc/nginx/templates.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Cache-Control: no-transform prevents Cloudflare from auto-injecting Web Analytics beacon
    add_header Cache-Control "no-transform" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://static.cloudflareinsights.com https://plausible.io; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https://www.google.com https://*.googleusercontent.com; connect-src 'self' https://*.maplespike.ca https://cloudflareinsights.com https://plausible.io; frame-ancestors none;" always;
}
