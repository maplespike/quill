server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (non-docs — docs has its own cached assets below)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vitepress docs — served from docs-dist/, accessed at /docs/
    # ^~ gives this prefix priority over the regex asset cache above
    location ^~ /docs/ {
        alias /usr/share/nginx/html/docs-dist/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    # SPA-like routing for all HTML pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
