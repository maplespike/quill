server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (non-docs — docs has its own cached assets below)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro hashed assets — all go to /_astro/ directory
    location ~* /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docs — served from generated docs/, accessed at /docs/
    # ^~ gives this prefix priority over the regex asset cache above
    location ^~ /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    # SPA-like routing for all HTML pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Proxy API calls to the backend so the browser sees them as same-origin.
    # The ${API_UPSTREAM} placeholder is substituted from the API_UPSTREAM env var
    # by the official nginx image when the config is copied to /etc/nginx/templates.
    location /api/ {
        proxy_pass ${API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # Security headers. These mirror server.py's SECURITY_HEADERS and public/_headers:
    # the CSP is asserted identical across all three copies by tests/server-csp.test.ts.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # X-XSS-Protection deliberately absent: deprecated, and the old "1; mode=block" auditor
    # could itself introduce XSS in old WebKit. CSP replaces it.
    # Cache-Control: no-transform prevents Cloudflare from auto-injecting Web Analytics beacon
    add_header Cache-Control "no-transform" always;
    # Stripe embedded checkout: js.stripe.com must be allowed in script-src AND frame-src
    # (the form is an iframe), and Stripe.js calls api.stripe.com from the browser. Without
    # frame-src this falls back to default-src 'self' and the form never renders.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://plausible.io https://js.stripe.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.stripe.com; connect-src 'self' https://*.maplespike.ca https://*.quill.maplespike.ca https://cloudflareinsights.com https://plausible.io https://api.stripe.com; frame-src 'self' https://js.stripe.com https://hooks.stripe.com; media-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
}
