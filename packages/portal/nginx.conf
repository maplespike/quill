server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets (non-docs — docs has its own cached assets below)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Astro hashed assets — all go to /_astro/ directory
    location ~* /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docs — served from generated docs/, accessed at /docs/
    # ^~ gives this prefix priority over the regex asset cache above
    location ^~ /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    # SPA-like routing for all HTML pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://www.google.com https://*.googleusercontent.com; connect-src 'self' https://maplespike-api.lan; frame-ancestors none;" always;
}
