<!DOCTYPE html>
<html lang="en-CA" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapleSpike — Citation Verification</title>
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Verified Citation — MapleSpike">
  <meta property="og:description" content="SHA-256 verified Canadian government data citation">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23C23030'/><text x='16' y='22' text-anchor='middle' fill='white' font-size='16' font-weight='800' font-family='sans-serif'>C</text></svg>">
  <script src="/config.js"></script>
  <script src="/sanitize.js"></script>
  <style>
    .cite-page { padding-top: 80px; min-height: 100vh; }
    .cite-container { max-width: 720px; margin: 0 auto; padding: 32px 24px 80px; }
    .cite-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .cite-header { padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .cite-header .badge { font-size: 0.72rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; background: rgba(16,185,129,0.15); color: #10B981; text-transform: uppercase; letter-spacing: 0.05em; }
    .cite-header h1 { font-size: 1rem; font-weight: 600; margin: 0; flex: 1; }
    .cite-body { padding: 24px; }
    .cite-field { margin-bottom: 20px; }
    .cite-field:last-child { margin-bottom: 0; }
    .cite-field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .cite-field .value { font-size: 0.85rem; color: var(--text); word-break: break-all; font-family: var(--font-mono); }
    .cite-field .value a { color: var(--accent); }
    .cite-verify { background: var(--bg-elevated); border-radius: var(--radius-sm); padding: 16px; margin-top: 24px; }
    .cite-verify label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: block; }
    .cite-verify code { display: block; font-size: 0.78rem; line-height: 1.6; color: var(--accent-cyan); word-break: break-all; white-space: pre-wrap; background: var(--bg-card); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    .cite-error { text-align: center; padding: 60px 24px; }
    .cite-error .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .cite-error h2 { font-size: 1.1rem; margin-bottom: 8px; }
    .cite-error p { color: var(--text-muted); font-size: 0.85rem; }
    .cite-loading { text-align: center; padding: 60px; color: var(--text-muted); }
    .og-meta { display: none; }
  </style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo"><span class="logo-icon">C</span> MapleSpike</a>
    <div class="nav-links">
      <a href="explorer.html">Explorer</a>
      <a href="api-explorer.html">API</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="pricing.html">Pricing</a>
    </div>
  </div>
</nav>

<div class="cite-page">
  <div class="cite-container" id="app">
    <div class="cite-loading">Loading citation...</div>
  </div>
</div>

<script>
(function() {
  const cfg = window.MAPLESPIKE || {};
  const base = cfg.apiBase || 'http://127.0.0.1:8082';
  const app = document.getElementById('app');

  const params = new URLSearchParams(window.location.search);
  let hash = params.get('hash') || window.location.hash.replace(/^#/, '');
  if (!hash) {
    app.innerHTML = '<div class="cite-error"><div class="icon">🔍</div><h2>No Citation Hash</h2><p>Provide a hash: <code>/citation.html?hash=sha256:abc...</code></p></div>';
    return;
  }

  // Strip sha256: prefix if present
  const cleanHash = hash.replace(/^sha256[-:]/, '').toLowerCase();
  if (!/^[a-f0-9]{64}$/.test(cleanHash)) {
    app.innerHTML = '<div class="cite-error"><div class="icon">⚠</div><h2>Invalid Hash</h2><p>Citation hash must be 64 hex characters (SHA-256).</p></div>';
    return;
  }

  const fullHash = 'sha256:' + cleanHash;

  async function loadCitation() {
    try {
      const resp = await fetch(base + '/v1/citation/' + encodeURIComponent(fullHash), {
        signal: AbortSignal.timeout(8000),
      });
      const json = await resp.json();

      if (!json.success || !json.data) {
        throw new Error(json.error?.message || 'Citation not found');
      }

      const c = json.data.citation || {};
      const vc = json.data.verify_command || '';

      // Update OG meta
      const ogTitle = document.querySelector('meta[property="og:title"]');
      const ogDesc = document.querySelector('meta[property="og:description"]');
      if (ogTitle) ogTitle.content = 'Verified Citation — ' + (c.source_name || 'Government of Canada');
      if (ogDesc) ogDesc.content = 'SHA-256: ' + cleanHash.slice(0, 16) + '... | ' + (c.license || 'OGL-C');
      document.title = 'Citation — ' + (c.source_name || 'Government of Canada') + ' | MapleSpike';

      app.innerHTML = MAPLESPIKE.sanitizeHtml(`
        <div class="cite-card">
          <div class="cite-header">
            <span class="badge">Verified</span>
            <h1>${MAPLESPIKE.esc(c.source_name || 'Government of Canada')}</h1>
          </div>
          <div class="cite-body">
            <div class="cite-field">
              <label>Source URL</label>
              <div class="value">${c.source_url ? '<a href="' + MAPLESPIKE.esc(c.source_url) + '" target="_blank" rel="noopener">' + MAPLESPIKE.esc(c.source_url) + '</a>' : '<span style="color:var(--text-muted)">—</span>'}</div>
            </div>
            <div class="cite-field">
              <label>SHA-256 Hash</label>
              <div class="value" style="font-size:0.78rem;">${MAPLESPIKE.esc(fullHash)}</div>
            </div>
            <div class="cite-field">
              <label>License</label>
              <div class="value">${MAPLESPIKE.esc(c.license || 'Open Government Licence – Canada')}</div>
            </div>
            <div class="cite-field">
              <label>Retrieved</label>
              <div class="value">${MAPLESPIKE.esc(c.retrieved_at ? new Date(c.retrieved_at).toLocaleString('en-CA') : '—')}</div>
            </div>
            <div class="cite-verify">
              <label>Verify This Citation</label>
              <code>${MAPLESPIKE.esc(vc)}</code>
            </div>
          </div>
        </div>
      `);
    } catch (e) {
      app.innerHTML = MAPLESPIKE.sanitizeHtml(`
        <div class="cite-error">
          <div class="icon">❌</div>
          <h2>Citation Not Found</h2>
          <p>${MAPLESPIKE.esc(e.message)}</p>
          <p style="font-size:0.78rem;margin-top:12px;">Hash: <code>${MAPLESPIKE.esc(fullHash)}</code></p>
        </div>
      `);
    }
  }

  loadCitation();
})();
</script>
</body>
</html>
