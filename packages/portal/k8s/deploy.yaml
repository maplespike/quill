apiVersion: v1
kind: Pod
metadata:
  name: maplespike-portal
  namespace: ai-inference
  labels:
    app: maplespike-portal
    component: frontend
    tier: web
spec:
  nodeName: nexus
  containers:
    - name: maplespike-portal
      image: nexus:5000/maplespike-portal:latest
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "196Mi"
      livenessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 30
      readinessProbe:
        httpGet:
          path: /
          port: 8080
        initialDelaySeconds: 3
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: maplespike-portal
  namespace: ai-inference
  labels:
    app: maplespike-portal
    component: frontend
    tier: web
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30964
      protocol: TCP
  selector:
    app: maplespike-portal
