apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-sweep
  namespace: ai-inference
  labels:
    app: maplespike-sweep
    component: sweep-scheduler
    tier: backend
spec:
  # Every 6 hours — aligns with the SweepScheduler's daily sources (ciec, gac)
  # while covering high-frequency sources (spending, lobbying) multiple times.
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: maplespike-sweep
            component: sweep-scheduler
            tier: backend
        spec:
          # Pin to nexus — no GPU needed, keep traffic local to the registry
          nodeName: nexus
          containers:
            - name: maplespike-sweep
              image: nexus:5000/maplespike-engine:latest
              imagePullPolicy: Always
              command:
                - node
                - packages/engine/dist/sweep/run.js
              env:
                - name: NODE_ENV
                  value: "production"
                - name: MAPLESPIKE_AI_ENDPOINT
                  value: "http://ai-inference-gateway:8080/v1"
                - name: MAPLESPIKE_AI_MODEL
                  value: "Carnice-Qwen3.6-MoE-35B-A3B.IQ4_XS.gguf"
              resources:
                requests:
                  cpu: "200m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
          restartPolicy: OnFailure
      backoffLimit: 3
