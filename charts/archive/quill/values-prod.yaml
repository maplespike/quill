# Quill — Production Values
# helm upgrade --install quill charts/quill -n maplespike -f charts/quill/values-prod.yaml

image:
  registry: nexus:5000
  tag: stable
  pullPolicy: Always

# API Server
api:
  replicas: 2
  port: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    QUILL_API_URL: "http://quill-api:8082/v1"
    NODE_ENV: "production"
    QUILL_STORAGE: "postgres"
    QUILL_DB_HOST: "quill-db"
    QUILL_DB_PORT: "5432"
    QUILL_DB_NAME: "maplespike"
    QUILL_QDRANT_ENDPOINT: "http://qdrant:6333"
    QUILL_QDRANT_COLLECTION: "maplespike"
    QUILL_EMBED_MODEL: "nvidia/llama-3.2-nv-embedqa-1b-v2"
    # WebAuthn / passkey — rp.id must match the browser origin domain
    MAPLESPIKE_DOMAIN: "maplespike.ca"
    MAPLESPIKE_ORIGIN: "https://quill.maplespike.ca"
    # Portal URL for OAuth callback redirects
    PORTAL_URL: "https://quill.maplespike.ca"
    APP_URL: "https://quill.maplespike.ca"
    # GitHub OAuth callback — must match GitHub App registration
    GITHUB_REDIRECT_URI: "https://api.maplespike.ca/v1/auth/github/callback"
    # Trust proxy headers from cloudflared tunnel
    TRUST_PROXY: "true"
  ingress:
    host: api.maplespike.ca
    tls: true

# MCP Server
mcp:
  replicas: 1
  port: 3001
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ingress:
    host: mcp.maplespike.ca
    tls: true

# PostgreSQL Database
database:
  enabled: true
  image: postgres:17-alpine
  user: maplespike
  database: maplespike
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeName: nexus

# Portal (static HTML)
portal:
  enabled: true
  replicas: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  ingress:
    host: maplespike.ca
    tls: true

# Cloudflare Tunnel (cloudflared)
cloudflared:
  enabled: true
  image: cloudflare/cloudflared
  tag: latest
  pullPolicy: Always
  replicas: 1
  tunnelId: "cec1b070-796f-4524-b43e-9b05c32af906"
  nodeSelector:
    kubernetes.io/hostname: nexus
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # quill.maplespike.ca is now served by Cloudflare Pages (free tier)
  # — no tunnel ingress needed for the portal
  ingress:
    - hostname: api.maplespike.ca
      service: http://quill-api.maplespike.svc.cluster.local:8082
    - hostname: mcp.maplespike.ca
      service: http://quill-mcp.maplespike.svc.cluster.local:3001
    - hostname: kanban.maplespike.ca
      service: http://quill-kanban-exec.maplespike.svc.cluster.local:8080

# Secrets (override via --set or external secret management)
secrets:
  apiKey: ""
  jwtSecret: ""
  dbPassword: ""
  # Stripe keys → injected via externalSecretRef in templates/secrets.yaml.
  # Do NOT put real keys here; populate the K8s Secret `maplespike-stripe-secrets`
  # via sops-sync-k8s.sh from the SOPS-encrypted `quill/secrets/runtime.yaml`.
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  stripeAccountId: ""
  stripePublishableKey: ""
