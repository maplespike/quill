{{/*
  Quill — Redis (cache + distributed rate-limit state)

  Gate A2-REDIS (#764, #770): the API used to point at a phantom endpoint
  (`redis.ai-inference`, a namespace that never existed), so the cache ran in
  bypass and the limiter ran in pass-through while the logs filled with
  connection errors. This Deployment + Service is the real backend: a
  namespace-local ClusterIP the API reaches through REDIS_URL.

  Deliberately ephemeral: the workload is a cache plus sliding-window
  counters. Both are rebuildable, so the data volume is an emptyDir and RDB
  persistence is switched off — a restart resets counters/cache instead of
  silently resurrecting stale state from a Longhorn volume.

  Not exposed outside the namespace: ClusterIP only, no NodePort, no Ingress.
  Matches the cluster convention for `media/redis` and `argocd-redis`
  (unauthenticated, network-isolated). Do not add an Ingress.
*/}}
{{- if (.Values.redis | default dict).enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-redis
    component: cache
spec:
  replicas: {{ .Values.redis.replicas | default 1 }}
  strategy:
    # Single replica, single writer: no surge pod may hold the same counters.
    type: Recreate
  selector:
    matchLabels:
      app: quill-redis
  template:
    metadata:
      labels:
        app: quill-redis
    spec:
      {{- with ($.Values.priorityClass | default dict).critical }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.redis.nodeName }}
      nodeName: {{ .Values.redis.nodeName }}
      {{- end }}
      securityContext:
        # The upstream redis image runs as root by default; the redis account
        # baked into the image is uid 999 / gid 1000 (verified against
        # public.ecr.aws/docker/library/redis:8.2.3-alpine). fsGroup makes the
        # emptyDir group-writable for that account.
        runAsNonRoot: true
        runAsUser: {{ .Values.redis.runAsUser | default 999 }}
        runAsGroup: {{ .Values.redis.runAsGroup | default 1000 }}
        fsGroup: {{ .Values.redis.fsGroup | default 1000 }}
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: {{ .Values.redis.image | quote }}
        imagePullPolicy: {{ .Values.redis.pullPolicy | default .Values.image.pullPolicy }}
        args:
        - "--maxmemory"
        - {{ .Values.redis.maxmemory | default "128mb" | quote }}
        # Cache semantics: evict the least-recently-used key instead of
        # refusing writes once the budget is full.
        - "--maxmemory-policy"
        - "allkeys-lru"
        # No RDB snapshots, no AOF: the volume is ephemeral by design.
        - "--save"
        - ""
        - "--appendonly"
        - "no"
        - "--dir"
        - "/data"
        ports:
        - name: redis
          containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "cpu" "200m" "memory" "192Mi")) .Values.redis.resources) | nindent 10 }}
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-redis
    component: cache
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
  selector:
    app: quill-redis
{{- end }}
