# Quill — policy-intelligence engine sweep.
#
# values.engine.schedule used to sit in the chart with no CronJob, so
# GET /v1/engine/status stayed never_run. This job runs the sweep entry
# that the api image already ships (Dockerfile.api copies packages/engine).
# It mounts the same SQLite file the ingest jobs write, because the sweep
# reads canonical rows and writes briefs there.
#
# Do not point this at a separate "engine" image. values-prod pins api, mcp,
# portal, and ingest only. quill.image fails closed when a service has no pin.
{{- if .Values.engine.enabled }}
{{- $sqlite := and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "quill.fullname" . }}-engine-sweep
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-engine
    component: engine
spec:
  schedule: "{{ .Values.engine.schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: quill-engine
            component: engine
          {{- with include "quill.imageAnnotations" (dict "svc" "api" "ctx" $) }}
          {{- . | nindent 10 }}
          {{- end }}
        spec:
          {{- with ($.Values.priorityClass | default dict).batch }}
          priorityClassName: {{ . }}
          {{- end }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          {{- if .Values.ingestion.nodeName }}
          nodeName: {{ .Values.ingestion.nodeName }}
          {{- end }}
          containers:
          - name: sweep
            image: {{ include "quill.image" (dict "svc" "api" "ctx" $) | quote }}
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            # entrypoint.sh is `exec node "$@"`. The register hook lets Node
            # load the engine's extensionless relative imports.
            args:
            - --import
            - ./packages/engine/dist/sweep/register.js
            - packages/engine/dist/sweep/run.js
            env:
            - name: NODE_ENV
              value: production
            {{- if $sqlite }}
            - name: QUILL_DB_PATH
              value: /data/quill/maplespike.db
            {{- end }}
            resources:
              requests:
                cpu: {{ .Values.engine.resources.requests.cpu }}
                memory: {{ .Values.engine.resources.requests.memory }}
              limits:
                cpu: {{ .Values.engine.resources.limits.cpu }}
                memory: {{ .Values.engine.resources.limits.memory }}
            {{- if $sqlite }}
            volumeMounts:
            - name: data
              mountPath: /data/quill
            {{- end }}
          {{- if $sqlite }}
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "quill.fullname" . }}-api-data
          {{- end }}
{{- end }}
