{{/*
  Quill Search Service — Service + PVC
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-search
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
    # component: metrics lets the quill-services VMServiceScrape select this
    # Service; without it the search service is invisible to monitoring.
    component: metrics
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8083
    targetPort: http
  - name: metrics
    port: 9466
    targetPort: metrics
  selector:
    app: quill-search
---
# Legacy index claim. Leave this object in the chart so Argo CD does not
# delete it on the sync that creates quill-search-data. It was created with
# no storageClassName, so the cluster default (local-path on this cluster)
# bound it to one node's disk. Do not add storageClassName here: that field
# is immutable, and a patch fails the sync. Delete the claim by hand after
# search.migrateLegacyIndex is false and the new volume serves /health.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quill.fullname" . }}-search-index
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.search.indexStorage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quill.fullname" . }}-search-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
    component: search
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.search.storageClass | default "longhorn" | quote }}
  resources:
    requests:
      storage: {{ .Values.search.indexStorage }}
