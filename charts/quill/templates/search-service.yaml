{{/*
  Quill Search Service — Service + PVC
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-search
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
    # component: metrics lets the quill-services VMServiceScrape select this
    # Service; without it the search service is invisible to monitoring.
    component: metrics
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8083
    targetPort: http
  - name: metrics
    port: 9466
    targetPort: metrics
  selector:
    app: quill-search
---
# Legacy index claim (local-path, bound to nexus). Rendered only while
# search.migrateLegacyIndex is true, i.e. while the init container still
# copies it onto quill-search-data. The copy finished in October 2026 and
# the flag is false in prod, so Argo CD prunes the claim. Do not add
# storageClassName here: that field is immutable, and a patch fails the sync.
{{- if .Values.search.migrateLegacyIndex }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quill.fullname" . }}-search-index
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.search.indexStorage }}
{{- end }}
{{- if not (.Values.storageCutover | default dict).useLocalPathCopies }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "quill.fullname" . }}-search-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
    component: search
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ .Values.search.storageClass | default "local-path" | quote }}
  resources:
    requests:
      storage: {{ .Values.search.indexStorage }}
{{- end }}
