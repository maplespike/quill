{{/*
  Quill Search Service — Deployment
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-search
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
    component: search
spec:
  replicas: {{ .Values.search.replicas }}
  # The index claim is ReadWriteOnce. A rolling update with maxSurge 1 asks
  # for a second pod, and that pod cannot mount the volume. Recreate frees
  # the claim first. Search has no public route, so the gap stays inside the
  # cluster.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quill-search
  template:
    metadata:
      labels:
        app: quill-search
      {{- with include "quill.imageAnnotations" (dict "svc" "search" "ctx" $) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      {{- with ($.Values.priorityClass | default dict).critical }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.search.migrateLegacyIndex }}
      # Legacy local-path index (only while migrateLegacyIndex): pin only when
      # search.nodeName / api.storage.nodeName is set. Empty falls through — do
      # not hardcode nexus (host-independence 2026-10-28).
      {{- $legacyNode := .Values.search.nodeName | default ((.Values.api.storage | default dict).nodeName) | default "" }}
      {{- if $legacyNode }}
      nodeName: {{ $legacyNode }}
      {{- end }}
      {{- else if .Values.search.nodeName }}
      nodeName: {{ .Values.search.nodeName }}
      {{- else }}
      {{- include "quill.nodeAffinity" (dict "affinityHosts" (.Values.search.affinityHosts | default list) "preferredHost" (.Values.search.preferredHost | default "")) | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      {{- if .Values.search.migrateLegacyIndex }}
      initContainers:
      - name: migrate-legacy-index
        # Same reference as the Redis Deployment (redis.image). Production
        # sets public.ecr.aws/docker/library/redis:8.2.3-alpine, which is
        # already in the nexus containerd store. A bare redis tag resolves
        # to docker.io and is not cached there.
        image: {{ .Values.redis.image | quote }}
        imagePullPolicy: {{ .Values.redis.pullPolicy | default "IfNotPresent" }}
        command: ["/bin/sh", "/scripts/migrate-search-index.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: index
          mountPath: /data
        - name: legacy
          mountPath: /legacy
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
      {{- end }}
      containers:
      - name: search
        image: {{ include "quill.image" (dict "svc" "search" "ctx" $) | quote }}
        imagePullPolicy: {{ include "quill.pullPolicy" (dict "svc" "search" "ctx" $) }}
        # Dockerfile.search sets the same ENTRYPOINT/CMD, so this block restates
        # the image's own defaults. Kept explicit on purpose: the previous
        # quill/search image had neither, and a manifest that names the
        # subcommand is readable without opening the image. Args mirror the
        # documented CLI (rust/crates/quill-search/src/main.rs:
        # `serve --index --port --metrics-port`) and the containerPorts below.
        command: ["quill-search"]
        args:
          - serve
          - --index
          - /data/index
          - --port
          - "8083"
          - --metrics-port
          - "9466"
        # Numeric UID: the image user is the named account "quill" (uid 1001),
        # and kubelet cannot verify a named user is non-root under runAsNonRoot.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        - name: metrics
          containerPort: 9466
          protocol: TCP
        env:
        - name: RUST_LOG
          value: {{ .Values.search.logLevel | default "info" | quote }}
        - name: QUILL_SEARCH_INDEX_DIR
          value: "/data/index"
        resources:
          requests:
            cpu: {{ .Values.search.resources.requests.cpu }}
            memory: {{ .Values.search.resources.requests.memory }}
          limits:
            cpu: {{ .Values.search.resources.limits.cpu }}
            memory: {{ .Values.search.resources.limits.memory }}
        # The index is opened before the listener binds. startupProbe absorbs
        # that wait. /health is a small JSON document, not a search.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: index
          # Mount the volume at /data; the index lives in its `index/` subdir
          # (matches QUILL_SEARCH_INDEX_DIR=/data/index below).
          mountPath: /data
      volumes:
      - name: index
        persistentVolumeClaim:
          claimName: {{ include "quill.fullname" . }}-search-data
      {{- if .Values.search.migrateLegacyIndex }}
      - name: legacy
        persistentVolumeClaim:
          claimName: {{ include "quill.fullname" . }}-search-index
          readOnly: true
      - name: scripts
        configMap:
          name: {{ include "quill.fullname" . }}-backup-scripts
          defaultMode: 0555
      {{- end }}
