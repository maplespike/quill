{{/*
  Quill Search Service — Deployment
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-search
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-search
    component: search
spec:
  replicas: {{ .Values.search.replicas }}
  # The index claim is ReadWriteOnce. A rolling update with maxSurge 1 asks
  # for a second pod, and that pod cannot mount the volume. Recreate frees
  # the claim first. Search has no public route, so the gap stays inside the
  # cluster.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: quill-search
  template:
    metadata:
      labels:
        app: quill-search
      {{- with include "quill.imageAnnotations" (dict "svc" "search" "ctx" $) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      {{- if .Values.search.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.search.nodeSelector | nindent 8 }}
      {{- else if .Values.search.nodeName }}
      nodeName: {{ .Values.search.nodeName }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
      {{- if .Values.search.migrateLegacyIndex }}
      initContainers:
      - name: migrate-legacy-index
        image: {{ .Values.redis.image | quote }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/migrate-search-index.sh"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: index
          mountPath: /data
        - name: legacy
          mountPath: /legacy
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
      {{- end }}
      containers:
      - name: search
        image: {{ include "quill.image" (dict "svc" "search" "ctx" $) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        # Numeric UID: the image user is the named account "quill" (uid 1001),
        # and kubelet cannot verify a named user is non-root under runAsNonRoot.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        - name: metrics
          containerPort: 9466
          protocol: TCP
        env:
        - name: RUST_LOG
          value: {{ .Values.search.logLevel | default "info" | quote }}
        - name: QUILL_SEARCH_INDEX_DIR
          value: "/data/index"
        resources:
          requests:
            cpu: {{ .Values.search.resources.requests.cpu }}
            memory: {{ .Values.search.resources.requests.memory }}
          limits:
            cpu: {{ .Values.search.resources.limits.cpu }}
            memory: {{ .Values.search.resources.limits.memory }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: index
          # Mount the volume at /data; the index lives in its `index/` subdir
          # (matches QUILL_SEARCH_INDEX_DIR=/data/index below).
          mountPath: /data
      volumes:
      - name: index
        persistentVolumeClaim:
          claimName: {{ include "quill.fullname" . }}-search-data
      {{- if .Values.search.migrateLegacyIndex }}
      - name: legacy
        persistentVolumeClaim:
          claimName: {{ include "quill.fullname" . }}-search-index
          readOnly: true
      - name: scripts
        configMap:
          name: {{ include "quill.fullname" . }}-backup-scripts
          defaultMode: 0555
      {{- end }}
