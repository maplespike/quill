{{/*
  Quill — Portal Deployment + Service

  PLACEMENT: dynamic. The portal is stateless (no volumes, no hostPath), so it
  is the one quill workload that can be fully scheduler-managed — no nodeName
  pin. It floats across the labelled nodes (quill.io/workload=true), spread by
  topology + anti-affinity so a single node loss cannot take both replicas.

  The api/mcp/search pods stay pinned because their storage is node-local
  (local-path PVCs). That is a real constraint, not a preference — see
  values-prod.yaml. Making THOSE dynamic needs shared storage first.
*/}}
{{- if (.Values.portal | default dict).enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
    component: portal
spec:
  replicas: {{ .Values.portal.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #758: zero-downtime rollouts for every deployment (matches api).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quill-portal
  template:
    metadata:
      labels:
        app: quill-portal
      {{- with include "quill.imageAnnotations" (dict "svc" "portal" "ctx" $) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      # Dynamic placement. nodeName would bypass the scheduler entirely and
      # pin the portal to one node; nodeSelector keeps the scheduler in control
      # while restricting to nodes that hold the pinned image.
      {{- if .Values.portal.nodeName }}
      nodeName: {{ .Values.portal.nodeName }}
      {{- else if (.Values.portal | default dict).nodeSelector }}
      nodeSelector:
        {{- toYaml (.Values.portal | default dict).nodeSelector | nindent 8 }}
      {{- end }}
      # Spread replicas across DIFFERENT nodes — hard, not soft. Measured
      # 2026-10-06: with ScheduleAnyway + preferred anti-affinity both replicas
      # landed on the same node, because during a simultaneous rollout neither
      # pod sees the other and the scoring picks one node. That is two things to
      # lose at once — not HA. DoNotSchedule makes "one replica per node" an
      # invariant: if a node is unavailable the extra replica stays Pending,
      # which is correct — a Pending pod is honest, a co-located one is a false
      # sense of redundancy.
      {{- if gt (int (.Values.portal.replicas | default 1)) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: quill-portal
      # REQUIRED anti-affinity, not preferred. Measured 2026-10-06: with soft
      # constraints (and even with DoNotSchedule spread) both replicas
      # co-located, because during a rollout the scheduler does not count a pod
      # that is still terminating — so the second replica sees an empty node.
      # requiredDuringScheduling makes co-location a scheduling ERROR: the
      # second replica stays Pending until the first node is free of its peer.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: quill-portal
      {{- end }}
      containers:
      - name: portal
        # Digest-pinned import from the node containerd store — see
        # charts/quill/values-prod.yaml and docs/IMAGE-PINNING.md.
        image: {{ include "quill.image" (dict "svc" "portal" "ctx" $) | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: API_UPSTREAM
          value: "http://{{ include "quill.fullname" . }}-api:{{ .Values.api.port }}"
        ports:
        - name: http
          containerPort: {{ .Values.portal.port | default 8080 }}
        # Probes: without these the Service routes to a portal whose upstream
        # (the api) is unreachable, and a rolling update has no readiness gate.
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 3
        resources:
          {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi")) .Values.portal.resources) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
spec:
  type: NodePort
  ports:
  - port: {{ .Values.portal.port | default 8080 }}
    targetPort: {{ .Values.portal.port | default 8080 }}
    nodePort: 30964
  selector:
    app: quill-portal
{{- if gt (int (.Values.portal.replicas | default 1)) 1 }}
---
{{/*
  PDB: HA is not just "run 2 replicas" — it is "a voluntary disruption cannot
  take both". Without this, a node drain evicts both replicas at once and the
  portal goes dark during maintenance. minAvailable: 1 keeps one serving.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quill-portal
{{- end }}
{{- end }}
