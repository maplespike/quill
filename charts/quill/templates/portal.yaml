{{/*
  Quill — Portal Deployment + Service
*/}}
{{- if (.Values.portal | default dict).enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
    component: portal
spec:
  replicas: {{ .Values.portal.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #758: zero-downtime rollouts for every deployment (matches api).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quill-portal
  template:
    metadata:
      labels:
        app: quill-portal
    spec:
      {{- with (.Values.portal | default dict).nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: portal
        image: {{ printf "%s/quill-portal:%s" .Values.image.registry .Values.image.tag | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: API_UPSTREAM
          value: "http://{{ include "quill.fullname" . }}-api:{{ .Values.api.port }}"
        ports:
        - containerPort: {{ .Values.portal.port | default 8080 }}
        resources:
          {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi")) .Values.portal.resources) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
spec:
  type: NodePort
  ports:
  - port: {{ .Values.portal.port | default 8080 }}
    targetPort: {{ .Values.portal.port | default 8080 }}
    nodePort: 30964
  selector:
    app: quill-portal
{{- end }}
