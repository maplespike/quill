{{/*
  Quill — Portal Deployment + Service

  PLACEMENT: required hostname affinity on nexus and sentry-agent (never
  forge). The portal is stateless. Two replicas use anti-affinity. The
  image is pulled from the in-cluster registry (imagePullPolicy
  IfNotPresent). Both nodes mirror that registry, so a replica can start
  on either host.
*/}}
{{- if (.Values.portal | default dict).enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
    component: portal
spec:
  replicas: {{ .Values.portal.replicas | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxSurge: 0 (2026-10-26). With REQUIRED anti-affinity on the 2-node
      # quill.io/workload pool, both nodes already hold a replica, so a surge
      # pod can never schedule: it sits Pending (fleet-critical has
      # preemptionPolicy Never, so it cannot preempt either). When two syncs
      # land back to back, that Pending surge pod plus three ReplicaSets
      # stalled the rollout for 2h past its progress deadline and failed
      # deploy-prod (run 40331119588). With maxSurge: 0 the controller
      # removes one old pod first and the replacement schedules into the
      # freed slot, one node at a time. The other replica keeps serving.
      maxSurge: 0
      # maxUnavailable: 1 ONLY because this deployment has REQUIRED anti-affinity
      # on a 2-node pool. maxUnavailable: 0 + hard anti-affinity deadlocks: the
      # new pod cannot schedule while the old one holds the peer slot, and the
      # old one is not removed until the new one is ready (measured 2026-10-06).
      # The PDB (minAvailable: 1) still guarantees a drain leaves one serving;
      # this only permits a brief single-replica window DURING a rollout.
      # With a 3+ node pool, restore maxUnavailable: 0.
      maxUnavailable: 1
  selector:
    matchLabels:
      app: quill-portal
  template:
    metadata:
      labels:
        app: quill-portal
      {{- with include "quill.imageAnnotations" (dict "svc" "portal" "ctx" $) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      {{- with ($.Values.priorityClass | default dict).critical }}
      priorityClassName: {{ . }}
      {{- end }}
      # Dynamic placement. nodeName bypasses the scheduler; otherwise use
      # affinityHosts (nexus|sentry-agent; never forge) + preferredHost.
      {{- if .Values.portal.nodeName }}
      nodeName: {{ .Values.portal.nodeName }}
      {{- end }}
      # Spread replicas across DIFFERENT nodes — hard, not soft. Measured
      # 2026-10-06: with ScheduleAnyway + preferred anti-affinity both replicas
      # landed on the same node, because during a simultaneous rollout neither
      # pod sees the other and the scoring picks one node. That is two things to
      # lose at once — not HA. DoNotSchedule makes "one replica per node" an
      # invariant: if a node is unavailable the extra replica stays Pending,
      # which is correct — a Pending pod is honest, a co-located one is a false
      # sense of redundancy.
      {{- $portalHosts := (.Values.portal | default dict).affinityHosts | default list }}
      {{- $portalPref := (.Values.portal | default dict).preferredHost | default "" }}
      {{- if gt (int (.Values.portal.replicas | default 1)) 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: quill-portal
      {{- end }}
      {{- if or $portalHosts (gt (int (.Values.portal.replicas | default 1)) 1) }}
      affinity:
        {{- if $portalHosts }}
        nodeAffinity:
{{- include "quill.nodeAffinityBody" (dict "affinityHosts" $portalHosts "preferredHost" $portalPref) | nindent 10 }}
        {{- end }}
        {{- if gt (int (.Values.portal.replicas | default 1)) 1 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: quill-portal
        {{- end }}
      {{- end }}
      containers:
      - name: portal
        # Digest-pinned import from the node containerd store — see
        # charts/quill/values-prod.yaml and docs/IMAGE-PINNING.md.
        image: {{ include "quill.image" (dict "svc" "portal" "ctx" $) | quote }}
        imagePullPolicy: {{ include "quill.pullPolicy" (dict "svc" "portal" "ctx" $) }}
        env:
        - name: API_UPSTREAM
          value: "http://{{ include "quill.fullname" . }}-api:{{ .Values.api.port }}"
        # Public by design (it ships in the browser bundle), but it is an
        # environment fact: server.py appends it to /config.js so the embedded
        # checkout works even when the image was built without
        # PUBLIC_STRIPE_PUBLISHABLE_KEY. Empty = fall back to the built bundle.
        - name: STRIPE_PUBLISHABLE_KEY
          value: {{ index (.Values.secrets | default dict) "stripePublishableKey" | default "" | quote }}
        ports:
        - name: http
          containerPort: {{ .Values.portal.port | default 8080 }}
        # /health is a tiny JSON body. Probing / would read the homepage on
        # every period. The Python process is up before it serves files, so
        # it does not need a startupProbe.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi")) .Values.portal.resources) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
spec:
  type: NodePort
  ports:
  - port: {{ .Values.portal.port | default 8080 }}
    targetPort: {{ .Values.portal.port | default 8080 }}
    nodePort: {{ .Values.portal.nodePort | default 30964 }}
  selector:
    app: quill-portal
{{- if gt (int (.Values.portal.replicas | default 1)) 1 }}
---
{{/*
  PDB: HA is not just "run 2 replicas" — it is "a voluntary disruption cannot
  take both". Without this, a node drain evicts both replicas at once and the
  portal goes dark during maintenance. minAvailable: 1 keeps one serving.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "quill.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-portal
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: quill-portal
{{- end }}
{{- end }}
