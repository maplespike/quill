{{/*
  Quill — Secrets template
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: quill-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- if .Values.secrets.apiKey }}
  apiKey: {{ .Values.secrets.apiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: quill-db-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  postgres-user: {{ (.Values.database | default dict).user | default "maplespike" | quote }}
  postgres-password: {{ .Values.secrets.dbPassword | default "maplespike" | quote }}
  postgres-database: {{ (.Values.database | default dict).database | default "maplespike" | quote }}
