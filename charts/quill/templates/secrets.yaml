{{/*
  Quill — Secrets template. quill-secrets (apiKey, jwtSecret, githubClientId,
  githubClientSecret) is OPERATOR-MANAGED and deliberately NOT rendered here:
  ArgoCD selfHeal owns this chart, so chart-rendered keys would wipe any
  out-of-band values on every sync (2026-09-21: secret emptied -> GitHub OAuth
  + JWT_SECRET dropped from the pod env). Create it before install (see
  docs/STANDUP-2026-09-17.md) and keep it synced via scripts/sops-sync-k8s.sh.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: quill-db-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  postgres-user: {{ (.Values.database | default dict).user | default "maplespike" | quote }}
  postgres-password: {{ .Values.secrets.dbPassword | default "maplespike" | quote }}
  postgres-database: {{ (.Values.database | default dict).database | default "maplespike" | quote }}
