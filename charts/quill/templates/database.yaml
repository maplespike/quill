{{/*
  Quill — Database StatefulSet + Service (PostgreSQL)
*/}}
{{- if (.Values.database | default dict).enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "quill.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-db
    component: database
    tier: data
spec:
  replicas: 1
  serviceName: {{ include "quill.fullname" . }}-db
  selector:
    matchLabels:
      app: quill-db
  template:
    metadata:
      labels:
        app: quill-db
    spec:
      {{- if .Values.database.nodeName }}
      nodeName: {{ .Values.database.nodeName }}
      {{- end }}
      containers:
      - name: postgres
        image: {{ .Values.database.image | default "postgres:17-alpine" | quote }}
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-database
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          {{- toYaml .Values.database.resources | nindent 10 }}
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.database.user | default "maplespike" | quote }}]
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", {{ .Values.database.user | default "maplespike" | quote }}]
          initialDelaySeconds: 10
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- with .Values.database.storageClass }}
      storageClassName: {{ . | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.database.storage | default "5Gi" | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quill.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-db
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: quill-db
{{- end }}
