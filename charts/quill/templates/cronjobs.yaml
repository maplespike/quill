{{- range $name, $schedule := .Values.ingestion.schedules }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "quill.fullname" $ }}-ingest-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: quill-ingest
    pipeline: {{ $name }}
spec:
  schedule: "{{ $schedule }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ingest
            image: "{{ $.Values.image.registry }}/quill-ingest:{{ $.Values.image.tag }}"
            imagePullPolicy: {{ $.Values.image.pullPolicy }}
            env:
            - name: QUILL_PIPELINE
              value: {{ $name }}
            - name: NODE_ENV
              value: production
            - name: PROMETHEUS_PUSHGATEWAY
              value: "http://prometheus-pushgateway.observability:9091"
            {{- if eq $.Values.api.env.QUILL_STORAGE "postgres" }}
            - name: QUILL_DB_HOST
              value: "{{ $.Values.api.env.QUILL_DB_HOST | default "quill-db" }}"
            - name: QUILL_DB_PORT
              value: "{{ $.Values.api.env.QUILL_DB_PORT | default "5432" }}"
            - name: QUILL_DB_NAME
              value: "{{ $.Values.api.env.QUILL_DB_NAME | default "maplespike" }}"
            - name: QUILL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: quill-db-secret
                  key: postgres-user
            - name: QUILL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quill-db-secret
                  key: postgres-password
            {{- end }}
            resources:
              requests:
                cpu: {{ $.Values.ingestion.resources.requests.cpu }}
                memory: {{ $.Values.ingestion.resources.requests.memory }}
              limits:
                cpu: {{ $.Values.ingestion.resources.limits.cpu }}
                memory: {{ $.Values.ingestion.resources.limits.memory }}
          {{- if $.Values.secrets.canliiApiKey }}
            envFrom:
            - secretRef:
                name: quill-secrets
          {{- end }}
---
{{- end }}
