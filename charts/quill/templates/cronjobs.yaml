# Quill — ingestion CronJobs (one per pipeline in .Values.ingestion.schedules)
#
# Every job:
#   - runs the quill-ingest image (the CLI runner in pipeline-core),
#   - mounts the SAME PVC as the api pod and points QUILL_DB_PATH at the api's
#     SQLite file, so ingested rows and claim bundles land in the store the API
#     reads (a job writing to an ephemeral path is invisible to /v1/claims/latest),
#   - records its run in the shared `ingest_runs` table, which
#     /v1/ingest/status reads back — a stopped pipeline raises a stale signal
#     instead of failing silently.
#
# The PVC is ReadWriteOnce, so ingestion.nodeName MUST match the node that
# holds the api pod's volume (api.storage.nodeName in sqlite mode).
{{- if .Values.ingestion.enabled }}
{{- $sqlite := and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
{{- range $name, $schedule := .Values.ingestion.schedules }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "quill.fullname" $ }}-ingest-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: quill-ingest
    component: ingestion
    pipeline: {{ $name }}
spec:
  schedule: "{{ $schedule }}"
  # Suspension lives in git (ingestion.suspended), not in a kubectl patch.
  # Always rendered so Argo owns the field and can clear an old live patch.
  suspend: {{ has $name ($.Values.ingestion.suspended | default list) }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ $.Values.ingestion.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ $.Values.ingestion.failedJobsHistoryLimit | default 3 }}
  startingDeadlineSeconds: {{ $.Values.ingestion.startingDeadlineSeconds | default 600 }}
  jobTemplate:
    spec:
      backoffLimit: {{ $.Values.ingestion.backoffLimit | default 1 }}
      # Per-pipeline override first (ingestion.deadlines.<pipeline>), then the
      # chart-wide default. One deadline for every pipeline is wrong: the
      # influence crawl walks actor and funding pages and can legitimately run
      # past 30 minutes, while a feed reader that needs 30 minutes is stuck.
      # 2026-10-23 04:00 CDT: Job quill-ingest-influence-29879100 failed with
      # "Job was active longer than specified deadline" at the 1800s default,
      # and the next run finished in 9 min (QUILL-AUDIT.md, P2).
      activeDeadlineSeconds: {{ (get ($.Values.ingestion.deadlines | default dict) $name) | default ($.Values.ingestion.activeDeadlineSeconds | default 1800) }}
      # Finished ingest pods used to linger forever (no TTL, history 3 each), and
      # nexus's kubelet pod cap (110 by default) filled up until later runs were
      # rejected with OutOfpods (seen 2026-09-25 on quill-ingest-realtime/ngo-rss).
      # The TTL deletes the Job - and with it the pod - 10 minutes after it
      # finishes; widen it via values when debugging a failed ingest.
      {{- /*
        Opt-in only. A default TTL deletes a finished Job's evidence minutes
        after the run, so a failed ingest leaves nothing to inspect — the exact
        blind spot this pipeline exists to remove. Retention is already bounded
        by successful/failedJobsHistoryLimit; set this only when you want
        aggressive cleanup and accept the loss of forensics.
      */}}
      {{- with $.Values.ingestion.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          labels:
            app: quill-ingest
            pipeline: {{ $name }}
          {{- with include "quill.imageAnnotations" (dict "svc" "ingest" "ctx" $) }}
          {{- . | nindent 10 }}
          {{- end }}
        spec:
          {{- with ($.Values.priorityClass | default dict).batch }}
          priorityClassName: {{ . }}
          {{- end }}
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          {{- if $sqlite }}
          # RWO quill-api-data: must share the live api pod's node.
          # Soft nexus|sentry affinity alone scheduled onto sentry while api
          # held the volume on nexus → FailedAttachVolume (2026-11-04).
          {{- include "quill.rwoApiCoLocate" . | nindent 10 }}
          {{- else if $.Values.ingestion.nodeName }}
          nodeName: {{ $.Values.ingestion.nodeName }}
          {{- else }}
          {{- include "quill.nodeAffinity" (dict "affinityHosts" ($.Values.ingestion.affinityHosts | default list) "preferredHost" ($.Values.ingestion.preferredHost | default "")) | nindent 10 }}
          {{- end }}
          containers:
          - name: ingest
            # Digest-pinned from the node containerd store, like the services
            # (docs/IMAGE-PINNING.md). Never render a bare registry/tag here:
            # an unset tag makes the reference invalid (InvalidImageName).
            image: {{ include "quill.image" (dict "svc" "ingest" "ctx" $) | quote }}
            imagePullPolicy: {{ include "quill.pullPolicy" (dict "svc" "ingest" "ctx" $) }}
            env:
            - name: NODE_ENV
              value: production
            - name: QUILL_PIPELINE
              value: {{ $name | quote }}
            # Read back by the API to derive the staleness bound (2x the period).
            - name: QUILL_INGEST_SCHEDULE
              value: {{ $schedule | quote }}
            {{- if $sqlite }}
            # Same file the api-server opens — see templates/deployments.yaml.
            - name: QUILL_DB_PATH
              value: /data/quill/maplespike.db
            {{- end }}
            {{- if eq $.Values.api.env.QUILL_STORAGE "postgres" }}
            - name: QUILL_DB_HOST
              value: "{{ $.Values.api.env.QUILL_DB_HOST | default "quill-db" }}"
            - name: QUILL_DB_PORT
              value: "{{ $.Values.api.env.QUILL_DB_PORT | default "5432" }}"
            - name: QUILL_DB_NAME
              value: "{{ $.Values.api.env.QUILL_DB_NAME | default "maplespike" }}"
            - name: QUILL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: quill-db-secret
                  key: postgres-user
            - name: QUILL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quill-db-secret
                  key: postgres-password
            {{- end }}
            # Only modules that need a data-source key read these; optional so a
            # missing key degrades one pipeline instead of blocking the job.
            - name: OPENCORPORATES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quill-secrets
                  key: opencorporatesApiKey
                  optional: true
            # Freshness ledger: the cronjob reports each run's outcome to the API,
            # which owns the ledger file the quality report reads.
            - name: QUILL_API_URL
              value: "http://{{ include "quill.fullname" $ }}-api:{{ $.Values.api.port }}"
            - name: INTERNAL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: quill-secrets
                  key: internalJwtSecret
            {{- $res := $.Values.ingestion.resources }}
            {{- if and $.Values.ingestion.resourcesByPipeline (index $.Values.ingestion.resourcesByPipeline $name) }}
            {{- $res = index $.Values.ingestion.resourcesByPipeline $name }}
            {{- end }}
            resources:
              requests:
                cpu: {{ $res.requests.cpu }}
                memory: {{ $res.requests.memory }}
              limits:
                cpu: {{ $res.limits.cpu }}
                memory: {{ $res.limits.memory }}
            {{- if $sqlite }}
            volumeMounts:
            - name: data
              mountPath: /data/quill
            {{- end }}
          {{- if $sqlite }}
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "quill.apiDataClaim" $ }}
          {{- end }}
{{- end }}
{{- end }}
