apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-api
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #816: zero-downtime rollouts keep the tunnel origin healthy.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quill-api
  template:
    metadata:
      labels:
        app: quill-api
    spec:
      securityContext:
        runAsNonRoot: true
      {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
      # SQLite on PVC → the pod must stay on the node holding its volume.
      # (Single-replica-per-node constraint; replicas>1 needs a shared FS or PG.)
      {{- if .Values.api.storage.nodeName }}
      nodeName: {{ .Values.api.storage.nodeName }}
      {{- end }}
      {{- end }}
      containers:
      - name: api
        image: "{{ .Values.image.registry }}/quill-api:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.api.port }}
        env:
        - name: NODE_ENV
          value: "{{ .Values.api.env.NODE_ENV }}"
        - name: QUILL_STORAGE
          value: "{{ .Values.api.env.QUILL_STORAGE | default "memory" }}"
        {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
        - name: QUILL_DB_PATH
          value: /data/quill/maplespike.db
        {{- end }}
        - name: QUILL_API_URL
          value: "{{ .Values.api.env.QUILL_API_URL }}"
        - name: QUILL_QDRANT_ENDPOINT
          value: "{{ .Values.api.env.QUILL_QDRANT_ENDPOINT | default "http://qdrant:6333" }}"
        - name: QUILL_QDRANT_COLLECTION
          value: "{{ .Values.api.env.QUILL_QDRANT_COLLECTION | default "maplespike" }}"
        - name: QUILL_EMBED_MODEL
          value: "{{ .Values.api.env.QUILL_EMBED_MODEL | default "nvidia/llama-3.2-nv-embedqa-1b-v2" }}"
        - name: MAPLESPIKE_DOMAIN
          value: "{{ .Values.api.env.MAPLESPIKE_DOMAIN | default "maplespike.ca" }}"
        - name: MAPLESPIKE_ORIGIN
          value: "{{ .Values.api.env.MAPLESPIKE_ORIGIN | default "https://quill.maplespike.ca" }}"
        - name: PORTAL_URL
          value: "{{ .Values.api.env.PORTAL_URL | default "https://quill.maplespike.ca" }}"
        - name: APP_URL
          value: "{{ .Values.api.env.APP_URL | default "https://quill.maplespike.ca" }}"
        - name: GITHUB_REDIRECT_URI
          value: "{{ .Values.api.env.GITHUB_REDIRECT_URI | default "https://api.maplespike.ca/v1/auth/github/callback" }}"
        - name: MAPLESPIKE_OAUTH_REDIRECT_BASE
          value: "{{ .Values.api.env.MAPLESPIKE_OAUTH_REDIRECT_BASE | default "https://api.maplespike.ca/v1/auth/oauth" }}"
        - name: TRUST_PROXY
          value: "{{ .Values.api.env.TRUST_PROXY | default "true" }}"
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: githubClientId
              optional: true
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: githubClientSecret
              optional: true
        - name: QUILL_API_KEY
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: apiKey
              optional: true
        {{- if eq .Values.api.env.QUILL_STORAGE "postgres" }}
        - name: QUILL_DB_HOST
          value: "{{ .Values.api.env.QUILL_DB_HOST | default "quill-db" }}"
        - name: QUILL_DB_PORT
          value: "{{ .Values.api.env.QUILL_DB_PORT | default "5432" }}"
        - name: QUILL_DB_NAME
          value: "{{ .Values.api.env.QUILL_DB_NAME | default "maplespike" }}"
        - name: QUILL_DB_USER
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-user
        - name: QUILL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-password
        {{- end }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: jwtSecret
              optional: true
        # Decision 0002: stable 64-hex PII hash. Without it, register
        # refuses and OAuth user-dedupe degrades to per-boot hashing.
        - name: QUILL_PII_HASH_SECRET
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: pii-hash-secret
              optional: true
        # #806: Stripe billing secrets (sourced from quill-owned secret).
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: stripe-secret-key
              optional: true
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: stripe-webhook-secret
              optional: true
        - name: QUILL_BILLING_SECRET
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: quill-billing-secret
              optional: true
        - name: STRIPE_ENV
          value: "{{ .Values.api.env.STRIPE_ENV | default "test" }}"
        {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
        volumeMounts:
        - name: data
          mountPath: /data/quill
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.api.resources.requests.cpu }}
            memory: {{ .Values.api.resources.requests.memory }}
          limits:
            cpu: {{ .Values.api.resources.limits.cpu }}
            memory: {{ .Values.api.resources.limits.memory }}
      {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "quill.fullname" . }}-api-data
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-mcp
    component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #758: zero-downtime rollouts for every deployment (matches api).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quill-mcp
  template:
    metadata:
      labels:
        app: quill-mcp
    spec:
      securityContext:
        runAsNonRoot: true
      {{- with .Values.mcp.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: mcp
        image: "{{ .Values.image.registry }}/quill-mcp:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.mcp.port }}
        env:
        - name: NODE_ENV
          value: production
        - name: QUILL_API_URL
          value: "http://{{ include "quill.fullname" . }}-api:{{ .Values.api.port }}"
        - name: QUILL_API_KEY
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: apiKey
              optional: true
        resources:
          requests:
            cpu: {{ .Values.mcp.resources.requests.cpu }}
            memory: {{ .Values.mcp.resources.requests.memory }}
          limits:
            cpu: {{ .Values.mcp.resources.limits.cpu }}
            memory: {{ .Values.mcp.resources.limits.memory }}
