apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-api
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #816: zero-downtime rollouts keep the tunnel origin healthy.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quill-api
  template:
    metadata:
      labels:
        app: quill-api
      {{- with include "quill.imageAnnotations" (dict "svc" "api" "ctx" $) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      {{- with ($.Values.priorityClass | default dict).critical }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
      # SQLite on PVC: hard pin only when api.storage.nodeName is set. Otherwise
      # required affinityHosts (nexus|sentry-agent; never forge) + preferredHost.
      {{- if .Values.api.storage.nodeName }}
      nodeName: {{ .Values.api.storage.nodeName }}
      {{- else }}
      {{- include "quill.nodeAffinity" (dict "affinityHosts" (.Values.api.affinityHosts | default list) "preferredHost" (.Values.api.preferredHost | default "")) | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
      - name: api
        # Digest-pinned import from the node containerd store — see
        # charts/quill/values-prod.yaml and docs/IMAGE-PINNING.md.
        image: {{ include "quill.image" (dict "svc" "api" "ctx" $) | quote }}
        imagePullPolicy: {{ include "quill.pullPolicy" (dict "svc" "api" "ctx" $) }}
        ports:
        - name: http
          containerPort: {{ .Values.api.port }}
        - name: metrics
          containerPort: {{ .Values.api.metricsPort }}
        # Probes (QUILL-AUDIT.md 2026-10-24, P1): the live Deployment had
        # livenessProbe and readinessProbe unset, so a hung API kept its
        # endpoints and a rolling update had no readiness gate. Probe the real
        # health path, GET /v1/health — never /health, which answered 404 until
        # the API gained a 308 to this same path.
        # timeoutSeconds 5, not the 1s k8s default: the API answers in 213 ms
        # warm, but a CPU-throttled cold start on this cluster loses a 1s probe
        # (2026-08-11 incident, k8s/maplespike/quill-api-deployment.yaml:99).
        # startupProbe covers the cold node process. Liveness does not run
        # until this succeeds, so a slow boot is not killed and restarted.
        startupProbe:
          httpGet:
            path: /v1/health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /v1/health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: QUILL_API_METRICS_PORT
          value: {{ .Values.api.metricsPort | quote }}
        - name: NODE_ENV
          value: "{{ .Values.api.env.NODE_ENV }}"
        # In-process upstream prober behind GET /v1/upstream/status
        # (UPSTREAM-OUTAGES.md §6). "0" serves the route with no probes.
        - name: QUILL_UPSTREAM_PROBE
          value: "{{ .Values.api.env.QUILL_UPSTREAM_PROBE | default "1" }}"
        - name: ENVIRONMENT
          value: "{{ .Values.api.env.ENVIRONMENT | default "production" }}"
        - name: QUILL_STORAGE
          value: "{{ .Values.api.env.QUILL_STORAGE | default "memory" }}"
        {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
        - name: QUILL_DB_PATH
          value: /data/quill/maplespike.db
        {{- end }}
        - name: QUILL_API_URL
          value: "{{ .Values.api.env.QUILL_API_URL }}"
        - name: QUILL_QDRANT_ENDPOINT
          value: "{{ .Values.api.env.QUILL_QDRANT_ENDPOINT | default "http://qdrant:6333" }}"
        - name: QUILL_QDRANT_COLLECTION
          value: "{{ .Values.api.env.QUILL_QDRANT_COLLECTION | default "maplespike" }}"
        - name: QUILL_EMBED_MODEL
          value: "{{ .Values.api.env.QUILL_EMBED_MODEL | default "nvidia/llama-3.2-nv-embedqa-1b-v2" }}"
        - name: MAPLESPIKE_DOMAIN
          value: "{{ .Values.api.env.MAPLESPIKE_DOMAIN | default "maplespike.ca" }}"
        - name: MAPLESPIKE_ORIGIN
          value: "{{ .Values.api.env.MAPLESPIKE_ORIGIN | default "https://quill.maplespike.ca" }}"
        - name: PORTAL_URL
          value: "{{ .Values.api.env.PORTAL_URL | default "https://quill.maplespike.ca" }}"
        - name: APP_URL
          value: "{{ .Values.api.env.APP_URL | default "https://quill.maplespike.ca" }}"
        - name: GITHUB_REDIRECT_URI
          value: "{{ .Values.api.env.GITHUB_REDIRECT_URI | default "https://api.maplespike.ca/v1/auth/github/callback" }}"
        - name: MAPLESPIKE_OAUTH_REDIRECT_BASE
          value: "{{ .Values.api.env.MAPLESPIKE_OAUTH_REDIRECT_BASE | default "https://api.maplespike.ca/v1/auth/oauth" }}"
        - name: TRUST_PROXY
          value: "{{ .Values.api.env.TRUST_PROXY | default "true" }}"
        # A2-REDIS (#764, #770): the cache + distributed rate-limit endpoint.
        # Only injected when configured — an unset REDIS_URL is better than an
        # empty one, because the client reads "unset" as "no Redis, use the
        # in-memory fallback" instead of dialling a host nobody provisioned.
        {{- if .Values.api.env.REDIS_URL }}
        - name: REDIS_URL
          value: "{{ .Values.api.env.REDIS_URL }}"
        {{- end }}
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: githubClientId
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: githubClientSecret
        - name: QUILL_API_KEY
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: apiKey
        {{- if eq .Values.api.env.QUILL_STORAGE "postgres" }}
        - name: QUILL_DB_HOST
          value: "{{ .Values.api.env.QUILL_DB_HOST | default "quill-db" }}"
        - name: QUILL_DB_PORT
          value: "{{ .Values.api.env.QUILL_DB_PORT | default "5432" }}"
        - name: QUILL_DB_NAME
          value: "{{ .Values.api.env.QUILL_DB_NAME | default "maplespike" }}"
        - name: QUILL_DB_USER
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-user
        - name: QUILL_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: quill-db-secret
              key: postgres-password
        {{- end }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: jwtSecret
        # Internal service RPC: HMAC secret signing the short-lived X-Internal-Token
        # JWTs (audience quill-internal) for service-to-service calls incl. the
        # ingest ledger endpoint.
        - name: INTERNAL_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: internalJwtSecret
        # Decision 0002: stable 64-hex PII hash. Without it, register
        # refuses and OAuth user-dedupe degrades to per-boot hashing.
        - name: QUILL_PII_HASH_SECRET
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: pii-hash-secret
        # Dual-key PII rotation (Decision 0002): lookups also accept hashes
        # written under the retiring secret. Optional — absent means
        # single-key mode (pre-rotation behavior). Delivered from BSM
        # maplespike-secrets.pii-hash-secret-previous.
        - name: QUILL_PII_HASH_SECRET_PREVIOUS
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: pii-hash-secret-previous
              optional: true
        # #806: Stripe billing secrets (sourced from quill-owned secret).
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: stripe-secret-key
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: stripe-webhook-secret
        - name: QUILL_BILLING_SECRET
          valueFrom:
            secretKeyRef:
              name: maplespike-secrets
              key: quill-billing-secret
        - name: STRIPE_ENV
          value: "{{ .Values.api.env.STRIPE_ENV | default "test" }}"
        {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
        volumeMounts:
        - name: data
          mountPath: /data/quill
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.api.resources.requests.cpu }}
            memory: {{ .Values.api.resources.requests.memory }}
          limits:
            cpu: {{ .Values.api.resources.limits.cpu }}
            memory: {{ .Values.api.resources.limits.memory }}
      {{- if and .Values.api.storage (eq (.Values.api.env.QUILL_STORAGE | default "memory") "sqlite") }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "quill.fullname" . }}-api-data
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quill.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app: quill-mcp
    component: mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #758: zero-downtime rollouts for every deployment (matches api).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quill-mcp
  template:
    metadata:
      labels:
        app: quill-mcp
      {{- with include "quill.imageAnnotations" (dict "svc" "mcp" "ctx" $) }}
      {{- . | nindent 6 }}
      {{- end }}
    spec:
      {{- with ($.Values.priorityClass | default dict).critical }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      {{- if .Values.mcp.nodeName }}
      # Local-import images live per node: keep the pod on the node whose
      # containerd store holds the pinned digest (docs/IMAGE-PINNING.md).
      nodeName: {{ .Values.mcp.nodeName }}
      {{- else }}
      {{- include "quill.nodeAffinity" (dict "affinityHosts" (.Values.mcp.affinityHosts | default list) "preferredHost" (.Values.mcp.preferredHost | default "")) | nindent 6 }}
      {{- end }}
      containers:
      - name: mcp
        # Digest-pinned import from the node containerd store — see
        # charts/quill/values-prod.yaml and docs/IMAGE-PINNING.md.
        image: {{ include "quill.image" (dict "svc" "mcp" "ctx" $) | quote }}
        imagePullPolicy: {{ include "quill.pullPolicy" (dict "svc" "mcp" "ctx" $) }}
        ports:
        - name: http
          containerPort: {{ .Values.mcp.port }}
        - name: metrics
          containerPort: {{ .Values.mcp.metricsPort }}
        # Tool registration runs before the process listens. A startupProbe
        # waits that out. /health is the public process check; /sse is authenticated.
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: QUILL_MCP_METRICS_PORT
          value: {{ .Values.mcp.metricsPort | quote }}
        - name: NODE_ENV
          value: production
        - name: QUILL_API_URL
          value: "http://{{ include "quill.fullname" . }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.port }}"
        - name: QUILL_API_KEY
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: apiKey
        resources:
          requests:
            cpu: {{ .Values.mcp.resources.requests.cpu }}
            memory: {{ .Values.mcp.resources.requests.memory }}
          limits:
            cpu: {{ .Values.mcp.resources.limits.cpu }}
            memory: {{ .Values.mcp.resources.limits.memory }}
