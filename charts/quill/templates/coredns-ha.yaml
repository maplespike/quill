{{/*
  MapleSpike — CoreDNS High Availability Patch

  Scales CoreDNS to 2 replicas with pod anti-affinity so one CoreDNS pod
  runs on each node. This fixes cross-node DNS resolution failures that
  occur when pods on one node can't reach CoreDNS on another node (due to
  flannel overlay issues in K3s multi-node clusters).

  Apply: kubectl apply -f <this-rendered-manifest> -n kube-system
  Or:    helm upgrade --install maplespike charts/quill -n maplespike
         (this template renders regardless of namespace since it patches
         the kube-system deployment)
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
spec:
  replicas: 2
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: k8s-app
                operator: In
                values:
                - kube-dns
            topologyKey: kubernetes.io/hostname
