image:
  # Still the live pin. deploy-prod rewrites each images.<svc> entry to
  # registry + repository + pullPolicy IfNotPresent in one commit, and only
  # after the registry HEAD check passes for every service. Until that
  # commit, a render must keep these refs and Never.
  registry: docker.io/library
  tag: ''
  pullPolicy: Never
images:
  api:
    registry: "registry.registry.svc.cluster.local:5000"
    repository: "quill/api"
    pullPolicy: IfNotPresent
    digest: "sha256:42846d14ae8287cfe01ae44e0453b3363a778d61b72a548f3e8d2de4788ad84e"
    tag: "9f3a48d6ae9982f0adf3f637f8c7d9dedf0a680b"
  mcp:
    registry: "registry.registry.svc.cluster.local:5000"
    repository: "quill/mcp"
    pullPolicy: IfNotPresent
    digest: "sha256:081bab0cd640e5412d56c887269f877b1a21c93cd103399e0ed53e2645ccbade"
    tag: "bd65fcbe5ee40911a173b08dc5b90ce7db07ff83"
  portal:
    registry: "registry.registry.svc.cluster.local:5000"
    repository: "quill/portal"
    pullPolicy: IfNotPresent
    digest: "sha256:4f040e2eb0257e314686030e80fcf06505e65b478f7b05838c68ed4da602a430"
    tag: "8db874fc6c7248fa0cb73360aeee8f8d44454efa"
  ingest:
    registry: "registry.registry.svc.cluster.local:5000"
    repository: "quill/ingest"
    pullPolicy: IfNotPresent
    digest: "sha256:2c1184bf9a53d92d15e183d64aa7f7e3341b08735e7d7c13a7e2bec23e49eec1"
    tag: "bd65fcbe5ee40911a173b08dc5b90ce7db07ff83"
  search:
    registry: "registry.registry.svc.cluster.local:5000"
    repository: "quill/search"
    pullPolicy: IfNotPresent
    digest: "sha256:4f5fcbfdafefe209d2a0145debc0405649bebde0c6185d89fb110bc1f7da7f24"
    tag: "bd65fcbe5ee40911a173b08dc5b90ce7db07ff83"
# CPU order (Reverb 2026-10-28 15:06 CT): nexus first, then sentry;
# forge last and only for ultra-light work (cloudflared). Heavy workloads
# use required hostname In affinityHosts + preferredHost weight 100.
# No kubectl node-label writes — affinity uses kubernetes.io/hostname only.
affinityHosts: &quillHeavyHosts
  - nexus
  - sentry
preferredHost: &quillPreferredHost nexus

api:
  replicas: 1
  port: 8082
  metricsPort: 9464
  # Memory request covers a live working set of about 146Mi (operator
  # sample), plus headroom. That sample is not a 7-day peak. Ingest, engine,
  # and backup peaks are separate pods. CPU request unchanged. Limit stays 512Mi.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    QUILL_API_URL: http://quill-api.maplespike.svc.cluster.local:8082/v1
    NODE_ENV: production
    ENVIRONMENT: production
    QUILL_STORAGE: sqlite
    MAPLESPIKE_DOMAIN: maplespike.ca
    MAPLESPIKE_ORIGIN: https://quill.maplespike.ca
    PORTAL_URL: https://quill.maplespike.ca
    APP_URL: https://quill.maplespike.ca
    GITHUB_REDIRECT_URI: https://api.maplespike.ca/v1/auth/github/callback
    MAPLESPIKE_OAUTH_REDIRECT_BASE: https://api.maplespike.ca/v1/auth/oauth
    TRUST_PROXY: 'true'
    REDIS_URL: redis://quill-redis:6379
    STRIPE_ENV: live
    # Account the live and test keys belong to (pk_live_ and pk_test_ carry the
    # same id). Diagnostics only — the billing status payload's
    # accountFingerprint reads it; no Connect/Stripe-Account usage.
    STRIPE_ACCOUNT_ID: acct_1TXKNtIZlbpvSCVX
  ingress:
    host: api.maplespike.ca
    tls: true
  storage:
    size: 5Gi
    # Migrated from local-path to longhorn (t_9dfeef39): 2 replicas, removing
    # the single-nexus failure domain for the API's SQLite volume.
    storageClass: longhorn
    # 2026-10-28: longhorn RWO; schedule via affinityHosts (not forge).
    nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
mcp:
  replicas: 1
  port: 3001
  metricsPort: 9465
  # 2026-10-28: nexus|sentry only (never forge).
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  # No working-set or CPU sample in-repo. The Grafana dashboard counts
  # pipeline jobs only. Modest cut. Limit stays 256Mi.
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ingress:
    host: mcp.maplespike.ca
    tls: true
redis:
  enabled: true
  replicas: 1
  image: public.ecr.aws/docker/library/redis:8.2.3-alpine
  pullPolicy: IfNotPresent
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  maxmemory: 128mb
  # No working-set sample. maxmemory 128mb is the data ceiling, already
  # above this 64Mi request and under the 192Mi limit, so the memory request
  # stays. CPU request halved. No CPU sample.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
database:
  enabled: false
  image: docker.io/library/postgres:17-alpine
  user: maplespike
  database: maplespike
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storageClass: longhorn
  nodeName: ""
portal:
  enabled: true
  # HA: 2 replicas, spread by topology + anti-affinity, guarded by a PDB
  # (charts/quill/templates/portal.yaml). The portal is stateless, so unlike
  # api/mcp/search it needs no node pin.
  replicas: 2
  port: 8080
  # CPU order: nexus preferred, sentry fallback; never forge (Reverb 15:06 CT).
  # Combined with required podAntiAffinity when replicas>1 (portal.yaml).
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  # No production working-set sample in-repo. A local idle start of
  # packages/portal/server.py was about 20Mi, so 32Mi already has headroom.
  # CPU request halved. No CPU sample. Limit stays 64Mi.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  ingress:
    host: maplespike.ca
    tls: true
cloudflared:
  enabled: false
  image: docker.io/cloudflare/cloudflared
  tag: 2026.8.2
  pullPolicy: IfNotPresent
  replicas: 1
  tunnelId: 66d76492-036b-4177-8fac-8682e0eda37e
  # Ultra-light only: may land on forge (Reverb 15:06 CT).
  affinityHosts:
    - nexus
    - sentry
    - forge
  preferredHost: nexus
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
  - hostname: api.maplespike.ca
    service: http://quill-api.maplespike.svc.cluster.local:8082
  - hostname: mcp.maplespike.ca
    service: http://quill-mcp.maplespike.svc.cluster.local:3001
  - hostname: kanban.maplespike.ca
    service: http://quill-kanban-exec.maplespike.svc.cluster.local:8080
secrets:
  apiKey: ''
  jwtSecret: ''
  dbPassword: ''
  stripeSecretKey: ''
  stripeWebhookSecret: ''
  stripeAccountId: ''
  # Publishable by design: it ships in the portal's client bundle, so it is not
  # a secret and is not duplicated here. The canonical copy is the build env in
  # .github/workflows/ci.yml; the portal image bakes it into its bundle at build
  # time, so an empty value here is the normal case.
  #
  # When set, portal.yaml passes it to the portal as STRIPE_PUBLISHABLE_KEY and
  # server.py appends it to /config.js — the recovery path for an image built
  # without it (the 2026-11 "Checkout is not configured for this build" bug).
  # Do not paste the key here: the leakguard gate flags a pk_live_ literal in
  # this file, and the image rebuild is the delivery path.
  stripePublishableKey: ''
ingestion:
  enabled: true
  # Prefer rwoApiCoLocate (template) over nodeName; leave empty.
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  activeDeadlineSeconds: 1800
  # Age out finished Job pods (Error pods from Oct lingered 4d with history=3 alone).
  ttlSecondsAfterFinished: 7200
  failedJobsHistoryLimit: 1
  schedules:
    committees: 0 */6 * * *
    gazette: 0 */12 * * *
    oversight: 0 */12 * * *
    corporate: 0 2 * * *
    influence: 0 4 * * *
    ngo-rss: '*/15 * * * *'
    realtime: '*/30 * * * *'
    a2aj: null
    canlii: null
    culture: null
    defence: null
    gic: null
    immigration: null
    indigenous: null
    legislation: null
    lmia: null
    media: null
    provincial: null
    social: null
    unions: null
    universities: null
  # Limits right-sized from 7-day VictoriaMetrics peaks (Infra 2026-10-28):
  # ngo-rss ~202Mi, realtime ~225Mi. Shared across every pipeline in
  # charts/quill/templates/cronjobs.yaml. Requests stay 128Mi (do not raise —
  # OutOfmemory on nexus was kubelet admission, not cgroup OOM; see #1225).
  # Note: corporate once peaked ~546Mi under the old 2Gi ceiling; if it
  # OOMKills at 512Mi, raise that pipeline alone rather than every ingest job.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Per-pipeline resource overrides (see cronjobs.yaml). Corporate ingest
  # OOMKilled at 512Mi (2026-11-23 audit); raise that pipeline alone.
  resourcesByPipeline:
    corporate:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 1Gi
# Policy-intelligence sweep. Uses the pinned api image (no images.engine pin).
# The sweep file is packages/engine/dist/sweep/run.js. Rebuild the api image
# before this job can succeed; the manifest is not applied by this change.
engine:
  enabled: true
  # Peak working_set ~122Mi over 7d (Infra). Limit 256Mi (chart default was
  # 512Mi in values.yaml). Requests unchanged at 128Mi — do not raise.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  ttlSecondsAfterFinished: 7200
  failedJobsHistoryLimit: 1

search:
  replicas: 1
  port: 8083
  metricsPort: 9466
  logLevel: info
  indexStorage: 5Gi
  # Durable class. The claim is quill-search-data. The old local-path
  # quill-search-index claim is rendered only while migrateLegacyIndex is
  # true; with it false Argo CD prunes it. See docs/ops/BACKUPS.md.
  storageClass: longhorn
  migrateLegacyIndex: false
  # Serve process idles near 2Mi (operator sample). This pod runs
  # `quill-search serve` only. Index build (32MiB tantivy writer) and the
  # search backup tar are other containers. 32Mi is headroom over that idle
  # sample. No CPU sample; CPU request halved. Limit stays 512Mi.
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # While migrateLegacyIndex is true the pod also mounts quill-search-index.
  # That claim is local-path and is bound to nexus, so the template sets
  # nodeName from this value and ignores nodeSelector for the copy.
  # After the copy, set migrateLegacyIndex to false and leave nodeName set.
  # The backup claim is ReadWriteOnce, so search and its backup must stay
  # 2026-10-28: nexus|sentry only; longhorn RWO attaches on chosen node.
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost

# Daily backups of the SQLite file and the search index, plus a freshness
# check and a weekly restore drill. The claim is longhorn, same class as the
# API volume, ReadWriteOnce. Backup, freshness, and drill pods use the same
# affinityHosts / preferredHost as the API (nexus|sentry, never forge)
# so they stay co-located with the API volume's allowed hosts. ReadWriteMany
# is optional and needs a verified NFS client. Redis is not included.
# Postgres is off in this file (database.enabled: false), so no pg_dump
# CronJob is rendered.
backups:
  enabled: true
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  ttlSecondsAfterFinished: 7200
  failedJobsHistoryLimit: 1
  schedule: "15 1 * * *"
  searchSchedule: "45 1 * * *"
  freshnessSchedule: "20 */6 * * *"
  drillSchedule: "30 3 * * 0"
  # 14 -> 7 -> 3 days (2026-11-22). Measured at 14 days: the quill-backups
  # claim held 14.26 GiB of actual blocks on a 30Gi Longhorn claim with
  # numberOfReplicas 2, so ~28.5 GiB of cluster storage — the 4th largest
  # Longhorn consumer, and the only one whose size is purely a policy number.
  #
  # WHY 3 AND NOT MORE: two jobs write a full archive per day (a SQLite dump
  # and a complete tantivy index tarball), so 7 days was 14 archives and 3
  # days is 6. Three is the floor that still satisfies both consumers:
  #   - verify-freshness needs the newest backup younger than maxAgeHours: 26;
  #     a daily job against a 3-day window can lose two runs and still pass.
  #   - the weekly drill (Sunday) restores whatever is current; it does not
  #     need history, and Longhorn's S3 backupstore holds the volume-level
  #     snapshots separately (weekly-backup, retain: 1).
  # The search index is derived data — rebuildable from the SQLite dump by the
  # ingest pipelines — so long index history has no recovery value that the
  # dump does not already provide.
  # Archives age out via `-mtime +RETENTION_DAYS` on the next run; no PVC
  # surgery, and storageClass stays put (immutable on a bound claim anyway).
  retentionDays: 3
  maxAgeHours: 26
  storage: 30Gi
  storageClass: longhorn
  accessMode: ReadWriteOnce
  timeZone: Etc/UTC
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
