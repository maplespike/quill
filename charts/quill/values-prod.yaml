image:
  # In-cluster registry. nexus and sentry-agent both mirror this host in
  # /etc/rancher/k3s/registries.yaml (plain HTTP, endpoint pinned to the
  # ClusterIP). imagePullPolicy is IfNotPresent: kubelet pulls. Never is
  # retired, because a node-local image cannot follow a pod without
  # cross-node ssh, which infra does not allow.
  registry: registry.registry.svc.cluster.local:5000
  repositoryPath: quill
  tag: ''
  pullPolicy: IfNotPresent
images:
  api:
    digest: "sha256:401dfe6c5cd1bd89cc8e24fa24154d864908411054e248590343dee96a514566"
    tag: "2026-10-28-a9e3ef0764"
  mcp:
    digest: "sha256:4c23916e7f71ec81a43a4a262f38cd70e86bc888dfb3e983d92fd61796a6f10e"
    tag: "2026-10-28-a9e3ef0764"
  portal:
    digest: "sha256:52f117704191e78865b966da91c263ce3c95cff7b87eb381a97470209cda7e9d"
    tag: "2026-10-28-a9e3ef0764"
  ingest:
    digest: "sha256:3505a9ec818bb307423f503db7238564b53b938789085ab49d8b4981d88b9061"
    tag: "2026-10-28-a9e3ef0764"
  search:
    digest: sha256:993d9045ec835d1265d7b63396f567c66d3ea7a6456a8c6e6377e2789ec690cd
    tag: '2026-10-06-serve-fix'
# CPU order (Reverb 2026-10-28 15:06 CT): nexus first, then sentry-agent;
# forge last and only for ultra-light work (cloudflared). Heavy workloads
# use required hostname In affinityHosts + preferredHost weight 100.
# No kubectl node-label writes — affinity uses kubernetes.io/hostname only.
affinityHosts: &quillHeavyHosts
  - nexus
  - sentry-agent
preferredHost: &quillPreferredHost nexus

api:
  replicas: 1
  port: 8082
  metricsPort: 9464
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    QUILL_API_URL: http://quill-api:8082/v1
    NODE_ENV: production
    ENVIRONMENT: production
    QUILL_STORAGE: sqlite
    MAPLESPIKE_DOMAIN: maplespike.ca
    MAPLESPIKE_ORIGIN: https://quill.maplespike.ca
    PORTAL_URL: https://quill.maplespike.ca
    APP_URL: https://quill.maplespike.ca
    GITHUB_REDIRECT_URI: https://api.maplespike.ca/v1/auth/github/callback
    MAPLESPIKE_OAUTH_REDIRECT_BASE: https://api.maplespike.ca/v1/auth/oauth
    TRUST_PROXY: 'true'
    REDIS_URL: redis://quill-redis:6379
    STRIPE_ENV: live
  ingress:
    host: api.maplespike.ca
    tls: true
  storage:
    size: 5Gi
    # Migrated from local-path to longhorn (t_9dfeef39): 2 replicas, removing
    # the single-nexus failure domain for the API's SQLite volume.
    storageClass: longhorn
    # 2026-10-28: longhorn RWO; schedule via affinityHosts (not forge).
    nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
mcp:
  replicas: 1
  port: 3001
  metricsPort: 9465
  # 2026-10-28: nexus|sentry-agent only (never forge).
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ingress:
    host: mcp.maplespike.ca
    tls: true
redis:
  enabled: true
  replicas: 1
  image: public.ecr.aws/docker/library/redis:8.2.3-alpine
  pullPolicy: IfNotPresent
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  maxmemory: 128mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
database:
  enabled: false
  image: docker.io/library/postgres:17-alpine
  user: maplespike
  database: maplespike
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  storageClass: longhorn
  nodeName: ""
portal:
  enabled: true
  # HA: 2 replicas, spread by topology + anti-affinity, guarded by a PDB
  # (charts/quill/templates/portal.yaml). The portal is stateless, so unlike
  # api/mcp/search it needs no node pin.
  replicas: 2
  port: 8080
  # CPU order: nexus preferred, sentry-agent fallback; never forge (Reverb 15:06 CT).
  # Combined with required podAntiAffinity when replicas>1 (portal.yaml).
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  ingress:
    host: maplespike.ca
    tls: true
cloudflared:
  enabled: false
  image: docker.io/cloudflare/cloudflared
  tag: 2026.8.2
  pullPolicy: IfNotPresent
  replicas: 1
  tunnelId: 66d76492-036b-4177-8fac-8682e0eda37e
  # Ultra-light only: may land on forge (Reverb 15:06 CT).
  affinityHosts:
    - nexus
    - sentry-agent
    - forge
  preferredHost: nexus
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
  - hostname: api.maplespike.ca
    service: http://quill-api.maplespike.svc.cluster.local:8082
  - hostname: mcp.maplespike.ca
    service: http://quill-mcp.maplespike.svc.cluster.local:3001
  - hostname: kanban.maplespike.ca
    service: http://quill-kanban-exec.maplespike.svc.cluster.local:8080
secrets:
  apiKey: ''
  jwtSecret: ''
  dbPassword: ''
  stripeSecretKey: ''
  stripeWebhookSecret: ''
  stripeAccountId: ''
  stripePublishableKey: ''
ingestion:
  enabled: true
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  activeDeadlineSeconds: 1800
  schedules:
    committees: 0 */6 * * *
    gazette: 0 */12 * * *
    oversight: 0 */12 * * *
    corporate: 0 2 * * *
    influence: 0 4 * * *
    ngo-rss: '*/15 * * * *'
    realtime: '*/30 * * * *'
    a2aj: null
    canlii: null
    culture: null
    defence: null
    gic: null
    immigration: null
    indigenous: null
    legislation: null
    lmia: null
    media: null
    provincial: null
    social: null
    unions: null
    universities: null
  # 512Mi OOMKilled the corporate pipeline on every scheduled run
  # (quill-ingest-corporate, jobs 29855940 / 29857380 Failed, 2026-10-07).
  # The limit is shared by every pipeline in charts/quill/templates/cronjobs.yaml,
  # so it is raised once here rather than per-pipeline.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 2Gi
# Policy-intelligence sweep. Uses the pinned api image (no images.engine pin).
# The sweep file is packages/engine/dist/sweep/run.js. Rebuild the api image
# before this job can succeed; the manifest is not applied by this change.
engine:
  enabled: true
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost

search:
  replicas: 1
  port: 8083
  metricsPort: 9466
  logLevel: info
  indexStorage: 5Gi
  # Durable class. The claim is quill-search-data. The old local-path
  # quill-search-index claim is rendered only while migrateLegacyIndex is
  # true; with it false Argo CD prunes it. See docs/ops/BACKUPS.md.
  storageClass: longhorn
  migrateLegacyIndex: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # While migrateLegacyIndex is true the pod also mounts quill-search-index.
  # That claim is local-path and is bound to nexus, so the template sets
  # nodeName from this value and ignores nodeSelector for the copy.
  # After the copy, set migrateLegacyIndex to false and leave nodeName set.
  # The backup claim is ReadWriteOnce, so search and its backup must stay
  # 2026-10-28: nexus|sentry-agent only; longhorn RWO attaches on chosen node.
  nodeName: ""
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost

# Daily backups of the SQLite file and the search index, plus a freshness
# check and a weekly restore drill. The claim is longhorn, same class as the
# API volume, ReadWriteOnce. Backup, freshness, and drill pods use the same
# affinityHosts / preferredHost as the API (nexus|sentry-agent, never forge)
# so they stay co-located with the API volume's allowed hosts. ReadWriteMany
# is optional and needs a verified NFS client. Redis is not included.
# Postgres is off in this file (database.enabled: false), so no pg_dump
# CronJob is rendered.
backups:
  enabled: true
  affinityHosts: *quillHeavyHosts
  preferredHost: *quillPreferredHost
  schedule: "15 1 * * *"
  searchSchedule: "45 1 * * *"
  freshnessSchedule: "20 */6 * * *"
  drillSchedule: "30 3 * * 0"
  retentionDays: 14
  maxAgeHours: 26
  storage: 30Gi
  storageClass: longhorn
  accessMode: ReadWriteOnce
  timeZone: Etc/UTC
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
