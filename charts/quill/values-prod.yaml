api:
  replicas: 1
  port: 8082
  metricsPort: 9464
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    QUILL_API_URL: http://quill-api:8082/v1
    NODE_ENV: production
    ENVIRONMENT: production
    QUILL_STORAGE: sqlite
    MAPLESPIKE_DOMAIN: maplespike.ca
    MAPLESPIKE_ORIGIN: https://quill.maplespike.ca
    PORTAL_URL: https://quill.maplespike.ca
    APP_URL: https://quill.maplespike.ca
    GITHUB_REDIRECT_URI: https://api.maplespike.ca/v1/auth/github/callback
    MAPLESPIKE_OAUTH_REDIRECT_BASE: https://api.maplespike.ca/v1/auth/oauth
    TRUST_PROXY: 'true'
    REDIS_URL: redis://quill-redis:6379
    STRIPE_ENV: live
  ingress:
    host: api.maplespike.ca
    tls: true
  storage:
    size: 5Gi
    # Migrated from local-path to longhorn (t_9dfeef39): 2 replicas, removing
    # the single-nexus failure domain for the API's SQLite volume.
    storageClass: longhorn
    nodeName: nexus
mcp:
  replicas: 1
  port: 3001
  metricsPort: 9465
  nodeName: nexus
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  ingress:
    host: mcp.maplespike.ca
    tls: true
redis:
  enabled: true
  replicas: 1
  image: public.ecr.aws/docker/library/redis:8.2.3-alpine
  pullPolicy: IfNotPresent
  nodeName: nexus
  maxmemory: 128mb
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi
database:
  enabled: false
  image: docker.io/library/postgres:17-alpine
  user: maplespike
  database: maplespike
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeName: nexus
portal:
  enabled: true
  # HA: 2 replicas, spread by topology + anti-affinity, guarded by a PDB
  # (charts/quill/templates/portal.yaml). The portal is stateless, so unlike
  # api/mcp/search it needs no node pin.
  replicas: 2
  port: 8080
  # nodeSelector (not nodeName): keeps the scheduler in control so the two
  # replicas can spread across the quill.io/workload pool (nexus + forge),
  # while still restricting to nodes whose containerd store holds the digest.
  nodeSelector:
    quill.io/workload: "true"
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  ingress:
    host: maplespike.ca
    tls: true
cloudflared:
  enabled: false
  image: docker.io/cloudflare/cloudflared
  tag: 2026.8.2
  pullPolicy: IfNotPresent
  replicas: 1
  tunnelId: 66d76492-036b-4177-8fac-8682e0eda37e
  nodeSelector:
    kubernetes.io/hostname: nexus
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
  - hostname: api.maplespike.ca
    service: http://quill-api.maplespike.svc.cluster.local:8082
  - hostname: mcp.maplespike.ca
    service: http://quill-mcp.maplespike.svc.cluster.local:3001
  - hostname: kanban.maplespike.ca
    service: http://quill-kanban-exec.maplespike.svc.cluster.local:8080
secrets:
  apiKey: ''
  jwtSecret: ''
  dbPassword: ''
  stripeSecretKey: ''
  stripeWebhookSecret: ''
  stripeAccountId: ''
  stripePublishableKey: ''
ingestion:
  enabled: true
  nodeName: nexus
  activeDeadlineSeconds: 1800
  schedules:
    committees: 0 */6 * * *
    gazette: 0 */12 * * *
    oversight: 0 */12 * * *
    corporate: 0 2 * * *
    influence: 0 4 * * *
    ngo-rss: '*/15 * * * *'
    realtime: '*/30 * * * *'
    a2aj: null
    canlii: null
    culture: null
    defence: null
    gic: null
    immigration: null
    indigenous: null
    legislation: null
    lmia: null
    media: null
    provincial: null
    social: null
    unions: null
    universities: null
  # 512Mi OOMKilled the corporate pipeline on every scheduled run
  # (quill-ingest-corporate, jobs 29855940 / 29857380 Failed, 2026-10-07).
  # The limit is shared by every pipeline in charts/quill/templates/cronjobs.yaml,
  # so it is raised once here rather than per-pipeline.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 2Gi
search:
  replicas: 1
  port: 8083
  metricsPort: 9466
  logLevel: info
  indexStorage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Float across nodes that carry the quill workload label (nexus, forge).
  # zephyr carries no label and stays out. nodeSelector keeps the scheduler
  # in control so a local-path PV and the pod can never contradict each
  # other (the nodeName deadlock, 2026-10-05).
  nodeSelector:
    quill.io/workload: "true"
