{{/*
  MapleSpike — Portal Deployment + Service
*/}}
{{- if .Values.portal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "maplespike.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: maplespike-portal
    component: portal
spec:
  replicas: {{ .Values.portal.replicas | default 1 }}
  selector:
    matchLabels:
      app: maplespike-portal
  template:
    metadata:
      labels:
        app: maplespike-portal
    spec:
      containers:
      - name: portal
        image: {{ printf "%s/maplespike-portal:%s" .Values.image.registry .Values.image.tag | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.portal.port | default 8080 }}
        resources:
          {{- toYaml (default (dict "requests" (dict "cpu" "50m" "memory" "32Mi") "limits" (dict "cpu" "100m" "memory" "64Mi")) .Values.portal.resources) | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "maplespike.fullname" . }}-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: maplespike-portal
spec:
  type: NodePort
  ports:
  - port: {{ .Values.portal.port | default 8080 }}
    targetPort: {{ .Values.portal.port | default 8080 }}
    nodePort: 30964
  selector:
    app: maplespike-portal
{{- end }}
