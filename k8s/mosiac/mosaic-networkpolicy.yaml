apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosaic-network-policy
  namespace: maplespike
spec:
  podSelector:
    matchLabels:
      app: mosaic
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maplespike
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
