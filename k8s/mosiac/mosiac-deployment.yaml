apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mosiac-server
  namespace: maplespike
  labels:
    app: mosiac
    component: server
spec:
  serviceName: mosiac-server
  replicas: 1
  selector:
    matchLabels:
      app: mosiac
  template:
    metadata:
      labels:
        app: mosiac
        component: server
    spec:
      containers:
        - name: mosiac
          image: nexus:5000/mosiac-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: FORCE_HTTP
              value: "true"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
