# Patch for cloudflared ConfigMap to add mosaic.maplespike.ca ingress row.
# Apply with:
#   kubectl patch configmap cloudflared-config -n maplespike --patch-file mosaic-ingress-patch.yaml
#
# The Mosaic server runs as a StatefulSet in maplespike namespace.
# ClusterIP for mosaic service is dynamically allocated; update the IP below after creation:
#   kubectl get svc mosaic -n maplespike -o jsonpath='{.spec.clusterIP}'
# Currently using the next available in the 10.43.100.x range.

data:
  config.yaml: |
    tunnel: 66d76492-036b-4177-8fac-8682e0eda37e
    credentials-file: /etc/cloudflared/credentials.json
    no-autoupdate: true
    metrics: 0.0.0.0:2000
    edge-ip-version: 4
    ingress:
      # API server (quill-api service)
      - hostname: api.maplespike.ca
        service: http://10.43.100.10:8082
      # Quill portal (quill-portal service)
      - hostname: quill.maplespike.ca
        service: http://10.43.100.12:8080
      # MCP server (quill-mcp service)
      - hostname: mcp.maplespike.ca
        service: http://10.43.100.11:3001
      # Data Fabric portal surface (quill-portal service)
      - hostname: datafabric.maplespike.ca
        service: http://10.43.100.12:8080
      # Legacy alias for MCP server (quill-mcp service)
      - hostname: data.maplespike.ca
        service: http://10.43.100.11:3001
      # Mosaic sovereign identity platform
      # ClusterIP: replace <MOSAIC_CLUSTER_IP> with actual after `kubectl get svc mosaic -n maplespike`
      - hostname: mosaic.maplespike.ca
        service: http://<MOSAIC_CLUSTER_IP>:8080
      # Catch-all: return 404 for unmatched routes
      - service: http_status:404
