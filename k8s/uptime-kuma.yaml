apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: maplespike
  labels:
    app: uptime-kuma
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
        component: monitoring
    spec:
      nodeName: nexus
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:2
          ports:
            - containerPort: 3001
          env:
            - name: UPTIME_KUMA_PORT
              value: "3001"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: maplespike
  labels:
    app: uptime-kuma
    component: monitoring
spec:
  type: NodePort
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: uptime-kuma
