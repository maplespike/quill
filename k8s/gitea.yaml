apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: ai-inference
  labels:
    app: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: ai-inference
  labels:
    app: gitea
    component: devops
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
        component: devops
    spec:
      nodeName: nexus
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:latest
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            # ── Database ──
            - name: GITEA__database__DB_TYPE
              value: "sqlite3"
            - name: GITEA__database__PATH
              value: "/data/gitea/gitea.db"

            # ── Instance ──
            - name: GITEA__server__DOMAIN
              value: "gitea.lan"
            - name: GITEA__server__ROOT_URL
              value: "https://gitea.lan"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__SSH_PORT
              value: "22"
            - name: GITEA__server__SSH_DOMAIN
              value: "gitea.lan"

            # ── Security ──
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: secret-key
                  optional: true

            # ── OAuth — Casdoor SSO ──
            - name: GITEA__oauth__ENABLED
              value: "true"
            - name: GITEA__oauth__PROVIDER
              value: "casdoor"
            - name: GITEA__oauth__CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: casdoor-client-id
                  optional: true
            - name: GITEA__oauth__CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: casdoor-client-secret
                  optional: true

            # ── Mail (optional) ──
            - name: GITEA__mailer__ENABLED
              value: "false"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: ai-inference
  labels:
    app: gitea
    component: devops
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: ssh
      port: 22
      targetPort: 22
  selector:
    app: gitea
