apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: ai-inference
  labels:
    app: gitea
    component: devops
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
        component: devops
    spec:
      nodeName: nexus
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: gitea
          image: docker.io/gitea/gitea:latest
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 22
              name: ssh
          env:
            - name: GITEA__database__DB_TYPE
              value: "sqlite3"
            - name: GITEA__database__PATH
              value: "/data/gitea/gitea.db"
            - name: GITEA__server__DOMAIN
              value: "gitea.lan"
            - name: GITEA__server__ROOT_URL
              value: "https://gitea.lan"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__SSH_PORT
              value: "22"
            - name: GITEA__server__SSH_DOMAIN
              value: "gitea.lan"
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__server__START_SSH_SERVER
              value: "false"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__security__SECRET_KEY
              value: "custom-maplespike-gitea-secret-2026"
            - name: GITEA__oauth2__ENABLED
              value: "true"
            - name: GITEA__openid__ENABLE_OPENID_SIGNIN
              value: "false"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: ai-inference
  labels:
    app: gitea
    component: devops
spec:
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: gitea
