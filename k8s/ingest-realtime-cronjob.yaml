apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest-realtime
  namespace: maplespike
  labels:
    app.kubernetes.io/managed-by: easykubenix
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: forge
          containers:
          - name: ingest
            image: nexus:5000/quill-ingest:2026-05-16
            imagePullPolicy: IfNotPresent
            env:
            - name: MAPLESPIKE_PIPELINE
              value: realtime
            - name: NODE_ENV
              value: production
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
