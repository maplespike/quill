apiVersion: v1
kind: Service
metadata:
  name: maplespike-api
  namespace: ai-inference
  labels:
    app: maplespike-api
    component: api-server
    tier: backend
spec:
  type: ClusterIP
  ports:
    - name: api-http
      port: 8082
      targetPort: 8082
      protocol: TCP
  selector:
    app: maplespike-api
