apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest-social-programs
  namespace: ai-inference
  labels:
    app: maplespike-ingest
    pipeline: social-programs
    tier: backend
spec:
  schedule: "0 6 * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: maplespike-ingest
            pipeline: social-programs
            tier: backend
        spec:
          restartPolicy: Never
          nodeName: nexus
          containers:
            - name: maplespike-ingest
              image: nexus:5000/maplespike-ingest:stable
              imagePullPolicy: Always
              env:
                - name: NODE_ENV
                  value: "production"
                - name: MAPLESPIKE_PIPELINE
                  value: "social-programs"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
