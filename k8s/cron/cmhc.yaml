apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest-cmhc
  namespace: ai-inference
  labels:
    app: maplespike-ingest
    pipeline: cmhc
    tier: backend
spec:
  schedule: "0 6 * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: maplespike-ingest
            pipeline: cmhc
            tier: backend
        spec:
          restartPolicy: Never
          nodeName: nexus
          containers:
            - name: maplespike-ingest
              image: nexus:5000/maplespike-ingest:latest
              imagePullPolicy: Always
              env:
                - name: NODE_ENV
                  value: "production"
                - name: MAPLESPIKE_PIPELINE
                  value: "cmhc"
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
