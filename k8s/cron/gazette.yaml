apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest-gazette
  namespace: ai-inference
  labels:
    app: maplespike-ingest
    pipeline: gazette
    tier: backend
spec:
  schedule: 0 6 * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: maplespike-ingest
            pipeline: gazette
            tier: backend
        spec:
          restartPolicy: OnFailure
          nodeName: nexus
          containers:
          - name: maplespike-ingest
            image: ghcr.io/reverb256/maplespike/maplespike-ingest:stable
            imagePullPolicy: Always
            env:
            - name: NODE_ENV
              value: production
            - name: MAPLESPIKE_PIPELINE
              value: gazette
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          imagePullSecrets:
          - name: ghcr-pull
