apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-portal
  namespace: maplespike
  labels:
    app: maplespike-portal
    component: portal
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: maplespike-portal
  template:
    metadata:
      labels:
        app: maplespike-portal
        component: portal
        tier: frontend
    spec:
      nodeName: nexus
      containers:
        - name: portal
          image: nexus:5000/maplespike-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: API_URL
              value: "http://maplespike-api:8082/v1"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
