apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-api
  namespace: maplespike-prod
  labels:
    app: maplespike-api
    component: api
    tier: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: maplespike-api
  template:
    metadata:
      labels:
        app: maplespike-api
        component: api
        tier: backend
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-pull
      nodeName: nexus
      containers:
        - name: api
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/reverb256/maplespike/maplespike-api:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: PORT
              value: "8082"
            - name: NODE_ENV
              value: "production"
            - name: MAPLESPIKE_STORAGE
              value: "sqlite"
            - name: MAPLESPIKE_DB_PATH
              value: "/data/maplespike.db"
            - name: MAPLESPIKE_AI_ENDPOINT
              value: "http://ai-inference-gateway.ai-inference:8080/v1"
            - name: MAPLESPIKE_AI_MODEL
              value: "Carnice-Qwen3.6-MoE-35B-A3B.IQ4_XS.gguf"
            - name: MAPLESPIKE_API_KEY
              value: "maplespike-dev-key"
            - name: MAPLESPIKE_DB_HOST
              value: "maplespike-db"
            - name: MAPLESPIKE_DB_PORT
              value: "5432"
            - name: MAPLESPIKE_DB_NAME
              value: "maplespike"
            - name: MAPLESPIKE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: maplespike-db-secret
                  key: postgres-user
            - name: MAPLESPIKE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maplespike-db-secret
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
