apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-mcp
  namespace: maplespike-prod
  labels:
    app: maplespike-mcp
    component: mcp
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: maplespike-mcp
  template:
    metadata:
      labels:
        app: maplespike-mcp
        component: mcp
        tier: backend
    spec:
      imagePullSecrets:
      - name: ghcr-pull
      nodeName: nexus
      containers:
        - name: mcp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/reverb256/maplespike/maplespike-mcp:stable
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: MAPLESPIKE_API_URL
              value: "http://maplespike-api:8082/v1"
            - name: MAPLESPIKE_API_KEY
              value: "maplespike-dev-key"
            - name: AI_ENDPOINT
              value: "http://ai-inference-gateway.ai-inference:8080/v1"
            - name: AI_MODEL
              value: "Carnice-Qwen3.6-MoE-35B-A3B.IQ4_XS.gguf"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
