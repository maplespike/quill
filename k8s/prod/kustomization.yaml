# MapleSpike Production Kubernetes Manifests
# Applied via CI/CD on push to `prod` branch
# Routes: host-level Caddy routes maplespike.lan, maplespike-api.lan, maplespike-mcp.lan
# Tailscale Ingress (easykubenix) for funnel/Internet access
# NodePorts: portal=30964, api=31283, mcp=31745, uptime-kuma=31832
#
# Apply: kubectl apply -k k8s/prod/
resources:
  - namespace.yaml
  - network-policy.yaml
  - db-secret.yaml
  - postgres.yaml
  - api-deployment.yaml
  - api-service.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - portal-deployment.yaml
  - portal-service.yaml
