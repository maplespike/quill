# MapleSpike Production Kubernetes Manifests
# Applied via CI/CD on push to `prod` branch
# All services behind maplespike.lan single-domain ingress
#
# Apply: kubectl apply -k k8s/prod/
#
# Services:
#   maplespike.lan/         → Portal (static HTML/nginx)
#   maplespike.lan/api/     → API Server
#   maplespike.lan/mcp/     → MCP Server SSE endpoint
#   maplespike.lan/health   → API health check
#   maplespike.lan/db/      → pgAdmin (optional, for db management)

resources:
  - namespace.yaml
  - db-secret.yaml
  - postgres.yaml
  - api-deployment.yaml
  - api-service.yaml
  - mcp-deployment.yaml
  - mcp-service.yaml
  - portal-deployment.yaml
  - portal-service.yaml
  - ingress.yaml
