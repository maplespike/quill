apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  namespace: maplespike-prod
  labels:
    app: maplespike-portal
    component: portal
data:
  config.js: |
    window.MAPLESPIKE = window.MAPLESPIKE || {};
    MAPLESPIKE.apiBase   = 'https://maplespike-api.lan';
    MAPLESPIKE.apiKey    = '';
    MAPLESPIKE.timeout   = { health: 3000, quick: 5000, default: 8000 };