apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: maplespike-db
  namespace: maplespike-prod
  labels:
    app: maplespike-db
    component: database
    tier: data
spec:
  serviceName: maplespike-db
  replicas: 1
  selector:
    matchLabels:
      app: maplespike-db
  template:
    metadata:
      labels:
        app: maplespike-db
    spec:
      automountServiceAccountToken: false
      nodeName: nexus
      containers:
        - name: postgres
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: postgres@sha256:979c4379dd698aba0b890599a6104e082035f98ef31d9b9291ec22f2b13059ca # 17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maplespike-db-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maplespike-db-secret
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maplespike-db-secret
                  key: postgres-database
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "maplespike"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "maplespike"]
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: maplespike-db
  namespace: maplespike-prod
  labels:
    app: maplespike-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: maplespike-db
