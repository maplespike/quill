apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maplespike-mcp
  namespace: maplespike-prod
  labels:
    app: maplespike-mcp
    app.kubernetes.io/managed-by: easykubenix
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/proxy-group: "funnel-proxies"
spec:
  ingressClassName: tailscale
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: maplespike-mcp
            port:
              number: 3001
