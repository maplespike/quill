apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-quill
  namespace: maplespike
  labels:
    app: maplespike-quill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maplespike-quill
  template:
    metadata:
      labels:
        app: maplespike-quill
    spec:
      containers:
      - name: mcp
        image: localhost/maplespike-quill:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "development"
        - name: MAPLESPIKE_API_URL
          value: "http://maplespike-api:8082"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maplespike-quill
  namespace: maplespike
spec:
  selector:
    app: maplespike-quill
  ports:
  - port: 3001
    targetPort: 3001
  type: NodePort
