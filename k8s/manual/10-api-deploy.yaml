apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-api
  namespace: maplespike
  labels:
    app: maplespike-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maplespike-api
  template:
    metadata:
      labels:
        app: maplespike-api
    spec:
      containers:
      - name: api
        image: localhost/maplespike-api:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 8082
        env:
        - name: JWT_SECRET
          value: "dev-secret-not-for-production"
        - name: PORT
          value: "8082"
        - name: NODE_ENV
          value: "development"
        - name: MAPLESPIKE_STORAGE
          value: "memory"
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maplespike-api
  namespace: maplespike
spec:
  selector:
    app: maplespike-api
  ports:
  - port: 8082
    targetPort: 8082
  type: NodePort
