---
# MapleSpike Dev Deployment — Manual manifests
# TODO: Replace with nix-generated once easykubenix label bug is fixed
apiVersion: v1
kind: Namespace
metadata:
  name: maplespike
---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-api
  namespace: maplespike
  labels:
    app: maplespike-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maplespike-api
  template:
    metadata:
      labels:
        app: maplespike-api
    spec:
      containers:
      - name: api
        image: ghcr.io/reverb256/maplespike/api-server:dev
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        env:
        - name: JWT_SECRET
          value: "dev-secret-not-for-production"
        - name: PORT
          value: "8082"
        - name: NODE_ENV
          value: "development"
        - name: MAPLESPIKE_STORAGE
          value: "memory"
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: maplespike-api
  namespace: maplespike
spec:
  selector:
    app: maplespike-api
  ports:
  - port: 8082
    targetPort: 8082
  type: ClusterIP
---
# Test ingest CronJob — will use real image once built
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest-test
  namespace: maplespike
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: ingest
            image: alpine:3.19
            command: ["/bin/sh", "-c"]
            args:
            - echo "MapleSpike ingestion tick at $(date --iso-8601=seconds)";
              echo "TODO: mount real ingest image here";
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest-cronjob
  namespace: ai-inference
spec:
  schedule: "0 6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: ingest
            image: ghcr.io/reverb256/maplespike/ingest:dev
            imagePullPolicy: Always
            env:
            - name: NODE_ENV
              value: "production"
            - name: PIPELINE
              value: "statcan"
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
          restartPolicy: OnFailure
