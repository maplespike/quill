apiVersion: batch/v1
kind: CronJob
metadata:
  name: maplespike-ingest
  namespace: maplespike
spec:
  schedule: "*/30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: ingest
            image: alpine:3.19
            command: ["/bin/sh", "-c"]
            args:
            - echo "MapleSpike ingestion tick at $(date --iso-8601=seconds)"
          restartPolicy: OnFailure
