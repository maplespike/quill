# =============================================================================
# MapleSpike — Cloudflare Tunnel (K3s Deployment) — external routing for *.ca
# =============================================================================
# Exposes API + MCP servers to the public internet via maplespike.ca using a
# Cloudflare Tunnel. Pairs with `15-ingress-lan.yaml` which handles the LAN
# side (`*.maplespike.lan`) — both terminate at the same Services in-cluster.
#
# Pair with: `15-ingress-lan.yaml` (LAN Ingress), `ROUTING.md` (operator
# guide), and decision `0004-split-hostname-routing.md`.
#
# Prerequisites:
#   1. Create a tunnel in the Cloudflare dashboard (Zero Trust → Networks →
#      Tunnels). Choose "Cloudflared" connector type.
#   2. Copy the tunnel token from the dashboard.
#   3. Create the secret (replaces the placeholder below):
#        kubectl create secret generic cloudflared-creds \
#          --from-file=credentials.json=<(echo '{"AccountTag":"...","TunnelSecret":"...","TunnelID":"..."}')
#        kubectl create configmap cloudflared-config \
#          --from-file=config.yaml=<(echo '...')
#   4. Configure DNS in the Cloudflare dashboard:
#        api.maplespike.ca  →  CNAME <tunnel-id>.cfargotunnel.com
#        quill.maplespike.ca  →  CNAME <tunnel-id>.cfargotunnel.com
#        datafabric.maplespike.ca  →  CNAME <tunnel-id>.cfargotunnel.com
#        data.maplespike.ca  →  CNAME <tunnel-id>.cfargotunnel.com
#        mcp.maplespike.ca  →  CNAME <tunnel-id>.cfargotunnel.com
#   5. Configure tunnel routes in the ConfigMap (see below) — NOT via Dashboard.
#      The ConfigMap is the source of truth. If you edit routes in the Dashboard,
#      the ConfigMap will be overwritten on next apply.
#
# Why Service FQDNs in route targets?
#   Using the full FQDN (quill-api.maplespike.svc.cluster.local:8082) vs.
#   shorthand (quill-api:8082) makes the route unambiguous when you later
#   add a second namespace.
#
# Why no Service for cloudflared?
#   cloudflared makes outbound TCP connections to Cloudflare and tunnels
#   inbound HTTP through that — there is nothing inbound-side to Service-
#   front. Cluster DNS resolution of Services is automatic inside the pod.
#
# Why replicas: 1?
#   cloudflared is stateful per tunnel (single tunnel connection); multiple
#   replicas would just thrash. For HA, run a 2nd tunnel from a separate
#   cluster and configure Cloudflare to load-balance.
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: maplespike
data:
  config.yaml: |
    tunnel: 66d76492-036b-4177-8fac-8682e0eda37e
    credentials-file: /etc/cloudflared/credentials.json
    ingress:
      - hostname: api.maplespike.ca
        service: http://quill-api.maplespike.svc.cluster.local:8082
      - hostname: mcp.maplespike.ca
        service: http://quill-mcp.maplespike.svc.cluster.local:3001
      - hostname: quill.maplespike.ca
        service: http://quill-mcp.maplespike.svc.cluster.local:3001
      - hostname: datafabric.maplespike.ca
        service: http://quill-portal.maplespike.svc.cluster.local:8080
      - hostname: data.maplespike.ca
        service: http://quill-portal.maplespike.svc.cluster.local:8080
      - service: http_status:404

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: maplespike
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - --metrics
        - 0.0.0.0:2000
        - --config
        - /etc/cloudflared/config.yaml
        - run
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 64Mi
        volumeMounts:
        - name: creds
          mountPath: /etc/cloudflared/credentials.json
          subPath: credentials.json
        - name: config
          mountPath: /etc/cloudflared/config.yaml
          subPath: config.yaml
      volumes:
      - name: creds
        secret:
          secretName: cloudflared-creds
      - name: config
        configMap:
          name: cloudflared-config
