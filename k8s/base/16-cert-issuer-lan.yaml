---
# =============================================================================
# MapleSpike — LAN TLS issuer + wildcard Certificate
# =============================================================================
# Uses cert-manager + smallstep step-issuer plugin to issue a 90-day
# wildcard cert for *.maplespike.lan, signed by the user's local step-ca.
# Resulting Secret `maplespike-lan-tls` is consumed by 15-ingress-lan.yaml.
#
# Prerequisite (one-time setup, see scripts/setup-stepca-lan.sh):
#
#   1. Install cert-manager:
#        helm install cert-manager jetstack/cert-manager \
#          --namespace cert-manager --create-namespace \
#          --set installCRDs=true
#
#   2. Install the step-issuer plugin (cert-manager extension for step-ca):
#        https://github.com/smallstep/cert-manager-step-issuer
#      Either install via kustomize or follow the chart README.
#
#   3. Run scripts/setup-stepca-lan.sh — generates LAN root CA + outputs
#      the kubectl create-secret snippet you'll run below.
#
#   4. Create the bootstrap namespace + secret the issuer reads:
#        kubectl create namespace cert-manager
#        kubectl create secret generic stepca-lan-bootstrap -n cert-manager \
#          --from-literal=caURL=https://step-ca.maplespike.lan:8443 \
#          --from-literal=caFingerprint=<fingerprint-from-setup> \
#          --from-literal=caSubject='/CN=MapleSpike LAN CA'
#
#   5. Wire local DNS so step-ca + cert-manager can resolve each other:
#        sudo scripts/wire-lan-dns-unbound.sh <k3s-ingress-ip>
#
# After these one-time steps, this manifest is the only thing to apply.
# =============================================================================

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: stepca-lan
spec:
  step:
    # Where step-ca is reachable from inside the cluster.
    # Use a `.lan` Service ClusterIP once step-ca runs in k3s, or a
    # LAN-reachable IP/hostname if step-ca runs on a homelab host.
    url: https://step-ca.maplespike.lan:8443
    # References inside `cert-manager` namespace (`step-issuer` plugin reads
    # keys from this Secret).
    authSecretName: stepca-lan-bootstrap
    caFingerprintSecretName: stepca-lan-bootstrap-fp
    caSubjectSecretName: stepca-lan-bootstrap-subject
    # Step-issuer can present a JWK instead of a fingerprint; we use the
    # simpler fingerprint path. If you switch to JWK, set `provisioner` +
    # `provisionerPasswordSecretName` here instead.
    durations:
      - 2160h   # 90 days — issued cert lifetime
      - 720h    # 30 days  — renewal fallback
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: maplespike-lan-wildcard
  namespace: maplespike
spec:
  # Consumed by 15-ingress-lan.yaml's `tls.secretName`.
  secretName: maplespike-lan-tls
  issuerRef:
    name: stepca-lan
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 2160h        # 90 days
  renewBefore: 720h      # renew 30 days before expiry
  commonName: maplespike.lan
  # Wildcard covers ALL *.maplespike.lan hostnames that the Ingress
  # announces — individually-listed hosts in the Ingress are matched by
  # the wildcard SAN, so no need to enumerate them here.
  dnsNames:
    - "*.maplespike.lan"
    - "maplespike.lan"
---
# Notes for the operator:
#
# • If your step-issuer plugin version expects the fingerprint in a separate
#   Secret from `authSecretName`, run this once after setup-stepca-lan.sh:
#
#     FP=$(cat /etc/step-ca/fingerprint)
#     kubectl create secret generic stepca-lan-bootstrap-fp -n cert-manager \
#       --from-literal=fingerprint="$FP" \
#       --from-literal=caURL=https://step-ca.maplespike.lan:8443 \
#       --from-literal=caSubject='/CN=MapleSpike LAN CA'
#
#   …and replace the references above with that single Secret. Plugin
#   versions vary on this point; check your installed step-issuer CRD.
#
# • If you migrate from step-issuer to a self-signed issuer + cert-manager
# `Issuer` with `selfSigned: {}`, the wildcard still works — only the
# trust chain on the LAN CA changes.
