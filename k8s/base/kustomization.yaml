apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maplespike

resources:
  - namespace.yaml
  - 10-api-deploy.yaml
  - 11-mcp-deploy.yaml
  - 20-cronjob.yaml
  - health-check-cronjob.yaml

labels:
  - pairs:
      app.kubernetes.io/name: maplespike
      app.kubernetes.io/part-of: maplespike

images:
  - name: maplespike-portal
    newName: localhost/maplespike-portal
    newTag: latest
  - name: maplespike-api
    newName: localhost/maplespike-api
    newTag: latest