apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: maplespike

resources:
  - namespace.yaml
  - ../manual/10-api-deploy.yaml
  - ../manual/11-mcp-deploy.yaml
  - ../manual/20-cronjob.yaml
  - health-check-cronjob.yaml

commonLabels:
  app.kubernetes.io/name: maplespike
  app.kubernetes.io/part-of: maplespike

images:
  - name: maplespike-portal
    newName: localhost/maplespike-portal
    newTag: latest
  - name: maplespike-api
    newName: localhost/maplespike-api
    newTag: latest