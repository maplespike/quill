apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-mcp
  namespace: maplespike
  labels:
    app: quill-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-mcp
  template:
    metadata:
      labels:
        app: quill-mcp
    spec:
      containers:
      - name: mcp
        image: localhost/quill-mcp:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "development"
        - name: QUILL_API_URL
          value: "http://quill-api:8082"
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quill-mcp
  namespace: maplespike
spec:
  selector:
    app: quill-mcp
  ports:
  - port: 3001
    targetPort: 3001
  type: NodePort
