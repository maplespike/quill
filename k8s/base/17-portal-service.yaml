---
# =============================================================================
# MapleSpike — Portal Deployment + ClusterIP Service (LAN + external entry)
# =============================================================================
# The portal (Astro static site + server.py) is the user-facing landing page
# at `maplespike.lan` / `portal.maplespike.lan`. Both the Traefik Ingress
# (15-ingress-lan.yaml) and the cloudflared tunnel route back to this Service.
#
# The Helm chart at charts/maplespike/templates/portal.yaml covers the
# helm-based install; this manifest is for manual `kubectl apply`
# deployments that don't go through Helm.
#
# Image: ghcr.io/reverb256/quill/portal:dev — built via:
#   docker build --target portal -t quill-portal:dev .
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-portal
  namespace: maplespike
  labels:
    app: quill-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-portal
  template:
    metadata:
      labels:
        app: quill-portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/reverb256/quill/portal:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            # Brand env defaults — override per deployment if needed.
            - name: BRAND_DOMAIN
              value: "maplespike.lan"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: quill-portal
  namespace: maplespike
  labels:
    app: quill-portal
spec:
  type: ClusterIP
  selector:
    app: quill-portal
  ports:
    - name: http
      port: 8080
      targetPort: http
