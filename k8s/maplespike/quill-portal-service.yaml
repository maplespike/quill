apiVersion: v1
kind: Service
metadata:
  name: quill-portal
  namespace: maplespike
  labels:
    app: quill-portal
spec:
  type: ClusterIP
  # PINNED — must match nix/saas-manifests.nix AND the cloudflared ConfigMap
  # ingress literal IPs (cloudflared's Go resolver NXDOMAINs DNS-name upstreams
  # on the minimal image, so the tunnel dials these by IP). If you change this,
  # update BOTH the nix cloudflared block and k8s/cloudflared/cloudflared.yaml.
  clusterIP: 10.43.100.12
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: quill-portal
