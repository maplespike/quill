apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-api
  namespace: maplespike
  labels:
    app: quill-api
spec:
  # replicas: 1 — /data is a shared ReadWriteOnce PVC holding one SQLite
  # file (claims + api_keys + tenants); two replicas would mean two processes
  # writing the same WAL-mode DB (lock contention). The cloudflared tunnel
  # pins the ClusterIP Service, so 1 replica is a healthy origin.
  replicas: 1
  selector:
    matchLabels:
      app: quill-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # #816: zero-downtime rollouts — never drop below desired replicas.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quill-api
    spec:
      containers:
      - name: api
        # nix/saas-manifests.nix is the canonical image source (apiTag param).
        # This file is the secondary/kustomize path — keep the tag in sync or
        # applying it rolls back the quill_ rename + better-sqlite3 binding.
        image: nexus:5000/quill-api:2026-08-13-14aef96c
        # NOTE: the cluster ValidatingAdmissionPolicy 'deny-latest-tag-deployments'
        # forbids :latest tags — bump this date tag on every image rebuild.
        # IfNotPresent: images are pinned tags in the local containerd store;
        # the nexus:5000 registry is a bare podman container that does NOT
        # survive reboots, and Always round-tripped the dead registry ->
        # ImagePullBackOff -> site 502 (2026-08-11 reboot). Do NOT revert.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8082
        env:
        # Single-source contract (see k8s/maplespike/README.md + secrets/SECRETSPEC-CONTRACT.md):
        #   maplespike-secrets         → JWT_SECRET, QUILL_BILLING_SECRET (upper, from runtime.yaml)
        #   maplespike-stripe-secrets  → stripe-secret-key, stripe-webhook-secret,
        #                                 stripe-account-id, stripe-publishable-key
        #                                 (lower, from billing.yaml)
        # Provisioned by BOTH the quill scripts/sops-sync-k8s.sh (5-min timer in
        # nix/sops-nix-module.nix) and nixos-config's k8s-secret-sync — two writers still
        # exist because the script carries the live-verified PII-hash logic; R2 (single
        # secret-sync) is pending in #825. Key case MUST match the sync output exactly;
        # K8s Secret data keys are case-sensitive.
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: maplespike-secrets
              optional: true
        - name: PORT
          value: "8082"
        - name: NODE_ENV
          value: production
        - name: QUILL_STORAGE
          value: sqlite
        - name: QUILL_DB_PATH
          value: /data/maplespike.db
        # qdrant-service lives in the ai-inference namespace (not `qdrant`,
        # which does not resolve in the maplespike namespace).
        - name: QUILL_QDRANT_ENDPOINT
          value: http://qdrant-service.ai-inference.svc.cluster.local:6333
        - name: QUILL_QDRANT_COLLECTION
          value: maplespike
        - name: QUILL_EMBED_MODEL
          value: nvidia/llama-3.2-nv-embedqa-1b-v2
        - name: AUTH_MODE
          value: astral-key
        - name: ASTRAL_KEY_URL
          value: http://astral-key.astral-key.svc.cluster.local:8080
        # PII hash: app auto-generates an ephemeral secret when unset (pii-hash.ts), so
        # optional: true — a hard-required key that NO sync mechanism writes would block
        # pod start (CreateContainerConfigError). For stable emailHash across restarts,
        # provision `pii-hash-secret` (64-hex) into maplespike-secrets before go-live.
        - name: QUILL_PII_HASH_SECRET
          valueFrom:
            secretKeyRef:
              key: pii-hash-secret
              name: maplespike-secrets
              optional: true
        # #806: Stripe billing secrets — live in maplespike-stripe-secrets (NOT
        # maplespike-secrets). Provisioned from secrets/billing.yaml by k8s-secret-sync.
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: stripe-secret-key
              name: maplespike-stripe-secrets
              optional: true
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              key: stripe-webhook-secret
              name: maplespike-stripe-secrets
              optional: true
        - name: STRIPE_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              key: stripe-account-id
              name: maplespike-stripe-secrets
              optional: true
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              key: stripe-publishable-key
              name: maplespike-stripe-secrets
              optional: true
        - name: QUILL_BILLING_SECRET
          valueFrom:
            secretKeyRef:
              key: QUILL_BILLING_SECRET
              name: maplespike-secrets
              optional: true
        # STRIPE_ENV defaults to 'test'; flip to 'live' at go-live (human step).
        - name: STRIPE_ENV
          value: "test"
        # Probe timeouts are 5s (not the 1s k8s default) — the 1s default
        # kills healthy pods during CPU-throttled cold start (2026-08-11 incident).
        livenessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /v1/health
            port: 8082
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # Admission policy 'require-resources-and-security-deployments'
        # requires non-root + no privilege escalation.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
        volumeMounts:
        - mountPath: /data
          name: data
      # Claims store + sqlite DB persist across pod restarts on the
      # local-path StorageClass (single-node k3s).
      securityContext:
        fsGroup: 1001
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: quill-api-data
