apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quill-api-hpa
  namespace: maplespike
  labels:
    app: quill-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quill-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quill-portal-hpa
  namespace: maplespike
  labels:
    app: quill-portal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quill-portal
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
