apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-mcp
  namespace: maplespike
  labels:
    app: quill-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: quill-mcp
    spec:
      # Images are imported per-node into containerd (registry-free flow);
      # the MCP image lives on nexus only.
      nodeName: nexus
      containers:
      - name: mcp
        image: nexus:5000/quill-mcp:2026-08-13-14aef96c
        # NOTE: cluster admission policy forbids :latest tags.
        # IfNotPresent — see quill-api-deployment.yaml (2026-08-11 reboot incident).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: production
        - name: QUILL_API_URL
          value: http://quill-api:8082/v1
        # QUILL_API_KEY gates the MCP gateway. Without it the server falls
        # back to the well-known default 'dev-key' (2026-08-15 auth audit).
        # Value lives in quill-secrets/apiKey (the pair the Helm chart renders;
        # written by scripts/sops-sync-k8s.sh from secrets/runtime.yaml).
        - name: QUILL_API_KEY
          valueFrom:
            secretKeyRef:
              name: quill-secrets
              key: apiKey
        # Probe timeouts are 5s (not the 1s k8s default) — the 1s default
        # kills healthy pods during CPU-throttled cold start (2026-08-11 incident).
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        # Admission policy requires non-root + no privilege escalation.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
