apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-mcp
  namespace: maplespike
  labels:
    app: quill-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-mcp
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: quill-mcp
    spec:
      containers:
      - name: mcp
        image: nexus:5000/quill-mcp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: production
        - name: QUILL_API_URL
          value: http://quill-api:8082/v1
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
