apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-portal
  namespace: maplespike
  labels:
    app: quill-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: quill-portal
    spec:
      # Images are imported per-node into containerd (registry-free flow);
      # the portal image lives on nexus only.
      nodeName: nexus
      containers:
      - name: portal
        image: nexus:5000/quill-portal:2026-08-13-14aef96c
        # NOTE: cluster admission policy forbids :latest tags.
        # IfNotPresent — see quill-api-deployment.yaml (2026-08-11 reboot incident).
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
        # server.py proxies /api/* to the API Service. Without this, the proxy
        # defaults to localhost:8082 inside the portal pod -> 502s on /claims
        # and /verify.
        - name: API_UPSTREAM
          value: http://quill-api:8082
        # Probe timeouts are 5s (not the 1s k8s default) — the 1s default
        # kills healthy pods during CPU-throttled cold start (2026-08-11 incident).
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 8
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        # Admission policy requires non-root + no privilege escalation.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
