apiVersion: apps/v1
kind: Deployment
metadata:
  name: quill-portal
  namespace: maplespike
  labels:
    app: quill-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quill-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: quill-portal
    spec:
      containers:
      - name: portal
        image: nexus:5000/quill-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
