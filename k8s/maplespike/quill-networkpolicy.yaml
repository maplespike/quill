apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quill-network-policy
  namespace: maplespike
spec:
  podSelector:
    matchLabels:
      app: quill-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - port: 8082
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
