apiVersion: v1
kind: Service
metadata:
  name: maplespike-portal
  namespace: maplespike-dev
  labels:
    app: maplespike-portal
    component: portal
    tier: frontend
spec:
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30965
  selector:
    app: maplespike-portal
