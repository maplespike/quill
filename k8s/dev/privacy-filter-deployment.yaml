apiVersion: apps/v1
kind: Deployment
metadata:
  name: privacy-filter
  namespace: maplespike-dev
  labels:
    app: privacy-filter
    component: pii-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: privacy-filter
  template:
    metadata:
      labels:
        app: privacy-filter
        component: pii-detection
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                      values:
                      - nexus
                weight: 80
      containers:
      - name: privacy-filter
        image: docker.io/python:3.12-slim
        env:
        - name: HF_HOME
          value: /var/cache/ai-inference
        - name: PYTHONUNBUFFERED
          value: "1"
        command:
        - /bin/bash
        - -c
        - |
          set -e
          pip install --quiet fastapi uvicorn transformers accelerate safetensors pydantic 2>&1
          mkdir -p /config
          cp /app/server.py /config/server.py
          python /config/server.py
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          failureThreshold: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 500m
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - mountPath: /var/cache/huggingface
          name: hf-cache
        - mountPath: /config
          name: config
        - mountPath: /tmp
          name: tmp
      volumes:
      - name: hf-cache
        hostPath:
          path: /var/cache/huggingface
          type: DirectoryOrCreate
      - name: config
        configMap:
          name: privacy-filter-server
      - emptyDir:
          name: tmp
      terminationGracePeriodSeconds: 30
