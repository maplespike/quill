apiVersion: v1
kind: Service
metadata:
  name: maplespike-api
  namespace: maplespike-dev
  labels:
    app: maplespike-api
    component: api
    tier: backend
spec:
  type: NodePort
  ports:
    - name: http
      port: 8082
      targetPort: 8082
      nodePort: 31284
  selector:
    app: maplespike-api
