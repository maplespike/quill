apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-dashboard
  namespace: maplespike-dev
  labels:
    app: maplespike-dashboard
    component: dashboard
    tier: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: maplespike-dashboard
  template:
    metadata:
      labels:
        app: maplespike-dashboard
        component: dashboard
        tier: frontend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nexus, sentry, forge]
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [zephyr]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: maplespike-dashboard
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.forge/mining
          operator: Exists
          effect: NoSchedule
      containers:
        - name: dashboard
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: ghcr.io/reverb256/maplespike/maplespike-dashboard:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 4322
          env:
            - name: PORT
              value: "4322"
            - name: NODE_ENV
              value: "development"
            - name: NEXT_PUBLIC_API_BASE
              value: "https://dev-maplespike-api.lan/v1"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 4322
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 4322
            initialDelaySeconds: 5
            periodSeconds: 10
