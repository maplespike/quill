# MapleSpike Dev Resource Quotas
# Limits for maplespike-dev namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: maplespike-dev-quota
  namespace: maplespike-dev
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "2"
    pods: "20"
    services: "10"
    configmaps: "20"
    secrets: "20"
