apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: maplespike-dev
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                      values:
                      - nexus
                weight: 80
      automountServiceAccountToken: false
      containers:
      - name: open-webui
        image: ghcr.io/open-webui/open-webui:0.6.5
        imagePullPolicy: IfNotPresent
        env:
        - name: ERROR_MESSAGES_PATH
          value: /app/backend/open_webui/i18n/errors.json
        - name: STATIC_FILES_PATH
          value: /app/backend/open_webui/static
        - name: OLLAMA_BASE_URLS
          value: http://10.1.1.110:8080/v1
        - name: ENABLE_OLLAMA
          value: "true"
        - name: ENABLE_OPENAI_API
          value: "false"
        - name: ENABLE_LLM
          value: "true"
        - name: OAUTH_CLIENT_ID
          value: openwebui
        - name: OAUTH_CLIENT_SECRET
          value: f73abe187c8976c4b9d376a1dc9e4ec71cfaf3d6
        - name: OPENID_PROVIDER_URL
          value: https://auth.lan/.well-known/openid-configuration
        - name: ENABLE_OAUTH_SIGNUP
          value: "true"
        - name: OAUTH_PROVIDER_NAME
          value: Casdoor
        - name: OAUTH_SCOPES
          value: openid email profile
        - name: OPENID_REDIRECT_URI
          value: https://openwebui.lan/oauth/oidc/callback
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        resources:
          limits:
            memory: 4Gi
          requests:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - mountPath: /app/backend/data
          name: webui-data
      volumes:
      - name: webui-data
        hostPath:
          path: /mnt/open-webui-dev-data
          type: DirectoryOrCreate
      terminationGracePeriodSeconds: 30
