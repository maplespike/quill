apiVersion: apps/v1
kind: Deployment
metadata:
  name: maplespike-mcp
  namespace: maplespike-dev
  labels:
    app: maplespike-mcp
    component: mcp
    tier: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: maplespike-mcp
  template:
    metadata:
      labels:
        app: maplespike-mcp
        component: mcp
        tier: backend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nexus, sentry, forge]
            - weight: 1
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [zephyr]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: maplespike-mcp
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node.forge/mining
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mcp
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: nexus:5000/maplespike-mcp:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "development"
            - name: MAPLESPIKE_API_URL
              value: "http://maplespike-api.maplespike-dev.svc.cluster.local:8082/v1"
            - name: MAPLESPIKE_API_KEY
              value: "maplespike-dev-key"
            - name: AI_ENDPOINT
              value: "http://ai-inference-gateway.ai-inference:8080/v1"
            - name: AI_MODEL
              value: "qwen3.5-27b"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
