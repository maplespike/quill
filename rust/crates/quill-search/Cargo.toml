[package]
name = "quill-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Quill full-text search service (tantivy) — first Rust seam (#976)"

[[bin]]
name = "quill-search"
path = "src/main.rs"

[lib]
name = "quill_search"
path = "src/lib.rs"

[features]
default = []
# Criterion-bench-only feature: exposes bench_support (deterministic corpus
# generation + hot-path wrappers). Not compiled into the service binary.
bench = ["dep:quill-search-bench-gen"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tantivy = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = "2"
# Bench-only dependency (feature `bench`): never compiled into the service.
quill-search-bench-gen = { path = "../quill-search-bench-gen", optional = true }

[dev-dependencies]
criterion = { workspace = true }
tempfile = "3"

[[bench]]
name = "quill_search_bench"
harness = false
required-features = ["bench"]
