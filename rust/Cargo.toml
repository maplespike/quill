[workspace]
resolver = "2"
members = ["crates/quill-search", "crates/quill-search-bench-gen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/reverb256/quill"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.26"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
