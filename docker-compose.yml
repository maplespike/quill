# =============================================================================
# MapleSpike — Local Development Docker Compose Stack
# =============================================================================
# Builds and runs the three MapleSpike services (API + MCP + Portal) from the
# multi-stage Dockerfile at repo root.
#
# Usage:
#   docker compose up -d --build     # boot detached, build images
#   docker compose logs -f           # follow logs
#   docker compose down              # tear down
#
# Or use the helper: scripts/dev-up.sh
# =============================================================================

name: maplespike

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    image: quill-api:local
    container_name: quill-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      PORT: "8082"
      QUILL_STORAGE: sqlite
      QUILL_API_KEY: ${QUILL_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      QUILL_DB_PATH: /data/maplespike.db
      QUILL_LOG_LEVEL: ${QUILL_LOG_LEVEL:-info}
      APP_URL: http://localhost:8082
      MAPLESPIKE_DOMAIN: ${MAPLESPIKE_DOMAIN:-localhost}
      MAPLESPIKE_ORIGIN: ${MAPLESPIKE_ORIGIN:-http://localhost:8082}
    volumes:
      - quill-api-data:/data
    networks:
      - maplespike
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  quill:
    build:
      context: .
      dockerfile: Dockerfile
      target: quill-mcp
    image: quill-mcp:local
    container_name: quill-mcp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      QUILL_API_URL: http://api:8082/v1
      QUILL_LOCALE: ${QUILL_LOCALE:-en-CA}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - maplespike
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
    image: quill-portal:local
    container_name: quill-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
      # Same-origin /api proxy target (no /v1 suffix — the frontend sends /api/v1/...)
      API_UPSTREAM: http://api:8082
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  maplespike:
    driver: bridge
    name: maplespike

volumes:
  quill-api-data:
    name: quill-api-data
