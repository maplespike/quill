# =============================================================================
# ⚠️  OPERATOR-ONLY post-flip (2026-07-10) — see AGENTS.md install-matrix item 2
# Default image URLs target `nexus:5000/quill-<svc>` which is the operator-host
# registry on the bare metal cluster. External self-hosters without nexus access
# should EITHER:
#   (a) `nix build .#quill-<svc>-image && podman load < result && podman tag ...`
#       then update the `image:` line below to your local registry path; OR
#   (b) use `./scripts/dev-up.sh` (which wraps these same images but reads
#       `IMAGE_REGISTRY` from .env — set it to `localhost` for a fully local
#       build-and-load loop); OR
#   (c) use the canonical Podman Quadlet path: `nix run .#selfhost up`.
# =============================================================================

# =============================================================================
# Quill — One-touch self-hosting (Docker / Podman Compose)
# =============================================================================
# Bring up the entire Quill stack (API + MCP + Portal) on any host with Docker
# or Podman. No Nix required. Mirrors the podman-quadlet generator at
# quill/nix/selfhost.nix so behaviour stays equivalent across install paths.
#
#   docker compose up -d        # or: podman compose up -d
#   docker compose ps
#   docker compose logs -f
#   docker compose down
#
# After startup: http://localhost:8080
# =============================================================================
services:
  api:
    image: nexus:5000/quill-api:${QUILL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: quill-api
    restart: unless-stopped
    depends_on:
      quill-redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      PORT: 8082
      QUILL_STORAGE: ${QUILL_STORAGE:-sqlite}
      QUILL_DB_PATH: /data/quill.db
      # Gate A2-REDIS (#764, #770): the response cache and the distributed
      # rate-limit counters. Without this the API caches nothing and enforces
      # its limits in-process — it never dials a guessed host.
      REDIS_URL: ${REDIS_URL:-redis://quill-redis:6379}
      # JWT_SECRET: optional; set via .env to enable real auth, defaults to dev.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
    volumes:
      - quill-api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8082/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quill-net

  # Redis — cache + rate-limit counters (gate A2-REDIS). Ephemeral by design:
  # no RDB snapshots, no AOF. A restart resets cached bodies and counters,
  # which is correct for both.
  quill-redis:
    image: redis:8-alpine
    container_name: quill-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - quill-net

  mcp:
    image: nexus:5000/quill-mcp:${QUILL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: quill-mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      QUILL_API_URL: http://quill-api:8082/v1
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - quill-net

  portal:
    image: nexus:5000/quill-portal:${QUILL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.portal
    container_name: quill-portal
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      # Same-origin /api proxy target (no /v1 suffix — the frontend sends /api/v1/...)
      API_UPSTREAM: http://quill-api:8082
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')\" || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - quill-net

  ingest:
    image: nexus:5000/quill-ingest:${QUILL_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.ingest
    container_name: quill-ingest
    profiles:
      - ingest
    restart: "no"
    environment:
      NODE_ENV: production
      QUILL_PIPELINE: ${QUILL_PIPELINE:-help}
    networks:
      - quill-net

volumes:
  quill-api-data:
    driver: local

networks:
  quill-net:
    driver: bridge
    name: quill-net
