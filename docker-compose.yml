# =============================================================================
# MapleSpike — Local Development Docker Compose Stack
# =============================================================================
# Builds and runs the three MapleSpike services (API + MCP + Portal) from the
# multi-stage Dockerfile at repo root.
#
# Usage:
#   docker compose up -d --build     # boot detached, build images
#   docker compose logs -f           # follow logs
#   docker compose down              # tear down
#
# Or use the helper: scripts/dev-up.sh
# =============================================================================

name: maplespike

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api-server
    image: maplespike-api:local
    container_name: maplespike-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      PORT: "8082"
      MAPLESPIKE_STORAGE: sqlite
      MAPLESPIKE_API_KEY: ${MAPLESPIKE_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      MAPLESPIKE_DB_PATH: /data/maplespike.db
      MAPLESPIKE_LOG_LEVEL: ${MAPLESPIKE_LOG_LEVEL:-info}
      APP_URL: http://localhost:8082
      MAPLESPIKE_DOMAIN: ${MAPLESPIKE_DOMAIN:-localhost}
      MAPLESPIKE_ORIGIN: ${MAPLESPIKE_ORIGIN:-http://localhost:8082}
    volumes:
      - maplespike-api-data:/data
    networks:
      - maplespike
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp-server
    image: maplespike-mcp:local
    container_name: maplespike-mcp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      MAPLESPIKE_API_URL: http://api:8082/v1
      MAPLESPIKE_LOCALE: ${MAPLESPIKE_LOCALE:-en-CA}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - maplespike
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
    image: maplespike-portal:local
    container_name: maplespike-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - maplespike
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  maplespike:
    driver: bridge
    name: maplespike

volumes:
  maplespike-api-data:
    name: maplespike-api-data
