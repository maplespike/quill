apiVersion: apps/v1
kind: Deployment
metadata:
  name: civic-intel
  namespace: civic-intel
  labels:
    app.kubernetes.io/name: civic-intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: civic-intel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: civic-intel
    spec:
      hostNetwork: true
      nodeSelector:
        kubernetes.io/hostname: nexus
      containers:
        - name: civic-intel
          image: localhost/civic-intel:latest
          imagePullPolicy: Never
          args:
            ["darkhttpd", "/var/www/", "--port", "8081", "--addr", "0.0.0.0"]
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: civic-intel
  namespace: civic-intel
  labels:
    app.kubernetes.io/name: civic-intel
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
  selector:
    app.kubernetes.io/name: civic-intel
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civic-intel
  namespace: civic-intel
  annotations:
    caddy.ingress.kubernetes.io/disable-ssl-redirect: "true"
  labels:
    app.kubernetes.io/name: civic-intel
spec:
  ingressClassName: caddy
  rules:
    - host: civicintel.lan
      http:
        paths:
          - path: /CivicIntel
            pathType: Prefix
            backend:
              service:
                name: civic-intel
                port:
                  number: 8081
    - host: civicintel.cluster.local
      http:
        paths:
          - path: /CivicIntel
            pathType: Prefix
            backend:
              service:
                name: civic-intel
                port:
                  number: 8081
