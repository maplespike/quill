name: Weekly Release

on:
  schedule:
    - cron: "0 14 * * 5"  # Every Friday at 2 PM
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  prepare-release:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - run: pnpm install --frozen-lockfile

      - name: Check for changesets
        id: check-changesets
        run: |
          CSET_COUNT=$(ls .changeset/*.md 2>/dev/null | grep -v README | wc -l)
          echo "count=$CSET_COUNT" >> $GITHUB_OUTPUT
          if [ "$CSET_COUNT" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Version packages
        if: steps.check-changesets.outputs.has_changesets == 'true'
        env:
          # changesets' changelog generation reads GITHUB_TOKEN; without it the
          # step dies with "Please create a GitHub personal access token ..."
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          echo "## 📦 Release Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git diff --stat HEAD >> $GITHUB_STEP_SUMMARY

      - name: Create Release PR
        if: steps.check-changesets.outputs.has_changesets == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: 'changeset-release/prod'
            });

            if (prs.length === 0) {
              // Commit and push version changes
              const { execSync } = require('child_process');
              execSync('git config user.name "maple-automation"');
              execSync('git config user.email "automation@maplespike.ca"');
              execSync('git add -A');
              execSync('git commit -m "chore: version packages for weekly release"');
              execSync('git push origin HEAD:changeset-release/prod');

              // Create PR
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'chore: weekly release',
                head: 'changeset-release/prod',
                base: 'prod',
                body: '## 📦 Weekly Release\n\nAutomated version bump and changelog generation.\n\n_Generated by weekly-release workflow_'
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['release', 'automation']
              });

              return `Created PR #${pr.number}`;
            } else {
              return `Release PR already exists: #${prs[0].number}`;
            }

      - name: No changesets
        if: steps.check-changesets.outputs.has_changesets == 'false'
        run: |
          echo "✅ No pending changesets — no release needed this week." >> $GITHUB_STEP_SUMMARY
