# =============================================================================
# MapleSpike — Deploy Dev
# Triggers on push to main, builds images and deploys to maplespike-dev
# Dev is the chaotic "break anything" space — not a canary
# =============================================================================
name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - 'packages/**'
    - 'flake.nix'
    - 'flake.lock'
    - 'k8s/**'
    - '.github/workflows/deploy-dev.yml'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-dev

jobs:
  build-and-push:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile

      # Set working directory for composite TypeScript builds
      - run: echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV

      - run: pnpm run clean
      - run: bash scripts/build-packages.sh
      - run: node scripts/build-docs.mjs
      - run: cd packages/pipeline-core && pnpm rebuild better-sqlite3

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: build-and-push
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: bash scripts/build-packages.sh

      # Build docs pages from markdown source
      - run: node scripts/build-docs.mjs

      - name: Decrypt vault (JIT)
        run: |
          eval "$(./scripts/decrypt-secrets.sh)"
          echo "MAPLESPIKE_GHCR_PAT_TOKEN=${MAPLESPIKE_GHCR_PAT_TOKEN}" >> $GITHUB_ENV
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}

      # Podman-native registry login (self-hosted NixOS runner has no Docker daemon)
      - name: Login to GHCR
        run: |
          echo "${{ env.MAPLESPIKE_GHCR_PAT_TOKEN || env.REGISTRY_PASS }}" | \
            podman login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin

      - name: Build & push API (dev) — Nix
        run: |
          nix build .#maplespike-api-image -L
          podman load < result
          podman tag maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:dev
          podman tag maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-api:dev
          podman push ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}

      - name: Build & push MCP (dev) — Nix
        run: |
          nix build .#maplespike-mcp-image -L
          podman load < result
          podman tag maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:dev
          podman tag maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:dev
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}

      - name: Build & push Portal (dev) — Nix
        run: |
          nix build .#maplespike-portal-image -L
          podman load < result
          podman tag maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:dev
          podman tag maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:dev
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}

  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV
      - name: Apply K8s manifests
        run: |
          bash ${{ env.WORKSPACE }}/scripts/auto-rollback.sh deploy \
            "${{ env.NAMESPACE }}" \
            "maplespike-api" \
            "http://maplespike-api.${{ env.NAMESPACE }}.svc.cluster.local/v1/health" \
            "k8s/dev/"
          bash ${{ env.WORKSPACE }}/scripts/auto-rollback.sh deploy \
            "${{ env.NAMESPACE }}" \
            "maplespike-mcp" \
            "http://maplespike-mcp.${{ env.NAMESPACE }}.svc.cluster.local/v1/health" \
            "k8s/dev/"
          bash ${{ env.WORKSPACE }}/scripts/auto-rollback.sh deploy \
            "${{ env.NAMESPACE }}" \
            "maplespike-portal" \
            "http://maplespike-portal.${{ env.NAMESPACE }}.svc.cluster.local/health" \
            "k8s/dev/"
      - name: Verify cluster health
        run: |
          bash ${{ env.WORKSPACE }}/scripts/health-verification.sh "${{ env.NAMESPACE }}"
      - name: Escalate on deployment failure
        if: failure()
        run: |
          bash ${{ env.WORKSPACE }}/scripts/escalate-incident.sh \
            deployment_failure \
            "{\"namespace\": \"${{ env.NAMESPACE }}\", \"commit\": \"${{ github.sha }}\", \"workflow\": \"deploy-dev\"}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  promote:
    name: Promote to Prod
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt vault (JIT)
        run: |
          eval "$(./scripts/decrypt-secrets.sh)"
          echo "MAPLESPIKE_GITHUB_PROMOTION_TOKEN=${MAPLESPIKE_GITHUB_PROMOTION_TOKEN}" >> $GITHUB_ENV
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Re-checkout with promotion token
        uses: actions/checkout@v4
        with:
          token: ${{ env.MAPLESPIKE_GITHUB_PROMOTION_TOKEN }}
          fetch-depth: 0

      - name: Merge main to prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main origin/prod:prod
          git checkout prod
          git merge main --no-edit
          git push origin prod
