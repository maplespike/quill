# =============================================================================
# MapleSpike — Deploy Dev
# Triggers on push to main, builds images and deploys to maplespike-dev
# Dev is the chaotic "break anything" space — not a canary
# =============================================================================
name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - '.github/workflows/deploy-dev.yml'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-dev

jobs:
  build-and-push:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Set working directory for composite TypeScript builds
- run: echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV

  - run: pnpm run clean
  - run: pnpm build
  - run: node scripts/build-docs.mjs
  - run: pnpm rebuild better-sqlite3

  - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: build-and-push
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

- run: pnpm install --frozen-lockfile
  - run: pnpm run clean
  - run: pnpm build

      # Build docs pages from markdown source
      - run: node scripts/build-docs.mjs

      - name: Decrypt vault (JIT)
        run: |
          eval "$(./scripts/decrypt-secrets.sh)"
          echo "MAPLESPIKE_GHCR_PAT_TOKEN=${MAPLESPIKE_GHCR_PAT_TOKEN}" >> $GITHUB_ENV
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.MAPLESPIKE_GHCR_PAT_TOKEN || env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike/maplespike-api:dev
            ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build & push MCP (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike/maplespike-mcp:dev
            ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-dev
          cache-to: type=gha,mode=max,scope=mcp-dev

      - name: Build & push Portal (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike/maplespike-portal:dev
            ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-dev
          cache-to: type=gha,mode=max,scope=portal-dev

  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/dev/ --prune --all --prune-allowlist=apps/v1/Deployment --prune-allowlist=/v1/Service --prune-allowlist=/v1/ConfigMap --prune-allowlist=/v1/Secret --validate=false
      - name: Rollout dev deployments
        run: |
          kubectl rollout restart deployment -n $NAMESPACE maplespike-api
          kubectl rollout restart deployment -n $NAMESPACE maplespike-mcp
          kubectl rollout restart deployment -n $NAMESPACE maplespike-portal
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n $NAMESPACE maplespike-api --timeout=5m
          kubectl rollout status deployment -n $NAMESPACE maplespike-mcp --timeout=5m
          kubectl rollout status deployment -n $NAMESPACE maplespike-portal --timeout=5m

  promote:
    name: Promote to Prod
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt vault (JIT)
        run: |
          eval "$(./scripts/decrypt-secrets.sh)"
          echo "MAPLESPIKE_GITHUB_PROMOTION_TOKEN=${MAPLESPIKE_GITHUB_PROMOTION_TOKEN}" >> $GITHUB_ENV
        env:
          AGE_SECRET_KEY: ${{ secrets.AGE_SECRET_KEY }}

      - name: Merge main to prod
        uses: actions/checkout@v4
        with:
          token: ${{ env.MAPLESPIKE_GITHUB_PROMOTION_TOKEN }}
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main origin/prod:prod
          git checkout prod
          git merge main --no-edit
          git push origin prod
        working-directory: ${{ github.workspace }}
