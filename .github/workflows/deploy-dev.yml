# =============================================================================
# MapleSpike — Deploy Dev
# Builds Docker images for dev on merge to main.
# Actual K8s deployment is handled by cluster CronJob (auto-deploy).
# =============================================================================
name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/dev/**'
      - '.github/workflows/deploy-dev.yml'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ── Step 1: Test (gate) ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: pnpm -r build
      - run: node scripts/build-docs.mjs

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

      - name: Build-check legal-core
        run: pnpm build
        working-directory: packages/legal-core
      - name: Build-check legislation
        run: pnpm build
        working-directory: packages/legislation
      - name: Build-check api-server
        run: pnpm build
        working-directory: packages/api-server

  # ── Step 2: Build and push images ───────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:dev
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build & push MCP (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-mcp:dev
            ghcr.io/reverb256/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-dev
          cache-to: type=gha,mode=max,scope=mcp-dev

      - name: Build & push Portal (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:dev
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-dev
          cache-to: type=gha,mode=max,scope=portal-dev
