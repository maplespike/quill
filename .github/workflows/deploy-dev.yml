# =============================================================================
# MapleSpike — Deploy Dev
# Builds Docker images + deploys to K3s dev namespace on merge to main
# =============================================================================
name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/dev/**'
      - '.github/workflows/deploy-dev.yml'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ── Step 1: Build, test, and deploy ──
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build images that dev actually uses ──
      - name: Build & push API (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:dev
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build & push MCP (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-mcp:dev
            ghcr.io/reverb256/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-dev
          cache-to: type=gha,mode=max,scope=mcp-dev

      - name: Build & push Portal (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:dev
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-dev
          cache-to: type=gha,mode=max,scope=portal-dev

      # ── Deploy to K3s dev namespace ──
      - name: Deploy to K3s (dev)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEXUS_HOST }}
          port: ${{ secrets.NEXUS_PORT || '22' }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            set -e

            # Authenticate with GHCR to pull private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            cd /data/projects/own/maplespike

            # Update to latest code
            git fetch origin main
            git checkout main
            git pull origin main

            # Pull dev images from GHCR, retag for local registry
            for img in api mcp portal; do
              echo "=== Pulling maplespike-$img:dev ==="
              docker pull ghcr.io/reverb256/maplespike-$img:dev 2>/dev/null || echo "Warning: pull failed for $img"
              docker tag ghcr.io/reverb256/maplespike-$img:dev nexus:5000/maplespike-$img:dev 2>/dev/null || true
              docker push nexus:5000/maplespike-$img:dev 2>/dev/null || \
                podman push --tls-verify=false nexus:5000/maplespike-$img:dev 2>/dev/null || true
            done

            # Ensure dev namespace exists
            kubectl create namespace maplespike-dev 2>/dev/null || true

            # Apply all dev manifests
            for f in k8s/dev/*.yaml; do
              kubectl apply -f "$f" --wait=true 2>&1 || true
            done

            # Restart deployments to pick up new images
            for deploy in maplespike-api maplespike-mcp maplespike-portal; do
              kubectl rollout restart deployment/$deploy -n maplespike-dev --timeout=120s 2>/dev/null || true
            done

            # Wait for readiness
            kubectl rollout status deployment/maplespike-api -n maplespike-dev --timeout=120s || true
            kubectl rollout status deployment/maplespike-mcp -n maplespike-dev --timeout=120s || true
            kubectl rollout status deployment/maplespike-portal -n maplespike-dev --timeout=60s || true

            # Report
            echo "=== Dev Deployment Complete ==="
            kubectl get pods -n maplespike-dev
