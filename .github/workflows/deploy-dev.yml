# Dev deploy runs on the self-hosted NixOS runner — node/pnpm/kubectl/podman
# are system packages per docs/GITHUB-ACTIONS-NIX.md. Image paths use the
# `nexus:5000/quill-<svc>` namespace per ADR 0007.
name: Deploy to Development

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  deploy-dev:
    name: Deploy to maplespike-dev
    needs: ci
    runs-on: [self-hosted, nixos]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Apply dev overlay
        run: |
          kubectl apply -k k8s/overlays/dev/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/quill-api -n maplespike-dev --timeout=3m || true
          kubectl rollout status deployment/quill-portal -n maplespike-dev --timeout=3m || true
          kubectl rollout status deployment/cloudflared -n maplespike-dev --timeout=3m || true

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://api.maplespike.ca/v1/health && echo "✓ API healthy" || echo "⚠ API health check unavailable"
          curl -sfI https://maplespike.ca/ && echo "✓ Portal up" || echo "⚠ Portal unavailable"

  build-docker:
    name: Build & Push Dev Docker Images
    needs: ci
    runs-on: [self-hosted, nixos]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dev Portal image (push: false — operator-side nix run .#push-images)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: portal
          push: false
          tags: |
            nexus:5000/quill-portal:dev
            nexus:5000/quill-portal:${{ github.sha }}

      - name: Build dev API image (push: false)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api-server
          push: false
          tags: |
            nexus:5000/quill-api:dev
            nexus:5000/quill-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/quill-api -n maplespike-dev --timeout=5m
          kubectl rollout status deployment/quill-portal -n maplespike-dev --timeout=5m