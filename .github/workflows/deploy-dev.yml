name: Deploy to Development

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  deploy-dev:
    name: Deploy to maplespike-dev
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DEV }}" | base64 -d > ~/.kube/config

      - name: Apply dev overlay
        run: |
          kubectl apply -k k8s/overlays/dev/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/maplespike-api -n maplespike-dev --timeout=3m || true
          kubectl rollout status deployment/maplespike-portal -n maplespike-dev --timeout=3m || true
          kubectl rollout status deployment/cloudflared -n maplespike-dev --timeout=3m || true

      - name: Smoke test
        run: |
          sleep 10
          curl -sf https://dev-api.maplespike.lan/v1/health && echo "✓ dev API healthy" || echo "⚠ dev API health check unavailable"
          curl -sfI https://dev.maplespike.lan/ && echo "✓ dev Portal up" || echo "⚠ dev Portal unavailable"

  build-docker:
    name: Build & Push Dev Docker Images
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev portal image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:dev
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}

      - name: Build and push dev API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api-server
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:dev
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/maplespike-api -n maplespike-dev --timeout=5m
          kubectl rollout status deployment/maplespike-portal -n maplespike-dev --timeout=5m