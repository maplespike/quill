# Dev deploy runs on the self-hosted NixOS runner — node/pnpm/kubectl/nix/podman
# are system packages per docs/GITHUB-ACTIONS-NIX.md.
#
# CANONICAL DEPLOY PATH (2026-08-10): the Nix-generated manifest bundle
# (`nix build .#saas-manifests` → `kubectl apply -f result/manifests.yaml`) is
# the single source of truth for the live cluster. Image tags are pinned per
# service in flake.nix — NOT `latest` (the cluster's `deny-latest-tag-deployments`
# admission policy rejects it).
#
# Old workflow (pre-2026-08-10) deployed to a `quill-dev` namespace that never
# existed on the single-node k3s cluster — the live cluster has ONE production
# namespace `maplespike`. Dev is exercised via the Docker Compose stack
# (`./scripts/dev-up.sh`) or `nix run .#selfhost up`; this workflow gates main
# and validates the canonical manifests without applying to the shared cluster.
name: Deploy to Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        continue-on-error: true

  validate-manifests:
    name: Validate Nix manifests render
    needs: ci
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manifests from Nix (canonical path)
        run: |
          nix build .#saas-manifests -L
          test -s result/manifests.yaml
          grep -q 'name: maplespike' result/manifests.yaml
          grep -q 'clusterIP: 10.43.100.10' result/manifests.yaml
          echo "✓ saas-manifests renders (14 resources)"
