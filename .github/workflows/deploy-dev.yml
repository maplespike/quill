# =============================================================================
# MapleSpike — Deploy Dev
# Triggers on push to main, builds images and deploys to maplespike-dev
# Dev is the chaotic "break anything" space — not a canary
# =============================================================================
name: Deploy Dev

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - '.github/workflows/deploy-dev.yml'

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: pnpm -r build
      - run: node scripts/build-docs.mjs
      - run: pnpm rebuild better-sqlite3

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:dev
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build & push MCP (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-mcp:dev
            ghcr.io/reverb256/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-dev
          cache-to: type=gha,mode=max,scope=mcp-dev

      - name: Build & push Portal (dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:dev
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-dev
          cache-to: type=gha,mode=max,scope=portal-dev

    deploy:
      name: Deploy to K8s
      needs: build
      runs-on: [self-hosted, nixos]
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Check GHCR secret
          run: |
            echo "Checking if ghcr-pull secret exists in namespace $NAMESPACE..."
            if kubectl get secret ghcr-pull -n $NAMESPACE &>/dev/null; then
              echo "Secret ghcr-pull found."
              # Optionally, check that we can decode the .dockerconfigjson (without showing token)
              if kubectl get secret ghcr-pull -n $NAMESPACE -o jsonpath='{.data.\.dockerconfigjson}' | base64 --decode | jq -r '.auths."ghcr.io".username' 2>/dev/null | grep -q reverb256; then
                echo "Secret appears to contain credentials for reverb256."
              else
                echo "Warning: Secret does not seem to contain expected credentials."
              fi
            else
              echo "Error: Secret ghcr-pull not found in namespace $NAMESPACE."
              echo "Available secrets:"
              kubectl get secrets -n $NAMESPACE
              exit 1
            fi
        - name: Verify image accessibility
          run: |
            echo "Checking if we can pull the API image (dry run)..."
            # Use kubectl to attempt to pull the image (this will use the secret)
            if kubectl run --rm -i --temp --image=ghcr.io/reverb256/maplespike-api:dev --restart=Never --image-pull-policy=IfNotPresent --command -- sh -c "echo Image pulled successfully" 2>&1 | grep -q "Image pulled successfully"; then
              echo "Image pull test succeeded."
            else
              echo "Image pull test failed. Check secret and token scope."
              # Optional: try to curl GHCR to see if it's public
              if curl -s -o /dev/null -w "%{http_code}" "https://ghcr.io/v2/reverb256/maplespike-api/manifests/dev"; then
                echo "GHCR manifest is accessible (public or token works)."
              else
                echo "GHCR manifest not accessible (private or token invalid)."
              fi
              exit 1
            fi

      - name: Apply K8s manifests
        run: |
          cd /etc/nixos
           /run/current-system/sw/bin/kubectl apply -f <(nix eval .#kubernetes.objects --json | jq -r '.[] | @yaml') || true

      - name: Rollout dev deployments
        run: |
           /run/current-system/sw/bin/kubectl rollout restart deployment -n $NAMESPACE maplespike-api
           /run/current-system/sw/bin/kubectl rollout restart deployment -n $NAMESPACE maplespike-mcp
          kubectl rollout restart deployment -n $NAMESPACE maplespike-portal

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n $NAMESPACE maplespike-api --timeout=5m
          kubectl rollout status deployment -n $NAMESPACE maplespike-mcp --timeout=5m
          kubectl rollout status deployment -n $NAMESPACE maplespike-portal --timeout=5m

  promote:
    name: Promote to Prod
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN_FOR_PROMOTION }}

      - name: Merge main to prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main origin/prod:prod
          git checkout prod
          git merge main --no-edit
          git push origin prod
