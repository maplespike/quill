# =============================================================================
# Quill — Live Data Check
# Nightly verification that all external data endpoints are reachable
# and returning expected data. Creates a GitHub issue on failure.
# =============================================================================
name: Live Data Check

on:
  schedule:
    - cron: '0 6 * * *'   # Daily 6 AM UTC
  workflow_dispatch:       # Manual trigger

concurrency:
  group: live-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  LIVE_DATA_TEST: 'true'

jobs:
  live-data:
    name: Live Data Integration Tests
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: bash scripts/build-packages.sh
      - run: pnpm rebuild better-sqlite3

      - name: Start API server (background)
        run: |
          node packages/api-server/dist/dev-server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/v1/health > /dev/null 2>&1; then
              echo "API server ready on port 8082"
              break
            fi
            echo "Waiting for API server... ($i/30)"
            sleep 1
          done

      - name: Run live endpoint smoke tests
        id: live-tests
        run: |
          cd packages/pipeline-core
          LIVE_DATA_TEST=true pnpm test 2>&1 | tee /tmp/live-test-output.txt
        continue-on-error: true

      - name: Check for failures
        id: check-failures
        run: |
          if grep -q '^not ok' /tmp/live-test-output.txt; then
            echo "failures<<EOF" >> $GITHUB_ENV
            grep '^not ok' /tmp/live-test-output.txt | head -20 >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            echo "has_failures=true" >> $GITHUB_ENV
          else
            echo "has_failures=false" >> $GITHUB_ENV
          fi

      - name: Create issue on failure
        if: env.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const failures = process.env.failures || 'Unknown';
            const summary = 'Live data check failed with:\n\n```\n' + failures + '\n```\n\nSee workflow run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[LIVE-DATA] Endpoint failures detected on ' + new Date().toISOString().slice(0, 10),
              body: summary,
              labels: ['bug', 'p2']
            })
