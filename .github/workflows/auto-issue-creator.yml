---
name: "Auto Create Issues"
on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9 AM
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-docs-review:
    name: "Check docs needing review"
    runs-on: arc-maplespike
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # scripts/docs-staleness.mjs owns the walk. `.changeset/` is skipped
      # there: changeset entries are transient and are not documentation
      # (#958, #1118).
      - name: "Find docs with stale last-reviewed"
        id: stale-docs
        run: node scripts/docs-staleness.mjs --json > "$RUNNER_TEMP/stale-docs.json"

      - name: "Open issues for stale docs"
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const today = new Date();
            const issuesToCreate = JSON.parse(
              fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'stale-docs.json'), 'utf8')
            );

            // Create issues for significant findings
            let issueCount = 0;
            for (const item of issuesToCreate.slice(0, 5)) {  // Max 5 issues per run
              const title = item.missing
                ? `docs: Add metadata to ${item.file.replace('./', '')}`
                : `docs: Review ${item.file.replace('./', '')} — not updated in ${item.daysSinceReview} days`;

              const body = item.missing
                ? `## Documentation Metadata Required\n\nFile: \`${item.file}\`\n\nThis file is missing the \`last-reviewed\` frontmatter metadata.\n\n### Required fix\nAdd to the file frontmatter:\n\`\`\`markdown\n---\nlast-reviewed: ${today.toISOString().split('T')[0]}\n---\n\`\`\`\n\n---\n_Automatically generated by docs-maintenance workflow_`
                : `## Documentation Review Required\n\nFile: \`${item.file}\`\n\nLast reviewed: ${item.lastReviewed}\nDays since review: ${item.daysSinceReview}\n\nThis documentation has not been reviewed in over 30 days.\n\n### Action Required\n- [ ] Review file for accuracy\n- [ ] Update \`last-reviewed\` frontmatter\n- [ ] Fix any outdated content\n\n---\n_Automatically generated by docs-maintenance workflow_`;

              // Check if issue already exists for this file
              const { data: existingIssues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'documentation,auto-generated'
              });

              const alreadyExists = existingIssues.some(issue =>
                issue.title.includes(item.file.replace('./', ''))
              );

              if (!alreadyExists) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['documentation', 'auto-generated', 'p3']
                });
                issueCount++;
              }
            }

            return `Created ${issueCount} new issues (${issuesToCreate.length} total findings, capped at 5)`;

  check-metrics-drift:
    name: "Check for metrics drift"
    runs-on: arc-maplespike
    steps:
      - uses: actions/checkout@v7
      - run: pnpm install --frozen-lockfile 2>/dev/null || true

      - name: "Detect metrics drift"
        id: drift-detect
        run: |
          node scripts/generate-metrics.mjs 2>/dev/null || true
          if git diff --exit-code docs/metrics.json 2>/dev/null; then
            echo "drift=false" >> $GITHUB_OUTPUT
            echo "Metrics are synchronized." >> $GITHUB_STEP_SUMMARY
          else
            echo "drift=true" >> $GITHUB_OUTPUT
            echo "⚠️ Metrics drift detected!" >> $GITHUB_STEP_SUMMARY
            git diff docs/metrics.json >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Regenerate metrics and commit (auto-heal)"
        if: steps.drift-detect.outputs.drift == 'true'
        run: |
          pnpm generate-metrics
          if git diff --quiet docs/metrics.json; then
            echo "regenerated output identical — nothing to commit"
            exit 0
          fi
          git config user.name "quill-ci-bot"
          git config user.email "ci-bot@maplespike.ca"
          git add docs/metrics.json
          git commit -m "chore(docs): regenerate metrics.json (auto-heal by docs-maintenance)"
          git push

      - name: "Create issue for metrics drift (fallback when auto-heal fails)"
        if: failure() && steps.drift-detect.outputs.drift == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['auto-generated', 'ci-cd']
            });
            const hasIssue = existing.some(i => i.title.includes('metrics drift'));
            if (!hasIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'fix: docs/metrics.json drift detected — regenerate metrics',
                body: `## Metrics Drift Detected\n\n\`docs/metrics.json\` is out of sync with the codebase.\n\n### Fix\nRun \`pnpm generate-metrics\` and commit the changes.\n\n---\n_Automatically generated by docs-maintenance workflow_`,
                labels: ['ci-cd', 'auto-generated', 'p2']
              });
            }
