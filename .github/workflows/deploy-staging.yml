# =============================================================================
# MapleSpike — Deploy Staging
# Triggers on push to main, builds images and deploys to maplespike-staging
# After deploy, auto-merges main to prod
# =============================================================================
name: Deploy Staging

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - '.github/workflows/deploy-staging.yml'

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-staging

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: pnpm -r build
      - run: node scripts/build-docs.mjs
      - run: pnpm rebuild better-sqlite3

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:staging
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-staging
          cache-to: type=gha,mode=max,scope=api-staging

      - name: Build & push MCP (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-mcp:staging
            ghcr.io/reverb256/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-staging
          cache-to: type=gha,mode=max,scope=mcp-staging

      - name: Build & push Portal (staging)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:staging
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-staging
          cache-to: type=gha,mode=max,scope=portal-staging

  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply K8s manifests
        run: |
          cd /etc/nixos
          kubectl apply -f <(nix eval .#kubernetes.objects --json | jq -r '.[] | @yaml') || true

      - name: Rollout staging deployments
        run: |
          kubectl rollout restart deployment -n $NAMESPACE maplespike-api
          kubectl rollout restart deployment -n $NAMESPACE maplespike-mcp
          kubectl rollout restart deployment -n $NAMESPACE maplespike-portal

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n $NAMESPACE maplespike-api --timeout=5m
          kubectl rollout status deployment -n $NAMESPACE maplespike-mcp --timeout=5m
          kubectl rollout status deployment -n $NAMESPACE maplespike-portal --timeout=5m

  promote:
    name: Promote to Prod
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN_FOR_PROMOTION }}

      - name: Merge main to prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main:main origin/prod:prod
          git checkout prod
          git merge main --no-edit
          git push origin prod