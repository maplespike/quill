name: Open-source facts audit

on:
  push:
    branches: [main, prod]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**/package.json'
      - 'packages/**/LICENSE*'
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/*.js'
      - 'packages/**/*.mjs'
      - 'packages/**/*.py'
      - 'packages/**/*.rs'
      - 'packages/**/*.sh'
      - 'scripts/audit-open-source.mjs'
      - 'scripts/test-audit-open-source.mjs'
      - '.github/workflows/open-source-audit.yml'
  pull_request_target:
    branches: [main, prod]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**/package.json'
      - 'packages/**/LICENSE*'
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/*.js'
      - 'packages/**/*.mjs'
      - 'packages/**/*.py'
      - 'packages/**/*.rs'
      - 'packages/**/*.sh'
      - 'scripts/audit-open-source.mjs'
      - 'scripts/test-audit-open-source.mjs'
      - '.github/workflows/open-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "nixos"]') }}
    steps:
      - name: Refuse untrusted code on self-hosted runners
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request)
              echo "::error::A pull_request job must not run on a self-hosted runner."
              exit 1
              ;;
            pull_request_target|workflow_run)
              if [[ -n "$EVENT_HEAD" && "$EVENT_HEAD" != "$THIS_REPO" ]]; then
                echo "::error::Refusing ${EVENT_NAME} from a fork on a self-hosted runner."
                exit 1
              fi
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Drop the job token before repository code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "GITHUB_TOKEN=" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted'
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: 22

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Test audit behavior
        run: pnpm test:audit:open-source

      - name: Generate source-level audit report
        run: node scripts/audit-open-source.mjs --format json --output open-source-audit.json

      - name: Publish audit report
        uses: actions/upload-artifact@v7
        with:
          name: quill-open-source-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: open-source-audit.json
          if-no-files-found: error
          retention-days: 90
