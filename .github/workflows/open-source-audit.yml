name: Open-source facts audit

on:
  push:
    branches: [main, prod]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**/package.json'
      - 'packages/**/LICENSE*'
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/*.js'
      - 'packages/**/*.mjs'
      - 'packages/**/*.py'
      - 'packages/**/*.rs'
      - 'packages/**/*.sh'
      - 'scripts/audit-open-source.mjs'
      - 'scripts/test-audit-open-source.mjs'
      - '.github/workflows/open-source-audit.yml'
  pull_request:
    branches: [main, prod]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/**/package.json'
      - 'packages/**/LICENSE*'
      - 'packages/**/*.ts'
      - 'packages/**/*.tsx'
      - 'packages/**/*.js'
      - 'packages/**/*.mjs'
      - 'packages/**/*.py'
      - 'packages/**/*.rs'
      - 'packages/**/*.sh'
      - 'scripts/audit-open-source.mjs'
      - 'scripts/test-audit-open-source.mjs'
      - '.github/workflows/open-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-maplespike' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: ARC runner tools
        if: startsWith(runner.name, 'arc-')
        uses: ./.github/actions/arc-tools

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted' || startsWith(runner.name, 'arc-')

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted' || startsWith(runner.name, 'arc-')
        with:
          node-version: 22

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Test audit behavior
        run: pnpm test:audit:open-source

      - name: Generate source-level audit report
        run: node scripts/audit-open-source.mjs --format json --output open-source-audit.json

      - name: Publish audit report
        uses: actions/upload-artifact@v7
        with:
          name: quill-open-source-audit-${{ github.sha }}
          path: open-source-audit.json
          if-no-files-found: error
          retention-days: 90
