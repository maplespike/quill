name: Health Monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: arc-maplespike
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x scripts/quill-health-check.sh && bash scripts/quill-health-check.sh --create-issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
