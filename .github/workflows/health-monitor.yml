name: Health Monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/maplespike-health-check.sh && bash scripts/maplespike-health-check.sh --create-issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
