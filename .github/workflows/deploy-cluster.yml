# =============================================================================
# MapleSpike — Deploy to K3s Cluster
# Triggers on push to main: builds 4 Docker targets, pushes to GHCR, then
# SSHs into nexus to import images into containerd and restart deployments.
# =============================================================================
name: Deploy Cluster

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - 'packages/**'
    - 'Dockerfile'
    - '.github/workflows/deploy-cluster.yml'

concurrency:
  group: deploy-cluster-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  CLUSTER_NAMESPACE: maplespike

jobs:
  canary:
    name: Build & Test (Canary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm -r test -- --reporter=dot
        continue-on-error: false

  build-and-push:
    name: Build & Push Images
    needs: canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      # ── API Server ────────────────────────────────────────────
      - name: Build and push API Server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api-server:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/api-server:dev
            ${{ env.REGISTRY }}/${{ github.repository }}/api-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── MCP Server ────────────────────────────────────────────
      - name: Build and push MCP Server
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp-server
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:dev
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Portal (Python static server) ─────────────────────────
      - name: Build and push Portal
        uses: docker/build-push-action@v6
        with:
          context: .
          target: portal
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/portal:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/portal:dev
            ${{ env.REGISTRY }}/${{ github.repository }}/portal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Ingestion Runner ──────────────────────────────────────
      - name: Build and push Ingestion
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ingestion
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/ingestion:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/ingestion:dev
            ${{ env.REGISTRY }}/${{ github.repository }}/ingestion:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K3s Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH into nexus — import images & restart deployments
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: nexus
          username: ${{ secrets.NEXUS_SSH_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          port: ${{ secrets.NEXUS_SSH_PORT || '22' }}
          script: |
            set -euo pipefail

            echo "=== Pulling images into containerd ==="

            # Authenticate containerd with GHCR using the deploy token
            # (token is passed via GITHUB_TOKEN secret mapped to env below)
            echo "${{ env.REGISTRY_PASS }}" | \
              ctr -n k8s.io registry login ${{ env.REGISTRY }} \
                -u ${{ env.REGISTRY_USER }} \
                --password-stdin 2>/dev/null || true

            IMAGES="
              ${{ env.REGISTRY }}/${{ github.repository }}/api-server:latest
              ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:latest
              ${{ env.REGISTRY }}/${{ github.repository }}/portal:latest
              ${{ env.REGISTRY }}/${{ github.repository }}/ingestion:latest
            "

            for IMG in $IMAGES; do
              echo "  Pulling $IMG ..."
              ctr -n k8s.io images pull "$IMG" 2>&1 | tail -1
            done

            echo ""
            echo "=== Restarting deployments in namespace ${{ env.CLUSTER_NAMESPACE }} ==="

            # Restart services in dependency order: api → mcp → portal
            for DEPLOY in maplespike-api maplespike-mcp maplespike-portal; do
              if kubectl get deployment "$DEPLOY" -n ${{ env.CLUSTER_NAMESPACE }} &>/dev/null; then
                echo "  Restarting $DEPLOY ..."
                kubectl rollout restart deployment "$DEPLOY" -n ${{ env.CLUSTER_NAMESPACE }}
                kubectl rollout status deployment "$DEPLOY" -n ${{ env.CLUSTER_NAMESPACE }} --timeout=300s
              else
                echo "  Skipping $DEPLOY (not found in namespace ${{ env.CLUSTER_NAMESPACE }})"
              fi
            done

            echo ""
            echo "=== Deploy complete ==="
            kubectl get pods -n ${{ env.CLUSTER_NAMESPACE }} -o wide

      - name: Verify cluster health
        if: success()
        run: |
          echo "Cluster deployment completed successfully."
          echo "Namespace: ${{ env.CLUSTER_NAMESPACE }}"
          echo "Commit: ${{ github.sha }}"

      - name: Escalate on deployment failure
        if: failure()
        run: |
          echo "::error::Cluster deployment failed for commit ${{ github.sha }}"
          # TODO: integration with Slack/PagerDuty via secrets
