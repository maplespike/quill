name: Deploy

on:
  push:
    branches:
      - main
      - prod
    paths:
      - 'packages/mcp-server/**'
      - 'packages/api-server/**'
      - 'packages/pipeline-core/**'
      - 'packages/engine/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - 'packages/portal/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run MCP server tests
        working-directory: packages/mcp-server
        run: pnpm test

      - name: Run engine tests
        working-directory: packages/engine
        run: pnpm test

  merge-to-prod:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'maplespike-bot'
          git config user.email 'bot@maplespike.ca'

      - name: Merge main into prod
        run: |
          git fetch origin prod
          git checkout prod
          git merge origin/main --ff-only
          git push origin prod

  # ── Deploy to K3s (runs on push to main OR prod) ──
  deploy-k3s:
    needs: [test, merge-to-prod]
    if: always() && (github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prod

      - name: Build and deploy on nexus via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEXUS_HOST }}
          port: ${{ secrets.NEXUS_PORT || '22' }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            set -e
            cd /data/projects/own/maplespike
            git fetch origin prod
            git checkout prod
            git pull origin prod

            # Build all Docker images
            docker build -f Dockerfile.mcp     -t nexus:5000/maplespike-mcp:latest     .
            docker build -f Dockerfile.api     -t nexus:5000/maplespike-api:latest     .
            docker build -f Dockerfile.ingest  -t nexus:5000/maplespike-ingest:latest  .
            docker build -f Dockerfile.engine  -t nexus:5000/maplespike-engine:latest  .

            # Build and push portal image for K3s
            docker build -f packages/portal/Dockerfile -t nexus:5000/maplespike-portal:latest packages/portal

            docker push nexus:5000/maplespike-mcp:latest
            docker push nexus:5000/maplespike-api:latest
            docker push nexus:5000/maplespike-ingest:latest
            docker push nexus:5000/maplespike-engine:latest
            docker push nexus:5000/maplespike-portal:latest

            # Rollout K8s deployments
            kubectl rollout restart deployment/maplespike-mcp -n ai-inference 2>/dev/null || \
              kubectl rollout restart deployment/civint-mcp -n ai-inference
            kubectl rollout status deployment/maplespike-mcp -n ai-inference --timeout=120s 2>/dev/null || \
              kubectl rollout status deployment/civint-mcp -n ai-inference --timeout=120s

            kubectl rollout restart deployment/maplespike-api -n ai-inference 2>/dev/null || \
              kubectl rollout restart deployment/civint-api -n ai-inference
            kubectl rollout status deployment/maplespike-api -n ai-inference --timeout=120s 2>/dev/null || \
              kubectl rollout status deployment/civint-api -n ai-inference --timeout=120s

            kubectl rollout restart deployment/maplespike-portal -n ai-inference 2>/dev/null || \
              kubectl apply -f packages/portal/k8s/deploy.yaml
            kubectl rollout status deployment/maplespike-portal -n ai-inference --timeout=60s 2>/dev/null || true

  # ── Portal: Deploy static site to GitHub Pages ──
  deploy-portal:
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject analytics domain
        run: |
          if [ -n "${{ secrets.MAPLESPIKE_ANALYTICS_DOMAIN }}" ]; then
            sed -i "s/__MAPLESPIKE_ANALYTICS_DOMAIN__/${{ secrets.MAPLESPIKE_ANALYTICS_DOMAIN }}/g" packages/portal/*.html
          else
            sed -i '/plausible/d' packages/portal/*.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/portal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
