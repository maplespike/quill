# MapleSpike Deploy — CI/CD for prod branch
# Builds + pushes Docker images, deploys to K3s via kubectl
# Triggers on push/merge to prod branch only
name: Deploy
on:
  push:
    branches: [prod]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/prod/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ── Step 1: Test ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @maplespike/engine test

  # ── Step 2: Build + push all images to GHCR ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push all images
        run: |
          for img in api mcp portal ingest engine; do
            echo "=== Building $img ==="
            docker build -f Dockerfile.$img \
              -t ghcr.io/reverb256/maplespike-$img:latest \
              -t ghcr.io/reverb256/maplespike-$img:${{ github.sha }} .
            docker push ghcr.io/reverb256/maplespike-$img:latest
            docker push ghcr.io/reverb256/maplespike-$img:${{ github.sha }}
          done

      # ── Step 3: Deploy to K3s cluster ──
      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEXUS_HOST }}
          port: ${{ secrets.NEXUS_PORT || '22' }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            set -e
            cd /data/projects/own/maplespike

            # Update code
            git fetch origin prod
            git checkout prod
            git pull origin prod

            # Pull images from GHCR, tag for local registry
            for img in api mcp portal ingest engine; do
              docker pull ghcr.io/reverb256/maplespike-$img:latest || true
              docker tag ghcr.io/reverb256/maplespike-$img:latest nexus:5000/maplespike-$img:latest 2>/dev/null || true
              docker push nexus:5000/maplespike-$img:latest 2>/dev/null || \
                podman push --tls-verify=false nexus:5000/maplespike-$img:latest 2>/dev/null || true
            done

            # (Re)create maplespike namespace and apply all prod manifests
            kubectl create namespace maplespike 2>/dev/null || true

            for f in k8s/prod/*.yaml; do
              kubectl apply -f "$f" --wait=true 2>&1 || true
            done

            # Restart deployments to pick up new images
            for deploy in maplespike-api maplespike-mcp maplespike-portal; do
              kubectl rollout restart deployment/$deploy -n maplespike --timeout=120s 2>/dev/null || true
            done

            # Wait for readiness
            kubectl rollout status deployment/maplespike-api -n maplespike --timeout=120s || true
            kubectl rollout status deployment/maplespike-mcp -n maplespike --timeout=120s || true
            kubectl rollout status deployment/maplespike-portal -n maplespike --timeout=60s || true

            # Verify
            echo "=== Deployment Complete ==="
            kubectl get pods -n maplespike
