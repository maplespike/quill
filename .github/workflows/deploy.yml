# ─────────────────────────────────────────────────────────────────
# MapleSpike Deploy — builds + pushes Docker images to GHCR,
# deploys backends to K3s, and publishes portal to GitHub Pages
# ─────────────────────────────────────────────────────────────────
name: Deploy
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write
  pages: write

jobs:
  # ── Step 1: Test ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test && cd ../mcp-server && pnpm test && cd ../engine && pnpm test
        working-directory: packages/sdk

  # ── Step 2: Build + push Docker images to GHCR + nexus ──
  build-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Login to GHCR
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build + push all 4 images to GHCR
      - run: |
          for img in mcp api ingest engine; do
            docker build -f Dockerfile.$img -t ghcr.io/reverb256/maplespike-$img:latest .
            docker push ghcr.io/reverb256/maplespike-$img:latest
          done

      # Deploy to K3s via SSH
      - name: Deploy to K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEXUS_HOST }}
          port: ${{ secrets.NEXUS_PORT || '22' }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            set -e
            cd /data/projects/own/maplespike
            git fetch origin main && git checkout main && git pull origin main
            for img in mcp api ingest engine; do
              docker pull ghcr.io/reverb256/maplespike-$img:latest
              docker tag ghcr.io/reverb256/maplespike-$img:latest nexus:5000/maplespike-$img:latest
              docker push nexus:5000/maplespike-$img:latest
            done
            kubectl rollout restart deployment/maplespike-mcp -n ai-inference --timeout=120s
            kubectl rollout restart deployment/maplespike-api -n ai-inference --timeout=120s

  # ── Step 3: Deploy portal to GitHub Pages ──
  deploy-portal:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build agents.json from SDK
        run: node packages/portal/scripts/generate-agents-json.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: packages/portal }
      - id: deployment
        uses: actions/deploy-pages@v4
