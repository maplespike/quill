name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'packages/mcp-server/**'
      - 'packages/api-server/**'
      - 'packages/pipeline-core/**'
      - 'packages/engine/**'
      - 'packages/sdk/**'
      - 'packages/portal/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: |
          cd packages/pipeline-core && npx tsc --noEmit &
          cd packages/mcp-server && npx tsc --noEmit &
          cd packages/sdk && npx tsc --noEmit &
          cd packages/api-server && npx tsc --noEmit &
          wait

      - name: Build all packages
        run: pnpm -r build

      - name: Run all tests
        run: |
          cd packages/sdk && pnpm test &
          cd packages/pipeline-core && pnpm test &
          cd packages/mcp-server && pnpm test &
          cd packages/engine && pnpm test &
          cd packages/api-server && pnpm test &
          wait

  # ── Backend: Build Docker images on nexus ──
  build-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and deploy on nexus via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEXUS_HOST }}
          port: ${{ secrets.NEXUS_PORT || '22' }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            set -e
            cd /data/projects/own/maplespike
            git fetch origin main
            git checkout main
            git pull origin main

            # Build images with local nexus tags
            docker build -f Dockerfile.mcp     -t nexus:5000/maplespike-mcp:latest     .
            docker build -f Dockerfile.api     -t nexus:5000/maplespike-api:latest     .
            docker build -f Dockerfile.ingest  -t nexus:5000/maplespike-ingest:latest  .
            docker build -f Dockerfile.engine  -t nexus:5000/maplespike-engine:latest  .

            # Push to local nexus registry
            docker push nexus:5000/maplespike-mcp:latest
            docker push nexus:5000/maplespike-api:latest
            docker push nexus:5000/maplespike-ingest:latest
            docker push nexus:5000/maplespike-engine:latest

            # Also tag and push to GHCR if GITHUB_TOKEN is available
            if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              docker tag nexus:5000/maplespike-mcp:latest     ghcr.io/reverb256/maplespike-mcp:latest
              docker tag nexus:5000/maplespike-api:latest     ghcr.io/reverb256/maplespike-api:latest
              docker tag nexus:5000/maplespike-ingest:latest  ghcr.io/reverb256/maplespike-ingest:latest
              docker tag nexus:5000/maplespike-engine:latest  ghcr.io/reverb256/maplespike-engine:latest
              docker push ghcr.io/reverb256/maplespike-mcp:latest
              docker push ghcr.io/reverb256/maplespike-api:latest
              docker push ghcr.io/reverb256/maplespike-ingest:latest
              docker push ghcr.io/reverb256/maplespike-engine:latest
            fi

            kubectl rollout restart deployment/civint-mcp -n ai-inference
            kubectl rollout status deployment/civint-mcp -n ai-inference --timeout=120s

            kubectl rollout restart deployment/civint-api -n ai-inference
            kubectl rollout status deployment/civint-api -n ai-inference --timeout=120s

  # ── Portal: Deploy static site to GitHub Pages ──
  deploy-portal:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject analytics domain
        run: |
          if [ -n "${{ secrets.MAPLESPIKE_ANALYTICS_DOMAIN }}" ]; then
            sed -i "s/__MAPLESPIKE_ANALYTICS_DOMAIN__/${{ secrets.MAPLESPIKE_ANALYTICS_DOMAIN }}/g" packages/portal/*.html
            echo "Analytics domain injected: ${{ secrets.MAPLESPIKE_ANALYTICS_DOMAIN }}"
          else
            sed -i '/plausible/d' packages/portal/*.html
            echo "No analytics domain set — analytics disabled"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/portal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
