# =============================================================================
# MapleSpike — Image Digest Drift Check
# Runs weekly to detect when upstream image digests have changed
# Creates an issue if drift is detected
# =============================================================================
name: Image Digest Drift Check

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    name: Check Image Digest Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current digests
        run: |
          pip install requests > /dev/null 2>&1
          python3 scripts/check-image-drift.py > drift-report.txt 2>&1 || true
          cat drift-report.txt

      - name: Check for drift
        id: drift
        run: |
          if grep -q "DRIFT" drift-report.txt; then
            echo "has_drift=true" >> $GITHUB_OUTPUT
            echo "Drift detected!"
          else
            echo "has_drift=false" >> $GITHUB_OUTPUT
            echo "No drift detected"
          fi

      - name: Create drift issue
        if: steps.drift.outputs.has_drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('drift-report.txt', 'utf8');
            const title = `Supply Chain: Container image digest drift detected`;
            const body = `## Image Digest Drift Report\n\nGenerated: ${new Date().toISOString()}\n\n\`\`\`\n${report}\n\`\`\`\n\n### Action Required\n\n1. Run \`scripts/update-image-digests.sh\` to resolve new digests\n2. Run \`scripts/apply-image-pins.sh\` to update k8s manifests\n3. Review changes and commit\n4. Run \`pnpm build && pnpm test\` to verify\n\n---\n*Auto-generated by Image Digest Drift Check workflow*`;

            // Check if there's already an open issue with this title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'supply-chain'
            });

            const existing = issues.data.find(i => i.title.includes('digest drift'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `## Updated Drift Report\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['supply-chain', 'p1']
              });
            }
