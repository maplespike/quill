name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read
  packages: write  # needed for GHCR push

env:
  NODE_ENV: test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Auto-detects version from package.json packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm -r test -- --reporter=dot
        continue-on-error: false
        # NOTE: If notification-service tests fail, check SQLite version compatibility

  docker-build:
    # Build container images to verify Dockerfile, but only push on main
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/api-server:latest
            ghcr.io/${{ github.repository }}/api-server:${{ github.sha }}

      - name: Build and push MCP Server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp-server
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/mcp-server:latest
            ghcr.io/${{ github.repository }}/mcp-server:${{ github.sha }}

      - name: Build and push Portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: portal
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/portal:latest
            ghcr.io/${{ github.repository }}/portal:${{ github.sha }}
