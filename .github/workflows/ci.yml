name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check pipeline-core
        working-directory: packages/pipeline-core
        run: npx tsc --noEmit

      - name: Type-check MCP server
        working-directory: packages/mcp-server
        run: npx tsc --noEmit

      - name: Type-check SDK
        working-directory: packages/sdk
        run: npx tsc --noEmit

      - name: Type-check API server
        working-directory: packages/api-server
        run: npx tsc --noEmit

      - name: Build all packages
        run: pnpm -r build

      - name: Run SDK tests
        working-directory: packages/sdk
        run: pnpm test

      - name: Run pipeline-core tests
        working-directory: packages/pipeline-core
        run: pnpm test

      - name: Run MCP server tests
        working-directory: packages/mcp-server
        run: pnpm test

      - name: Run engine tests
        working-directory: packages/engine
        run: pnpm test

      - name: Run API server tests
        working-directory: packages/api-server
        run: pnpm test
