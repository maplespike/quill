---
name: CI

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit signatures
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x  # Enable debugging
          echo "Checking PR #${{ github.event.pull_request.number }}"
          COMMITS=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[].oid')
          echo "Found commits: $COMMITS"
          FAILED=0
          for sha in $COMMITS; do
            echo "Verifying commit $sha"
            if ! git verify-commit $sha 2>/dev/null; then
              echo "⚠️ Commit $sha is NOT signed"
              FAILED=$((FAILED + 1))
            else
              echo "✅ Commit $sha is signed"
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED commit(s) without signature. Consider enabling commit signing."
          fi

      - run: pnpm install --frozen-lockfile

      - run: echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV

      - run: pnpm run clean
      - run: bash scripts/build-packages.sh
      - run: node scripts/build-docs.mjs
      - run: cd packages/pipeline-core && pnpm rebuild better-sqlite3

      - name: Forbid legacy Dockerfiles
        run: |
          FOUND=$(find . -name "Dockerfile*" -not -path "./.devenv/*" -not -path "./node_modules/*" 2>/dev/null)
          if [ -n "$FOUND" ]; then
            echo "::error::Legacy Dockerfiles found (Nix builds all images):"
            echo "$FOUND"
            exit 1
          fi
          echo "✅ No legacy Dockerfiles — all images built via Nix"

      - name: Validate metrics.json is up to date
        run: |
          node scripts/generate-metrics.mjs
          git diff --exit-code docs/metrics.json || {
            echo "ERROR: docs/metrics.json is out of date. Run 'pnpm generate-metrics' and commit the changes."
            exit 1
          }

      - name: Placeholder audit — detect new mocks/stubs/placeholders
        run: node scripts/audit-placeholders.mjs

      - name: Start API server (background)
        env:
          JWT_SECRET: maplespike-ci-test-secret-not-for-production
          PORT: "8082"
        run: |
          pnpm install
          pnpm --filter @maplespike/api-server run dev &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/v1/health > /dev/null 2>&1; then
              echo "API server ready on port 8082"
              break
            fi
            echo "Waiting for API server... ($i/30)"
            sleep 1
          done

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core

      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
        env:
          MAPLESPIKE_API_URL: http://localhost:8082/v1
          MAPLESPIKE_API_KEY: maplespike-dev-key

      - name: Test engine
        run: pnpm test
        working-directory: packages/engine

      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

      # ── Phase 5: Documentation rot check ─────────────────────────
      - name: "Docs rot check — TODO diff vs base"
        if: github.event_name == 'pull_request'
        run: |
          BASE_TODOS=$(git show origin/${{ github.base_ref }}:packages/docs/ 2>/dev/null | grep -ci "TODO\|FIXME" || echo "0")
          CURRENT_TODOS=$(grep -ci "TODO\|FIXME" packages/docs/**/*.md 2>/dev/null | awk -F: '{s+=$NF}END{print s}' || echo "0")

          echo "## 📝 Documentation Rot Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Base (${{ github.base_ref }}) | Current |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| TODO/FIXME count | $BASE_TODOS | $CURRENT_TODOS |" >> $GITHUB_STEP_SUMMARY

          if [ "$CURRENT_TODOS" -gt "$BASE_TODOS" ] 2>/dev/null; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ TODO count increased from $BASE_TODOS to $CURRENT_TODOS" >> $GITHUB_STEP_SUMMARY
            echo "::warning::TODO count increased from $BASE_TODOS to $CURRENT_TODOS"
          elif [ "$CURRENT_TODOS" -lt "$BASE_TODOS" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ TODO count decreased — great work!" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ TODO count unchanged" >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Metrics drift check"
        if: github.event_name == 'pull_request'
        run: |
          echo "## 📊 Metrics Drift Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f "docs/metrics.json" ]; then
            echo "ℹ️ No docs/metrics.json found" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Check metrics.json hasn't drifted from what generate-metrics produces
          node scripts/generate-metrics.mjs 2>/dev/null
          git diff --stat docs/metrics.json
          git diff --exit-code docs/metrics.json || {
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ docs/metrics.json is out of sync with codebase" >> $GITHUB_STEP_SUMMARY
            echo "::error::docs/metrics.json is out of sync. Run 'pnpm generate-metrics'."
            exit 1
          }

          echo "✅ docs/metrics.json is synchronized with codebase" >> $GITHUB_STEP_SUMMARY

  k8s-manifests:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate K8s Nix manifests build
        run: nix build .#k8s-manifests --no-link --print-out-paths

      - name: Verify generated manifest resource counts
        run: |
          MANIFEST=$(nix build .#k8s-manifests --no-link --print-out-paths)
          CRONJOBS=$(grep -c "^kind: CronJob" "$MANIFEST")
          DEPLOYMENTS=$(grep -c "^kind: Deployment" "$MANIFEST")
          SERVICES=$(grep -c "^kind: Service" "$MANIFEST")
          NAMESPACES=$(grep -c "^kind: Namespace" "$MANIFEST")
          echo "## ☸️ K8s Manifest Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Resource | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| CronJobs | $CRONJOBS |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployments | $DEPLOYMENTS |" >> $GITHUB_STEP_SUMMARY
          echo "| Services | $SERVICES |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespaces | $NAMESPACES |" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(grep -c "^kind:" "$MANIFEST")
          echo "| **Total** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY