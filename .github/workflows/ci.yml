name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read
  packages: write  # needed for GHCR push

env:
  NODE_ENV: test

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Auto-detects version from package.json packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run unit tests
        run: pnpm test

  integration-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run integration tests (network-dependent)
        run: pnpm -r test:integration
        env:
          MAPLESPIKE_HTTP_MAX_RETRIES: '1'
          MAPLESPIKE_HTTP_TIMEOUT_MS: '15000'

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/prod'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Portal image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: portal
          push: true
          tags: |
            ghcr.io/reverb256/quill-portal:latest
            ghcr.io/reverb256/quill-portal:${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api-server
          push: true
          tags: |
            ghcr.io/reverb256/quill-api:latest
            ghcr.io/reverb256/quill-api:${{ github.sha }}

      - name: Build and push MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: quill-mcp
          push: true
          tags: |
            ghcr.io/reverb256/quill-mcp:latest
            ghcr.io/reverb256/quill-mcp:${{ github.sha }}
