# CI runs on a self-hosted runner labelled `nixos` — the label is historical and
# is kept because 10+ workflows select on it. The hosts are actually Omarchy
# (Arch) with node, pnpm, docker, buildx, age, gh, kubectl and k3s installed as
# ordinary system packages. NEITHER nix NOR podman IS INSTALLED: do not wire a
# control into `nix run .#*` or podman, and verify on the runner before
# assuming a tool exists. See docs/GITHUB-ACTIONS-NIX.md for the verified list.
# DO NOT add actions/setup-node or pnpm/action-setup here — those tools are
# already on the runner, and a second install breaks cache attribution.
# Image paths use the `nexus:5000/quill-<svc>` namespace per ADR 0007
# (see docs/GHCR-CLEANUP.md); the older flat `ghcr.io/reverb256/<svc>` paths
# are RETIRED and either quarantined or purged on GHCR.
name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]

permissions:
  contents: read
  packages: write  # needed for GHCR push

env:
  NODE_ENV: test

jobs:
  build-and-test:
    runs-on: [self-hosted, nixos]
    # Self-hosted runners otherwise inherit a 5-day job cap. Bound the job so
    # an infrastructure or process hang cannot squat a runner for days.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Fail fast on unresolved merge/rebase conflict markers. A rebase that
      # ships `<<<<<<< HEAD` into a chart file breaks ArgoCD manifest
      # generation for the WHOLE chart: the quill app stops syncing anything
      # and goes Unknown/Degraded until a restore lands (measured 2026-10-08 —
      # markers in charts/quill/values-prod.yaml broke `helm template`; the
      # sync was dead until the file was restored). Only tracked files are
      # searched, because only tracked files reach ArgoCD.
      - name: No conflict markers
        run: |
          if git grep -nE '^(<{7}|>{7})( |$)' -- . ; then
            echo "::error::Unresolved conflict markers found in tracked files — resolve before pushing."
            exit 1
          fi
          echo "no conflict markers"

      # Lint the workflow files themselves. actionlint catches schema errors
      # AND the untrusted-input class — an expression interpolated straight
      # into a `run:` script — which is how the auto-merge PR-title injection
      # was found on 2026-10-08. Runs via mise, a system binary present on
      # every runner (/usr/bin/mise); the config at .github/actionlint.yaml
      # declares the custom `nixos` runner label.
      - name: Lint workflows (actionlint)
        run: mise exec actionlint@1.7.7 -- actionlint

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs here, not only in the audit job, because the audit job is gated on
      # this one: a red step above would skip it and the guard would go silent.
      - name: No vulnerable native bindings
        run: bash scripts/check-no-native-bindings.sh

      - name: Typecheck api-server
        run: pnpm --filter @maplespike/api-server typecheck

      - name: Typecheck quill-mcp
        run: pnpm --filter @maplespike/quill-mcp typecheck

      - name: Lint api-server
        run: pnpm --filter @maplespike/api-server lint
        continue-on-error: true

      - name: Lint quill-mcp
        run: pnpm --filter @maplespike/quill-mcp lint
        continue-on-error: true

      - name: Build all packages
        run: pnpm build
        env:
          # Publishable by design: this exact value ships in the portal's client
          # bundle, so it belongs in git next to the build that consumes it — not
          # in a GitHub variable, where it would be invisible state.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_live_51TXKNtIZlbpvSCVXPrwYO2dinosjcpXJTFtzvgNWNKYuulIovwEstgih1CGYDOXOXxgunw6MAprIirNBpLhtjJJt00nZ41pewc

      # Design-logic invariants that historically broke only in prod builds
      # (lang-toggle .html targets, dashboard tab, reveal-on-scroll observer,
      # plans.json drift). Fails the build when dist regresses.
      - name: Portal prod-build smoke test
        run: node packages/portal/scripts/smoke-test-dist.mjs

      # Secret key-name drift between sops-sync-k8s.sh and deployment
      # secretKeyRefs caused a prod crash-loop incident (2026-08-15).
      - name: Secret key lockstep check
        run: bash scripts/check-secret-lockstep.sh

      # Incident rule for run 35901746802: the gate once died silently (empty
      # grep under set -e) and CI went red with an empty log. These fixtures
      # pin the gate's contract: loud failure on format change, required-ref
      # enforcement, optional-ref warn, dead-row warn, never pass blind.
      - name: Secret lockstep unit tests
        run: pnpm exec tsx --test scripts/test-secret-lockstep.mts

      # Gate A3-IMAGEPIN (#755): no mutable image tags anywhere, every quill
      # workload pinned by digest, and no `imagePullPolicy: Never` workload
      # without a node pin. Pure Node — no cluster, no helm required.
      # docs/IMAGE-PINNING.md
      - name: Image pin check (chart values + templates)
        run: node scripts/gates/check-image-pins.mjs --values charts/quill/values-prod.yaml

      - name: Image pin unit tests
        run: pnpm exec tsx --test scripts/test-image-pins.mts

      # The [self-hosted, nixos] runner pool mixes hosts with and without
      # stored `gh` credentials. A step that shells out to `gh` without a
      # token therefore passes or fails by luck of runner selection (#909;
      # PR 908's required `PR checks` check went red on forge-quill-runner).
      # scripts/gates/check-workflow-gh-auth.mjs asserts every gh-invoking
      # workflow step carries GH_TOKEN/GITHUB_TOKEN in scope.
      - name: Workflow gh auth check
        run: node scripts/gates/check-workflow-gh-auth.mjs

      - name: Workflow gh auth unit tests
        run: pnpm exec tsx --test scripts/test-workflow-gh-auth.mts

      # An invalid workflow file is silent: GitHub starts zero jobs and marks
      # the run failed, which reads as an infrastructure problem rather than a
      # syntax error. Two workflows have been broken this way unnoticed.
      - name: Workflow YAML validity check
        run: node scripts/gates/check-workflow-yaml.mjs

      # Keep test stdout off the runner's live log stream while the suite runs,
      # then emit a bounded tail. Earlier jobs wedged during this step, but
      # diagnostics did not establish the process-level cause. The job timeout
      # bounds recurrence; this helper also preserves the child exit status
      # despite GitHub's default bash -e behavior and uses a per-step temp log.
      - name: Run api-server unit tests
        run: timeout 25m bash scripts/run-with-log-tail.sh pnpm --filter @maplespike/api-server test:unit

      - name: Run quill-mcp unit tests
        run: timeout 25m bash scripts/run-with-log-tail.sh pnpm --filter @maplespike/quill-mcp test:unit

      - name: Run api-server integration tests
        run: timeout 25m bash scripts/run-with-log-tail.sh pnpm --filter @maplespike/api-server test:integration
        continue-on-error: true

      - name: Run quill-mcp integration tests
        run: timeout 25m bash scripts/run-with-log-tail.sh pnpm --filter @maplespike/quill-mcp test:integration
        continue-on-error: true

  coverage:
    needs: build-and-test
    runs-on: [self-hosted, nixos]
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build api-server + quill-mcp
        run: |
          pnpm --filter @maplespike/api-server build
          pnpm --filter @maplespike/quill-mcp build

      - name: Run api-server coverage (floor-enforced)
        run: timeout 25m bash scripts/run-with-log-tail.sh bash scripts/check-coverage-floor.sh @maplespike/api-server test:coverage 71 65

      - name: Run quill-mcp coverage, hermetic unit suite (floor-enforced)
        # Unit suite only: the integration suite deliberately hits live
        # government endpoints and must not gate coverage (#859).
        run: timeout 25m bash scripts/run-with-log-tail.sh bash scripts/check-coverage-floor.sh @maplespike/quill-mcp test:coverage:unit 73 65

  integration-test:
    needs: build-and-test
    runs-on: [self-hosted, nixos]
    continue-on-error: true
    # The suite's normal wall time is <1 min (measured 2026-10-08: 14 s for all
    # six files). 60 min let a teardown hang squat a runner for a full hour;
    # 15 min still leaves a ~60x margin while bounding that damage. The real
    # fix for the 2026-10-08 hang is in http-routes.test.ts (group kill), this
    # is the backstop.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run integration tests (network-dependent)
        run: pnpm -r test:integration
        env:
          QUILL_HTTP_MAX_RETRIES: '1'
          QUILL_HTTP_TIMEOUT_MS: '15000'

  secrets:
    needs: build-and-test
    # Runs anywhere (no cluster dependency): full-history gitleaks scan.
    # Baseline: docs/SECRETS-AUDIT-2026-09-16.md / issue #854 — the two real
    # age-key findings are remediated by history rewrite before public flip;
    # verified placeholder values are allow-listed in .gitleaks.toml, and
    # historic findings are pinned by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    # gitleaks-action lists PR commits via the API on pull_request events —
    # without pull-requests:read the token 403s ("Resource not accessible by
    # integration") and the job fails regardless of findings.
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      # Pin the engine. The allow-list spelling in .gitleaks.toml depends on
      # the version: gitleaks <= 8.24 reads [allowlist] and silently ignores
      # [[allowlists]] (verified on run 35676870104, engine 8.24.3).
      # scripts/check-gitleaks-baseline.sh fails loudly if the pin drifts.
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks must see every commit

      # The baseline is security-critical config: a malformed .gitleaksignore
      # is silently inert (34 warnings, zero exclusions applied — run
      # 35676870104), and a too-broad allow-list silently disables the gate.
      # Validate the file shape AND the behaviour, on the pinned engine.
      - name: Install gitleaks (pinned, for the baseline check)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/.local/bin" gitleaks

      - name: Validate the gitleaks baseline
        run: |
          GITLEAKS_BIN="$HOME/.local/bin/gitleaks" \
            bash scripts/check-gitleaks-baseline.sh --require-gitleaks

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action requires a licence key for organisation repos and exits
          # with "is an organization. License key is required." without it. The
          # secret was already set but never handed to the action, so this job
          # failed on every PR regardless of its contents.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  audit:
    needs: build-and-test
    runs-on: [self-hosted, nixos]
    timeout-minutes: 45
    # Dependency advisory gate. pnpm audit fails (exit 1) on any high/critical
    # advisory by default; we tolerate the known High findings (tracked in
    # portal/public/data/security/audit.json) but fail on CRITICALs so a new
    # critical blocks the PR. bigint-buffer (CVE-2025-3194) is the open High: it
    # cannot be resolved away until the lockfile can be regenerated safely (a
    # blind relock downgrades six packages and breaks our own uuid/ws overrides),
    # and it is unreachable meanwhile because its native addon is never built —
    # the step below enforces that. Bump --audit-level back to high when the open
    # Highs are closed.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A checked invariant instead of policy by omission: the vulnerable
      # bigint-buffer native addon must not exist in the tree, and the package
      # must not be allowlisted for building. Rationale in the script header.
      - name: No vulnerable native bindings
        run: bash scripts/check-no-native-bindings.sh

      - name: pnpm audit (fail on critical only)
        run: |
          set +e
          pnpm audit --audit-level=critical > /tmp/audit.txt 2>&1
          rc=$?
          set -e
          echo "pnpm audit exit code: $rc"
          cat /tmp/audit.txt
          if [ "$rc" -ne 0 ]; then
            echo "::error::CRITICAL dependency advisory found -- see pnpm audit output above"
            exit 1
          fi

      - name: Emit audit.json snapshot
        run: |
          pnpm audit --json > packages/portal/public/data/security/audit.json 2>/dev/null || true
          echo "audit.json refreshed (non-fatal on audit error -- file may be empty)"

  docker:
    needs: build-and-test
    runs-on: [self-hosted, nixos]
    if: github.ref == 'refs/heads/prod'
    # Three multi-stage builds; generous, but not unbounded.
    timeout-minutes: 120
    # GHCR push is RETIRED post-flip (2026-07-10 systemic registry flip).
    # The default target is the operator-host nexus:5000 registry. Images are
    # pushed operator-side by `scripts/pin-images.sh` (see docs/IMAGE-PINNING.md),
    # which is also where the per-image SBOM is generated. This job builds only;
    # `push:` is intentionally false. To restore GHCR push when PAT scope is
    # bumped, replace the login + flip `push: true` + retarget tags to ghcr.io.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 'Build Portal image (push: false; operator-side scripts/pin-images.sh)'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.portal
          target: portal
          push: false
          tags: |
            nexus:5000/quill-portal:${{ github.sha }}

      - name: 'Build API image (push: false)'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          target: api-server
          push: false
          tags: |
            nexus:5000/quill-api:${{ github.sha }}

      - name: 'Build MCP image (push: false)'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.mcp
          target: quill-mcp
          push: false
          tags: |
            nexus:5000/quill-mcp:${{ github.sha }}
