# ─────────────────────────────────────────────────────────────────
# MapleSpike CI — runs on every PR and push to main
# Covers all 10 packages: pipeline-core, mcp-server, engine, sdk,
# legal-core, legislation, api-server, python-sdk, portal, pretext-civic
# ─────────────────────────────────────────────────────────────────
name: CI
on:
  pull_request: { branches: [main, prod] }
  push: { branches: [main, prod] }
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: write

jobs:
  test:
    runs-on: [self-hosted, maplespike]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for commit signing check

      # Cache pnpm store and node_modules
      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            **/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install gh CLI (needed for labeling)
      - name: Install gh CLI
        run: |
          type gh >/dev/null 2>&1 || sudo apt-get update -qq && sudo apt-get install -y -qq gh

      # ── Verify commit signatures on PRs (non-fatal) ────────────────
      - name: Verify commit signatures
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          COMMITS=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[].oid')
          FAILED=0
          for sha in $COMMITS; do
            if ! git verify-commit $sha 2>/dev/null; then
              echo "⚠️  Commit $sha is NOT signed"
              FAILED=$((FAILED + 1))
            else
              echo "✅ Commit $sha is signed"
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED commit(s) without signature. Consider enabling commit signing."
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: pnpm install --frozen-lockfile

      # ── Enforce: all k8s changes go through Nix ────────────────────
      - name: "Forbid raw k8s YAML edits outside Nix"
        run: |
          K8S_CHANGES=$(git diff --name-only origin/main -- 'k8s/' 2>/dev/null || true)
          NIX_CHANGES=$(git diff --name-only origin/main -- 'flake.nix' 2>/dev/null || true)
          if [ -n "$K8S_CHANGES" ] && [ -z "$NIX_CHANGES" ]; then
            echo "::error::k8s/*.yaml changed without flake.nix"
            echo "All k8s manifest changes must go through the Nix flake."
            echo "Changed k8s files:"
            echo "$K8S_CHANGES"
            exit 1
          fi
          if [ -n "$K8S_CHANGES" ]; then
            echo "✅ k8s changes accompanied by flake.nix changes — OK"
          else
            echo "✅ No raw k8s YAML changes"
          fi

      # ── Warn on type suppression (not blocking - tracked by #XXX) ──
      - name: "Warn on type suppression (as any, @ts-ignore, @ts-expect-error)"
        continue-on-error: true
        run: |
          SUPPRESSIONS=$(grep -rn '@ts-ignore\|@ts-expect-error' packages/ --include='*.ts' \
            | grep -v node_modules | grep -v '.d.ts' | grep -v '.test.' || true)
          if [ -n "$SUPPRESSIONS" ]; then
            echo "::warning::@ts-ignore / @ts-expect-error is FORBIDDEN. Fix type errors properly."
            echo "$SUPPRESSIONS"
          fi
          AS_ANY=$(grep -rn '\bas any\b' packages/ --include='*.ts' \
            | grep -v node_modules | grep -v '.d.ts' | grep -v '.test.' || true)
          if [ -n "$AS_ANY" ]; then
            echo "::warning::'as any' type cast is FORBIDDEN. Use proper TypeScript types."
            echo "$AS_ANY"
          fi
          echo "✅ Warnings issued — type suppressions found"

      # ── Verify gateway routing (no direct NIM API calls) ──────────
      - name: "Verify gateway routing — no direct backend API calls"
        continue-on-error: true
        run: |
          DIRECT_CALLS=$(grep -rn 'api\.nim\|direct.*api\|bypass.*gateway' packages/ --include='*.ts' \
            | grep -v node_modules | grep -v '.test.' | grep -v '.d.ts' || true)
          if [ -n "$DIRECT_CALLS" ]; then
            echo "::warning::Possible direct backend API calls. Check if these route through the gateway."
            echo "$DIRECT_CALLS"
          fi
          echo "✅ Gateway routing check completed"

      # Clean before build to avoid stale dist issues
      - run: pnpm run clean

      - run: pnpm build

      # Build docs pages from markdown source
      - run: node scripts/build-docs.mjs

      # Rebuild native modules (better-sqlite3) for CI runner's Node version
      - run: pnpm rebuild better-sqlite3

      # ── Start API server for MCP integration tests ──────────

      - name: Start API server (background)
        run: |
          node packages/api-server/dist/dev-server.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8082/v1/health > /dev/null 2>&1; then
              echo "API server ready on port 8082"
              break
            fi
            echo "Waiting for API server... ($i/30)"
            sleep 1
          done

      # ── Test packages that have tests ────────────────────────

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core

      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
        env:
          MAPLESPIKE_API_URL: http://localhost:8082/v1
          MAPLESPIKE_API_KEY: maplespike-dev-key

      - name: Test engine
        run: pnpm test
        working-directory: packages/engine

      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

      # ── Verify build-only packages (no tests yet) ────────────

      - name: Build legal-core
        run: pnpm build
        working-directory: packages/legal-core

      - name: Build legislation
        run: pnpm build
        working-directory: packages/legislation

      - name: Build api-server
        run: pnpm build
        working-directory: packages/api-server

      # ── Signal AI agent that PR is ready for review ───────────
      - name: Label PR as CI-passed for AI review
        if: |
          github.event_name == 'pull_request' &&
          (startsWith(github.head_ref, 'kelos-task') || startsWith(github.head_ref, 'dependabot'))
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "ci-passed" \
            --remove-label "ci-pending" 2>/dev/null || \
          gh pr edit ${{ github.event.pull_request.number }} \
            --add-label "ci-passed"
        env:
          GH_TOKEN: ${{ github.token }}
