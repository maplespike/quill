name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for CI checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Hardcoded display name (NOT `github.workflow`, which resolves to
          # the workflow FILE basename — `gh pr checks --json name` returns the
          # DISPLAY name, so only the literal matches).
          WORKFLOW_NAME: "Dependabot Auto-Merge"
        run: |
          # Native replacement for the unmaintained lewagon/wait-on-check-action.
          # Polls `gh pr checks` until every required check reports success.
          #
          # IMPORTANT: resolve by PR NUMBER, never by head SHA — `gh pr checks
          # <sha>` does not resolve raw commit SHAs; the previous version's
          # `|| echo '[]'` fallback then read "no checks found" as "all checks
          # passed" and merged RED dependabot PRs (zod 4, TS 7, ioredis 6 all
          # merged red on 2026-09-21 and broke main).
          echo "Waiting for CI checks on PR #$PR_NUMBER…"
          for i in $(seq 1 60); do
            CHECKS=$(gh pr checks "$PR_NUMBER" --json name,bucket 2>/dev/null) || CHECKS=""
            if [ -z "$CHECKS" ]; then
              echo "($i/60) checks not resolvable yet…"
              sleep 30
              continue
            fi
            PENDING=$(jq --arg wf "$WORKFLOW_NAME" \
              '[.[] | select(.bucket == "pending" and .name != $wf)] | length' \
              <<<"$CHECKS")
            FAILURES=$(jq --arg wf "$WORKFLOW_NAME" \
              '[.[] | select(.bucket == "fail" and .name != $wf)] | length' \
              <<<"$CHECKS")
            NONOWN=$(jq --arg wf "$WORKFLOW_NAME" \
              '[.[] | select(.name != $wf)] | length' \
              <<<"$CHECKS")
            if [ "$FAILURES" -gt 0 ]; then
              echo "::error::A required check failed before timeout."
              exit 1
            fi
            # Require at least one non-own check to exist AND none pending —
            # an empty/absent check list must never count as success.
            if [ "$PENDING" -eq 0 ] && [ "$NONOWN" -gt 0 ]; then
              echo "All required checks passed."
              exit 0
            fi
            echo "($i/60) $PENDING checks still pending…"
            sleep 30
          done
          echo "::error::Timed out waiting for CI after 30 minutes."
          exit 1

      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}" \
            --subject "chore(deps): ${{ github.event.pull_request.title }}"
