name: Auto-assign Sprint-to-Live Milestone

on:
  pull_request:
    types: [opened, reopened]
  issues:
    types: [opened]

jobs:
  assign-milestone:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos]
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Find Sprint-to-Live v1 milestone
        id: find-milestone
        uses: actions/github-script@v9
        with:
          script: |
            const { data: milestones } = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const sprintMilestone = milestones.find(m =>
              m.title === 'Sprint-to-Live v1' ||
              m.title.includes('Sprint-to-Live')
            );

            if (sprintMilestone) {
              core.setOutput('milestone_number', sprintMilestone.number);
              console.log(`Found milestone: ${sprintMilestone.title} (#${sprintMilestone.number})`);
            } else {
              console.log('Sprint-to-Live v1 milestone not found. Skipping auto-assign.');
              core.setOutput('milestone_number', '0');
            }

      - name: Assign milestone to PR / Issue
        if: steps.find-milestone.outputs.milestone_number != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const milestoneNumber = parseInt('${{ steps.find-milestone.outputs.milestone_number }}');

            if (context.payload.pull_request) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                milestone: milestoneNumber
              });
              console.log(`Assigned milestone to PR #${context.payload.pull_request.number}`);
            } else if (context.payload.issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                milestone: milestoneNumber
              });
              console.log(`Assigned milestone to Issue #${context.payload.issue.number}`);
            }
