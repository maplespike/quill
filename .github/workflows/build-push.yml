# ─────────────────────────────────────────────────────────────────
# GHCR Build & Push
#
# Builds Docker images on push to main (when relevant packages
# change) and pushes them to GHCR. Supports manual dispatch.
# Does NOT auto-deploy to k3s — no cluster creds in GH Actions.
#
# Auth:
#   GITHUB_TOKEN (auto-provided, packages:write) — sufficient for
#   GHCR push within the same repo. GHCR_PAT (write:packages) is
#   accepted as an override when cross-repo or fine-grained scope
#   is needed.
# ─────────────────────────────────────────────────────────────────
name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - packages/api-server/**
      - packages/quill-mcp/**
      - packages/portal/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  REGISTRY_OWNER: reverb256
  NODE_ENV: production

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    needs: [build]

    strategy:
      fail-fast: false
      matrix:
        image:
          - service: quill-api
            dockerfile: Dockerfile.api
            target: api-server
          - service: quill-portal
            dockerfile: Dockerfile.portal
            target: portal
          - service: quill-mcp
            dockerfile: Dockerfile.mcp
            target: quill-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          target: ${{ matrix.image.target }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.image.service }}:v0.3.0-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_OWNER }}/${{ matrix.image.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
