---
name: "Metrics Drift Check"
on:
  pull_request:
    branches: [main, prod]
    paths:
      # Any package tree can change the TypeScript line totals. The old
      # filter (tools + ingestion only) missed api-server, engine, portal,
      # and sdk, which is how docs/metrics.json stayed stale for weeks.
      - 'packages/**'
      - 'docs/metrics.json'
      - 'scripts/generate-metrics.mjs'
      - 'scripts/test-generate-metrics.mjs'
      - '.github/workflows/metrics-drift-check.yml'
  push:
    branches: [main, prod]
    paths:
      - 'packages/**'
      - 'docs/metrics.json'
      - 'scripts/generate-metrics.mjs'
      - 'scripts/test-generate-metrics.mjs'
      - '.github/workflows/metrics-drift-check.yml'
  workflow_dispatch:

concurrency:
  # One run per PR; a new push cancels the superseded run. Main/prod and
  # workflow_dispatch group per sha, so a newer push never evicts a queued run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-metrics:
    name: "Check for metrics drift"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-maplespike' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: ARC runner tools
        if: startsWith(runner.name, 'arc-')
        uses: ./.github/actions/arc-tools

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted' || startsWith(runner.name, 'arc-')
        with:
          node-version: 22

      # The previous steps overwrote docs/metrics.json and then compared that
      # overwritten file to the generator's own stdout, so the four counts
      # always matched and the gate could not fail. Compare the committed
      # bytes instead. Date stamps and dist/ are stabilized in the generator
      # so this diff does not flap.
      - name: "Fail when docs/metrics.json drifts"
        run: |
          node --test scripts/test-generate-metrics.mjs
          node scripts/generate-metrics.mjs
          git diff --exit-code docs/metrics.json