---
# Browsers enforce the CSP, after our JavaScript has already decided everything
# worked. That is why two failures this year were invisible to the unit tests:
# the copy of the policy Cloudflare Pages serves never allowed js.stripe.com (no
# visitor could load the payment form), and an Astro meta-CSP experiment blocked
# 83 inline scripts and handlers. Static assertions cannot see either.
#
# This job looks at the site the way a browser does:
#   1. the static contract (three copies, one policy) via vitest;
#   2. every built route loaded under the policy from public/_headers, failing on
#      any securitypolicyviolation — hashes, eval, img/font/connect;
#   3. the embedded checkout form driven end to end in Stripe TEST mode, with a
#      session this job creates and expires itself. No live key, no charge.
name: Portal CSP + checkout

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/portal/**'
      - 'packages/quill-mcp/**'
      - 'packages/pipeline-core/**'
      - '.github/workflows/portal-csp-checkout.yml'
  push:
    branches: [main]
    paths:
      - 'packages/portal/**'
  workflow_dispatch:
  schedule:
    # Daily against production: catches a header changed at the edge, or a
    # dependency that starts fetching a new origin at runtime.
    - cron: '17 7 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # actions/cache needs this to save the Playwright browser cache. Restore
  # works with read, but a missing write permission would make every ARC run
  # re-download Chromium (~190 MiB) and still look like a cache miss.
  actions: write

jobs:
  csp-and-checkout:
    # Fork PRs take ubuntu-latest; same-repo runs use the ARC pool, like every
    # other workflow here (scripts/gates/check-fork-runner-policy.mjs).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-maplespike' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # Job-level env so step `if:` can branch on whether the secrets exist;
      # secret values themselves are not available in an `if:` expression.
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: ARC runner tools
        if: startsWith(runner.name, 'arc-')
        uses: ./.github/actions/arc-tools

      - uses: pnpm/action-setup@v4
        if: runner.environment == 'github-hosted' || (startsWith(runner.name, 'arc-') && env.ARC_NEED_NODE != '0')

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted' || (startsWith(runner.name, 'arc-') && env.ARC_NEED_NODE != '0')
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Build the workspace
        # Root `pnpm build`, NOT a per-package build. The portal's gen:all loads
        # quill-mcp's built tool registry, which imports pipeline-core, which
        # imports @maplespike/database; only turbo's dependency order builds that
        # chain correctly (runs 45037143372 and 45037297872 failed on the missing
        # intermediates). Same invocation the Pages deploy uses.
        env:
          MAPLESPIKE_DOMAIN: maplespike.ca
          # Not needed for the audit, but it keeps this build byte-comparable to
          # the one that ships — the checkout page renders its real state.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: The portal output exists
        # Fail here, before the browser steps, with a message that names the
        # missing file. Run 45550425692 built dist/index.html successfully, so
        # a missing portal output is a separate failure mode from the Chrome
        # channel bug this workflow also guards against.
        run: |
          set -euo pipefail
          if [ ! -f packages/portal/dist/index.html ]; then
            echo "::error::pnpm build did not produce packages/portal/dist/index.html"
            echo "Root pnpm build must write packages/portal/dist/index.html before the CSP and checkout e2e can run."
            if [ -d packages/portal/dist ]; then
              echo "packages/portal/dist exists; first entries:"
              find packages/portal/dist -maxdepth 1 -printf '%M %u %s %p\n' | head -50
            else
              echo "packages/portal/dist does not exist at all."
            fi
            exit 1
          fi
          echo "ok  packages/portal/dist/index.html is present"

      - name: Static CSP contract — three copies, one policy
        run: pnpm --filter ./packages/portal exec vitest run tests/server-csp.test.ts

      # arc-tools points Playwright at /ms-playwright or a runner tool-cache
      # path, which is not what actions/cache can restore. Override to the
      # standard user cache so the next two steps share one tree.
      - name: Use a cacheable Playwright browser path
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ms-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
          echo "Playwright browsers: $HOME/.cache/ms-playwright"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-

      - name: Chromium for the audit
        # Install the repo-pinned Playwright Chromium (root devDependency,
        # currently 1.64.x via pnpm-lock.yaml). --with-deps needs apt/sudo,
        # which GitHub-hosted runners have and ARC may not; fall back to a
        # browser-only install plus a launch check for OS libraries. No
        # runner image change, no paid runners.
        run: |
          set -euo pipefail
          if pnpm exec playwright install --with-deps chromium; then
            echo "Installed Playwright Chromium with OS deps"
          else
            echo "::warning::playwright install --with-deps chromium failed (likely no sudo/apt on this runner). Falling back to a browser-only install."
            pnpm exec playwright install chromium
            node --input-type=module -e '
              import { chromium } from "playwright";
              const browser = await chromium.launch({ args: ["--no-sandbox"] });
              await browser.close();
              console.log("Bundled Chromium launched; OS libraries look present.");
            ' || {
              echo "::error::Bundled Chromium failed to launch after a browser-only install. OS libraries are probably missing, and this job cannot apt-install them on this runner."
              exit 1
            }
          fi

      - name: Every route under the policy it ships with
        # Serves dist/ with the real Content-Security-Policy from public/_headers
        # and fails on any securitypolicyviolation in a real browser. This is the
        # check that the static test cannot make: the policy has to work, not
        # merely look right.
        run: node packages/portal/e2e/csp-audit.mjs

      - name: Embedded checkout form (test mode — never live, never charged)
        if: env.STRIPE_TEST_SECRET_KEY != ''
        env:
          E2E_BASE_URL: https://quill.maplespike.ca
          E2E_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          E2E_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
          E2E_SCREENSHOT: /tmp/quill-checkout-${{ github.run_id }}.png
        # The check mints its own test-mode session from the secret key and expires
        # it whether it passes or fails; the publishable key is injected as runtime
        # config because the deployed bundle carries the live one.
        run: node packages/portal/e2e/checkout-embedded.mjs

      - name: Upload the screenshot
        if: always() && env.STRIPE_TEST_SECRET_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: checkout-screenshot
          path: /tmp/quill-checkout-*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Say so when the form check could not run
        if: env.STRIPE_TEST_SECRET_KEY == ''
        run: |
          echo "::warning::STRIPE_TEST_SECRET_KEY is not set, so the embedded checkout form was NOT verified."
          echo "The CSP audit above did run. Add the two STRIPE_TEST_* repository secrets to enable the form check."
