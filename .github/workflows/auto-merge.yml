# =============================================================================
# MapleSpike — Auto-merge
# Merges PRs labeled "auto-merge" when all CI checks pass
# =============================================================================
name: Auto-merge

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      - name: Check CI status
        id: check-status
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          # Get check suites for this PR
          SUITES=$(gh api repos/$REPO/pulls/$PR_NUMBER/commits --jq '.[-1].sha')
          HEAD_SHA="$SUITES"

          # Wait a moment for checks to settle
          sleep 10

          # Fetch check suites for the HEAD commit
          CHECKS=$(gh api repos/$REPO/commits/$HEAD_SHA/check-suites \
            --jq '.check_suites[].conclusion // .check_suites[].status' 2>/dev/null || echo "")

          # Get all check run conclusions
          CONCLUSIONS=$(gh api repos/$REPO/commits/$HEAD_SHA/check-runs \
            --jq '.check_runs[].conclusion' 2>/dev/null || echo "")

          # Check for any in_progress or queued
          PENDING=$(echo "$CONCLUSIONS" | grep -cE "^(in_progress|queued|expected)$" || true)
          FAILURES=$(echo "$CONCLUSIONS" | grep -cE "^failure$" || true)

          if [ "$PENDING" -gt 0 ]; then
            echo "status=pending" >> $GITHUB_OUTPUT
            echo "⏳ $PENDING check(s) still running"
            exit 0
          fi

          if [ "$FAILURES" -gt 0 ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ $FAILURES check(s) failed — not merging"
            exit 0
          fi

          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ All checks passed"

      - name: Merge PR
        if: steps.check-status.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          gh pr merge $PR_NUMBER \
            --repo $REPO \
            --squash \
            --delete-branch \
            --subject "Auto-merge PR #$PR_NUMBER"

          echo "✅ PR #$PR_NUMBER merged successfully"

      - name: Comment on failure
        if: steps.check-status.outputs.status == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          gh pr comment $PR_NUMBER \
            --repo $REPO \
            --body "🚫 Auto-merge skipped — some CI checks are failing. Fix the failures and the PR will be merged automatically."
