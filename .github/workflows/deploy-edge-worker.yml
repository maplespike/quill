# Edge-worker deploy runs on the self-hosted NixOS runner — node, pnpm,
# wrangler, jq, gh are system packages per docs/GITHUB-ACTIONS-NIX.md.
name: Deploy Edge AI Worker

on:
  push:
    branches:
      - prod
    paths:
      - 'packages/edge-worker/**'
      - '.github/workflows/deploy-edge-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy quill-ai Worker
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install wrangler
        run: pnpm add -g wrangler

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/edge-worker

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: packages/edge-worker

      - name: Deploy Worker
        run: wrangler deploy --config wrangler.toml
        working-directory: packages/edge-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.QUILL_CLOUDFLARE_TOKEN }}

  provision-test-key:
    name: Provision test API key in KV
    runs-on: [self-hosted, nixos]
    needs: deploy
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Generate test key
        id: key
        run: |
          KEY="ms_test_$(openssl rand -hex 16)"
          KEY_HASH=$(echo -n "$KEY" | sha256sum | awk '{print $1}')
          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "hash=$KEY_HASH" >> $GITHUB_OUTPUT

      - name: Write tenant to KV
        run: |
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ vars.CF_ACCOUNT_ID }}/storage/kv/namespaces/${{ vars.CF_KV_API_KEYS }}/values/key:${{ steps.key.outputs.hash }}" \
            -H "Authorization: Bearer ${{ secrets.QUILL_CLOUDFLARE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"id":"tenant_test","name":"Test Tenant","tier":"free","rateLimitPerMin":10,"isActive":true}'
        env:
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_API_KEYS: ${{ vars.CF_KV_API_KEYS }}