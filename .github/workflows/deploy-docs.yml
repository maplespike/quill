# =============================================================================
# Quill — Deploy Portal + Docs to GitHub Pages
#
# Builds the docs (marked MD → HTML) and the Astro portal, then deploys
# the static output to GitHub Pages using the official deploy-pages action.
#
# Required GitHub Settings (under Settings → Pages):
#   Source: "GitHub Actions"
#   Custom domain: maplespike.ca (DNS: CNAME reverb256.github.io)
#
# Required Secrets:
#   None — the GITHUB_TOKEN used by actions/deploy-pages is auto-provided.
# =============================================================================
# NOTE (2026-10-15, #1086): Pages is STILL not enabled and CANNOT be enabled
# today — `POST /repos/{repo}/pages` is refused with 422 "Your current plan
# does not support GitHub Pages for this repository" (org-owner token), because
# the repo is private on the free org plan. Unlike the 2026-09-22 note below,
# the workflow no longer dies red on that state: the deploy steps are gated on
# scripts/gates/pages-probe.sh, which tells "not enabled" (verdict=not-enabled) apart from a
# real error (exit 1). Not-enabled skips ONLY the deploy with a loud warning —
# the build above it still runs and is verified, so a push to main is green
# when the build is green and red only when something in the repo is actually
# broken. The deploy path itself is unchanged and self-heals the moment Pages
# becomes available (public flip or paid plan — issue #1086 lists the owner
# steps). #1086 also pins this gating in scripts/test-deploy-docs-pages-gating.mts.
#
# NOTE (2026-09-22): these runs fail until the repository is public. GitHub Pages
# is not enabled on it (`has_pages: false`, /pages returns 404) and private-repo
# Pages needs a paid plan, so the failure is a repo setting, not this code. The
# build itself is verified locally with GH_PAGES=true. Re-run after the flip.

name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    # Only run when docs or portal actually change
    paths:
      - "packages/docs/**"
      - "packages/portal/**"
      - "scripts/build-docs.mjs"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch: # Allow manual trigger

# Ensure only one deployment runs at a time
concurrency:
  # Deploy: never cancel a run mid-deploy. A newer push still replaces an older
  # pending run in this group, so at most one deploy waits.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build portal + docs
    # Push and workflow_dispatch only (no pull_request), so the homelab
    # runner is not exposed to a fork. The pre-baked arc-maplespike image
    # already has Node v22.23.4 and pnpm 10.32.1 (measured 2026-11-09 on
    # arc-maplespike-runner). arc-tools installs them when a runner lacks
    # that pair. Pages deploy actions stay on the deploy job below.
    runs-on: arc-maplespike
    timeout-minutes: 45
    permissions:
      contents: read
      # The probe GETs /pages. pages:write is the scope the hosted job used
      # when that call succeeded; read alone is not what this repo measured.
      pages: write
    outputs:
      verdict: ${{ steps.pages-probe.outputs.verdict }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ARC runner tools
        uses: ./.github/actions/arc-tools

      - name: Setup pnpm
        # package.json "packageManager" is the version source of truth.
        # An explicit version here makes pnpm/action-setup fail with
        # "Multiple versions of pnpm specified". Skipped when the ARC image
        # already has that pnpm (ARC_NEED_NODE=0).
        if: env.ARC_NEED_NODE != '0'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: env.ARC_NEED_NODE != '0'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        # The portal imports @maplespike/i18n and @maplespike/sdk from the
        # workspace. Without this their dist/ does not exist and the portal
        # build dies on an unresolved import — which is exactly how these
        # Pages deploys have been failing.
        run: pnpm build
        env:
          # Publishable by design: ships in the portal's client bundle anyway.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Build portal (Astro)
        run: pnpm --filter @maplespike/portal build
        env:
          # Publishable by design: ships in the portal's client bundle anyway.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Build docs from canonical Markdown
        run: node scripts/build-docs.mjs

      - name: Copy portal assets into portal dist
        run: |
          cp packages/portal/styles.css packages/portal/dist/styles.css
          cp packages/portal/docs-pretext.js packages/portal/dist/docs-pretext.js

      - name: Probe GitHub Pages availability
        # #1086: verdict=enabled → deploy (unchanged path); verdict=not-enabled
        # (404, free-plan private repo) → skip ONLY the deploy, stay green;
        # verdict=error → fail loud. The probe's contract is pinned by
        # scripts/test-deploy-docs-pages-gating.mts.
        id: pages-probe
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/gates/pages-probe.sh

      - name: Fail loud on probe error (never guess a deploy)
        # Fail-closed (#1086): a probe that crashed without a verdict must
        # never read as "not-enabled" — that would silently skip deploys on a
        # repo where Pages IS enabled.
        if: steps.pages-probe.outputs.verdict != 'enabled' && steps.pages-probe.outputs.verdict != 'not-enabled'
        run: |
          echo "::error::pages-probe returned no verdict (outcome: ${{ steps.pages-probe.outcome }}). Refusing to guess — this is a real failure, not the not-enabled skip."
          exit 1

      - name: Skip Pages deploy (not enabled on this plan)
        # The org plan refuses Pages on a private repo (POST /pages → 422).
        # Skipping ONLY the deploy keeps the build verification signal: a
        # green run means "build verified, no deploy", never "deployed".
        # Loud, so nobody mistakes the skip for a success.
        if: steps.pages-probe.outputs.verdict == 'not-enabled'
        run: |
          echo "::warning::Pages is not enabled on ${{ github.repository }} (private repo on the free plan — POST /pages is refused with 422). The portal + docs build above IS verified; the deploy is skipped. Enable Pages (public flip or paid plan — see issue #1086), then re-run: the deploy path is unchanged and will fire on the next run."

      - name: Upload portal dist
        # Hand the built site to the hosted deploy job. Skipped when Pages
        # is not enabled, so a free-plan push does not publish an artifact.
        if: steps.pages-probe.outputs.verdict == 'enabled'
        uses: actions/upload-artifact@v7
        with:
          name: portal-dist
          path: packages/portal/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # actions/configure-pages, upload-pages-artifact, and deploy-pages
    # refuse self-hosted runners. This job stays on ubuntu-24.04. It does
    # not start unless the ARC build's probe said enabled, so a free-plan
    # private repo (the current state) spends no hosted minutes here.
    #
    # Manual dispatch only (2026-11-24). Since the repo went public, Pages is
    # enabled and deploy-demo-pages.yml owns the site on every portal push: it
    # builds with the /quill/ base the github.io URL needs. This job publishes a
    # root-base build to that same site, so on push the two raced and this one
    # lost (runs 45520713675, 45530345927). On push the build above still runs
    # and is verified; dispatch this workflow to publish the docs build on
    # purpose. Both deploy jobs share one concurrency group so they never
    # overlap.
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success' && needs.build.outputs.verdict == 'enabled'
    concurrency:
      group: github-pages-site
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download portal dist
        uses: actions/download-artifact@v8
        with:
          name: portal-dist
          path: packages/portal/dist

      # Re-emit the build probe so each Pages action keeps its step if.
      # No checkout: the site is the artifact, and the probe already ran.
      - name: Carry the Pages verdict
        id: pages-probe
        env:
          VERDICT: ${{ needs.build.outputs.verdict }}
        run: |
          if [ "$VERDICT" != "enabled" ]; then
            echo "::error::refusing to deploy without verdict=enabled (got ${VERDICT:-empty})."
            exit 1
          fi
          echo "verdict=enabled" >> "$GITHUB_OUTPUT"

      - name: Setup GitHub Pages
        if: steps.pages-probe.outputs.verdict == 'enabled'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.pages-probe.outputs.verdict == 'enabled'
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/portal/dist

      - name: Deploy to GitHub Pages
        if: steps.pages-probe.outputs.verdict == 'enabled'
        id: deployment
        uses: actions/deploy-pages@v5
