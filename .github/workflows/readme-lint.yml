name: "README Lint"

on:
  pull_request:
    branches: [main, prod]
    paths:
      - "*.md"
      - "packages/*/README.md"
      - "docs/**/*.md"
      - "assets/**"
      - ".github/workflows/readme-lint.yml"
  push:
    branches: [main, prod]
    paths:
      - "*.md"
      - "packages/*/README.md"
      - "docs/**/*.md"
      - "assets/**"
      - ".github/workflows/readme-lint.yml"
  workflow_dispatch:

concurrency:
  # One run per PR: a new push cancels the superseded run. Pushes to main/prod
  # group by commit SHA, so they never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  readme-lint:
    name: "Check documentation links and markdown formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Check dead links (lychee)"
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Non-HTTP schemes (gitlawb://, did:key:) are intentionally excluded.
          # 401 is accepted: auth-gated API endpoints (/v1, /sse) are alive by design.
          # *.lan hosts are excluded: CI cannot resolve the private LAN.
          # localhost is excluded: dev-stack URLs are unreachable from CI by definition.
          # Frostbite-Gazette is a PRIVATE repo (404s anonymously). nixos.wiki 403s bots.
          #
          # `--exclude-mail` is deliberately NOT passed. Upstream lychee removed
          # the flag in v0.19.0 (lycheeverse/lychee#1669, PR #1691) after
          # deprecating it in 2023, and mail checking has been off by default
          # since — so its removal changes nothing the gate checks. The action
          # bundles a pinned lychee binary that moves with the tag
          # (v2.0.2 -> v0.16.1, v2.9.0 -> v0.24.2), so on the older binary the
          # flag was only a warning while on the newer one it is a hard error:
          # run 38932597379 died with "unexpected argument '--exclude-mail'"
          # (exit 2) before checking a single link, the moment the Dependabot
          # actions bump (#966) moved the pin. scripts/test-readme-lint-flags.mts
          # is the incident-rule lane that keeps a pin bump from re-arming it.
          args: --verbose --no-progress --accept 200,206,401 --exclude 'gitlawb://' --exclude 'did:key:' --exclude '^https://github.com/maplespike/quill/(blob|tree)/' --exclude 'https://github.com/reverb256/Frostbite-Gazette' --exclude '^https?://localhost' --exclude 'https?://[a-zA-Z0-9.-]+\.lan(/|$)' --exclude 'https://nixos.wiki' ./README.md ./docs ./packages/*/README.md ./llms.txt ./llms-full.txt
          fail: true

      - name: "Lint markdown (markdownlint-cli2)"
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          # Scope: the files this gate owns (root docs + new standard files).
          # The legacy docs/ tree (300+ files) predates the gate and mixes
          # styles; it is link-checked by lychee but not style-gated.
          globs: |
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            AGENTS.md
            CREDITS.md
            docs/VISION.md
            packages/*/README.md
            llms.txt
            llms-full.txt
          config: .markdownlint-cli2.jsonc
          fix: false
