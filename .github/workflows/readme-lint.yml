name: "README Lint"

on:
  pull_request:
    branches: [main, prod]
    paths:
      - "*.md"
      - "packages/*/README.md"
      - "docs/**/*.md"
      - "assets/**"
      - ".github/workflows/readme-lint.yml"
  push:
    branches: [main, prod]
    paths:
      - "*.md"
      - "packages/*/README.md"
      - "docs/**/*.md"
      - "assets/**"
      - ".github/workflows/readme-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-lint:
    name: "Check documentation links and markdown formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Check dead links (lychee)"
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # Non-HTTP schemes (gitlawb://, did:key:) are intentionally excluded.
          # 401 is accepted: auth-gated API endpoints (/v1, /sse) are alive by design.
          # *.lan hosts are excluded: CI cannot resolve the private LAN.
          # localhost is excluded: dev-stack URLs are unreachable from CI by definition.
          # Frostbite-Gazette is a PRIVATE repo (404s anonymously). nixos.wiki 403s bots.
          args: --verbose --no-progress --accept 200,206,401 --exclude 'gitlawb://' --exclude 'did:key:' --exclude '^https://github.com/maplespike/quill/(blob|tree)/' --exclude 'https://github.com/reverb256/Frostbite-Gazette' --exclude '^https?://localhost' --exclude 'https?://[a-zA-Z0-9.-]+\.lan(/|$)' --exclude 'https://nixos.wiki' --exclude-mail ./README.md ./docs ./packages/*/README.md ./llms.txt ./llms-full.txt
          fail: true

      - name: "Lint markdown (markdownlint-cli2)"
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # Scope: the files this gate owns (root docs + new standard files).
          # The legacy docs/ tree (300+ files) predates the gate and mixes
          # styles; it is link-checked by lychee but not style-gated.
          globs: |
            README.md
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            CHANGELOG.md
            AGENTS.md
            CREDITS.md
            docs/VISION.md
            packages/*/README.md
            llms.txt
            llms-full.txt
          config: .markdownlint-cli2.jsonc
          fix: false
