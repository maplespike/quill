# Rust CI lane: runs on changes to rust/** — fmt, clippy, test
# Runner shells are non-login: resolve the provisioned Rust toolchain explicitly.
# rust/rust-toolchain.toml selects the toolchain; missing tooling fails preflight.
# Jobs require the 'rust' runner label: only runners with the provisioned toolchain
# carry it (forge does not — a rust job there fails the preflight, #1061).
#
# The run steps carry a hashFiles guard: this lane also triggers on its own
# file, so until the `rust/` tree lands (via #998) a missing crate dir skips
# cleanly instead of failing on `working-directory: ./rust`.
name: Rust CI

on:
  push:
    branches: [main, prod]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
      - 'scripts/ci-rust-env.sh'
  pull_request:
    branches: [main, prod]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
      - 'scripts/ci-rust-env.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-fmt:
    # Same-repo PRs only. Fork code must not run on the self-hosted pool (#1045).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos, rust]
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        run: |
          source ../scripts/ci-rust-env.sh
          cargo fmt --all --check
        working-directory: ./rust

  rust-clippy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos, rust]
    steps:
      - uses: actions/checkout@v7

      - name: Run clippy on lib targets (warning-tolerant; -D warnings after cleanup)
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        run: |
          source ../scripts/ci-rust-env.sh
          cargo clippy -p quill-search --lib
          cargo clippy -p quill-search-bench-gen --lib
        working-directory: ./rust

  rust-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nixos, rust]
    steps:
      - uses: actions/checkout@v7

      - name: Run lib tests
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        run: |
          source ../scripts/ci-rust-env.sh
          cargo test -p quill-search --lib
          cargo test -p quill-search-bench-gen --lib
        working-directory: ./rust
