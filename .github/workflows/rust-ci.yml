# Rust CI lane: runs on changes to rust/** — fmt, clippy, test
# Runner shells are non-login: resolve the provisioned Rust toolchain explicitly.
# rust/rust-toolchain.toml selects the toolchain; missing tooling fails preflight.
# Same-repo jobs run on the arc-maplespike scale set. The stock runner image
# has no cargo, so those jobs install the stable toolchain (dtolnay/rust-toolchain).
# Fork pull requests run on ubuntu-latest and install the same toolchain there.
# The run steps carry a hashFiles guard: this lane also triggers on its own
# file, so until the `rust/` tree lands (via #998) a missing crate dir skips
# cleanly instead of failing on `working-directory: ./rust`.
#
# Build cache (clippy and test only; rustfmt does not compile).
# arc-maplespike is an ephemeral scale set: each job gets a new pod name, and
# the pod disk does not survive it. A fresh pod's /opt/hostedtoolcache pnpm
# store reused 3 packages and downloaded the rest (CI run 42691263259,
# runner arc-maplespike-runner-j8b6z). sccache with a local disk cache would
# therefore miss on every job. Swatinem/rust-cache stores the cargo registry
# and rust/target dependency artifacts in the GitHub Actions cache service,
# which outlives the pod. That service is included with Actions. No S3, R2,
# or GCS.
# Keys: job id (add-job-id-key) plus `key`, which names the target and the
# feature set. A clippy entry cannot replace a test entry. A future job that
# passes --features or --target must use a different `key` or it will share
# this host/lib/default entry. `workspaces` is only the rust workspace, so
# no other target directory is archived. cache-bin is false, so ~/.cargo/bin
# (the toolchain) stays out. The action deletes CARGO_HOME/credentials.toml
# before it uploads.
name: Rust CI

on:
  push:
    branches: [main, prod]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
      - 'scripts/ci-rust-env.sh'
  pull_request:
    branches: [main, prod]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-ci.yml'
      - 'scripts/ci-rust-env.sh'
  workflow_dispatch:

concurrency:
  # One run per PR; a new push cancels the superseded run. Main/prod and
  # workflow_dispatch group per sha, so a newer push never evicts a queued run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-fmt:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-maplespike' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: ARC runner tools
        if: startsWith(runner.name, 'arc-')
        uses: ./.github/actions/arc-tools

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted' || startsWith(runner.name, 'arc-')
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        run: |
          source ../scripts/ci-rust-env.sh
          cargo fmt --all --check
        working-directory: ./rust

  rust-clippy:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-maplespike' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: ARC runner tools
        if: startsWith(runner.name, 'arc-')
        uses: ./.github/actions/arc-tools

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted' || startsWith(runner.name, 'arc-')
        with:
          components: rustfmt, clippy

      # Toolchain first: the cache key includes the rustc version.
      # key is the feature/target profile for `cargo clippy -p … --lib`
      # (host, default features, no bench). Do not reuse this key for
      # another profile.
      - name: Cache cargo dependencies
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: clippy-host-lib-default
          add-job-id-key: "true"
          cache-targets: "true"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-bin: "false"
          cache-on-failure: "false"

      - name: Run clippy on lib targets (warning-tolerant; -D warnings after cleanup)
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        run: |
          source ../scripts/ci-rust-env.sh
          cargo clippy -p quill-search --lib
          cargo clippy -p quill-search-bench-gen --lib
        working-directory: ./rust

  rust-test:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'arc-maplespike' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - name: ARC runner tools
        if: startsWith(runner.name, 'arc-')
        uses: ./.github/actions/arc-tools

      - uses: dtolnay/rust-toolchain@stable
        if: runner.environment == 'github-hosted' || startsWith(runner.name, 'arc-')
        with:
          components: rustfmt, clippy

      # Same scope rules as rust-clippy. This key is the test profile only.
      - name: Cache cargo dependencies
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: test-host-lib-default
          add-job-id-key: "true"
          cache-targets: "true"
          cache-workspace-crates: "false"
          cache-all-crates: "false"
          cache-bin: "false"
          cache-on-failure: "false"

      - name: Run lib tests
        if: ${{ hashFiles('rust/Cargo.toml') != '' }}
        run: |
          source ../scripts/ci-rust-env.sh
          cargo test -p quill-search --lib
          cargo test -p quill-search-bench-gen --lib
        working-directory: ./rust
