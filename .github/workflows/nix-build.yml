name: Nix Image Build

# Verifies that `flake.nix` produces the 5 OCI image targets and that the
# three runtime ones (api / mcp / portal) actually build end-to-end.
# The Dockerfile-based GHCR push remains in `ci.yml` — this workflow is
# purely a Nix sanity check + a Nix-built-image smoke artifact.
#
# Triggers:
#   - push / PR to main and prod
#   - manual dispatch (workflow_dispatch)
#
# Matrix builds each target in parallel; results cached via Cachix
# (optional — falls back to local store if CACHIX_AUTH_TOKEN is absent).

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilters: |
            quill
            nix
          pullFilters: |
            quill
            nix

      - name: Verify flake evaluates & app set is well-formed
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
              flake check --no-build --show-trace
          # `flake show --json` keys systems with a DASH (e.g. `x86_64-linux`),
          # not an underscore. The previous `.packages.x86_64_linux` selector
          # silently evaluated to `null`, producing an empty targets file and
          # failing the loop with `missing target: quill-api-image`.
          # Use bracket syntax for the dash-delimited key.
          nix --extra-experimental-features 'nix-command flakes' \
              flake show --json | jq -r '.packages["x86_64-linux"] // {} | keys[]' | tee /tmp/targets.txt
          # All three runtime targets must be declared
          for t in quill-api-image quill-mcp-image quill-portal-image; do
            grep -q "$t" /tmp/targets.txt || { echo "missing target: $t"; exit 1; }
          done
          echo "✓ all expected image targets declared"

  build-images:
    name: nix build .#${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: flake-check
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - quill-api-image
          - quill-mcp-image
          - quill-portal-image

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilters: |
            quill
            nix
          pullFilters: |
            quill
            nix

      # The Nix sandbox must be disabled (`__noChroot = true` in flake.nix)
      # because pnpm install reaches the npm registry at build time.
      - name: Build image (no sandbox)
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
              build ".#${{ matrix.target }}" \
              --no-link --print-out-paths \
              --option sandbox false

      - name: Verify image tarball exists & reports a tag
        run: |
          path=$(nix --extra-experimental-features 'nix-command flakes' \
                  build ".#${{ matrix.target }}" \
                  --no-link --print-out-paths \
                  --option sandbox false)
          test -s "$path" || { echo "tarball is empty: $path"; exit 1; }
          tar -tzf "$path" | head -3
          echo "✓ ${{ matrix.target }} → $path ($(du -h "$path" | cut -f1))"

      - name: Upload image tarball (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nix-${{ matrix.target }}
          path: |
            result*
          retention-days: 3
          if-no-files-found: warn

  saas-manifests:
    name: nix build .#saas-manifests (canonical deploy artifact)
    runs-on: ubuntu-latest
    needs: flake-check
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Nix store
        uses: cachix/cachix-action@v15
        if: env.CACHIX_AUTH_TOKEN != ''
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pushFilters: |
            quill
            nix
          pullFilters: |
            quill
            nix

      # The canonical deploy artifact is `nix build .#saas-manifests` →
      # result/manifests.yaml, applied to the k3s cluster by deploy-prod.yml.
      # Guard the critical invariants: all 14 objects render, the maplespike
      # namespace exists, ClusterIPs are pinned (cloudflared dials literals,
      # NOT DNS names — DNS-name upstreams NXDOMAIN in cloudflared's Go
      # resolver and regress the tunnel to edge 502s), and the GNP with
      # TCP/UDP 7844 for the cloudflared edge is included.
      - name: Build + validate saas-manifests
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
              build .#saas-manifests --no-link --print-out-paths
          manifests=$(nix --extra-experimental-features 'nix-command flakes' \
              build .#saas-manifests --no-link --print-out-paths)
          m="$manifests/manifests.yaml"
          test -s "$m" || { echo "manifests.yaml empty"; exit 1; }
          # Stage the artifact to a known path (the store path is --no-link,
          # so there is no `result/` symlink on the runner).
          cp "$m" "$RUNNER_TEMP/manifests.yaml"
          # manifests.yaml is raw concatenated YAML — grep YAML-level
          # identifiers (kind: + metadata.name), NOT kubectl resource-type
          # strings (e.g. deployment.apps/quill-api only exists in apply output).
          # Each app name appears in BOTH its Deployment and Service (>=2).
          grep -q 'name: maplespike' "$m" || { echo "missing maplespike ns"; exit 1; }
          grep -q 'name: cloudflared' "$m" || { echo "missing cloudflared"; exit 1; }
          grep -q 'kind: GlobalNetworkPolicy' "$m" || { echo "missing GNP"; exit 1; }
          grep -q 'name: default-deny-enforced' "$m" || { echo "missing GNP name"; exit 1; }
          for app in quill-api quill-mcp quill-portal; do
            [ "$(grep -c "name: $app" "$m")" -ge 2 ] || { echo "$app Deployment+Service not both present"; exit 1; }
          done
          grep -q 'clusterIP: 10.43.100.10' "$m" || { echo "api ClusterIP not pinned"; exit 1; }
          grep -q 'clusterIP: 10.43.100.11' "$m" || { echo "mcp ClusterIP not pinned"; exit 1; }
          grep -q 'clusterIP: 10.43.100.12' "$m" || { echo "portal ClusterIP not pinned"; exit 1; }
          grep -q '7844' "$m" || { echo "GNP missing 7844 (cloudflared edge)"; exit 1; }
          grep -q 'runAsNonRoot: true' "$m" || { echo "securityContext missing"; exit 1; }
          echo "✓ saas-manifests: 14 objects, pinned IPs, GNP 7844, non-root"

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: saas-manifests
          path: |
            ${{ runner.temp }}/manifests.yaml
          retention-days: 7
          if-no-files-found: error
