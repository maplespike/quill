name: Portal generated-artifact drift

# The portal commits generated artifacts (src/data/*.json, public/llms*.txt,
# public/agents.json, openapi.json). Until 2026-10-01 those generators wrote
# `new Date()` into their output, so every re-run produced a diff even when no
# input had changed — which made it impossible to tell a real content change
# from a re-run, and left stale claims (a 189-tool catalog when the server
# serves 184) sitting in the tree unnoticed.
#
# The generators now take their timestamp from scripts/lib/build-timestamp.mjs,
# which prefers the git HEAD commit date, so output is a function of the commit
# rather than of the clock. scripts/check-portal-artifact-drift.mjs then compares
# the regenerated artifacts against the committed ones, excluding that timestamp
# field: a commit's artifacts necessarily carry the parent commit's date, so
# comparing timestamps would flag drift on every commit.
#
# Scope note, stated plainly: this gate proves the artifacts match their
# generators. It does NOT prove the generators match the running system — the
# catalog counts come from a live MCP server, so a server-side tool change will
# NOT be caught here until someone re-runs the generator and commits the result.

on:
  pull_request:
    branches: [main, prod]
    paths:
      - 'packages/portal/scripts/generate-*.mjs'
      - 'packages/portal/scripts/lib/**'
      - 'packages/portal/src/data/**'
      - 'packages/portal/public/llms*.txt'
      - 'packages/portal/public/agents.json'
      - 'packages/portal/agents.json'
      - 'packages/portal/**/openapi.json'
      - 'packages/quill-mcp/src/tools/index.ts'
      - 'packages/quill-mcp/src/tools/tool-index.json'
      - 'docs/metrics.json'
      - '.github/workflows/portal-artifact-drift.yml'
  push:
    branches: [main, prod]
    paths:
      - 'packages/portal/scripts/generate-*.mjs'
      - 'packages/portal/scripts/lib/**'
      - 'packages/portal/src/data/**'
      - 'packages/portal/public/llms*.txt'
      - 'packages/portal/public/agents.json'
      - 'packages/portal/agents.json'
      - 'packages/portal/**/openapi.json'
      - 'packages/quill-mcp/src/tools/index.ts'
      - 'packages/quill-mcp/src/tools/tool-index.json'
      - 'docs/metrics.json'
      - '.github/workflows/portal-artifact-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two drift runs fight over the same checkout.
concurrency:
  group: portal-artifact-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the drift checker compares the worktree against
          # `git show HEAD:<path>`, and the generators resolve their timestamp
          # from the HEAD commit date.
          fetch-depth: 0

      - name: Install dependencies from the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Regenerate portal artifacts
        working-directory: packages/portal
        run: |
          pnpm gen:plans
          pnpm gen:agents
          pnpm gen:llms
          pnpm gen:openapi

      - name: Check committed artifacts against the generators
        run: node scripts/check-portal-artifact-drift.mjs

      - name: Explain a failure
        if: failure()
        run: |
          # The heredoc body is indented to match the block scalar. A body at
          # column 0 ends the `run: |` block early and the remaining lines are
          # parsed as YAML, which makes the whole workflow file invalid — the
          # same mistake that made deploy-prod.yml unrunnable.
          cat >&2 <<'EOF'
          The committed portal artifacts do not match what the generators produce.

          If the tool catalog or metrics genuinely changed upstream, regenerate
          and commit:

            pnpm --filter @maplespike/portal gen:plans
            pnpm --filter @maplespike/portal gen:agents
            pnpm --filter @maplespike/portal gen:llms
            pnpm --filter @maplespike/portal gen:openapi

          Do not hand-edit the generated files.

          A COUNT MISMATCH line means a committed file asserts a tool count that
          differs from packages/portal/src/data/tools.json. That is the failure
          this gate was written after: a 189-tool catalog sat in a committed
          artifact while the server served 184.

          Note that the build timestamp is deliberately excluded from the
          comparison. A commit's artifacts necessarily carry the *parent*
          commit's date, because a commit cannot know its own date before it
          exists, so comparing timestamps would report drift on every commit that
          touches an artifact.

          If you believe a diff is spurious, check the generator is reading the
          sources you expect. generate-plans.mjs imports quill-mcp's built dist/,
          so a stale build silently yields an older catalog; run
          `pnpm install --prefer-offline` and rebuild first.
          EOF
