# Merge when green — label-gated auto-merge (event-driven, no polling).
#
# Why a workflow and not branch protection: private repo on the free plan, so
# the branch-protection API returns 403. This gate is the ONLY guard on main.
#
# THE GATE: the `ready-to-merge` label, one deliberate human act after reading
# the diff. This workflow never approves and never judges safety. It merges a
# labelled PR only when ALL of these hold for the PR's CURRENT head SHA:
#   - every workflow run on that SHA (other than this one) is completed with
#     conclusion success / skipped / neutral (queued runs have no check runs
#     yet — that gap let media-k8s#125 merge while lint was still pending);
#   - every check run on that SHA (latest per name, excluding this workflow)
#     is completed success / skipped / neutral;
#   - every commit status is success (pending = wait; else refuse);
#   - the PR is open, not a draft, from this repo (no forks), MERGEABLE, and
#     not behind its base;
#   - the merge is `--match-head-commit <sha>`, so a push in between is refused.
#
# NO POLLING. Single quick evaluation, exit in seconds (target <15s), so it
# never holds a runner that the checks it waits for need:
#   - pull_request_target labeled / synchronize / reopened / ready_for_review
#   - workflow_run completed for every PR check workflow listed below
#   - check_suite completed (catch-all for any check)
#   - pull_request_review submitted / dismissed
# If the branch is behind, update-branch once and exit; the next check
# completion re-arms the gate.
#
# Exit 0 for every "not ready" posture. Exit 1 only for post-merge audit
# failure (gate bug).
#
# Security: write-token events never check out or run PR code. API only.
# Triggers read this file from the DEFAULT branch.
name: "Merge when green"

on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows:
      - CI
      - "PR validation"
      - QA
      - "Docs Validation"
      - "README Lint"
      - NetworkPolicy validation
      - Rust CI
      - Portal generated-artifact drift
      - "Metrics Drift Check"
    types: [completed]
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write
  issues: write

concurrency:
  group: merge-when-green-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch || github.event.check_suite.head_branch || github.run_id }}
  cancel-in-progress: false

jobs:
  merge:
    name: merge
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'check_suite' &&
       github.event.check_suite.head_repository.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Dedicated gate scale set (media-k8s #174). Tiny job; never poll.
    runs-on: arc-maplespike-gate
    timeout-minutes: 2
    steps:
      - name: Install gh
        env:
          GH_VERSION: "2.103.2"
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then gh --version | head -1; exit 0; fi
          dest="$RUNNER_TEMP/gh"
          mkdir -p "$dest"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$dest" --strip-components=1
          echo "$dest/bin" >> "$GITHUB_PATH"
          "$dest/bin/gh" --version | head -1

      - name: Judge the gate and squash-merge if everything is green
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
          SELF_WORKFLOW: ${{ github.workflow_ref }}
          LABEL: ready-to-merge
          REQUIRED_CHECKS: ""
        run: |
          set -euo pipefail
          note() { echo "::notice::$*"; }
          SELF_PATH=$(sed -E 's|^[^/]+/[^/]+/||; s|@.*$||' <<<"$SELF_WORKFLOW")

          PR="${PR_FROM_EVENT:-}"
          if [[ -z "$PR" ]]; then
            PR=$(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" \
                   --jq '[.[] | select(.state == "open")][0].number // empty')
            if [[ -z "$PR" ]]; then note "no open PR for ${RUN_SHA:-unknown}; nothing to do."; exit 0; fi
          fi

          META=$(gh pr view "$PR" --repo "$GH_REPO" \
                   --json state,isDraft,mergeable,labels,title,body,headRefOid,baseRefName)
          if [[ "$(jq -r .state <<<"$META")" != OPEN ]]; then note "#$PR is not open; nothing to do."; exit 0; fi
          if [[ "$(jq -r --arg l "$LABEL" 'any(.labels[]; .name == $l)' <<<"$META")" != true ]]; then
            note "#$PR has no '$LABEL' label; gate closed."; exit 0
          fi
          if [[ "$(jq -r .isDraft <<<"$META")" == true ]]; then note "#$PR is a draft; gate closed."; exit 0; fi
          SHA=$(jq -r .headRefOid <<<"$META")
          BASE=$(jq -r .baseRefName <<<"$META")
          if [[ -n "${RUN_SHA:-}" && "$RUN_SHA" != "$SHA" ]]; then
            note "event SHA $RUN_SHA but #$PR head is now $SHA; newer runs decide."; exit 0
          fi
          echo "Gate open on #$PR at $SHA (base $BASE); self=$SELF_PATH."

          WRUNS=$(gh api --paginate "repos/$GH_REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[]' | jq -s .)
          SELF_SUITES=$(jq -c --arg p "$SELF_PATH" '[.[] | select(.path == $p) | .check_suite_id]' <<<"$WRUNS")
          OTHER=$(jq --arg p "$SELF_PATH" '[.[] | select(.path != $p)] | group_by(.workflow_id) | map(max_by(.id))' <<<"$WRUNS")

          # Fresh label/push: sibling runs may not exist yet. Do not merge empty;
          # workflow_run / check_suite will re-arm once checks appear. No sleep.
          if [[ "$EVENT" == pull_request_target && "$(jq 'length' <<<"$OTHER")" -eq 0 ]]; then
            note "no other workflow runs on $SHA yet; waiting for checks to appear."; exit 0
          fi

          W_PENDING=$(jq -r '[.[] | select(.status != "completed") | "\(.name)=\(.status)"] | join(", ")' <<<"$OTHER")
          W_FAILED=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "\(.name)=\(.conclusion)"] | join(", ")' <<<"$OTHER")

          RUNS=$(gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s .)
          LATEST=$(jq --argjson self "$SELF_SUITES" '[.[] | select((.check_suite.id | IN($self[])) | not)] | group_by(.name) | map(max_by(.id))' <<<"$RUNS")
          C_PENDING=$(jq -r '[.[] | select(.status != "completed") | "\(.name)=\(.status)"] | join(", ")' <<<"$LATEST")
          C_FAILED=$(jq -r '[.[] | select(.status == "completed" and (.conclusion | IN("success","neutral","skipped") | not)) | "\(.name)=\(.conclusion)"] | join(", ")' <<<"$LATEST")

          STATUSES=$(gh api "repos/$GH_REPO/commits/$SHA/status" --jq '.statuses')
          S_PENDING=$(jq -r '[.[] | select(.state == "pending") | .context] | join(", ")' <<<"$STATUSES")
          S_FAILED=$(jq -r '[.[] | select(.state == "failure" or .state == "error") | "\(.context)=\(.state)"] | join(", ")' <<<"$STATUSES")

          echo "workflow runs: $(jq -r 'map("\(.name)=\(.status)/\(.conclusion)") | join(", ")' <<<"$OTHER")"
          echo "check runs:    $(jq -r 'map("\(.name)=\(.status)/\(.conclusion)") | join(", ")' <<<"$LATEST")"

          FAILED=$(printf '%s\n' "$W_FAILED" "$C_FAILED" "$S_FAILED" | grep -v '^$' | paste -sd'; ' - || true)
          PENDING=$(printf '%s\n' "$W_PENDING" "$C_PENDING" "$S_PENDING" | grep -v '^$' | paste -sd'; ' - || true)
          if [[ -n "$FAILED" ]]; then
            note "not green on $SHA: $FAILED; gate closed (no merge). Fix checks; label stays."
            exit 0
          fi
          if [[ -n "$PENDING" ]]; then note "still pending on $SHA: $PENDING; last completion re-runs the gate."; exit 0; fi

          for REQUIRED_CHECK in $REQUIRED_CHECKS; do
            REQ=$(jq -r --arg n "$REQUIRED_CHECK" '.[] | select(.name == $n) | "\(.status)/\(.conclusion)"' <<<"$LATEST")
            if [[ "$REQ" != completed/success ]]; then
              note "required check '$REQUIRED_CHECK' is '${REQ:-missing}' on $SHA; waiting."; exit 0
            fi
          done

          BEHIND=$(gh api "repos/$GH_REPO/compare/$BASE...$SHA" --jq .behind_by)
          if [[ "$BEHIND" != 0 ]]; then
            note "#$PR is $BEHIND commit(s) behind $BASE; updating branch once, then exit."
            if gh pr update-branch "$PR" --repo "$GH_REPO"; then
              note "updated #$PR onto $BASE; checks will re-run and re-arm the gate."
            else
              note "update-branch failed for #$PR; resolve manually; label stays."
            fi
            exit 0
          fi
          MERGEABLE=$(jq -r .mergeable <<<"$META")
          if [[ "$MERGEABLE" != MERGEABLE ]]; then
            note "#$PR mergeable=$MERGEABLE; gate closed (no merge). Resolve or wait; label stays."
            exit 0
          fi

          TITLE=$(jq -r .title <<<"$META")
          PR_BODY=$(jq -r '.body // ""' <<<"$META")
          echo "Everything green on $SHA; squash-merging #$PR."
          # Pass PR body as squash body so closing keywords / description survive
          # (COMMIT_MESSAGES squash setting would otherwise drop them).
          gh pr merge "$PR" --repo "$GH_REPO" --squash --delete-branch \
            --match-head-commit "$SHA" --subject "$TITLE (#$PR)" --body "$PR_BODY"
          note "merged #$PR at $SHA via the '$LABEL' gate."
          { echo "pr=$PR"; echo "sha=$SHA"; echo "body<<BODY_EOF"; printf '%s\n' "$PR_BODY"; echo "BODY_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Post-merge audit (every check finished before the merge)
        if: steps.judge.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.judge.outputs.pr }}
          SHA: ${{ steps.judge.outputs.sha }}
          SELF_WORKFLOW: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          SELF_PATH=$(sed -E 's|^[^/]+/[^/]+/||; s|@.*$||' <<<"$SELF_WORKFLOW")
          MERGED_AT=$(gh pr view "$PR" --repo "$GH_REPO" --json mergedAt --jq .mergedAt)
          WR=$(gh api --paginate "repos/$GH_REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '.workflow_runs[]' | jq -s .)
          SELF_SUITES=$(jq -c --arg p "$SELF_PATH" '[.[] | select(.path == $p) | .check_suite_id]' <<<"$WR")
          LATE_W=$(jq -r --arg p "$SELF_PATH" --arg m "$MERGED_AT" '[.[] | select(.path != $p and .created_at <= $m and .status != "completed") | .name] | unique | join(", ")' <<<"$WR")
          LATE_C=$(gh api --paginate "repos/$GH_REPO/commits/$SHA/check-runs?per_page=100" --jq '.check_runs[]' | jq -s -r --argjson self "$SELF_SUITES" --arg m "$MERGED_AT" \
            '[.[] | select((.check_suite.id | IN($self[])) | not) | select(.started_at <= $m and (.completed_at == null or .completed_at > $m)) | .name] | unique | join(", ")')
          if [[ -n "$LATE_W$LATE_C" ]]; then
            echo "::error::#$PR merged at $MERGED_AT before these finished: ${LATE_W} ${LATE_C}. The merge gate is broken; revert #$PR and fix merge-when-green."
            exit 1
          fi
          echo "::notice::audit ok: every check on $SHA finished before #$PR merged at $MERGED_AT."

      - name: Kick main CI after merge
        if: steps.judge.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.judge.outputs.pr }}
        run: |
          set -euo pipefail
          echo "Dispatching CI on main…"
          if gh workflow run CI --repo "$GH_REPO" --ref main; then
            echo "::notice::dispatched CI on main after #$PR merge"
          else
            echo "::warning::failed to dispatch CI on main — check workflow_dispatch + actions:write"
          fi

      - name: Deterministic issue closure
        if: steps.judge.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.judge.outputs.pr }}
          PR_BODY: ${{ steps.judge.outputs.body }}
        run: |
          set -euo pipefail
          CLOSE_REFS=$(printf '%s\n' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*(GH)?#[0-9]+' \
            | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
          echo "Close-loop: closing refs parsed from the PR body: ${CLOSE_REFS:-<none>}"
          for n in $CLOSE_REFS; do
            state=$(gh issue view "$n" --repo "$GH_REPO" --json state -q .state 2>&1 || true)
            case "$state" in
              OPEN)
                if gh issue close "$n" --repo "$GH_REPO" --reason completed \
                  --comment "Closed by the ready-to-merge gate when #$PR merged (deterministic closure — #983)."; then
                  echo "::notice::Close-loop closed #$n (referenced by #$PR)."
                else
                  echo "::warning::could not close issue #$n"
                fi
                ;;
              CLOSED)
                echo "Close-loop: #$n already closed."
                ;;
              *)
                echo "::warning::close-loop could not read the state of #$n: $state"
                ;;
            esac
          done
