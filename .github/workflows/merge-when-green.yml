---
# Merge when green — label-gated auto-merge.
#
# Why this exists as a workflow and not a branch-protection rule: this is a
# private repo on the free plan, so the branch-protection API returns 403 and
# there is no required-approvals / required-checks safety net (see the header
# of pr-validation.yml, which exists for the same reason). The merge policy
# therefore has to live here.
#
# The gate is deliberately one deliberate human act — dropping the
# `ready-to-merge` label after reading the diff. The workflow only removes the
# two-step dance (watch CI, come back, click merge). It does NOT approve the
# PR and it does NOT decide that a PR is safe; both stay with the human.
#
# Triggers on `labeled` (the gate opening) plus `synchronize`/`reopened`/
# `ready_for_review` so pushing more commits to an already-labelled PR re-arms
# the gate rather than leaving it merged against stale checks.
#
# "Not my turn" exits 0, never 1: a red check on a PR that is merely waiting
# for its author to label it is a misleading signal.
name: "Merge when green"
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  # The deterministic close-loop (#983) reads and closes issues. With the
  # block declared, an unlisted scope is NONE: on the first live run (#999,
  # 2026-10-05) `gh issue view` 403'd, `|| true` turned that into an empty
  # state, and the loop skipped #986 silently. issues:write covers both the
  # state read and the close.
  issues: write
  # gh pr checks' GraphQL reads checkSuite.workflowRun; without actions:read
  # the whole query can be refused ("Resource not accessible by integration",
  # measured on #997, 60/60 attempts, 2026-10-04). The REST fallback in the
  # wait step keeps the gate working even if this scope is still refused.
  actions: write

jobs:
  merge:
    # Author gate. Dependabot, or the maintainer. The head repository must be
    # this repository. This job does not check out pull request code.
    # pull_request_target is required so the squash-merge token can write.
    # A fork pull request does not run.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.actor == 'dependabot[bot]' || github.actor == 'reverb256')
    runs-on: ubuntu-latest
    steps:
      # Never rely on the runner's ambient `gh` credentials: the
      # [self-hosted, nixos] pool is not homogeneous (PR 908). github.token is
      # minted per run and exists everywhere.
      - name: "Wait for every check to settle, then squash-merge"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABEL: ${{ github.event.label.name }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          if [[ "$PR_LABEL" != "ready-to-merge" ]]; then
            echo "::notice::event=$ACTION label='$PR_LABEL' — not the merge gate. Nothing to do."
            exit 0
          fi

          echo "Gate open on #$PR_NUMBER — waiting for every check to settle."

          # 60 * 20s = 20 min ceiling. Longer than any CI lane in ci.yml
          # (longest observed ~2m) so this never truncates a healthy run.
          for i in $(seq 1 60); do
            # --repo on every call: this job has no checkout. `gh` cannot infer
            # the repository from a working tree. The job runs on ubuntu-latest.
            META=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state,isDraft,mergeable,labels,title,body)

            if [[ "$(jq -r '.state' <<<"$META")" != "OPEN" ]]; then
              echo "::notice::PR #$PR_NUMBER closed/merged by someone else — stopping."
              exit 0
            fi
            if [[ "$(jq -r '.isDraft' <<<"$META")" == "true" ]]; then
              echo "::notice::PR #$PR_NUMBER is a draft — stopping."
              exit 0
            fi
            if [[ "$(jq -r 'any(.labels[]; .name == "ready-to-merge")' <<<"$META")" != "true" ]]; then
              echo "::notice::'ready-to-merge' removed from #$PR_NUMBER — stopping."
              exit 0
            fi

            # Fail closed (#983 follow-up): a transient gh/API failure must
            # not read as "no pending, no failures". On an unreadable list,
            # wait and retry; the 20-min loop is the backstop. Observed once:
            # all-green reported while a check was still in_progress.
            #
            # Fallback (#997): gh pr checks' GraphQL can be refused wholesale
            # on this runner ("Resource not accessible by integration" on
            # checkSuite.workflowRun — measured 60/60 attempts on #997,
            # 2026-10-04). Read the same data over REST check-runs for the
            # head SHA; both paths failing keeps the fail-closed retry.
            PENDING=""
            FAILURES=""
            CHECKS=""
            RAW=""
            if CHECKS=$(gh pr checks "$PR_NUMBER" --repo "$GH_REPO" --json bucket,name 2>/dev/null); then
              PENDING=$(jq '[.[] | select(.bucket == "pending" and .name != "merge" and .name != "Merge when green")] | length' <<<"$CHECKS" 2>/dev/null || true)
              FAILURES=$(jq '[.[] | select(.bucket == "fail" and .name != "merge" and .name != "Merge when green")] | length' <<<"$CHECKS" 2>/dev/null || true)
            else
              HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid -q .headRefOid 2>/dev/null || true)
              if [ -n "$HEAD_SHA" ] && RAW=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" 2>/dev/null); then
                if [ "$(jq '.check_runs | length' <<<"$RAW" 2>/dev/null || echo 0)" -gt 0 ]; then
                  PENDING=$(jq '[.check_runs[] | select(.status != "completed" and .name != "merge" and .name != "Merge when green")] | length' <<<"$RAW")
                  FAILURES=$(jq '[.check_runs[] | select(.name != "merge" and .name != "Merge when green" and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure"))] | length' <<<"$RAW")
                fi
              fi
            fi
            if [ -z "$PENDING" ] || [ -z "$FAILURES" ]; then
              echo "($i/60) check list unreadable — retrying."
              sleep 20
              continue
            fi

            if [[ "$FAILURES" -gt 0 ]]; then
              if [ -n "$CHECKS" ]; then
                NAMES=$(jq -r '.[] | select(.bucket == "fail") | .name' <<<"$CHECKS" | paste -sd', ' -)
              else
                NAMES=$(jq -r '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure") | .name] | join(", ")' <<<"$RAW" 2>/dev/null || true)
              fi
              echo "::error::Failing checks on #$PR_NUMBER: $NAMES — refusing to merge."
              echo "Fix or revert them, then re-apply the label."
              exit 1
            fi

            if [[ "$PENDING" -eq 0 ]]; then
              if [[ "$(jq -r '.mergeable' <<<"$META")" != "MERGEABLE" ]]; then
                echo "::error::All checks green but the merge is $(jq -r '.mergeable' <<<"$META")."
                echo "Resolve conflicts, then re-apply the label."
                exit 1
              fi

              # No --subject on purpose (#985), and pass the PR body as the
              # squash body (#983/#993): this repo's squash settings are
              # COMMIT_OR_PR_TITLE + COMMIT_MESSAGES, so without --body the
              # composed squash body is the branch's commit messages — never
              # the PR description.
              #
              # Measured 2026-10-04 (#983): even with `Closes #N` present in
              # the squash message on main (f9e1a492/#990, 17416ec0/#983),
              # GitHub's keyword auto-closure did not fire — no `closed` and
              # no `referenced` events. Closure is therefore done
              # deterministically below, not left to the keyword.
              PR_BODY=$(jq -r '.body // ""' <<<"$META")
              echo "All checks green — squash-merging #$PR_NUMBER."
              gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --delete-branch \
                --body "$PR_BODY"
              echo "::notice::Merged #$PR_NUMBER via the ready-to-merge gate."

              # GITHUB_TOKEN merge does not fire push workflows on main.
              # workflow_dispatch from GITHUB_TOKEN does (needs actions: write).
              echo "Dispatching CI on main after merge…"
              if gh workflow run CI --repo "$GH_REPO" --ref main; then
                echo "::notice::dispatched CI on main after #$PR_NUMBER merge"
              else
                echo "::error::failed to dispatch CI on main"
                exit 1
              fi


              # Deterministic issue closure (#983): close the OPEN issues
              # referenced with closing keywords in the PR body. A failure
              # here must never fail the merge — but it must be VISIBLE:
              # the first live run (#999, 2026-10-05) skipped silently when
              # `gh issue view` 403'd (missing issues scope) into an empty
              # state. Log the parsed refs and every outcome.
              CLOSE_REFS=$(printf '%s\n' "$PR_BODY" \
                | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*(GH)?#[0-9]+' \
                | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true)
              echo "Close-loop: closing refs parsed from the PR body: ${CLOSE_REFS:-<none>}"
              for n in $CLOSE_REFS; do
                state=$(gh issue view "$n" --repo "$GH_REPO" --json state -q .state 2>&1 || true)
                case "$state" in
                  OPEN)
                    if gh issue close "$n" --repo "$GH_REPO" --reason completed \
                      --comment "Closed by the ready-to-merge gate when #$PR_NUMBER merged (deterministic closure — #983)."; then
                      echo "::notice::Close-loop closed #$n (referenced by #$PR_NUMBER)."
                    else
                      echo "::warning::could not close issue #$n"
                    fi
                    ;;
                  CLOSED)
                    echo "Close-loop: #$n already closed."
                    ;;
                  *)
                    echo "::warning::close-loop could not read the state of #$n: $state"
                    ;;
                esac
              done
              exit 0
            fi

            echo "($i/60) $PENDING checks pending…"
            sleep 20
          done

          echo "::error::Timed out after 20 min waiting for checks on #$PR_NUMBER — refusing to merge."
          echo "Re-apply the label once CI has settled."
          exit 1