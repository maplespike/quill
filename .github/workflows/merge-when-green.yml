---
# Merge when green — label-gated auto-merge.
#
# Why this exists as a workflow and not a branch-protection rule: this is a
# private repo on the free plan, so the branch-protection API returns 403 and
# there is no required-approvals / required-checks safety net (see the header
# of pr-validation.yml, which exists for the same reason). The merge policy
# therefore has to live here.
#
# The gate is deliberately one deliberate human act — dropping the
# `ready-to-merge` label after reading the diff. The workflow only removes the
# two-step dance (watch CI, come back, click merge). It does NOT approve the
# PR and it does NOT decide that a PR is safe; both stay with the human.
#
# The gate runs on the tiny `arc-maplespike-gate` scale set and never polls.
# It is triggered by completed CI workflows, completed check suites, or by
# label/ready_for_review/synchronize activity on the PR itself. Each run
# resolves the PR and head SHA, validates the gate conditions, queries the
# Checks API exactly once, and either merges or exits 0.
#
# "Not my turn" exits 0, never 1: a red check on a PR that is merely waiting
# for its author to label it is a misleading signal.
name: "Merge when green"

on:
  workflow_run:
    workflows: ["CI", "PR validation", "QA", "Rust CI"]
    types: [completed]
  check_suite:
    types: [completed]
  pull_request:
    types: [labeled, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_suite.pull_requests[0].number || github.event.workflow_run.head_sha || github.event.check_suite.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  merge:
    runs-on: arc-maplespike-gate
    timeout-minutes: 5
    steps:
      - name: Resolve PR and head SHA
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_NUMBER=""
          HEAD_SHA=""

          case "${{ github.event_name }}" in
            pull_request)
              PR_NUMBER="${{ github.event.pull_request.number }}"
              HEAD_SHA="${{ github.event.pull_request.head.sha }}"
              ;;
            workflow_run)
              HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
              PR_NUMBER=$(gh api "repos/$GH_REPO/pulls" --paginate \
                --jq '[.[] | select(.state == "open" and .head.sha == $sha) | .number] | first // empty' \
                --arg sha "$HEAD_SHA" 2>/dev/null || true)
              ;;
            check_suite)
              HEAD_SHA="${{ github.event.check_suite.head_sha }}"
              PR_NUMBER=$(gh api "repos/$GH_REPO/pulls" --paginate \
                --jq '[.[] | select(.state == "open" and .head.sha == $sha) | .number] | first // empty' \
                --arg sha "$HEAD_SHA" 2>/dev/null || true)
              ;;
          esac

          if [[ -z "${PR_NUMBER:-}" || -z "${HEAD_SHA:-}" ]]; then
            echo "::notice::No open PR resolved for this event — nothing to do."
            exit 0
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved PR #$PR_NUMBER at head SHA $HEAD_SHA."

      - name: Validate gate conditions
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_NUMBER:-}" ]]; then
            echo "::notice::No PR resolved — nothing to do."
            exit 0
          fi

          META=$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state,isDraft,headRepository,labels 2>/dev/null || true)
          if [[ -z "$META" ]]; then
            echo "::notice::Could not read PR #$PR_NUMBER — nothing to do."
            exit 0
          fi

          if [[ "$(jq -r '.state' <<<"$META")" != "OPEN" ]]; then
            echo "::notice::PR #$PR_NUMBER is not open — nothing to do."
            exit 0
          fi

          if [[ "$(jq -r '.isDraft' <<<"$META")" == "true" ]]; then
            echo "::notice::PR #$PR_NUMBER is a draft — nothing to do."
            exit 0
          fi

          if [[ "$(jq -r 'any(.labels[]; .name == "ready-to-merge")' <<<"$META")" != "true" ]]; then
            echo "::notice::PR #$PR_NUMBER does not have the ready-to-merge label — nothing to do."
            exit 0
          fi

          HEAD_REPO=$(jq -r '.headRepository.nameWithOwner' <<<"$META")
          if [[ "$HEAD_REPO" != "$GH_REPO" ]]; then
            echo "::notice::PR #$PR_NUMBER head repo $HEAD_REPO != $GH_REPO — nothing to do."
            exit 0
          fi

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Gate conditions satisfied for PR #$PR_NUMBER."

      - name: Check runs once
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${HEAD_SHA:-}" ]]; then
            exit 0
          fi

          RAW=$(gh api "repos/$GH_REPO/commits/$HEAD_SHA/check-runs" --paginate 2>/dev/null || true)
          if [[ -z "$RAW" ]]; then
            echo "::notice::Could not read check runs for $HEAD_SHA — nothing to do."
            exit 0
          fi

          OWN_NAME="Merge when green"
          PENDING=$(jq --arg name "$OWN_NAME" '[.check_runs[] | select(.name != $name and .status != "completed")] | length' <<<"$RAW")
          NOT_GREEN=$(jq --arg name "$OWN_NAME" '[.check_runs[] | select(.name != $name and .status == "completed" and .conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length' <<<"$RAW")

          if [[ "$PENDING" -gt 0 || "$NOT_GREEN" -gt 0 ]]; then
            echo "::notice::Checks are pending or not green for $HEAD_SHA — nothing to do."
            exit 0
          fi

          echo "all_green=true" >> "$GITHUB_OUTPUT"
          echo "::notice::All checks green for $HEAD_SHA."

      - name: Squash merge
        if: steps.gate.outputs.ok == 'true' && steps.checks.outputs.all_green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail

          echo "::notice::Squash-merging PR #$PR_NUMBER at head commit $HEAD_SHA."
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --match-head-commit "$HEAD_SHA"
          echo "::notice::Merged #$PR_NUMBER via the ready-to-merge gate."
