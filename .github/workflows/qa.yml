---
name: QA

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test-framework:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages (dist + injected-copy repair)
        # `pnpm --filter pipeline-core build` alone leaves pnpm's injected copies
        # of workspace deps stale, so importing @maplespike/database/dist fails
        # (ERR_MODULE_NOT_FOUND). The shared script builds everything AND
        # repairs those copies (#859 class).
        run: bash scripts/build-packages.sh

      - name: Run QA framework tests
        run: pnpm --filter @maplespike/pipeline-core test
        working-directory: packages/pipeline-core

      - name: Run schema extractor smoke test
        run: |
          node -e "
            const { extractSchemas } = require('./dist/doc-generator/index.js');
            const path = require('path');
            const schemas = extractSchemas(path.join(__dirname, 'src'));
            console.log('Schemas extracted:', schemas.length);
            schemas.slice(0, 5).forEach(s => console.log(' -', s.name, '(' + s.fields.length + ' fields)'));
          "
        working-directory: packages/pipeline-core

  qa-module-validation:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages (dist + injected-copy repair)
        # Both QA jobs import built workspace packages through pnpm's injected
        # copies, which are materialized at install time and never recopied —
        # `--filter X build` alone leaves @maplespike/database/dist missing
        # (ERR_MODULE_NOT_FOUND, #859 class). The shared script builds
        # everything AND repairs those copies.
        run: bash scripts/build-packages.sh

      - name: Run QA validation on registered modules
        run: |
          node --input-type=module -e "
            import { getAllModules } from '@maplespike/pipeline-core';
            import { validateAgainstSchema, computeSuiteResult } from '@maplespike/pipeline-core/test-framework';
            const modules = getAllModules();
            console.log('## QA Module Validation Report');
            console.log('');
            console.log('| Module | Status | Detail |');
            console.log('|--------|--------|--------|');
            modules.filter(m => m.healthCheckUrl).forEach(mod => {
              const row = mod.healthCheckUrl
                ? '| ' + mod.name + ' | 🔍 checked | ' + mod.healthCheckUrl + ' |'
                : '| ' + mod.name + ' | ⚠️ no health URL | — |';
              console.log(row);
            });
            console.log('');
            console.log('Total modules in registry:', modules.length);
          "
        working-directory: packages/pipeline-core

  attestation-chain:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - run: pnpm install --frozen-lockfile

      - name: Build workspace packages (dist + injected-copy repair)
        # `pnpm --filter pipeline-core build` alone leaves pnpm's injected copies
        # of workspace deps stale, so importing @maplespike/database/dist fails
        # (ERR_MODULE_NOT_FOUND, #859 class — this job kept the old single-filter
        # build after the other two jobs were fixed). The shared script builds
        # everything AND repairs those copies.
        run: bash scripts/build-packages.sh

      - name: Verify workspace package resolution (injected-copy guard)
        # Fails if any consumer's @maplespike/* dep resolves into a stale pnpm
        # injected copy (no dist/) or to a missing file — the #859 class that
        # broke this lane once already. Runs in ~0.5s.
        run: bash scripts/check-workspace-resolution.sh

      - name: Verify attestation module exports
        run: |
          node --input-type=module -e "
            import { buildCitation, buildMerkleRoot, computeHash } from '@maplespike/pipeline-core';
            const testData = { name: 'test', value: 42 };
            const hash = await computeHash(JSON.stringify(testData));
            const citation = buildCitation({ data: testData, hash });
            const merkleResult = await buildMerkleRoot([hash]);
            const root = typeof merkleResult === 'string' ? merkleResult : merkleResult.root;
            console.log('✅ Attestation chain operational');
            console.log('Hash:', hash.substring(0, 16) + '...');
            console.log('Citation:', citation.id?.substring(0, 16) + '...' || 'generated');
            console.log('Merkle root:', root.substring(0, 16) + '...');
            process.exit(0);
          "
        working-directory: packages/pipeline-core

  api-and-mcp-validation:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - run: pnpm install --frozen-lockfile

      - name: Typecheck api-server
        run: pnpm --filter @maplespike/api-server typecheck

      - name: Test portal (api-base routing rule + built-dist smoke)
        run: pnpm --filter @maplespike/portal test

      - name: Typecheck quill-mcp
        run: pnpm --filter @maplespike/quill-mcp typecheck

      - name: Lint api-server
        run: pnpm --filter @maplespike/api-server lint

      - name: Lint quill-mcp
        run: pnpm --filter @maplespike/quill-mcp lint

      - name: Build api-server + quill-mcp
        run: |
          pnpm --filter @maplespike/api-server build
          pnpm --filter @maplespike/quill-mcp build

      - name: Run api-server unit tests
        run: pnpm --filter @maplespike/api-server test:unit

      - name: Run quill-mcp unit tests
        run: pnpm --filter @maplespike/quill-mcp test:unit
