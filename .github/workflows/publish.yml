# ─────────────────────────────────────────────────────────────────
# MapleSpike Publish — publishes SDK packages to npm + PyPI
# Triggered by push to prod branch
# Uses npm Trusted Publishing (OIDC) — no token needed
# ─────────────────────────────────────────────────────────────────
name: Publish
on:
  push:
    branches: [prod]
permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  publish-npm:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-packages.sh

      # npm publish via OIDC Trusted Publishing
      - name: Version and Publish
        run: |
          pnpm changeset version
          pnpm --filter @reverb256/mcp-server publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    runs-on: [self-hosted, nixos]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist
