# ─────────────────────────────────────────────────────────────────
# Quill Publish — publishes SDK packages to npm + PyPI
# Triggered by:
#   - npm publish on push to prod branch
#   - PyPI publish on version tags (v*)
# Uses npm Trusted Publishing (OIDC) — no token needed
# ─────────────────────────────────────────────────────────────────
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  packages: write

jobs:
  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/build-packages.sh

      # npm publish via OIDC Trusted Publishing
      - name: Version and Publish
        run: |
          pnpm changeset version
          pnpm --filter @maplespike/quill-mcp publish --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, nixos]
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution packages
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
