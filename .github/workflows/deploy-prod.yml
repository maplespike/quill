# Prod deploy runs on the self-hosted NixOS runner — node/pnpm/kubectl/nix/podman
# are system packages per docs/GITHUB-ACTIONS-NIX.md.
#
# CANONICAL DEPLOY PATH (2026-08-10): `nix build .#saas-manifests` generates
# the single `manifests.yaml` from flake.nix + nix/saas-manifests.nix (the
# source of truth), and `kubectl apply -f` syncs the cluster to it. Image tags
# are pinned per service in flake.nix (apiTag/mcpTag/portalTag) — NOT `latest`
# (the cluster's `deny-latest-tag-deployments` admission policy rejects it).
# Image pushing happens operator-side via `nix run .#push-images` BEFORE this
# workflow's apply step (the manifests reference pinned registry tags that must
# exist in nexus:5000).
#
# Old workflow (pre-2026-08-10) referenced k8s/overlays/prod/, a quill-prod
# namespace, and a postgres StatefulSet that never existed on the live single-
# node k3s cluster — removed. The live cluster is: single node `nexus`,
# namespace `maplespike` (+ `cloudflared`), services pinned to 10.43.100.10/11/12.
name: Deploy to Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        continue-on-error: true

  validate-manifests:
    name: Validate Nix manifests render
    needs: ci
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate manifests from Nix (canonical path)
        run: |
          nix build .#saas-manifests -L
          test -s result/manifests.yaml
          grep -q 'name: maplespike' result/manifests.yaml
          grep -q 'clusterIP: 10.43.100.10' result/manifests.yaml
          echo "✓ saas-manifests renders (14 resources)"

  deploy-prod:
    name: Deploy to maplespike (single-node k3s)
    needs: [ci, validate-manifests]
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Apply canonical manifests
        run: |
          nix build .#saas-manifests -L
          kubectl apply -f result/manifests.yaml

      - name: Wait for rollout
        run: |
          # No `|| true` here — a failed rollout must fail the deploy job.
          kubectl rollout status deployment/quill-api -n maplespike --timeout=3m
          kubectl rollout status deployment/quill-mcp -n maplespike --timeout=3m
          kubectl rollout status deployment/quill-portal -n maplespike --timeout=3m
          kubectl rollout status deployment/cloudflared -n cloudflared --timeout=3m

      - name: Smoke test
        run: |
          sleep 15
          # API health is the hard gate — a broken deploy must fail CI.
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors https://api.maplespike.ca/v1/health
          echo "✓ API healthy"
          # MCP/portal report as warnings (portal may be in rollout transition).
          curl -sfI https://mcp.maplespike.ca/health && echo "✓ MCP up" || echo "⚠ MCP unavailable"
          curl -sfI https://quill.maplespike.ca/ && echo "✓ Portal up" || echo "⚠ Portal unavailable"
