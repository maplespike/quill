# =============================================================================
# MapleSpike — Deploy Prod
# Triggers on push to prod, builds images and deploys to maplespike-prod
# =============================================================================
name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/**'
      - '.github/workflows/deploy-prod.yml'

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-prod

jobs:
  test:
    name: Test
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Set working directory for composite TypeScript builds
      - run: echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV

      - run: pnpm run clean
      - run: bash scripts/build-packages.sh
      - run: node scripts/build-docs.mjs
      - run: cd packages/pipeline-core && pnpm rebuild better-sqlite3

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: test
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs.mjs

      # Podman-native registry login (self-hosted NixOS runner has no Docker daemon)
      - name: Login to GHCR
        run: |
          echo "${{ env.REGISTRY_PASS }}" | \
            podman login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin

      - name: Build & push API (prod)
        run: |
          podman build -f Dockerfile.api -t ghcr.io/reverb256/maplespike/maplespike-api:latest .
          podman tag ghcr.io/reverb256/maplespike/maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:stable
          podman tag ghcr.io/reverb256/maplespike/maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-api:latest
          podman push ghcr.io/reverb256/maplespike/maplespike-api:stable
          podman push ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}

      - name: Build & push MCP (prod)
        run: |
          podman build -f Dockerfile.mcp -t ghcr.io/reverb256/maplespike/maplespike-mcp:latest .
          podman tag ghcr.io/reverb256/maplespike/maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:stable
          podman tag ghcr.io/reverb256/maplespike/maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:latest
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:stable
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}

      - name: Build & push Portal (prod)
        run: |
          podman build -f Dockerfile.portal -t ghcr.io/reverb256/maplespike/maplespike-portal:latest .
          podman tag ghcr.io/reverb256/maplespike/maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:stable
          podman tag ghcr.io/reverb256/maplespike/maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:latest
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:stable
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}

  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply K8s manifests from repo
        run: |
          kubectl apply -f k8s/prod/ --prune --all --prune-allowlist=apps/v1/Deployment --prune-allowlist=/v1/Service --prune-allowlist=/v1/ConfigMap --prune-allowlist=/v1/Secret --validate=false
      - name: Rollout prod deployments
        run: |
          kubectl rollout restart deployment -n $NAMESPACE maplespike-api 2>&1 || echo "No api deployment to restart"
          kubectl rollout restart deployment -n $NAMESPACE maplespike-mcp 2>&1 || echo "No mcp deployment to restart"
          kubectl rollout restart deployment -n $NAMESPACE maplespike-portal 2>&1 || echo "No portal deployment to restart"
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n $NAMESPACE maplespike-api --timeout=5m 2>&1 || echo "Wait skipped (no api deployment)"
          kubectl rollout status deployment -n $NAMESPACE maplespike-mcp --timeout=5m 2>&1 || echo "Wait skipped (no mcp deployment)"
          kubectl rollout status deployment -n $NAMESPACE maplespike-portal --timeout=5m 2>&1 || echo "Wait skipped (no portal deployment)"