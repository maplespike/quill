# Prod deploy runs on the self-hosted NixOS runner — node/pnpm/kubectl/podman
# are system packages per docs/GITHUB-ACTIONS-NIX.md. Image paths use the
# `nexus:5000/quill-<svc>` namespace per ADR 0007 (docs/GHCR-CLEANUP.md).
name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        continue-on-error: true

  build-push-images:
    name: Build & Push Docker Images
    needs: ci
    runs-on: [self-hosted, nixos]
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build prod Portal image (push: false — operator-side nix run .#push-images)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: portal
          push: false
          tags: |
            nexus:5000/quill-portal:stable
            nexus:5000/quill-portal:${{ github.sha }}

      - name: Build prod API image (push: false)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: api-server
          push: false
          tags: |
            nexus:5000/quill-api:stable
            nexus:5000/quill-api:${{ github.sha }}

      - name: Build prod MCP image (push: false)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: quill-mcp
          push: false
          tags: |
            nexus:5000/quill-mcp:stable
            nexus:5000/quill-mcp:${{ github.sha }}

  deploy-prod:
    name: Deploy to quill-prod
    needs: build-push-images
    runs-on: [self-hosted, nixos]
    if: github.ref == 'refs/heads/prod'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > ~/.kube/config

      - name: Create PostgreSQL deployment
        run: |
          kubectl apply -f k8s/overlays/prod/postgres.yaml -n quill-prod

      - name: Apply prod overlay
        run: |
          kubectl apply -k k8s/overlays/prod/

      - name: Wait for PostgreSQL
        run: |
          kubectl rollout status statefulset/postgres -n quill-prod --timeout=5m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/quill-api -n quill-prod --timeout=5m
          kubectl rollout status deployment/quill-portal -n quill-prod --timeout=5m

      - name: Smoke test
        run: |
          # Wait a bit for services to be ready
          sleep 30
          # Use a dedicated curl image (the portal bundle has no /usr/bin/curl).
          # Pin a specific tag to avoid silent tag drift.
          # `--namespace=quill-prod` so the smoke pod lands in the prod namespace
          # and matches the same NetworkPolicy as the API it probes.
          kubectl run smoke-test --image=curlimages/curl:8.10.1 \
            --namespace=quill-prod --rm -i --restart=Never -- \
            curl -f http://quill-api.quill-prod.svc.cluster.local:8082/v1/health