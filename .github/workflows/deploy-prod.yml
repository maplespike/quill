# =============================================================================
# MapleSpike — Deploy Production
# Builds Docker images + deploys to K3s prod namespace on merge to prod
# =============================================================================
name: Deploy Production

on:
  push:
    branches: [prod]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - 'k8s/prod/**'
      - '.github/workflows/deploy-prod.yml'

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ── Step 1: Test ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: pnpm -r build

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core

      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server

      - name: Test engine
        run: pnpm test
        working-directory: packages/engine

      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

      - name: Build-check legal-core
        run: pnpm build
        working-directory: packages/legal-core

      - name: Build-check legislation
        run: pnpm build
        working-directory: packages/legislation

      - name: Build-check api-server
        run: pnpm build
        working-directory: packages/api-server

  # ── Step 2: Build + push images ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:latest
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Build & push MCP (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-mcp:latest
            ghcr.io/reverb256/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-prod
          cache-to: type=gha,mode=max,scope=mcp-prod

      - name: Build & push Portal (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:latest
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-prod
          cache-to: type=gha,mode=max,scope=portal-prod

      - name: Build & push Ingest (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.ingest
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-ingest:latest
            ghcr.io/reverb256/maplespike-ingest:${{ github.sha }}
          cache-from: type=gha,scope=ingest-prod
          cache-to: type=gha,mode=max,scope=ingest-prod

      - name: Build & push Engine (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.engine
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-engine:latest
            ghcr.io/reverb256/maplespike-engine:${{ github.sha }}
          cache-from: type=gha,scope=engine-prod
          cache-to: type=gha,mode=max,scope=engine-prod

  # ── Step 3: Deploy to K3s prod namespace ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to K3s (prod)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NEXUS_HOST }}
          port: ${{ secrets.NEXUS_PORT || '22' }}
          username: ${{ secrets.NEXUS_USER }}
          key: ${{ secrets.NEXUS_SSH_KEY }}
          script: |
            set -e

            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin 2>/dev/null || true

            cd /data/projects/own/maplespike

            # Update to latest code
            git fetch origin prod
            git checkout prod
            git pull origin prod

            # Pull prod images from GHCR, retag for local registry
            for img in api mcp portal ingest engine; do
              echo "=== Pulling maplespike-$img:latest ==="
              docker pull ghcr.io/reverb256/maplespike-$img:latest 2>/dev/null || echo "Warning: pull failed for $img"
              docker tag ghcr.io/reverb256/maplespike-$img:latest nexus:5000/maplespike-$img:latest 2>/dev/null || true
              docker push nexus:5000/maplespike-$img:latest 2>/dev/null || \
                podman push --tls-verify=false nexus:5000/maplespike-$img:latest 2>/dev/null || true
            done

            # Ensure prod namespace exists
            kubectl create namespace maplespike 2>/dev/null || true

            # Apply all prod manifests
            for f in k8s/prod/*.yaml; do
              kubectl apply -f "$f" --wait=true 2>&1 || true
            done

            # Restart deployments to pick up new images
            for deploy in maplespike-api maplespike-mcp maplespike-portal; do
              kubectl rollout restart deployment/$deploy -n maplespike --timeout=120s 2>/dev/null || true
            done

            # Wait for readiness
            kubectl rollout status deployment/maplespike-api -n maplespike --timeout=120s || true
            kubectl rollout status deployment/maplespike-mcp -n maplespike --timeout=120s || true
            kubectl rollout status deployment/maplespike-portal -n maplespike --timeout=60s || true

            # Report
            echo "=== Production Deployment Complete ==="
            kubectl get pods -n maplespike
