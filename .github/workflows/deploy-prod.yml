# =============================================================================
# MapleSpike — Deploy Prod
# Triggers on push to prod, builds images and deploys to maplespike-prod
# =============================================================================
name: Deploy Prod

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
    - 'packages/**'
    - 'flake.nix'
    - 'flake.lock'
    - 'k8s/**'
    - '.github/workflows/deploy-prod.yml'

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-prod

jobs:
  test:
    name: Test
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile

      # Set working directory for composite TypeScript builds
      - run: echo "WORKSPACE=$(pwd)" >> $GITHUB_ENV

      - run: pnpm run clean
      - run: bash scripts/build-packages.sh
      - run: node scripts/build-docs.mjs
      - run: cd packages/pipeline-core && pnpm rebuild better-sqlite3

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: test
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs.mjs

      # Podman-native registry login (self-hosted NixOS runner has no Docker daemon)
      - name: Login to GHCR
        run: |
          echo "${{ env.REGISTRY_PASS }}" | \
            podman login ${{ env.REGISTRY }} -u ${{ env.REGISTRY_USER }} --password-stdin

      - name: Build & push API (prod) — Nix
        run: |
          nix build .#maplespike-api-image -L
          podman load < result
          podman tag maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:latest
          podman tag maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:stable
          podman tag maplespike-api:latest ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-api:latest
          podman push ghcr.io/reverb256/maplespike/maplespike-api:stable
          podman push ghcr.io/reverb256/maplespike/maplespike-api:${{ github.sha }}

      - name: Build & push MCP (prod) — Nix
        run: |
          nix build .#maplespike-mcp-image -L
          podman load < result
          podman tag maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:latest
          podman tag maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:stable
          podman tag maplespike-mcp:latest ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:latest
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:stable
          podman push ghcr.io/reverb256/maplespike/maplespike-mcp:${{ github.sha }}

      - name: Build & push Portal (prod) — Nix
        run: |
          nix build .#maplespike-portal-image -L
          podman load < result
          podman tag maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:latest
          podman tag maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:stable
          podman tag maplespike-portal:latest ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:latest
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:stable
          podman push ghcr.io/reverb256/maplespike/maplespike-portal:${{ github.sha }}

  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply K8s manifests from repo
        run: |
          bash ${{ env.WORKSPACE }}/scripts/auto-rollback.sh deploy \
            "${{ env.NAMESPACE }}" \
            "maplespike-api" \
            "http://maplespike-api.${{ env.NAMESPACE }}.svc.cluster.local/v1/health" \
            "k8s/prod/"
          bash ${{ env.WORKSPACE }}/scripts/auto-rollback.sh deploy \
            "${{ env.NAMESPACE }}" \
            "maplespike-mcp" \
            "http://maplespike-mcp.${{ env.NAMESPACE }}.svc.cluster.local/v1/health" \
            "k8s/prod/"
          bash ${{ env.WORKSPACE }}/scripts/auto-rollback.sh deploy \
            "${{ env.NAMESPACE }}" \
            "maplespike-portal" \
            "http://maplespike-portal.${{ env.NAMESPACE }}.svc.cluster.local/health" \
            "k8s/prod/"
      - name: Verify cluster health
        run: |
          bash ${{ env.WORKSPACE }}/scripts/health-verification.sh "${{ env.NAMESPACE }}"
      - name: Escalate on deployment failure
        if: failure()
        run: |
          bash ${{ env.WORKSPACE }}/scripts/escalate-incident.sh \
            deployment_failure \
            "{\"namespace\": \"${{ env.NAMESPACE }}\", \"commit\": \"${{ github.sha }}\", \"workflow\": \"deploy-prod\"}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}