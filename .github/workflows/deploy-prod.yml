# =============================================================================
# MapleSpike — Deploy to Production
#
# WHAT CHANGED (2026-10-02) AND WHY
#
# This workflow previously called `nix build .#saas-manifests` and applied the
# result with kubectl. That could not run: the self-hosted runners are Omarchy
# hosts with docker, and nix is not installed on them. Its last eight runs all
# failed before a single job started, which had a separate cause — the workflow
# file at those commits was not valid YAML (a `run: |` block whose first line
# was indented further than the body), so GitHub rejected the workflow before
# it could schedule anything. Both problems are gone; the nix one is gone
# because the path it belonged to is no longer used.
#
# ArgoCD is the deploy path. It renders `charts/quill` with
# `charts/quill/values-prod.yaml` from `main`, Synced and Healthy, with selfHeal
# and prune enabled. So this workflow does not apply manifests. It does the
# work ArgoCD needs before it can roll a new build:
#
#   1. build api, mcp, portal, and ingest, scan each image, and push
#      registry.registry.svc.cluster.local:5000/quill/<svc>:<git sha>
#      (scripts/pin-images.sh). quill-search has no Dockerfile here; the
#      script re-tags the digest already in nexus containerd and pushes that.
#      The push is plain HTTP to the ClusterIP mirrored in
#      /etc/rancher/k3s/registries.yaml. Nodes do not copy images to each other.
#   2. HEAD every pushed digest. One miss stops the job. values-prod.yaml
#      is not edited, so main keeps the live docker.io / Never refs.
#   3. only then write registry, repository, IfNotPresent, and the registry
#      digest for every service in one edit (apply-image-pins.mjs --migrate).
#      The script HEADs again and writes nothing if any digest is missing.
#   4. delete older manifests, keeping the pinned digest and the 5 newest
#      tags. Manifest DELETE does not free blobs; garbage-collect is
#      server-side. Then commit and push, which is what ArgoCD watches.
#
# `kubectl set image` is deliberately absent: ArgoCD owns those objects, so a
# direct write is drift it will revert, not a deploy.
#
# Runner labels: the `nixos` label is historical — it describes how the runner
# was registered, not what is installed. The hosts run Omarchy with node, pnpm
# and docker as system packages. The label is load-bearing across 10+ workflows,
# so renaming it is a runner re-registration rather than an edit here.
# =============================================================================
name: Deploy to Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      max_load1:
        description: "Refuse to build when the runner's 1-minute load average is at or above this"
        required: false
        default: "12"
      min_mem_available_gib:
        description: "Refuse to build when the runner's MemAvailable (GiB) is below this"
        required: false
        default: "12"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

env:
  NAMESPACE: maplespike

jobs:
  ci:
    name: Build & Test
    runs-on: [self-hosted, nixos]
    # A hung test must fail the deploy, not hold a host runner for the 6 h
    # default (2026-10-26: api-server api.test.ts idled 24 min at 0% CPU).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm -r typecheck || true

      # `pnpm test` includes test:chart-probes, which since #1184 fails when
      # helm is missing instead of skipping. helm is not on the host runner
      # service PATH (deploy-prod run 40328070737).
      - name: Install helm
        uses: azure/setup-helm@v5

      - name: Test
        # The deploy gate must not depend on third-party uptime. Several suites
        # fetch live government endpoints and fail on an upstream 500/503
        # (2026-10-21: donneesquebec.ca 503, opendata.gov.nl.ca 500, plus the
        # corporate-filings/gtfs-transit/sedar-plus integrations). Those suites
        # honour SKIP_NETWORK_TESTS=1; PR CI still runs them for real, so
        # availability problems surface there instead of blocking a release.
        env:
          SKIP_NETWORK_TESTS: '1'
        run: pnpm test

  build-and-pin:
    name: Build images, scan, and record pins
    needs: ci
    # The push runs on nexus: docker, k3s, the registries.yaml mirror, and
    # the quill-search image (no Dockerfile in this repo) are there.
    # scripts/pin-images.sh refuses any other hostname. Unpinned, this job
    # lands on whichever runner is free and dies — 2026-10-21 run
    # 39630307172 claimed sentry and produced an empty pin block.
    runs-on: [self-hosted, nixos, nexus]
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      pin_sha: ${{ steps.commit.outputs.pin_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the registry tag is the git sha, and prune orders
          # older tags by commit time. A shallow clone makes both ambiguous.
          fetch-depth: 0

      - name: Confirm the working tree is clean
        # pin-images.sh refuses a dirty tree. The registry tag is the git sha,
        # so a dirty checkout must not be tagged as that commit.
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::working tree is dirty; refusing to stamp a -dirty tag onto a production image"
            git status --porcelain
            exit 1
          fi

      - name: Preflight — nexus docker/containerd store
        # Fail fast when the host docker build cache is corrupt (missing
        # overlayfs snapshots / blobs). deploy-prod run 40624285281 (2026-10-27)
        # spent ~7 min in Build & Test, then died in pin-images.sh on
        # `lstat .../overlayfs/snapshots/10294: no such file` left by a nexus
        # OOM. Dependabot updater runs hit the same class of failure on a
        # missing blob. Probe BEFORE pnpm install / pin-images so a broken
        # store does not burn a full CI cycle. Do NOT prune from CI — that is
        # Infra · Platform Ops territory on the host.
        run: |
          set -euo pipefail
          if ! docker buildx du >/dev/null 2>&1; then
            echo "::error::nexus docker/containerd store is broken (docker buildx du failed). Ask Infra · Platform Ops to repair it. Do not prune from CI."
            docker buildx du || true
            exit 1
          fi
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf 'FROM scratch\n' >"$tmp/Dockerfile"
          if ! docker build --quiet -t quill-deploy-preflight:ok "$tmp" >/dev/null; then
            echo "::error::nexus docker/containerd store is broken (tiny docker build from scratch failed). Ask Infra · Platform Ops to repair it. Do not prune from CI."
            exit 1
          fi
          docker rmi quill-deploy-preflight:ok >/dev/null 2>&1 || true
          echo "docker store preflight ok"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the workspace
        # pin-images.sh refuses to build the portal image without
        # packages/portal/dist: Dockerfile.portal COPYs the built Astro output
        # rather than building it inside the image. The ci job builds it in its
        # own workspace, which this job does not inherit (run 39633262674).
        #
        # Use the repo's own build: turbo orders it by dependency graph, so
        # @maplespike/database, quill-mcp's registry and the portal's agents.json
        # all exist before the portal's gen:all runs. Narrower filters failed:
        # portal-only (run 39660155111, missing MCP registry) and
        # mcp-then-portal (run 39663210447, missing @maplespike/database dist).
        run: pnpm build

      - name: Restore generated sources so the image tag stays commit-only
        # `pnpm build` rewrites tracked portal artifacts. pin-images.sh refuses
        # a dirty tree, because the registry tag is the git sha. The built
        # dist/ is what the image copies; these are regenerated sources, so
        # restore them and assert a clean tree. The 2026-10-21 deploy shipped
        # a -dirty tag when this restore was missing.
        run: |
          git status --porcelain
          git checkout -- .
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::tree still dirty after restoring generated files; refusing a -dirty tag"
            git status --porcelain
            exit 1
          fi

      - name: Refuse when the build host is already overloaded
        # Guards against k3s/etcd starvation when the deploy runs alongside other
        # heavy jobs on the same host. Thresholds are overridable on dispatch;
        # push-triggered runs use the defaults (12 / 12 GiB).
        env:
          MAX_LOAD1: ${{ github.event.inputs.max_load1 || '12' }}
          MIN_MEM_GIB: ${{ github.event.inputs.min_mem_available_gib || '12' }}
        run: |
          set -euo pipefail
          load=$(cut -d' ' -f1 /proc/loadavg)
          avail_gi=$(awk '/MemAvailable:/ {printf "%.1f", $2/1024/1024}' /proc/meminfo)
          echo "host=$(hostname -s) load1=$load MemAvailable=${avail_gi}Gi (max_load1=$MAX_LOAD1 min_mem=${MIN_MEM_GIB}Gi)"
          awk -v l1="$load" -v avail="$avail_gi" -v maxl="$MAX_LOAD1" -v minm="$MIN_MEM_GIB" 'BEGIN {
            if (l1+0 >= maxl+0) { printf "::error::load1=%.2f >= %s; re-dispatch deploy-prod when the host is cooler (or raise max_load1)\n", l1, maxl; exit 1 }
            if (avail+0 < minm+0) { printf "::error::MemAvailable=%.1fGi < %sGi; re-dispatch when headroom returns (or lower min_mem_available_gib)\n", avail, minm; exit 1 }
          }'

      - name: Build, scan, and import images
        # Writes a per-image SBOM next to the images and refuses an empty one.
        # Needs k3s (containerd) and syft on the host; both are required, and a
        # missing one fails the deploy rather than shipping an un-enumerated
        # image.
        run: |
          # pipefail is load-bearing. Without it `| tee` hides pin-images.sh's
          # exit status, the job proceeds with a truncated log, and the failure
          # surfaces two steps later as "no pins found in input" — which reads
          # like a parser bug instead of a refused build (run 39630307172).
          set -o pipefail
          bash scripts/pin-images.sh 2>&1 | tee pin-images.log
          sed -n '/^Pin block for charts\/quill\/values-prod.yaml/,/^Next:/p' pin-images.log > pin-block.txt
          if [[ ! -s pin-block.txt ]]; then
            echo "::error::pin-images.sh produced no pin block — refusing to continue (see pin-images.log)"
            exit 1
          fi

      - name: Verify every pushed digest is in the registry
        # HEAD each digest in the pin block. This does not edit values-prod.
        # One miss refuses the cutover: the next step never runs, so the
        # live docker.io / Never refs stay on main.
        run: node scripts/gates/check-node-images.mjs --pin-block pin-block.txt --check

      - name: Write the registry pin into values-prod.yaml
        # Same commit as the digest switch. --migrate HEADs again and writes
        # registry, repository, IfNotPresent, digest, and tag for every
        # service, or writes nothing.
        run: node scripts/apply-image-pins.mjs --migrate --values charts/quill/values-prod.yaml < pin-block.txt

      - name: Verify the pins
        run: node scripts/gates/check-image-pins.mjs --values charts/quill/values-prod.yaml

      - name: Prune old registry tags
        # Keep the pinned digest and the 5 newest tags per service. DELETE
        # unlinks the manifest only. A server-side registry garbage-collect
        # has to run in the registry pod before the 50Gi volume shrinks.
        run: node scripts/gates/check-node-images.mjs --values charts/quill/values-prod.yaml --prune --keep 5

      - name: Commit and push the pins
        id: commit
        run: |
          if git diff --quiet -- charts/quill/values-prod.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            # Nothing pushed: ArgoCD tracks main, so wait for main's head.
            git fetch -q origin main
            echo "pin_sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            echo "pins already current; nothing to commit"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/quill/values-prod.yaml
          # The pins are the deploy record, so the message names what shipped.
          git commit -m "chore(deploy): pin images built from ${GITHUB_SHA::8}"
          # main may have moved while the images built (a merge during the
          # run). A plain push was then rejected as non-fast-forward and the
          # whole deploy failed after a 17-minute build. Rebase the single
          # pin commit onto the current main and retry. The pins only touch
          # values-prod.yaml, so a conflict means another deploy pinned in
          # between; fail loudly rather than guess.
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then pushed=true; break; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            git fetch -q origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "::error::pin commit conflicts with origin/main (values-prod.yaml changed upstream)"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          if [ "$pushed" != true ]; then
            echo "::error::could not push the pin commit after 5 attempts"
            exit 1
          fi
          echo "pin_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Wait for ArgoCD rollout and smoke test
    needs: [ci, build-and-pin]
    runs-on: [self-hosted, nixos]
    steps:
      # Check out the pin commit. Without a checkout this job read
      # values-prod.yaml and scripts/ from whatever an earlier job left in the
      # runner workspace (the pre-pin dispatch SHA), so "Confirm the running
      # images are the pinned ones" compared the freshly rolled-out digests to
      # the previous pins and failed a good deploy (run 40352443979).
      - name: Checkout the pin commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-and-pin.outputs.pin_sha }}

      - name: Configure kubectl
        # KUBECONFIG_PROD has been pasted both raw and base64-encoded over its
        # lifetime; `| base64 -d` on a raw kubeconfig fails with "invalid input"
        # and every later step in this job silently skips (run 39665582123, so
        # the rollout and smoke gate never ran). Accept either form.
        #
        # Self-hosted runners on nexus and forge share the host user's HOME.
        # `mv` onto ~/.kube/config (added in #1135) replaced the operator
        # kubeconfig: nexus at 23:56 CT on 2026-10-25, forge on 2026-10-21.
        # /tmp/kubeconfig is shared across jobs on that host too. Write only
        # under RUNNER_TEMP, mode 600, and export KUBECONFIG. Never read or
        # write ~/.kube.
        #
        # Do not fall back to /etc/rancher/k3s/k3s.yaml. This job is not pinned
        # to nexus, that file is the node admin kubeconfig (forge's installer
        # writes it mode 644), and a fallback would hide a stale secret on the
        # hosts where the file is readable. A rotated cluster CA must fail here.
        env:
          KUBECONFIG_PROD: ${{ secrets.KUBECONFIG_PROD }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" ]]; then
            echo "::error::RUNNER_TEMP is missing. Refusing to write a kubeconfig onto the host."
            exit 1
          fi
          # Exclusive create. A fixed path can be a symlink to ~/.kube/config;
          # mktemp refuses that and still stays inside the per-job temp dir.
          KCFG="$(mktemp "${RUNNER_TEMP}/kubeconfig.XXXXXX")"
          chmod 600 "$KCFG"
          case "$KCFG" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::kubeconfig path escaped RUNNER_TEMP. Refusing to continue."
              rm -f "$KCFG"
              exit 1
              ;;
          esac
          umask 077
          is_kubeconfig() {
            [[ -s "$1" ]] || return 1
            grep -a -q 'apiVersion:' "$1" || return 1
            grep -a -q 'clusters:' "$1" || return 1
            grep -a -q 'server:' "$1" || return 1
          }
          if printf '%s' "$KUBECONFIG_PROD" | base64 -d > "$KCFG" 2>/dev/null && is_kubeconfig "$KCFG"; then
            echo "kubeconfig: decoded from base64"
          else
            printf '%s' "$KUBECONFIG_PROD" > "$KCFG"
            echo "kubeconfig: used raw value"
          fi
          chmod 600 "$KCFG"
          unset KUBECONFIG_PROD
          if [[ ! -s "$KCFG" ]]; then
            echo "::error::KUBECONFIG_PROD is empty"
            rm -f "$KCFG"
            exit 1
          fi
          if ! is_kubeconfig "$KCFG"; then
            echo "::error::KUBECONFIG_PROD is not a kubeconfig. Refusing to continue."
            rm -f "$KCFG"
            exit 1
          fi
          # Same-step export. GITHUB_ENV applies only to later steps, and only
          # after this probe accepts the file.
          export KUBECONFIG="$KCFG"
          probe_err="$RUNNER_TEMP/kubectl-probe.err"
          rm -f "$probe_err"
          # `kubectl version --client` never contacts the API server, so it
          # cannot see a stale certificate-authority-data. `get ns` checks TLS
          # and auth now, instead of failing inside the rollout wait.
          if ! kubectl --request-timeout=20s get ns -o name >"$RUNNER_TEMP/kubectl-probe.out" 2>"$probe_err"; then
            if grep -Eqi 'x509|unknown authority|bad certificate|failed to verify certificate' "$probe_err"; then
              echo "::error::KUBECONFIG_PROD cluster CA is stale. kubectl rejected the API server certificate (x509). The secret still has the June cluster CA; the live k3s CA dates from 2026-09-12. Update the KUBECONFIG_PROD repository secret. This step did not read ~/.kube or /etc/rancher/k3s/k3s.yaml."
            else
              echo "::error::kubectl cannot reach the cluster with KUBECONFIG_PROD, so the rollout was not started. This step did not read ~/.kube or /etc/rancher/k3s/k3s.yaml."
            fi
            # Server and x509 text only. Drop credential material and long lines.
            grep -Ei 'x509|unknown authority|bad certificate|Unable to connect|tls:|Unauthorized|Forbidden|timeout|dial tcp|connection refused|The connection to the server' "$probe_err" \
              | grep -Eiv 'BEGIN |PRIVATE|client-key-data|client-certificate-data|certificate-authority-data|Bearer |token:' \
              | awk 'length($0) <= 400' \
              | grep -m 8 . || true
            rm -f "$KCFG" "$probe_err" "$RUNNER_TEMP/kubectl-probe.out"
            exit 1
          fi
          rm -f "$probe_err" "$RUNNER_TEMP/kubectl-probe.out"
          echo "KUBECONFIG=$KCFG" >> "$GITHUB_ENV"
          echo "kubeconfig: API server accepted the credentials"

      - name: Wait for ArgoCD to sync
        env:
          GH_TOKEN: ${{ github.token }}
        # ArgoCD polls; the commit above is not the deploy. Wait for the app to
        # report Synced at the commit we pushed before declaring anything rolled
        # out, otherwise the rollout check below passes against the old images.
        run: |
          case "${KUBECONFIG:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::KUBECONFIG is not under RUNNER_TEMP. Refusing to use the host kubeconfig."
              exit 1
              ;;
          esac
          # Sync revision is the pin commit on main, not github.sha of this
          # prod-branch run. "Synced" alone is not enough: ArgoCD keeps
          # reporting Synced at the previous revision until it polls (up to
          # 3 min), and run 40331119588 checked the rollout against the old
          # revision. Request a refresh and wait for Synced AT the pin commit.
          PIN_SHA="${{ needs.build-and-pin.outputs.pin_sha }}"
          if [[ -z "$PIN_SHA" ]]; then
            echo "::error::build-and-pin did not report pin_sha"
            exit 1
          fi
          kubectl annotate application quill -n argocd argocd.argoproj.io/refresh=normal --overwrite >/dev/null || true
          for i in $(seq 1 40); do
            REV=$(kubectl get application quill -n argocd -o jsonpath='{.status.sync.revision}' 2>/dev/null || echo none)
            SYNC=$(kubectl get application quill -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || echo unknown)
            echo "attempt $i: rev=${REV:0:8} want=${PIN_SHA:0:8} sync=$SYNC"
            # main may move on while we wait; a later revision that contains
            # the pin commit is fine.
            OK=false
            if [[ "$REV" == "$PIN_SHA" ]]; then
              OK=true
            elif [[ "$REV" =~ ^[0-9a-f]{40}$ ]]; then
              CMP=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/compare/${PIN_SHA}...${REV}" \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).status))' 2>/dev/null || echo unknown)
              [[ "$CMP" == "ahead" ]] && OK=true
            fi
            if [[ "$OK" == true && "$SYNC" == "Synced" ]]; then
              echo "ArgoCD synced at ${REV:0:8}"
              exit 0
            fi
            sleep 15
          done
          echo "::error::ArgoCD did not sync to ${PIN_SHA:0:8} within 10 minutes"
          exit 1

      - name: Wait for rollout
        run: |
          case "${KUBECONFIG:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::KUBECONFIG is not under RUNNER_TEMP. Refusing to use the host kubeconfig."
              exit 1
              ;;
          esac
          # No `|| true` here — a failed rollout must fail the deploy job.
          kubectl rollout status deployment/quill-api -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/quill-mcp -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/quill-portal -n "$NAMESPACE" --timeout=5m
          kubectl rollout status deployment/cloudflared -n cloudflared --timeout=5m

      - name: Confirm the running images are the pinned ones
        # Guards against reporting a successful deploy while the cluster runs
        # something other than what was just built.
        run: |
          case "${KUBECONFIG:-}" in
            "$RUNNER_TEMP"/*) ;;
            *)
              echo "::error::KUBECONFIG is not under RUNNER_TEMP. Refusing to use the host kubeconfig."
              exit 1
              ;;
          esac
          node scripts/gates/check-image-pins.mjs --values charts/quill/values-prod.yaml
          fail=0
          for svc in api mcp portal; do
            pinned=$(node -e "
              const v=require('fs').readFileSync('charts/quill/values-prod.yaml','utf8');
              const m=v.match(new RegExp('^  ${svc}:\\\\n    digest: \"([^\"]+)\"','m'));
              process.stdout.write(m?m[1]:'');
            ")
            live=$(kubectl get deployment "quill-$svc" -n "$NAMESPACE" \
              -o jsonpath="{.spec.template.spec.containers[0].image}")
            if [[ "$live" == *"$pinned" ]]; then
              echo "ok   quill-$svc -> ${pinned:0:19}..."
            else
              echo "::error::quill-$svc runs $live but values-prod pins $pinned"
              fail=1
            fi
          done
          exit $fail

      - name: Smoke test
        run: |
          sleep 15
          # API health is the hard gate — a broken deploy must fail CI.
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors https://api.maplespike.ca/v1/health
          echo "✓ API healthy"
          # MCP/portal report as warnings (portal may be in rollout transition).
          curl -sfI https://mcp.maplespike.ca/health && echo "✓ MCP up" || echo "⚠ MCP unavailable"
          curl -sfI https://quill.maplespike.ca/ && echo "✓ Portal up" || echo "⚠ Portal unavailable"

      - name: Check out main (with the pin commit) for the verifier
        # This job has no checkout of its own. Take main, not github.sha, so
        # values-prod.yaml holds the pins build-and-pin just pushed.
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify production (scripts/verify-prod.sh)
        # Final gate, read-only: ArgoCD app Synced+Healthy, every running pod
        # (and ingest CronJob) on the digest pinned in values-prod.yaml, public
        # health endpoints 200, and unauthenticated /mcp and /sse 401. Exits
        # non-zero with a FAIL line per mismatch.
        run: bash scripts/verify-prod.sh
