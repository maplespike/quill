# =============================================================================
# MapleSpike — Deploy Prod
# Triggers on push to prod, builds images and deploys to maplespike-prod
# =============================================================================
name: Deploy Prod

on:
  push:
    branches: [prod]
    paths:
      - 'packages/**'
      - 'Dockerfile.*'
      - '.github/workflows/deploy-prod.yml'

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.actor }}
  REGISTRY_PASS: ${{ secrets.GITHUB_TOKEN }}
  NAMESPACE: maplespike-prod

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean
      - run: pnpm -r build
      - run: node scripts/build-docs.mjs
      - run: pnpm rebuild better-sqlite3

      - name: Test pipeline-core
        run: pnpm test
        working-directory: packages/pipeline-core
      - name: Test mcp-server
        run: pnpm test
        working-directory: packages/mcp-server
      - name: Test engine
        run: pnpm test
        working-directory: packages/engine
      - name: Test sdk
        run: pnpm test
        working-directory: packages/sdk

  build:
    name: Build & Push Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs.mjs

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.REGISTRY_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-api:stable
            ghcr.io/reverb256/maplespike-api:latest
            ghcr.io/reverb256/maplespike-api:${{ github.sha }}
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Build & push MCP (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-mcp:stable
            ghcr.io/reverb256/maplespike-mcp:latest
            ghcr.io/reverb256/maplespike-mcp:${{ github.sha }}
          cache-from: type=gha,scope=mcp-prod
          cache-to: type=gha,mode=max,scope=mcp-prod

      - name: Build & push Portal (prod)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.portal
          push: true
          tags: |
            ghcr.io/reverb256/maplespike-portal:stable
            ghcr.io/reverb256/maplespike-portal:latest
            ghcr.io/reverb256/maplespike-portal:${{ github.sha }}
          cache-from: type=gha,scope=portal-prod
          cache-to: type=gha,mode=max,scope=portal-prod

  deploy:
    name: Deploy to K8s
    needs: build
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply K8s manifests from repo
        run: |
           /run/current-system/sw/bin/kubectl apply -f k8s/prod/ --prune --prune-allowlist=apps/v1/Deployment --prune-allowlist=v1/Service --prune-allowlist=v1/ConfigMap --prune-allowlist=v1/Secret
          echo "Applied k8s/prod/ manifests to $NAMESPACE"

      - name: Rollout prod deployments
        run: |
           /run/current-system/sw/bin/kubectl rollout restart deployment -n $NAMESPACE maplespike-api 2>&1 || echo "No api deployment to restart"
          kubectl rollout restart deployment -n $NAMESPACE maplespike-mcp 2>&1 || echo "No mcp deployment to restart"
          kubectl rollout restart deployment -n $NAMESPACE maplespike-portal 2>&1 || echo "No portal deployment to restart"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n $NAMESPACE maplespike-api --timeout=5m 2>&1 || echo "Wait skipped (no api deployment)"
          kubectl rollout status deployment -n $NAMESPACE maplespike-mcp --timeout=5m 2>&1 || echo "Wait skipped (no mcp deployment)"
          kubectl rollout status deployment -n $NAMESPACE maplespike-portal --timeout=5m 2>&1 || echo "Wait skipped (no portal deployment)"