name: CI Doctor
# Failure → Hermes triage pipeline (quill, 2026-09-22).
#
# Every failed run of a watched workflow becomes a kanban card on the
# maplespike board (nexus DB). The dispatcher claims it (≤60s) and a worker
# diagnoses with the failure context attached. Gates in the card: the fix
# must make the workflow green on a re-run + a regression test for real bugs
# (incident rule). Loop cap: 3 attempts, then blocked for human triage.
#
# Companion to the in-workflow "Create issue on failure" steps (Ring 1
# record); this is the Hermes assist path.
on:
  workflow_run:
    workflows: ["CI", "Live Data Check", "QA", "Health Monitor", "Docs Validation", "PR validation"]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  doctor:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Staleness guard (superseded main runs + stale PR merge snapshots)
        # A main run whose SHA is no longer main HEAD was superseded: the
        # failure is usually already fixed, and filing a card for it makes
        # workers chase dead bugs. Skip those.
        #
        # PR runs execute the *merge snapshot* refs/pull/<n>/merge = PR head
        # merged into the base SHA recorded at snapshot time (PR #898:
        # refs/pull/898/merge = 3ccda3d into 1a526344, predating qa.yml's fix
        # at 879f0cf on main). When main advances after the snapshot, a re-run
        # reuses the same stale merge commit — the lane cannot heal without a
        # new push. Do NOT skip those; the red lane is real. Instead, annotate
        # the card so the worker knows to merge main before diagnosing.
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          WF_PATH: ${{ github.event.workflow_run.path }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha 2>/dev/null || echo "")
          skip=0
          annotation=""
          if [ -z "$HEAD" ]; then
            echo "Could not resolve main HEAD — proceeding without staleness check."
          elif [ "$BRANCH" = "main" ]; then
            if [ "$SHA" != "$HEAD" ]; then
              skip=1
              echo "Superseded: run SHA ${SHA:0:7} != main HEAD ${HEAD:0:7} — skipping."
            fi
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "$HEAD" ] && [ -n "$WF_PATH" ]; then
            CHANGED=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${HEAD}" \
              --jq '[.files[].filename] | .[]' 2>/dev/null || true)
            if echo "$CHANGED" | grep -qF "$WF_PATH"; then
              annotation="Merge snapshot base ${BASE_SHA:0:7} predates main HEAD ${HEAD:0:7} and ${WF_PATH} changed since — update the branch (merge main) before diagnosing; the failure may already be fixed."
              echo "$annotation"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "annotation=${annotation}" >> "$GITHUB_OUTPUT"
      - name: Build failure context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=${{ github.event.workflow_run.id }}
          NAME="${{ github.event.workflow_run.name }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          URL="${{ github.event.workflow_run.html_url }}"
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion==\"failure\") | .name + \" [\" + ([.steps[] | select(.conclusion==\"failure\") | .name] | join(\", \")) + \"]\"] | join(\"\\n\")' \
            2>/dev/null | head -30 || true)
          {
            echo "**Source:** $URL"
            echo "**Workflow:** $NAME | **Branch:** $BRANCH | **SHA:** $SHA"
            echo ""
            echo "**Failed jobs/steps:**"
            echo '```'
            echo "${FAILED:-(none reported by API — see run log)}"
            echo '```'
            echo ""
            echo "**Ask (error/triage path):**"
            echo "0. FIRST confirm the failure still reproduces on current main (check the newest run of this workflow, or re-run it). If it is already fixed, close this card with that evidence — do not fix a fixed bug."
            echo "1. Diagnose the root cause from the run log (gh run view $RUN_ID --log)."
            echo "2. Fix it on a branch, push, and VERIFY the failing workflow goes green."
            echo "3. Real bug → add a regression test in the same change (incident rule)."
            echo "4. Max 3 attempts; if blocked, comment the blocker and stop."
          } > /tmp/ci-doctor-body.md
          echo "TITLE=CI failure: $NAME ($BRANCH, run $RUN_ID)" >> "$GITHUB_ENV"
      - name: Post to kanban (nexus dispatcher)
        if: steps.guard.outputs.skip != '1'
        run: |
          if [ -n "${{ steps.guard.outputs.annotation }}" ]; then
            TMP=$(mktemp)
            echo "${{ steps.guard.outputs.annotation }}" > "$TMP"
            echo "" >> "$TMP"
            cat /tmp/ci-doctor-body.md >> "$TMP"
            mv "$TMP" /tmp/ci-doctor-body.md
          fi
          chmod +x scripts/kanban-post.sh
          scripts/kanban-post.sh --title "$TITLE" --body-file /tmp/ci-doctor-body.md \
            --assignee backend-eng --priority 1 \
            --workspace worktree --branch "wt/ci-${{ github.event.workflow_run.id }}" \
            --idem "ci-fail-${{ github.event.workflow_run.id }}"
        if: steps.guard.outputs.skip != '1'
