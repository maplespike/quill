name: CI Doctor
# Failure → Hermes triage pipeline (quill, 2026-09-22).
#
# Every failed run of a watched workflow becomes a kanban card on the
# maplespike board (nexus DB). The dispatcher claims it (≤60s) and a worker
# diagnoses with the failure context attached. Gates in the card: the fix
# must make the workflow green on a re-run + a regression test for real bugs
# (incident rule). Loop cap: 3 attempts, then blocked for human triage.
#
# Companion to the in-workflow "Create issue on failure" steps (Ring 1
# record); this is the Hermes assist path.
on:
  workflow_run:
    # Health Monitor is left out: it already opens its own issue on failure, and its
    # 30-minute schedule was the bulk of the skipped doctor runs. Only main and prod
    # are watched; PR-branch failures already show on the PR itself.
    workflows: ["CI", "Live Data Check", "QA", "Docs Validation", "PR validation", "NetworkPolicy validation"]
    types: [completed]
    branches: [main, prod]
# Collapse duplicate events for the same workflow+SHA. Without this the doctor
# queues one job per watched-workflow event on a single-runner pool (2026-09-22:
# four queued doctor jobs for one SHA), starving the CI/QA runs it exists to
# report on. Grouped per workflow name so two different workflows failing on the
# same SHA still each get their own card.
concurrency:
  group: ci-doctor-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  doctor:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, nixos]
    steps:
      - name: Refuse untrusted code on self-hosted runners
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request|pull_request_target|workflow_run)
              if [[ -z "$EVENT_HEAD" || "$EVENT_HEAD" != "$THIS_REPO" ]]; then
                echo "::error::Refusing ${EVENT_NAME} from a fork on a self-hosted runner."
                exit 1
              fi
              ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Staleness guard (superseded main runs)
        # A run whose SHA is no longer main HEAD was superseded: the failure is
        # usually already fixed, and filing a card for it makes workers chase
        # dead bugs (2026-09-22: seven cards piled up for runs that predated
        # their own fixes). Only main runs are checked — branch/PR runs are
        # always current for their branch.
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            *$'\n'*|*$'\r'*) echo "::error::Refusing a branch name that contains a newline."; exit 1 ;;
          esac
          case "$SHA" in
            *$'\n'*|*$'\r'*) echo "::error::Refusing a SHA that contains a newline."; exit 1 ;;
          esac
          HEAD=$(gh api "repos/${REPO}/commits/main" --jq .sha 2>/dev/null || echo "")
          if [ "$BRANCH" = "main" ] && [ -n "$HEAD" ] && [ "$SHA" != "$HEAD" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "Superseded: run SHA ${SHA:0:7} is not main HEAD — skipping."
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Build failure context
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          URL: ${{ github.event.workflow_run.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$NAME$BRANCH$URL$SHA" in
            *$'\n'*|*$'\r'*) echo "::error::Refusing workflow metadata that contains a newline."; exit 1 ;;
          esac
          FAILED=$(gh api "repos/${REPO}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name + " [" + ([.steps[] | select(.conclusion=="failure") | .name] | join(", ")) + "]"] | join("\n")' \
            2>/dev/null | head -30 || true)
          {
            echo "**Source:** $URL"
            echo "**Workflow:** $NAME | **Branch:** $BRANCH | **SHA:** $SHA"
            echo ""
            echo "**Failed jobs/steps:**"
            echo '```'
            echo "${FAILED:-(none reported by API — see run log)}"
            echo '```'
            echo ""
            echo "**Ask (error/triage path):**"
            echo "0. FIRST confirm the failure still reproduces on current main (check the newest run of this workflow, or re-run it). If it is already fixed, close this card with that evidence — do not fix a fixed bug."
            echo "1. Diagnose the root cause from the run log (gh run view $RUN_ID --log)."
            echo "2. Fix it on a branch, push, and VERIFY the failing workflow goes green."
            echo "3. Real bug → add a regression test in the same change (incident rule)."
            echo "4. Max 3 attempts; if blocked, comment the blocker and stop."
          } > /tmp/ci-doctor-body.md
          echo "TITLE=CI failure: $NAME ($BRANCH, run $RUN_ID)" >> "$GITHUB_ENV"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: Post to kanban (nexus dispatcher)
        if: steps.guard.outputs.skip != '1'
        run: |
          chmod +x scripts/kanban-post.sh
          scripts/kanban-post.sh --title "$TITLE" --body-file /tmp/ci-doctor-body.md \
            --assignee backend-eng --priority 1 \
            --workspace worktree --branch "wt/ci-${RUN_ID}" \
            --idem "ci-fail-${RUN_ID}"
