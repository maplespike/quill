# =============================================================================
# MapleSpike — Deploy Portal to Cloudflare Pages
#
# This workflow ONLY deploys the frontend SPA to the apex domain
# (maplespike.ca). It does NOT manage DNS, custom domains, or any
# *.maplespike.ca subdomain.
#
# Per docs/ROUTING.md (rationale: docs/decisions/0004-split-hostname-routing.md),
# all subdomains route via the Cloudflare Tunnel to the homelab k3s cluster —
# NOT via Pages:
#   - api.maplespike.ca         → tunnel → maplespike-api:8082
#   - mcp.maplespike.ca         → tunnel → maplespike-quill:3001
#   - data.maplespike.ca        → tunnel → maplespike-portal:8080 (Quill surface)
#   - quill.maplespike.ca       → tunnel → maplespike-portal:8080 (Phase D planned)
#
# IMPORTANT: hostname→service ingress rules for the tunnel are configured
# in the Cloudflare Zero Trust Dashboard (Networks → Tunnels → Routes),
# NOT in this repo. The yaml in k8s/base/05-cloudflared.yaml only sets
# up the Deployment + the TUNNEL_TOKEN Secret; it does NOT contain
# per-hostname routing logic. To add a new *.maplespike.ca subdomain,
# edit the route list in the Dashboard, then add the matching DNS CNAME
# pointing to <tunnel-id>.cfargotunnel.com. Do NOT add Pages custom-domain
# attach logic for any *.maplespike.ca subdomain in this workflow.
#
# Required Secrets:
#   MAPLESPIKE_CLOUDFLARE_TOKEN — CF API token with Pages:Edit scope
#
# Required Variables:
#   CF_ACCOUNT_ID — Cloudflare Account ID
# =============================================================================
name: Deploy Portal to Cloudflare Pages

on:
  push:
    branches:
      - prod
    paths:
      - "packages/portal/**"
      - "packages/quill-mcp/**"
      - "packages/sdk/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Portal + Deploy to CF Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Auto-detects version from package.json packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build
        env:
          MAPLESPIKE_DOMAIN: maplespike.ca

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy packages/portal/dist \
            --project-name=maplespike-brand \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAPLESPIKE_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}

      # Attach data.maplespike.ca as a custom domain on maplespike-brand.
      # Idempotent on re-runs: silently continues if already attached.
      # Other wrangler errors still fail the workflow (no silent masking).
      - name: Attach data.maplespike.ca to CF Pages
        run: |
          echo "Attaching data.maplespike.ca → maplespike-brand…"
          out=$(npx wrangler pages domain add maplespike-brand data.maplespike.ca 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -qiE 'already (attached|associated|exists)'; then
              echo "(already attached — continuing)"
            else
              echo "✗ wrangler failed (rc=$rc) and not duplicate-domain — failing workflow"
              exit "$rc"
            fi
          fi
          echo "Verifying via CF REST API…"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/maplespike-brand/domains" \
            | python3 -c "import sys, json
          d = json.load(sys.stdin)
          bound = any(x.get('name') == 'data.maplespike.ca' for x in d.get('result', []))
          print('✓ verified bound' if bound else '✗ not in domains list — failing')
          sys.exit(0 if bound else 1)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAPLESPIKE_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
