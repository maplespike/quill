# =============================================================================
# MapleSpike — Deploy Portal to Cloudflare Pages
#
# Builds the portal (pnpm build → gen:all + astro build) and deploys
# the static output to Cloudflare Pages (maplespike-brand).
#
# Required Secrets:
#   MAPLESPIKE_CLOUDFLARE_TOKEN — CF API token with Pages:Edit scope
#
# Required Variables:
#   CF_ACCOUNT_ID — Cloudflare Account ID
# =============================================================================
name: Deploy Portal to Cloudflare Pages

on:
  push:
    branches:
      - prod
    paths:
      - "packages/portal/**"
      - "packages/mcp-server/**"
      - "packages/sdk/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Ensure only one deployment runs at a time
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Portal + Deploy to CF Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Auto-detects version from package.json packageManager field

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build
        env:
          MAPLESPIKE_DOMAIN: maplespike.ca

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy packages/portal/dist \
            --project-name=maplespike-brand \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAPLESPIKE_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}

      # Attach data.maplespike.ca as a custom domain on maplespike-brand.
      # Idempotent on re-runs: silently continues if already attached.
      # Other wrangler errors still fail the workflow (no silent masking).
      #
      # Pre-clean: conflicting A/AAAA records on data.maplespike.ca block the
      # CF Pages binding with code 1004. We try to remove them via raw CF API
      # first (DNS:Edit scope required); if the token lacks DNS:Edit the
      # delete-records calls return 403 and we log a warning + fall back to
      # fail-loud dashboard instructions.
      - name: Attach data.maplespike.ca to CF Pages
        run: |
          set -u
          echo "Attaching data.maplespike.ca → maplespike-brand…"
          echo "  dashboard fallback: https://dash.cloudflare.com/?to=/${CLOUDFLARE_ACCOUNT_ID}/pages/view/maplespoke-brand/custom-domains" | sed 's/maplespoke-brand/maplespike-brand/' | tee /dev/stderr

          ZONE_ID=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=maplespike.ca" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null || true)
          echo "  zone_id=${ZONE_ID:-<unresolved>}"

          if [ -n "${ZONE_ID:-}" ]; then
            echo "  listing A/AAAA records for data.maplespike.ca…"
            record_ids=$(curl -fsS \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns/records?type=A&type=AAAA&name=data.maplespike.ca" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(r['id'] for r in d.get('result',[]) if r.get('name','').startswith('data.')))" 2>/dev/null || true)
            if [ -n "${record_ids:-}" ]; then
              echo "  found record IDs:"; echo "$record_ids" | sed 's/^/    /'
              for rid in $record_ids; do
                echo "  deleting record ${rid}…"
                del=$(curl -s -o /tmp/del-$rid.json -w '%{http_code}' \
                  -X DELETE \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns/records/${rid}" || echo 000)
                echo "    delete rc=$del"; cat /tmp/del-$rid.json 2>/dev/null | head -c 400; echo
              done
            else
              echo "  no conflicting A/AAAA records found — skipping delete"
            fi
          else
            echo "  ⚠ could not resolve zone_id; skipping pre-clean (token may not have Zone:Read)"
          fi

          echo "  attaching via wrangler pages domain add…"
          out=$(npx wrangler pages domain add maplespike-brand data.maplespike.ca 2>&1)
          rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            if echo "$out" | grep -qiE 'already (attached|associated|exists)'; then
              echo "(already attached — continuing)"
            else
              echo "✗ wrangler failed (rc=$rc) and not duplicate-domain"
              echo "::error::Wrangler failed to attach data.maplespike.ca. If the token lacks Zone.DNS:Edit, manually remove the A/AAAA records via the Cloudflare dashboard, then re-run."
              echo "  dashboard: https://dash.cloudflare.com/?to=/${CLOUDFLARE_ACCOUNT_ID}/pages/view/maplespike-brand/custom-domains"
              exit "$rc"
            fi
          fi

          echo "Verifying via CF REST API…"
          curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/maplespike-brand/domains" \
            | python3 -c "import sys, json
          d = json.load(sys.stdin)
          bound = any(x.get('name') == 'data.maplespike.ca' for x in d.get('result', []))
          print('✓ verified bound' if bound else '✗ not in domains list — failing')
          sys.exit(0 if bound else 1)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MAPLESPIKE_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
