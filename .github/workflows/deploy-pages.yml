# =============================================================================
# Quill — Deploy Portal to Cloudflare Pages (preview/non-production)
#
# This workflow deploys the Quill portal frontend to a CLOUDFLARE PAGES
# project for preview and fallback access.
#
# Production traffic for quill.maplespike.ca and all *.maplespike.ca
# subdomains routes through the Cloudflare Tunnel to the homelab k3s
# cluster — NOT through Pages (see docs/ROUTING.md).
#
# The apex domain maplespike.ca is served by the SEPARATE `maplespike-brand`
# Pages project. Do NOT deploy Quill content to that project — it would
# overwrite the brand landing site.
#
# Per docs/ROUTING.md (rationale: docs/decisions/0004-split-hostname-routing.md):
#   - api.maplespike.ca         -> tunnel -> quill-api:8082
#   - mcp.maplespike.ca         -> tunnel -> quill-mcp:3001
#   - quill.maplespike.ca       -> tunnel -> quill-portal:8080
#   - maplespike.ca             -> Cloudflare Pages -> maplespike-brand site
#
# Required Secrets:
#   QUILL_CLOUDFLARE_TOKEN — CF API token with Pages:Edit scope
#
# Required Variables:
#   CF_ACCOUNT_ID — Cloudflare Account ID
# =============================================================================
name: Deploy Portal to Cloudflare Pages

on:
  push:
    branches:
      - prod
    paths:
      - "packages/portal/**"
      - "packages/quill-mcp/**"
      - "packages/sdk/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Portal + Deploy to CF Pages
    runs-on: [self-hosted, nixos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build
        env:
          MAPLESPIKE_DOMAIN: maplespike.ca

      - name: Deploy to CF Pages (quill-portal)
        run: |
          npx wrangler pages deploy packages/portal/dist \
            --project-name=quill-portal \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.QUILL_CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
