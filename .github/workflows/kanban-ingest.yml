name: Kanban Auto-Ingest

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      force-ingest:
        description: 'Force re-import all agent-ready issues'
        required: false
        default: 'false'

concurrency:
  # A second label event on the same issue replaces the queued ingest.
  group: kanban-ingest-${{ github.event.issue.number || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: true

permissions:
  issues: read
  contents: read

jobs:
  ingest:
    runs-on: arc-maplespike
    steps:
      - uses: actions/checkout@v7

      - name: Self-check the importer's argument contract
        # Regression test for the silent arg-order bug: the workflow used to call
        # `... single 918`, which bound REPO="single" and MODE="918", fell through
        # every mode branch and exited 1, so no labeled issue ever reached the board.
        run: |
          set -euo pipefail
          chmod +x scripts/import-github-issues.sh
          expect() {
            want="$1"; shift
            got=$(DRY_RUN=1 ./scripts/import-github-issues.sh "$@")
            if [ "$got" != "$want" ]; then
              echo "✖ importer contract broke: args='$*' want='$want' got='$got'"
              exit 1
            fi
            echo "  ok: $got"
          }
          expect "repo=maplespike/quill mode=single issue=918" maplespike/quill single 918
          expect "repo=maplespike/quill mode=single issue=918" single 918
          expect "repo=maplespike/quill mode=agent-ready issue=none" maplespike/quill agent-ready
          expect "repo=maplespike/quill mode=agent-ready issue=none" agent-ready
          if DRY_RUN=1 ./scripts/import-github-issues.sh garbage >/dev/null 2>&1; then
            echo "✖ a non-repo first argument must fail loudly"; exit 1
          fi
          echo "✅ importer argument contract holds"
        shell: bash

      - name: Import GitHub Issues to Kanban
        id: import
        # Event-controlled values arrive through env, never inside the run body.
        # Shapes are validated before any command uses them (2026-11-27 audit, P1).
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_INGEST: ${{ github.event.inputs.force-ingest || 'false' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          chmod +x scripts/import-github-issues.sh

          if [[ ! "$FORCE_INGEST" =~ ^(true|false)$ ]]; then
            echo "::error::force-ingest must be true or false"
            exit 1
          fi
          if [[ -n "$ISSUE_NUMBER" && ! "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::issue number must be numeric"
            exit 1
          fi
          if [[ -n "$LABEL_NAME" && ! "$LABEL_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9\ _.:/-]{0,99}$ ]]; then
            echo "::error::label name contains unsupported characters"
            exit 1
          fi

          outcome=skipped
          if [ "$FORCE_INGEST" = "true" ]; then
            echo "🔄 Force re-importing all agent-ready issues..."
            ./scripts/import-github-issues.sh maplespike/quill agent-ready
            outcome=imported
          elif [ "$LABEL_NAME" = "agent-ready" ] && [ -n "$ISSUE_NUMBER" ]; then
            echo "✅ Issue #$ISSUE_NUMBER labeled agent-ready, importing..."
            ./scripts/import-github-issues.sh maplespike/quill single "$ISSUE_NUMBER"
            outcome=imported
          elif [ -n "$LABEL_NAME" ]; then
            echo "⏭️  Label '$LABEL_NAME' is not agent-ready, skipping auto-import"
            echo "Issue will be imported when labeled 'agent-ready'"
          elif [ -n "$ISSUE_NUMBER" ]; then
            HAS_LABEL=$(gh issue view "$ISSUE_NUMBER" --json labels --jq 'any(.labels[]; .name == "agent-ready")')
            if [ "$HAS_LABEL" = "true" ]; then
              echo "✅ New issue #$ISSUE_NUMBER has agent-ready label, importing..."
              ./scripts/import-github-issues.sh maplespike/quill single "$ISSUE_NUMBER"
              outcome=imported
            else
              echo "⏭️  New issue #$ISSUE_NUMBER lacks agent-ready label, skipping"
              echo "Label it 'agent-ready' to trigger import"
            fi
          else
            echo "⏭️  No issue or label in this event — nothing to import"
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Report Results
        env:
          OUTCOME: ${{ steps.import.outputs.outcome }}
        run: |
          echo "## 📋 Kanban Ingestion Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$OUTCOME" = "imported" ]; then
            echo "✅ Issues imported to Kanban board" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️  No issues imported (skip branch)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Board: \`quill\`" >> $GITHUB_STEP_SUMMARY
          echo "Automation: Workers execute every 30 minutes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Monitor: \`hermes kanban list --status running\`" >> $GITHUB_STEP_SUMMARY
