# Validates the quill network policies on every change that can affect them.
# The chart is rendered exactly the way ArgoCD renders it (values-prod.yaml)
# and the breach-containment properties are asserted. Runs on the self-hosted
# NixOS runner (helm + coreutils available, same as ci.yml's toolchain).
name: NetworkPolicy validation

on:
  push:
    branches: [main, prod]
    paths:
      - 'charts/quill/**'
      - 'scripts/test-networkpolicy.sh'
      - '.github/workflows/netpol-validation.yml'
  pull_request_target:
    branches: [main, prod]
    paths:
      - 'charts/quill/**'
      - 'scripts/test-networkpolicy.sh'
      - '.github/workflows/netpol-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netpol:
    name: netpol assertions
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "nixos"]') }}
    steps:
      - name: Refuse untrusted code on self-hosted runners
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]]; then
            exit 0
          fi
          case "$EVENT_NAME" in
            pull_request)
              echo "::error::A pull_request job must not run on a self-hosted runner."
              exit 1
              ;;
            pull_request_target|workflow_run)
              if [[ -n "$EVENT_HEAD" && "$EVENT_HEAD" != "$THIS_REPO" ]]; then
                echo "::error::Refusing ${EVENT_NAME} from a fork on a self-hosted runner."
                exit 1
              fi
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Drop the job token before repository code
        if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "GITHUB_TOKEN=" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5

      - name: Validate network policies
        run: bash scripts/test-networkpolicy.sh

      # The live breach-containment proof needs cluster access; if this runner
      # has a working kubeconfig, run it here too. Skipped otherwise (the
      # authoritative weekly run happens from zephyr).
      - name: Live isolation test (if cluster reachable)
        continue-on-error: true
        run: |
          if kubectl version --request-timeout=5s >/dev/null 2>&1; then
            bash scripts/isolation-test.sh
          else
            echo "no cluster access on this runner - skipping live test"
          fi
