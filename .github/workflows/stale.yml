# Stale issue and PR management
# Auto-close stale issues after 60d inactivity, stale PRs after 30d
name: "Stale management"
on:
  schedule:
    - cron: "0 6 * * 1"  # 6 AM Monday
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 7 days
            unless there is new activity.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen if this is still relevant.
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: "stale"
          exempt-issue-labels: "p1,security,bug,blocked,never-stale"

          # PRs
          stale-pr-message: >
            This PR has been inactive for 30 days. It will be closed in 7 days
            unless there is new activity.
          close-pr-message: >
            Closed due to inactivity. Please reopen with updated changes when ready.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: "stale"
          exempt-pr-labels: "p1,security,blocked,never-stale,dependencies"
