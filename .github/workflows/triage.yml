name: Issue Auto-Triage
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  triage:
    runs-on: arc-maplespike
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x scripts/quill-issue-triage.sh && bash scripts/quill-issue-triage.sh ${{ github.event.issue.number }} ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
