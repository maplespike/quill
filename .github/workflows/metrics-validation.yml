name: Validate Metrics

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up script
        run: chmod +x scripts/validate-metrics.sh

      - name: Run metrics validation
        run: ./scripts/validate-metrics.sh