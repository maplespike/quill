# PR Validation — enforces policies without requiring GitHub Pro
# Replaces branch protection rules for private repos
name: "PR validation"
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: "PR checks"
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "nixos"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Check 1: Branch name follows convention ───────────────────
      # NOTE: all PR-derived strings reach step scripts via `env:` — never
      # interpolate ${{ }} directly into `run:` bodies. Direct interpolation
      # breaks the shell on quotes/HTML and is a script-injection surface
      # (2026-09-21: a Dependabot PR body containing <details> crashed the
      # linked-issue check with `syntax error near unexpected token '<'`).
      - name: "Branch naming convention"
        id: branch-name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" =~ ^(issue|feat|fix|chore|dependabot)/[a-z0-9._-]+$ ]]; then
            echo "✅ Branch name: $BRANCH"
          elif [[ "$BRANCH" =~ ^dependabot/ ]]; then
            echo "✅ Dependabot branch: $BRANCH"
          else
            echo "::warning::Branch '$BRANCH' doesn't follow convention."
            echo "Expected: issue-NNN-desc, feat/NNN-desc, fix/NNN-desc"
          fi

      # ── Check 2: PR has linked issue ──────────────────────────────
      - name: "Linked issue check"
        id: linked-issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qiE "(Closes|Fixes|Resolves|Related to) #[0-9]+"; then
            echo "✅ PR references an issue"
          else
            echo "::warning::PR body should contain 'Closes #NNN' or 'Related to #NNN'"
          fi

      # ── Check 3: Commit messages reference issue numbers ───────────
      - name: "Commit message check"
        id: commit-msgs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Never rely on the runner's ambient `gh` credentials: the
          # [self-hosted, nixos] pool is not homogeneous. Runners with stored
          # credentials satisfied this step and runners without them made `gh`
          # exit 4 ("To use GitHub CLI in a GitHub Actions workflow, set the
          # GH_TOKEN environment variable"), so the required `PR checks` check
          # flapped with whichever host picked the job (PR 908, run
          # 35684897034 on forge-quill-runner). `github.token` is minted per
          # run and exists everywhere. Guard: scripts/gates/check-workflow-gh-auth.mjs
        run: |
          COMMITS=$(gh pr view "$PR_NUMBER" --json commits --jq '.commits[].messageHeadline')
          FAILED=0
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '#[0-9]+'; then
              echo "✅ $msg"
            elif echo "$msg" | grep -qiE "^(Merge|chore: release|chore: version)"; then
              echo "⏭️  $msg (merge/release)"
            else
              echo "⚠️  Missing issue ref: $msg"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$COMMITS"
          echo "count=$FAILED" >> $GITHUB_OUTPUT

      # ── Check 4: Title starts with conventional commit type ───────
      - name: "Conventional commit title check"
        id: title-check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$PR_TITLE" | grep -qiE "^(feat|fix|chore|refactor|docs|test|ci)(\([a-z]+\))?:"; then
            echo "✅ Title follows conventional commits"
          else
            echo "::warning::PR title should start with type: e.g. 'feat: add X (#NNN)'"
          fi

      # ── Check 5: No direct pushes to main ─────────────────────────
      - name: "Target branch check"
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$BASE" = "main" ] || [ "$BASE" = "prod" ]; then
            echo "✅ PR targets $BASE — correct"
          else
            echo "::warning::PR targets '$BASE' — should be main or prod"
          fi

      # ── Check 6: WORKFLOW_NAME rename guard ────────────────────────
      # dependabot-auto-merge.yml hardcodes a `WORKFLOW_NAME: "..."` env var
      # to gate its self-deadlock check. If anyone renames the workflow's
      # `name:` field, the guard silently deactivates and the bot can wedge
      # on its own check-pending state. This check asserts the two strings
      # stay in sync at PR time.
      - name: "WORKFLOW_NAME rename guard"
        id: workflow-name-guard
        run: |
          WF=.github/workflows/dependabot-auto-merge.yml
          # Strip quotes AND backticks so error messages and Job Summary render
          # clean Markdown even if the workflow is renamed to a name containing
          # code-span punctuation.
          NAME=$(grep '^name:' "$WF" | head -1 | sed 's/^name: *//' | tr -d '"\047\140')
          GUARD=$(grep 'WORKFLOW_NAME:' "$WF" | head -1 | sed 's/.*WORKFLOW_NAME: *//' | tr -d '"\047\140')
          if [ -z "$NAME" ] || [ -z "$GUARD" ]; then
            echo "::error::Could not extract \`name:\` or \`WORKFLOW_NAME:\` from $WF"
            exit 1
          fi
          if [ "$NAME" != "$GUARD" ]; then
            echo "::error::$WF \`name:\` field (\"$NAME\") does not match \`WORKFLOW_NAME:\` env (\"$GUARD\"). The self-deadlock guard would silently de-activate."
            exit 1
          fi
          echo "✅ WORKFLOW_NAME rename guard: \"$NAME\" == \"$GUARD\""

      # ── Summary ────────────────────────────────────────────────────
      - name: "PR validation summary"
        if: always()
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch name | ✅ Convention checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Issue linked | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit references | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional title | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Target branch | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          # Use a hard-coded ✅ rather than the step's outputs.match_count: if
          # the rename guard exited 1, we'd render a blank cell and the visual
          # signal would be lost. The job's overall pass/fail surfaces the
          # failure elsewhere.
          echo "| WORKFLOW_NAME guard | ✅ Matched |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Warnings do not block merge but should be addressed." >> $GITHUB_STEP_SUMMARY
