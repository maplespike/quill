# PR Validation — enforces policies without requiring GitHub Pro
# Replaces branch protection rules for private repos
name: "PR validation"
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate:
    name: "PR checks"
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Check 1: Branch name follows convention ───────────────────
      - name: "Branch naming convention"
        id: branch-name
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ ^(issue|feat|fix|chore|dependabot)/[a-z0-9._-]+$ ]]; then
            echo "✅ Branch name: $BRANCH"
          elif [[ "$BRANCH" =~ ^dependabot/ ]]; then
            echo "✅ Dependabot branch: $BRANCH"
          else
            echo "::warning::Branch '$BRANCH' doesn't follow convention."
            echo "Expected: issue-NNN-desc, feat/NNN-desc, fix/NNN-desc"
          fi

      # ── Check 2: PR has linked issue ──────────────────────────────
      - name: "Linked issue check"
        id: linked-issue
        run: |
          BODY="${{ github.event.pull_request.body }}"
          if echo "$BODY" | grep -qiE "(Closes|Fixes|Resolves|Related to) #[0-9]+"; then
            echo "✅ PR references an issue"
          else
            echo "::warning::PR body should contain 'Closes #NNN' or 'Related to #NNN'"
          fi

      # ── Check 3: Commit messages reference issue numbers ───────────
      - name: "Commit message check"
        id: commit-msgs
        run: |
          COMMITS=$(gh pr view ${{ github.event.pull_request.number }} --json commits --jq '.commits[].messageHeadline')
          FAILED=0
          while IFS= read -r msg; do
            if echo "$msg" | grep -qiE '#[0-9]+'; then
              echo "✅ $msg"
            elif echo "$msg" | grep -qiE "^(Merge|chore: release|chore: version)"; then
              echo "⏭️  $msg (merge/release)"
            else
              echo "⚠️  Missing issue ref: $msg"
              FAILED=$((FAILED + 1))
            fi
          done <<< "$COMMITS"
          echo "count=$FAILED" >> $GITHUB_OUTPUT

      # ── Check 4: Title starts with conventional commit type ───────
      - name: "Conventional commit title check"
        id: title-check
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if echo "$TITLE" | grep -qiE "^(feat|fix|chore|refactor|docs|test|ci)(\([a-z]+\))?:"; then
            echo "✅ Title follows conventional commits"
          else
            echo "::warning::PR title should start with type: e.g. 'feat: add X (#NNN)'"
          fi

      # ── Check 5: No direct pushes to main ─────────────────────────
      - name: "Target branch check"
        run: |
          BASE="${{ github.base_ref }}"
          if [ "$BASE" = "main" ] || [ "$BASE" = "prod" ]; then
            echo "✅ PR targets $BASE — correct"
          else
            echo "::warning::PR targets '$BASE' — should be main or prod"
          fi

      # ── Summary ────────────────────────────────────────────────────
      - name: "PR validation summary"
        if: always()
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch name | ✅ Convention checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Issue linked | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit references | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Conventional title | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "| Target branch | ✅ Checked |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Warnings do not block merge but should be addressed." >> $GITHUB_STEP_SUMMARY
