# =============================================================================
# Quill — Deploy Demo Portal to GitHub Pages
#
# Free-tier cloud demo: the static Astro portal built for GitHub Pages at
# https://reverb256.github.io/quill/. No Cloudflare token needed — GitHub
# Pages deploys with the built-in GITHUB_TOKEN.
#
# What works on Pages (static): index, explorer, docs, pricing, verify UI,
# claims, changelog, blog, contact, citation, signal, watcher, status, terms,
# privacy, signup, workspace shell. API-backed widgets (AgentChat, ask,
# dashboard) call PUBLIC_API_BASE and show their real state (online when
# api.maplespike.ca is up, offline state when not).
#
# Trigger: workflow_dispatch (manual) + push to main touching portal.
# =============================================================================
# NOTE (2026-09-22): these runs fail until the repository is public. GitHub Pages
# is not enabled on it (`has_pages: false`, /pages returns 404) and private-repo
# Pages needs a paid plan, so the failure is a repo setting, not this code. The
# build itself is verified locally with GH_PAGES=true. Re-run after the flip.
#
# NOTE (2026-10-08): the workflow is ALSO disabled_manually in the GitHub UI
# (workflow id 339324198) — it was disabled after a duplicate `env:` key in the
# portal-build step made GitHub reject the file, so every run died in 0.0 s.
# That key is fixed (actionlint now guards the class), but the workflow stays
# disabled on purpose: it cannot succeed until Pages is enabled. To bring it
# back, first enable Pages, then Actions -> this workflow -> Enable, then run.

name: Deploy Demo Portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/portal/**"
      - "scripts/gh-pages-rewrite-links.mjs"
      - ".github/workflows/deploy-demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploy: never cancel a run mid-deploy. A newer push still replaces an older
  # pending run in this group, so at most one deploy waits.
  group: pages-demo
  cancel-in-progress: false

jobs:
  build:
    # Stays on a GitHub-hosted runner. actions/upload-pages-artifact and
    # actions/deploy-pages refuse self-hosted runners, including ARC.
    # The workflow is disabled_manually until Pages can be enabled.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        # The portal imports @maplespike/i18n and @maplespike/sdk from the
        # workspace. Without this their dist/ does not exist and the portal
        # build dies on an unresolved import — which is exactly how these
        # Pages deploys have been failing.
        run: pnpm build
        env:
          # Publishable by design: ships in the portal's client bundle anyway.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Build portal (GitHub Pages base)
        run: pnpm --filter @maplespike/portal build
        # ONE env block. A second `env:` key in the same step is accepted by
        # every local YAML parser but GitHub rejects the file (or silently
        # keeps only the last block — YAML last-key-wins), so the Stripe key
        # never reached the build. Found by actionlint, 2026-10-08.
        env:
          # Publishable by design: ships in the portal's client bundle anyway.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          GH_PAGES: "true"
          PUBLIC_API_BASE: "https://api.maplespike.ca/v1"

      - name: Rewrite root-absolute links for /quill/ base
        run: node scripts/gh-pages-rewrite-links.mjs packages/portal/dist /quill/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/portal/dist

  deploy:
    needs: build
    # deploy-pages must run on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    # One GitHub Pages site per repo. This job and deploy-docs.yml's deploy job
    # share this group so two deployments never overlap: a second deployment
    # created mid-flight supersedes the first, which then times out red
    # (run 45530345927 lost to this job's run 45531953164 that way).
    concurrency:
      group: github-pages-site
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
