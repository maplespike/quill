# Dependabot — automated dependency updates
#
# Minor and patch updates are grouped into ONE PR per ecosystem per run
# (weekly for npm and github-actions, monthly for docker), which keeps the
# single ARC runner from drowning in one-package PRs.
# Major updates match no group (update-types excludes "major"), so Dependabot
# opens them individually: Reverb decides majors one at a time.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automation"
    ignore:
      # typescript-eslint has no TypeScript 7 support yet
      # (typescript-eslint/typescript-eslint#10940). Hold until it does.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Node is 22 on CI and in every image. @types/node must track the
      # runtime, not the newest DefinitelyTyped release.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
