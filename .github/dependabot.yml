# ───────────────────────────────────────────────────────────────
# Dependabot — automated dependency updates
# PRs from dependabot/* get CI guardrails + AI review + auto-merge
# ───────────────────────────────────────────────────────────────
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Toronto
    open-pull-requests-limit: 10
    labels:
      - dependabot
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
