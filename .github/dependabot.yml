# Dependabot — automated dependency updates
# Run daily, grouped by ecosystem, PR per group
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automation"
    ignore:
      # typescript-eslint has no TypeScript 7 support yet
      # (typescript-eslint/typescript-eslint#10940). Hold until it does.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # Node is 22 on CI and in every image. @types/node must track the
      # runtime, not the newest DefinitelyTyped release.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      turbo:
        patterns:
          - "turbo"
          - "@turbo/*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Toronto"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
