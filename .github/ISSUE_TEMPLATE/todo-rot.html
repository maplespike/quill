<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docs TODO Rot</title>
  <style>body{font-family:system-ui,sans-serif;max-width:700px;margin:2em auto;padding:0 1em}label{display:block;margin-top:1em;font-weight:600}input,textarea,select{width:100%;padding:0.5em;margin-top:0.3em;border:1px solid #ccc;border-radius:4px;font-size:1em}button{margin-top:1.5em;padding:0.7em 2em;background:#0366d6;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:1em}button:hover{background:#0257aa}</style>
</head>
<body>
  <h1>Docs TODO Rot</h1>
  <p>Report documentation with excessive TODO/FIXME density.</p>

  <form action="https://github.com/reverb256/maplespike/issues/new" method="GET">
    <input type="hidden" name="template" value="todo-rot.md">
    <input type="hidden" name="labels" value="documentation,security,auto-created,kelos">

    <label for="title">Title</label>
    <input type="text" id="title" name="title" placeholder="docs: Resolve TODOs in &lt;file&gt;" required>

    <label for="files">Files Affected</label>
    <textarea id="files" name="body" rows="5" placeholder="List files with high TODO density..."></textarea>

    <label for="type">Doc Category</label>
    <select id="type" name="doc_category">
      <option value="security">Security docs (target: 0 TODOs)</option>
      <option value="general">General docs (target: &lt;5% density)</option>
    </select>

    <button type="submit">Create Issue</button>
  </form>
</body>
</html>
