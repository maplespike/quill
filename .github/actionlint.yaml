# actionlint configuration.
#
# Declares the repo's self-hosted runner labels so actionlint reports real
# problems instead of unknown-label noise. The label is historical — the hosts
# run Omarchy/Arch, not NixOS; see the header of ci.yml and
# docs/GITHUB-ACTIONS-NIX.md.
self-hosted-runner:
  labels:
    - nixos
    - rust
    # Per-host labels. `nexus` is load-bearing: deploy-prod's image build must
    # run on nexus because scripts/pin-images.sh pins into that node's local
    # containerd store and refuses every other host.
    - nexus
    - sentry
    # Dedicated deploy runner on sentry (sentry-quill), used by deploy-prod fallback.
    - quill-deploy
    - forge
    - quill
    # ARC runner scale set on sentry (media-k8s helm/apps/arc-runner-maplespike.yaml).
    - arc-maplespike
