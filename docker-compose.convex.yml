version: "3.8"

# Self-hosted Convex backend for MapleSpike k3s cluster
# Run alongside Astral Key (auth) and MapleSpike API server
#
# Usage:
#   export CONVEX_POSTGRES_URL="postgresql://user:pass@postgres:5432/convex"
#   export CONVEX_S3_ENDPOINT="https://s3.maplespike.lan"
#   docker-compose -f docker-compose.convex.yml up -d

services:
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: convex-backend
    restart: unless-stopped
    ports:
      - "3210:3210" # HTTP API
      - "3211:3211" # WebSocket
    environment:
      # ── Database ──
      CONVEX_POSTGRES_URL: ${CONVEX_POSTGRES_URL:-postgresql://convex:convex@postgres:5432/convex}
      # ── File Storage (S3-compatible) ──
      CONVEX_S3_ENDPOINT: ${CONVEX_S3_ENDPOINT:-}
      CONVEX_S3_REGION: ${CONVEX_S3_REGION:-auto}
      CONVEX_S3_BUCKET: ${CONVEX_S3_BUCKET:-convex-storage}
      CONVEX_S3_ACCESS_KEY_ID: ${CONVEX_S3_ACCESS_KEY_ID:-}
      CONVEX_S3_SECRET_ACCESS_KEY: ${CONVEX_S3_SECRET_ACCESS_KEY:-}
      # ── Auth (Astral Key OIDC) ──
      # Convex reads auth config from convex/auth.config.ts in the deployed project
      # When self-hosting, configure via dashboard or push the config
      CONVEX_SITE_URL: ${CONVEX_SITE_URL:-https://convex.maplespike.lan}
      # ── Instance identity ──
      CONVEX_INSTANCE_NAME: ${CONVEX_INSTANCE_NAME:-maplespike}
      CONVEX_INSTANCE_SECRET: ${CONVEX_INSTANCE_SECRET:-}
    volumes:
      - convex-data:/data
    networks:
      - convex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: convex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: ${CONVEX_POSTGRES_PASSWORD:-convex}
      POSTGRES_DB: convex
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - convex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convex"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  convex-data:
  pgdata:

networks:
  convex:
    driver: bridge
