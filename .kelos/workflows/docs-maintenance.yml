# Kelos Workflow: Documentation Maintenance
# Scans docs daily/weekly, auto-creates GitHub issues for detected gaps.
# Issue #369 — https://github.com/reverb256/quill/issues/369
#
# Three scan tasks:
#   1. Daily: Metadata coverage (missing/stale last-reviewed)
#   2. Weekly: TODO density in security docs
#   3. Weekly: Metrics drift (metrics.json vs codebase reality)
#
# Prerequisite for:
#   - #370 (self-healing docs)
#   - #371 (CI/CD epic)

name: Documentation Maintenance
description: Automated docs scanning and issue creation

triggers:
  - schedule: "0 9 * * *"   # Daily at 9 AM
  - manual

vars:
  docs_path: "."
  metadata_field: "last-reviewed"
  max_todo_density: 0.05    # 5% threshold
  review_interval_days: 30
  max_issues_per_run: 5     # Cap to prevent issue flood

tasks:
  # ── Task 1: Metadata Coverage (Daily) ──────────────────────
  - name: Scan metadata coverage
    agent: kelos
    description: "Check all .md files for last-reviewed metadata"
    schedule: "0 9 * * *"    # Daily at 9 AM
    steps:
      - name: Find docs without metadata
        action: scan
        pattern: "*.md"
        exclude: "node_modules/**,.git/**,LICENSE.md"
        check: "contains('{{metadata_field}}:')"

      - name: Find docs with stale metadata
        action: scan
        pattern: "*.md"
        exclude: "node_modules/**,.git/**,LICENSE.md"
        check: "age_greater_than('{{metadata_field}}:', {{review_interval_days}})"

      - name: Create issue if gaps found
        action: create-issue
        condition: "missing_count > 0 OR stale_count > 0"
        template: |
          ## Task
          Add or update `{{metadata_field}}` metadata in documentation files.

          ## Files Missing Metadata
          {{missing_files_list}}

          ## Files With Stale Metadata (> {{review_interval_days}} days)
          {{stale_files_list}}

          ## Acceptance Criteria
          - [ ] All missing files have `{{metadata_field}}: <date>` in frontmatter
          - [ ] All stale files have `{{metadata_field}}` updated to current date
          - [ ] Frontmatter at top of each file
          - [ ] YAML syntax valid
          - [ ] Run `node scripts/generate-metrics.mjs` to update metrics

          ## Reference
          - Auto-created by Kelos docs-maintenance workflow
          - Parent: #367
        labels: ["documentation", "auto-created", "kelos"]
        assign: "reverb256"
        dedupe: true
        dedupe_labels: ["documentation", "auto-created"]
        max_per_run: "{{max_issues_per_run}}"

  # ── Task 2: TODO Density Scan (Weekly) ─────────────────────
  - name: Scan TODO density
    agent: kelos
    description: "Check TODO/FIXME density in security docs"
    schedule: "0 9 * * 1"    # Weekly Monday at 9 AM
    steps:
      - name: Count TODOs in security docs
        action: scan
        pattern: "docs/owasp-*.md"
        check: "TODO|FIXME"

      - name: Count TODOs in all docs
        action: scan
        pattern: "packages/docs/**/*.md"
        check: "TODO|FIXME|HACK|XXX"

      - name: Calculate density
        action: calculate
        formula: "todo_count / line_count"

      - name: Create issue if density > threshold
        action: create-issue
        condition: "density > {{max_todo_density}}"
        template: |
          ## Task
          Security documentation has {{todo_count}} TODOs ({{density}}%, threshold: {{max_todo_density}}).

          ## File
          `docs/owasp-threat-model-phase9.md`

          ## Required Action
          Complete or remove OWASP threat model TODOs — high TODO density in security docs is unacceptable.
          Target: 0 TODOs in security docs, <5% in other docs.

          ## Acceptance Criteria
          - [ ] All TODOs in security docs resolved or converted to tracked issues
          - [ ] Overall TODO density below 5% threshold
          - [ ] No HACK/XXX markers remain

          ## Reference
          - Auto-created by Kelos docs-maintenance workflow
          - Parent: #367, #360
        labels: ["documentation", "security", "auto-created", "kelos"]
        assign: "reverb256"
        dedupe: true
        dedupe_labels: ["documentation", "security", "auto-created"]
        max_per_run: "{{max_issues_per_run}}"

  # ── Task 3: Metrics Drift Scan (Weekly) ────────────────────
  - name: Scan metrics drift
    agent: kelos
    description: "Check docs metrics match metrics.json"
    schedule: "0 9 * * 1"    # Weekly Monday at 9 AM
    steps:
      - name: Get actual metrics
        action: read-json
        path: "docs/metrics.json"
        extract: "mcpTools.count"

      - name: Search for stale references
        action: grep
        pattern: "(24|26|28|29|30|32|34|88|90|100|110|120) MCP tools"
        files: "*.md"

      - name: Check module count drift
        action: read-json
        path: "docs/metrics.json"
        extract: "modules.registryCount"

      - name: Search for stale module references
        action: grep
        pattern: "(65|70|76|80|84|88|90|100|110|120) modules"
        files: "*.md"

      - name: Create issue if drift detected
        action: create-issue
        condition: "stale_matches > 0"
        template: |
          ## Task
          Update documentation — stale metric references detected.

          ## Drift Details
          | Metric | Current Value | Stale References |
          |--------|--------------|------------------|
          | MCP tools | {{actual_mcp_count}} | {{stale_mcp_references}} |
          | Modules | {{actual_module_count}} | {{stale_module_references}} |

          ## Files to Update
          {{stale_files_list}}

          ## Fix
          1. Run `node scripts/generate-metrics.mjs` to update `docs/metrics.json`
          2. Search for stale inline references: `grep -rn '<old-value>' --include='*.md' .`
          3. Update each reference to match current metrics
          4. Verify: `bash scripts/verify-metrics-sync.sh`

          ## Acceptance Criteria
          - [ ] `docs/metrics.json` is current
          - [ ] No stale metric references in any .md file
          - [ ] `scripts/verify-metrics-sync.sh` passes

          ## Reference
          - Auto-created by Kelos docs-maintenance workflow
          - Parent: #367, #361
        labels: ["documentation", "metrics", "auto-created", "kelos"]
        assign: "reverb256"
        dedupe: true
        dedupe_labels: ["documentation", "metrics", "auto-created"]
        max_per_run: "{{max_issues_per_run}}"
